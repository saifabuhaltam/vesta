  /** The question just asked, and the answer as it is being written. */
  function threadLiveHtml(){
    var st = TH.stream;
    return (st.user ? threadBubbleHtml(st.user) : '')
      + '<div class="th-msg th-assistant th-live" id="th-live">'
      + '<div class="th-who">Vesta'+(st.fast ? ' · Fast' : '')+'</div>'
      + '<div class="th-live-status">'+threadLiveStatusHtml(st)+'</div>'
      + '<div class="th-text th-md th-live-text">'+threadLiveTextHtml(st)+'</div>'
      + '</div>';
  }

  function threadLiveTextHtml(st){
    if(!st.text) return '';
    var caret = '<span class="th-caret"></span>';
    var html = mdLite(st.text);
    // inside the last paragraph or list item, so it follows the last word
    var m = html.match(/<\/(p|li|h[1-6])>(\s*<\/(ul|ol)>)?\s*$/);
    return m ? html.slice(0, m.index) + caret + html.slice(m.index) : html + caret;
  }

  function threadLiveStatusHtml(st){
    if(st.phase === 'waiting'){
      return '<i class="th-spin"></i><span>'+(st.fast ? 'Starting…' : 'Reading your material…')+'</span>';
    }
    if(st.phase === 'thinking'){
      var lines = st.thinking.split(/\n+/).filter(function(l){ return l.trim(); });
      var last = lines.length ? lines[lines.length - 1] : '';
      return '<i class="th-spin"></i><span class="th-think-line"><b>Thinking</b> '
        + escapeHtml(last.length > 200 ? '…' + last.slice(-200) : last)+'</span>';
    }
    if(st.thinkStart){
      var secs = Math.max(1, Math.round(((st.thinkEnd || Date.now()) - st.thinkStart) / 1000));
      return '<span>Thought for '+secs+' second'+(secs === 1 ? '' : 's')+'</span>';
    }
    return '';
  }

  function threadStreamEvent(th, name, data){
    var st = th.stream;
    if(!st) return;
    if(name === 'start'){ st.user = data.userMessage; return; }
    if(name === 'thinking'){
      if(!st.thinkStart) st.thinkStart = Date.now();
      st.thinking += data.t; st.phase = 'thinking';
    } else if(name === 'text'){
      if(st.thinkStart && !st.thinkEnd) st.thinkEnd = Date.now();
      st.text += data.t; st.phase = 'writing';
    } else if(name === 'error'){
      st.error = data; return;
    } else if(name === 'done'){
      var add = [];
      if(st.user) add.push(st.user);
      if(data.reply) add.push(data.reply);
      th.data.messages = (th.data.messages||[]).concat(add);
      if(data.usage) hsUsage = data.usage;
      th.busy = false; th.stream = null;
      if(TH === th) renderThread();
      hsLoadSide();
      if(st.error) reportError(new Error(st.error.error || 'The reply stopped with an error.'));
      return;
    }
    threadPaintLive(th);
  }

  /** Repaint just the answer being written, at most once a frame; the rest of the screen stays put. */
  function threadPaintLive(th){
    var st = th.stream;
    if(!st || TH !== th || st.painting) return;
    st.painting = true;
    requestAnimationFrame(function(){
      st.painting = false;
      var box = document.getElementById('th-live');
      if(!box || th.stream !== st) return;
      var sc = document.getElementById('th-scroll');
      // follow the answer down only if you were already at the bottom
      var stick = sc && (sc.scrollHeight - sc.scrollTop - sc.clientHeight < 120);
      box.querySelector('.th-live-status').innerHTML = threadLiveStatusHtml(st);
      box.querySelector('.th-live-text').innerHTML = threadLiveTextHtml(st);
      if(stick) sc.scrollTop = sc.scrollHeight;
    });
  }

  /** Stopped, or the connection dropped: keep what was written, then take the server's copy. */
  function threadStopped(th){
    var st = th.stream;
    if(!st) return;
    var add = [];
    if(st.user) add.push(st.user);
    if(st.text.trim()) add.push({ role:'assistant', content:st.text, stopped:true });
    th.data.messages = (th.data.messages||[]).concat(add);
    th.busy = false; th.stream = null;
    if(TH === th) renderThread();
    // The server saves the stopped part as soon as it notices; fetching it back gives
    // the reply an id, which Copy and Save as a note need.
    setTimeout(function(){
      apiGet('/api/threads/'+th.id).then(function(d){
        if(TH === th && !th.busy && d && d.messages){ th.data.messages = d.messages; renderThread(); }
        hsLoadSide();
      }).catch(function(){});
    }, 900);
  }

  /** Refused before anything was spent: the question was kept, so it can be sent on. */
  function threadRefused(th, status, j, text, toolKey){
    th.busy = false; th.stream = null;
    if(status === 401 && j.signedOut){ authState.user = null; showLogin(); return; }
    if(status === 409 || status === 402){
      th.confirm = j;
      if(j.userMessageId){
        var have = (th.data.messages||[]).some(function(m){ return m.id === j.userMessageId; });
        if(!have){
          th.data.messages = (th.data.messages||[]).concat(
            [{ id:j.userMessageId, role:'user', content:text, tool:toolKey||null }]);
        }
        th.retry = j.userMessageId;
      }
    } else {
      if(text && !th.draft) th.draft = text;    // nothing was kept, so give the words back
      reportError(new Error(j.error || 'That did not work.'));
    }
    if(TH === th) renderThread();
  }

  // ---------------- Lock In focus mode ----------------
  var FOCUS_SETTINGS_KEY = 'vesta_focus_settings';
  var FOCUS_PHASE_LABEL = { work:'Focus session', short_break:'Short break', long_break:'Long break' };
  var FOCUS_PHASE_TAB = { work:'Focus', short_break:'Short Break', long_break:'Long Break' };
  var FOCUS_DEFAULTS = {
    work:25, shortBreak:5, longBreak:15, sessionsBeforeLong:4,
    autoStartBreaks:false, autoStartFocus:false,
    alarmOn:true, alarmSound:'chime',
    scene:'none', customScene:'', accent:'#005FFB', ambient:'off'
  };
  var FOCUS_SCENES = {
    aurora:  'radial-gradient(1200px 700px at 20% 15%, #4c3f92 0%, transparent 60%), radial-gradient(900px 600px at 80% 75%, #2b6b8f 0%, transparent 55%), linear-gradient(160deg,#141326 0%,#1d1b3a 45%,#101024 100%)',
    dusk:    'radial-gradient(1000px 650px at 75% 20%, #b4643f 0%, transparent 58%), radial-gradient(900px 700px at 15% 80%, #5b3a72 0%, transparent 60%), linear-gradient(160deg,#2a1a2e 0%,#3b2440 50%,#150f1c 100%)',
    forest:  'radial-gradient(1000px 600px at 25% 20%, #2f6b4f 0%, transparent 58%), radial-gradient(900px 700px at 85% 80%, #1d4a56 0%, transparent 55%), linear-gradient(160deg,#0f1f1a 0%,#16302a 50%,#0a1613 100%)',
    ocean:   'radial-gradient(1100px 650px at 30% 25%, #1f5f8b 0%, transparent 58%), radial-gradient(900px 650px at 80% 70%, #10485c 0%, transparent 55%), linear-gradient(160deg,#08202e 0%,#0d2f42 50%,#061722 100%)',
    midnight:'radial-gradient(900px 600px at 50% 10%, #23304d 0%, transparent 60%), linear-gradient(170deg,#0a0d17 0%,#111524 55%,#07090f 100%)'
  };
  var FOCUS_ACCENTS = ['#005FFB','#8B7BF7','#1DA6A0','#34A868','#EE6E6E','#E7B85C'];
  var FOCUS_AMBIENTS = ['off','motes','stars','rain','bubbles'];
  var FOCUS_SOUNDS = ['chime','bell','digital'];
  var FOCUS_COUNTS_KEY = 'vesta-focus-counts';

  function loadFocusSettings(){
    // The account is the source of truth; localStorage is the fallback for a local
    // install and for the moment before /api/prefs has answered.
    if(PREFS && PREFS.focus) return clampFocusSettings(Object.assign({}, FOCUS_DEFAULTS, PREFS.focus));
    try{
      var raw = localStorage.getItem(FOCUS_SETTINGS_KEY);
      if(raw) return clampFocusSettings(Object.assign({}, FOCUS_DEFAULTS, JSON.parse(raw)));
    } catch(e){}
    return Object.assign({}, FOCUS_DEFAULTS);
  }
  function saveFocusSettings(s){
    try{ localStorage.setItem(FOCUS_SETTINGS_KEY, JSON.stringify(s)); } catch(e){}
    if(PREFS) savePrefs({ focus: s });
  }
  function clampFocusSettings(s){
    return {
      work: Math.min(120, Math.max(5, Number(s.work)||FOCUS_DEFAULTS.work)),
      shortBreak: Math.min(30, Math.max(1, Number(s.shortBreak)||FOCUS_DEFAULTS.shortBreak)),
      longBreak: Math.min(60, Math.max(5, Number(s.longBreak)||FOCUS_DEFAULTS.longBreak)),
      sessionsBeforeLong: Math.min(8, Math.max(2, Number(s.sessionsBeforeLong)||FOCUS_DEFAULTS.sessionsBeforeLong)),
      autoStartBreaks: !!s.autoStartBreaks,
      autoStartFocus: !!s.autoStartFocus,
      alarmOn: s.alarmOn !== false,
      alarmSound: FOCUS_SOUNDS.indexOf(s.alarmSound)>=0 ? s.alarmSound : 'chime',
      scene: (FOCUS_SCENES[s.scene] || s.scene==='custom' || s.scene==='none') ? s.scene : 'none',
      customScene: s.customScene || '',
      accent: /^#[0-9a-f]{6}$/i.test(s.accent||'') ? s.accent : FOCUS_DEFAULTS.accent,
      ambient: FOCUS_AMBIENTS.indexOf(s.ambient)>=0 ? s.ambient : 'off'
    };
  }

  // Completed intervals, tallied per day so the counts mean something across sessions.
  function loadFocusCounts(){
    var blank = { date: todayIso(), work:0, short_break:0, long_break:0, seconds:0 };
    try{
      var raw = JSON.parse(localStorage.getItem(FOCUS_COUNTS_KEY) || 'null');
      if(raw && raw.date === todayIso()) return Object.assign(blank, raw);
    } catch(e){}
    return blank;
  }
  // Seconds the timer actually ticked while running, not wall-clock since Start.
  function addFocusSecondsToday(n){
    if(focusCounts.date !== todayIso()){
      focusCounts = { date: todayIso(), work:0, short_break:0, long_break:0, seconds:0 };
    }
    focusCounts.seconds = (focusCounts.seconds||0) + n;
    if(focusCounts.seconds % 5 === 0) saveFocusCounts();
  }
  function saveFocusCounts(){
    try{ localStorage.setItem(FOCUS_COUNTS_KEY, JSON.stringify(focusCounts)); } catch(e){}
  }
  function bumpFocusCount(phase){
    focusCounts[phase] = (focusCounts[phase]||0) + 1;
    focusCounts.date = todayIso();
    saveFocusCounts();
  }

  var focusSettings = loadFocusSettings();

  function focusPhaseMinutes(phase){
    if(phase==='short_break') return focusSettings.shortBreak;
    if(phase==='long_break') return focusSettings.longBreak;

  function ensureFocusState(phase){
    if(!focusState){
      var ph = phase || 'work';
      focusState = {
        phase: ph, totalSeconds: focusPhaseMinutes(ph)*60, secondsLeft: focusPhaseMinutes(ph)*60,
        sessionNumber: 1, paused: true, running: false,

  // One timer, rendered either inline on the Focus page or full-screen. Same markup either way,
  // so it always looks like the rest of Vesta.
  function focusTimerHtml(opts){
    opts = opts || {};
    var fs = ensureFocusState('work');
    var total = fs.totalSeconds, left = fs.secondsLeft;
    var pct = total>0 ? (left/total) : 0;
    var circ = 2*Math.PI*118;
    var offset = circ * (1-pct);
    var mm = Math.floor(left/60), ss = left%60;
    var timeStr = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    var it = fs.taskItemId ? items.find(function(i){ return i.id===fs.taskItemId; }) : null;
    var cls = it ? classById(it.classId) : null;

    var tabs = '<div class="seg-tabs fx-modes">' + ['work','short_break','long_break'].map(function(ph){
      return '<button type="button" class="seg-tab'+(fs.phase===ph?' active':'')+'" data-action="focus-mode" data-phase="'+ph+'">'
        + FOCUS_PHASE_TAB[ph] + '<span class="fx-tab-n">'+(focusCounts[ph]||0)+'</span></button>';
    }).join('') + '</div>';

    var dots = '';
    for(var i=0;i<focusSettings.sessionsBeforeLong;i++){
      dots += '<span class="fx-dot'+(i < fs.sessionNumber ? ' filled':'')+'"></span>';
    }

    var openItems = items.filter(function(x){ return x.status!=='done'; })
      .sort(function(a,b){ return (a.dueDate||'zzzz').localeCompare(b.dueDate||'zzzz'); });
    var taskOptions = '<option value="">No specific task</option>' + openItems.map(function(x){

  // Repaint an already-open settings modal from focusSettings without replacing any node the
  // user might be interacting with. Rebuilding the modal on every click threw away the caret,
  // the scroll position and the button under the pointer.
  function syncFocusSettingsUi(){
    var root = document.getElementById('modal-root');
    if(!root) return;
    syncFocusSteppers();
    var each = function(sel, fn){ Array.prototype.forEach.call(root.querySelectorAll(sel), fn); };
    each('.fx-switch[data-key]', function(b){
      b.classList.toggle('on', !!focusSettings[b.getAttribute('data-key')]);
    });
    each('[data-action="focus-set-scene"]', function(b){
      b.classList.toggle('active', focusSettings.scene === b.getAttribute('data-scene'));
    });
    each('[data-action="focus-set-accent"]', function(b){
      b.classList.toggle('active', focusSettings.accent === b.getAttribute('data-accent'));
    });
    each('[data-action="focus-set-ambient"]', function(b){
      b.classList.toggle('active', focusSettings.ambient === b.getAttribute('data-ambient'));
    });
    each('[data-action="focus-set-sound"]', function(b){
      b.classList.toggle('active', focusSettings.alarmSound === b.getAttribute('data-sound'));
    });
    // The two conditional blocks are repainted only when they actually appear or disappear,
    // so typing in the custom image URL is never interrupted.
    var cw = root.querySelector('#fx-custom-wrap');
    if(cw){
      var wantC = focusSettings.scene === 'custom' ? 'on' : 'off';
      if(cw.getAttribute('data-state') !== wantC){
        cw.setAttribute('data-state', wantC);
        cw.innerHTML = fxCustomFieldHtml();
      }
    }
    var aw = root.querySelector('#fx-alarm-wrap');
    if(aw){
      aw.setAttribute('data-state', focusSettings.alarmOn ? 'on' : 'off');
      each('#fx-alarm-wrap [data-action="focus-set-sound"]', function(b){ b.disabled = !focusSettings.alarmOn; });
    }

  // Update just the numbers in an already-open settings modal. Rebuilding the whole
  // modal on every +/- click threw away the caret and the scroll position.
  function syncFocusSteppers(){
    var root = document.getElementById('modal-root');
    if(!root) return;
    Array.prototype.forEach.call(root.querySelectorAll('input[data-fx-key]'), function(inp){
      var key = inp.getAttribute('data-fx-key');
      var val = focusSettings[key];
      if(document.activeElement !== inp) inp.value = val;
      var min = Number(inp.min), max = Number(inp.max);
      var wrap = inp.parentNode;
      Array.prototype.forEach.call(wrap.querySelectorAll('button[data-action="focus-step"]'), function(b){
        b.disabled = Number(b.getAttribute('data-delta')) < 0 ? val <= min : val >= max;
      });
    });
  }

  // ---- ambient effects ----
  function stopFocusAmbient(){
    if(focusAmbientRaf){ cancelAnimationFrame(focusAmbientRaf); focusAmbientRaf = null; }
  }
  function startFocusAmbient(){
    stopFocusAmbient();
    var cv = document.getElementById('fx-ambient');
    if(!cv || focusSettings.ambient==='off') return;
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var ctx = cv.getContext('2d');
    var mode = focusSettings.ambient;
    function size(){ cv.width = cv.offsetWidth; cv.height = cv.offsetHeight; }
    size();
    var n = mode==='rain' ? 90 : mode==='stars' ? 110 : 55;
    var parts = [];
    for(var i=0;i<n;i++){
      parts.push({
        x: Math.random()*cv.width, y: Math.random()*cv.height,
        r: mode==='stars' ? Math.random()*1.4+0.4 : mode==='bubbles' ? Math.random()*9+3 : Math.random()*2.2+0.8,
        vy: mode==='rain' ? Math.random()*4+3 : mode==='bubbles' ? -(Math.random()*0.8+0.3) : -(Math.random()*0.35+0.08),
        vx: mode==='rain' ? 0.6 : (Math.random()-0.5)*0.25,
        a: Math.random()*0.5+0.25, tw: Math.random()*0.02+0.005, len: Math.random()*12+8
      });
    }
    function frame(){
      ctx.clearRect(0,0,cv.width,cv.height);
      parts.forEach(function(p){
        p.x += p.vx; p.y += p.vy;
        if(p.y < -20) { p.y = cv.height+10; p.x = Math.random()*cv.width; }
        if(p.y > cv.height+20){ p.y = -10; p.x = Math.random()*cv.width; }
        if(p.x > cv.width+20) p.x = -10;
        if(p.x < -20) p.x = cv.width+10;
        if(mode==='rain'){
          ctx.strokeStyle = 'rgba(255,255,255,'+(p.a*0.5)+')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(p.x-p.vx*2, p.y-p.len); ctx.stroke();
        } else if(mode==='stars'){
          p.a += p.tw; if(p.a>0.9 || p.a<0.15) p.tw *= -1;
          ctx.fillStyle = 'rgba(255,255,255,'+p.a+')';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
        } else if(mode==='bubbles'){
          ctx.strokeStyle = 'rgba(255,255,255,'+(p.a*0.4)+')';
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.stroke();
        } else {
          ctx.fillStyle = 'rgba(255,255,255,'+(p.a*0.55)+')';
          ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.283); ctx.fill();
        }
      });
      focusAmbientRaf = requestAnimationFrame(frame);
    }
    frame();
  }

  // ---- alarm ----
  function playFocusChime(){
    if(!focusSettings.alarmOn) return;
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var now = ctx.currentTime;
      var seq = focusSettings.alarmSound==='bell' ? [[660,0,1.1],[880,0.08,1.0]]
              : focusSettings.alarmSound==='digital' ? [[1000,0,0.12],[1000,0.18,0.12],[1000,0.36,0.12]]
              : [[880,0,0.6],[1174,0.18,0.5]];
      seq.forEach(function(s){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = focusSettings.alarmSound==='digital' ? 'square' : 'sine';
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = s[0];
        g.gain.setValueAtTime(0.0001, now+s[1]);
        g.gain.exponentialRampToValueAtTime(0.16, now+s[1]+0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now+s[1]+s[2]);
        o.start(now+s[1]); o.stop(now+s[1]+s[2]+0.02);
      });
    } catch(e){}
  }

  // ---- picture in picture ----
  var pipWin = null;
  function updatePipTimer(){
    if(!pipWin || pipWin.closed) return;
    var fs = focusState; if(!fs) return;
    var mm = Math.floor(fs.secondsLeft/60), ss = fs.secondsLeft%60;
    var t = pipWin.document.getElementById('pip-time');
    var p = pipWin.document.getElementById('pip-phase');
    if(t) t.textContent = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    if(p) p.textContent = FOCUS_PHASE_LABEL[fs.phase];
  }
  function openFocusPip(){
    if(!('documentPictureInPicture' in window)) return;
    window.documentPictureInPicture.requestWindow({ width:280, height:180 }).then(function(w){
      pipWin = w;
      w.document.body.style.cssText = 'margin:0;display:flex;flex-direction:column;align-items:center;justify-content:center;'
        + 'height:100vh;font-family:Inter,system-ui,sans-serif;background:#12121c;color:#fff;gap:6px;';
      var time = w.document.createElement('div');
      time.id = 'pip-time';
      time.style.cssText = 'font-size:52px;font-weight:700;letter-spacing:-1px;';
      var phase = w.document.createElement('div');
      phase.id = 'pip-phase';
      phase.style.cssText = 'font-size:13px;opacity:.7;';
      w.document.body.appendChild(time);
      w.document.body.appendChild(phase);
      w.addEventListener('pagehide', function(){ pipWin = null; });
      updatePipTimer();
    }).catch(function(){});
  }

  function advanceFocusPhase(){
    playFocusChime();
    var fs = focusState;
    bumpFocusCount(fs.phase);
    var wasWork = fs.phase === 'work';
    if(PREFS && PREFS.notifyFocusDone){
      vestaNotify(wasWork ? 'Focus block done' : 'Break over',
                  wasWork ? 'Time for a break.' : 'Back to it.',
                  'vesta-focus');
    }
    if(wasWork){
      flushFocusTime();
      if(fs.sessionNumber >= focusSettings.sessionsBeforeLong){ fs.phase = 'long_break'; }
      else { fs.phase = 'short_break'; }
    } else {
      if(fs.phase === 'long_break'){ fs.sessionNumber = 1; } else { fs.sessionNumber += 1; }
      fs.phase = 'work';
    }
    fs.totalSeconds = focusPhaseMinutes(fs.phase)*60;
    fs.secondsLeft = fs.totalSeconds;
    var autoContinue = wasWork ? focusSettings.autoStartBreaks : focusSettings.autoStartFocus;
    fs.paused = !autoContinue;
    fs.running = autoContinue;
    if(!autoContinue && focusTickHandle){ clearInterval(focusTickHandle); focusTickHandle = null; }
    renderFocusOverlay();
  }

  function focusTick(){
    if(!focusState || focusState.paused) return;
    focusState.secondsLeft -= 1;
    if(focusState.phase === 'work'){
      focusState.workSecondsLogged = (focusState.workSecondsLogged||0) + 1;
      focusState.unflushedSeconds = (focusState.unflushedSeconds||0) + 1;
      addFocusSecondsToday(1);
      if(focusState.unflushedSeconds >= 60) flushFocusTime();
    }
    if(focusState.secondsLeft <= 0){ advanceFocusPhase(); }
    else { renderFocusOverlay(); }
  }

  // Push the seconds studied so far onto the linked assignment. Called every minute,
  // on pause, on task switch and on exit, so quitting mid-session never loses the time.
  function flushFocusTime(){
    var fs = focusState;
    if(!fs) return;
    var secs = fs.unflushedSeconds || 0;
    fs.unflushedSeconds = 0;
    saveFocusCounts();
    if(secs <= 0 || !fs.taskItemId) return;
    var it = items.find(function(i){ return i.id === fs.taskItemId; });
    if(it) it.focusSeconds = (it.focusSeconds||0) + secs;   // optimistic, avoids a full re-render
    logFocusTime(fs.taskItemId, secs).catch(function(){});
  }

  function startFocusTicking(){
    if(focusTickHandle) clearInterval(focusTickHandle);
    focusTickHandle = setInterval(focusTick, 1000);
  }

  function focusPrimaryAction(){
    var fs = ensureFocusState('work');
    if(fs.running && !fs.paused){ fs.paused = true; flushFocusTime(); renderFocusOverlay(); return; }
    fs.running = true; fs.paused = false;
    startFocusTicking();
    renderFocusOverlay();
  }

  function setFocusPhase(phase){
    var fs = ensureFocusState(phase);
    fs.phase = phase;
    fs.totalSeconds = focusPhaseMinutes(phase)*60;
    fs.secondsLeft = fs.totalSeconds;
    fs.paused = true; fs.running = false;
    if(focusTickHandle){ clearInterval(focusTickHandle); focusTickHandle = null; }
    renderFocusOverlay();
  }

  function applyFocusDurationChange(){
    var fs = focusState;
    if(fs && !fs.running){
      fs.totalSeconds = focusPhaseMinutes(fs.phase)*60;
      fs.secondsLeft = fs.totalSeconds;
    }
  }

  function quickStartFocus(itemId){
    focusTaskId = itemId || '';
    focusState = {
      phase:'work', totalSeconds: focusSettings.work*60, secondsLeft: focusSettings.work*60,
      sessionNumber:1, paused:false, running:true,
      taskItemId: focusTaskId || null, workSecondsLogged:0
    };
    focusFullscreen = false;
    startFocusTicking();
    if(activeTab !== 'focus'){ activeTab = 'focus'; render(); }
    else { renderFocusOverlay(); }
  }

  function startFocusSession(){ focusPrimaryAction(); }

  function toggleFocusPause(){
    if(!focusState) return;
    focusState.paused = !focusState.paused;
    renderFocusOverlay();
  }

  function endFocusSession(){
    if(focusTickHandle){ clearInterval(focusTickHandle); focusTickHandle = null; }
    var fs = focusState;
    if(fs){
      var pending = fs.unflushedSeconds || 0;
      flushFocusTime();
      if(fs.taskItemId && pending > 0){ loadState().catch(function(){}); }
    }
    focusState = null;
    focusFullscreen = false;
    stopFocusAmbient();
    if(pipWin && !pipWin.closed){ try{ pipWin.close(); }catch(e){} pipWin = null; }
    document.getElementById('focus-root').innerHTML = '';
    render();
  }

  function saveTermFromForm(){

      name: document.getElementById('f-term-name').value.trim(),
      startDate: document.getElementById('f-term-start').value || '',
      endDate: document.getElementById('f-term-end').value || ''

  // ---------------- semesters ----------------

  function termLabel(t){ return t && t.name ? t.name : 'Untitled term'; }

  function termDates(t){
    if(!t) return '';
    if(t.startDate && t.endDate) return fmtDateShort(t.startDate)+' – '+fmtDateShort(t.endDate);
    if(t.startDate) return 'From '+fmtDateShort(t.startDate);
    if(t.endDate) return 'Until '+fmtDateShort(t.endDate);
    return 'No dates set';

  /**
   * The banner above every screen when you are reading a finished term.
   *
   * An archived term is read-only, enforced by the server, so this says plainly what
   * is going on and offers the way out. The unlock lasts for this browser session and
   * drops the moment you switch away, which is why it says so.
   */
  function renderTermBanner(){
    var host = document.getElementById('term-banner');
    if(!host) return;
    if(!semester || semester.status !== 'archived'){ host.innerHTML = ''; return; }
    if(termLocked){
      host.innerHTML = '<div class="term-banner">'
        + '<span class="tb-text"><b>'+escapeHtml(termLabel(semester))+'</b> is archived. '
        + 'You can read everything here; editing is off so an old record cannot be changed by accident.</span>'
        + '<button type="button" class="btn" data-action="unlock-term">Unlock to edit</button>'
        + '</div>';
    } else {
      host.innerHTML = '<div class="term-banner unlocked">'
        + '<span class="tb-text"><b>'+escapeHtml(termLabel(semester))+'</b> is unlocked. '
        + 'Changes are being saved. It locks again when you switch terms or close the tab.</span>'
        + '<button type="button" class="btn" data-action="lock-term">Lock it</button>'
        + '</div>';
    }
  }

  function switchTerm(id){
    if(semester && id === semester.id) return Promise.resolve();
    return apiPut('/api/semesters/active', { id:id }).then(function(){
      // A term switch changes every screen, so go back to the top rather than leaving
      // a class from last year open in front of the new one.
      activeClassId = null;
      if(activeTab === 'class') activeTab = 'classes';
      return loadState();
    });
  }

  function unlockTerm(lock){
    if(!semester) return Promise.resolve();
    return apiPost('/api/semesters/'+semester.id+'/unlock', { lock: !!lock })
      .then(function(){ return loadState(); });
  }

  /**
   * Every term, with what it holds and what can be done to it. Lives in Settings and
   * nowhere else.
   *
   * The counts come from /api/semesters rather than the page's own state, because the
   * page only ever holds the current term's rows: it cannot say how many classes are
   * sitting in last year. So this renders from `termList` when it has arrived and asks
   * for it when it has not, the same way the Google section handles its status.
   */
  var termList = null;

  function termsSectionHtml(){
    var head = '<div id="terms-section">';
    if(termList === null) return head + setCard('Your terms', null, '<div class="hint">Loading…</div>') + '</div>';

    var rows = termList.map(function(t){
      var c = t.counts || {};
      var bits = [];
      if(c.classes) bits.push(c.classes + (c.classes===1?' class':' classes'));
      if(c.items) bits.push(c.items + (c.items===1?' assignment':' assignments'));
      if(c.notes) bits.push(c.notes + (c.notes===1?' note':' notes'));
      if(c.materials) bits.push(c.materials + (c.materials===1?' file':' files'));
      var empty = !bits.length;
      var meta = termDates(t) + (bits.length ? ' · ' + bits.join(' · ') : ' · Empty');

  /** "Fall 2026" -> "Spring 2027": the term most likely to be started next. */
  function nextTermGuess(){
    var order = ['Spring', 'Summer', 'Fall'];
    var latest = semesters[0];
    var m = latest && /^(Spring|Summer|Fall)\s+(\d{4})$/.exec((latest.name||'').trim());
    if(!m){
      var d = new Date();
      var season = d.getMonth() < 4 ? 'Spring' : (d.getMonth() < 8 ? 'Summer' : 'Fall');
      return season + ' ' + d.getFullYear();
    }
    var i = order.indexOf(m[1]);
    var year = Number(m[2]);
    if(i === order.length - 1) return order[0] + ' ' + (year + 1);
    return order[i + 1] + ' ' + year;
  }

  function renderSearchResults(q){
    var root = document.getElementById('search-results');
    if(!root) return;
    var raw = (q||'').trim();
    q = raw.toLowerCase();
    var idx = searchIndex();
    var matches = q ? idx.filter(function(r){ return r.text.indexOf(q)>=0; }) : idx.slice(0,10);
    var groups = {}, order = [];
    matches.forEach(function(r){ if(!groups[r.type]){ groups[r.type]=[]; order.push(r.type); } groups[r.type].push(r); });
    var html = '';
    order.forEach(function(g){
      html += '<div class="search-group-label">'+g+'</div>';
      groups[g].slice(0,6).forEach(function(r){
        html += '<div class="search-result" data-action="'+r.action+'"'+(r.id?' data-id="'+r.id+'"':'')+(r.tab?' data-tab="'+r.tab+'"':'')
          + (r.kind?' data-kind="'+r.kind+'"':'')+(r.classId?' data-class="'+r.classId+'"':'')+'>'
          + '<span class="sr-ic">'+r.icon+'</span><div><div class="sr-title">'+escapeHtml(r.title)+'</div><div class="sr-meta">'+escapeHtml(r.meta)+'</div></div>'
          + '</div>';
      });
    });
    // Names are matched here instantly; what is written inside files and notes is
    // searched on the server a moment later and lands underneath.
    if(raw.length >= 2){
      html += '<div id="search-deep">'
        + (matches.length ? '' : '<div class="search-empty">Looking inside files and notes…</div>') + '</div>';
    } else if(!matches.length){
      html = '<div class="search-empty">No matches for "'+escapeHtml(raw)+'".</div>';
    }
    root.innerHTML = html;
    if(searchDeepTimer) clearTimeout(searchDeepTimer);
    if(raw.length >= 2){
      searchDeepTimer = setTimeout(function(){ loadDeepSearch(raw, matches.length); }, 220);
    }
  }

  // ---- dragging files and file folders into folders ----
  // Dropping moves, it does not copy. A file has one home class and one home folder,
  // so "where does this live" keeps a single answer; what it is *used by* stays in
  // item_files and survives the move untouched.

  /** Read a drop target's class and folder off the element. */
  function fileDropTarget(zone){
    return {
      classId: zone.dataset.class || null,
      folderId: zone.dataset.folder || null
    };
  }

  function fileDropAllowed(zone){
    if(!dragPayload) return false;
    var to = fileDropTarget(zone);
    if(dragPayload.kind === 'file') return !!to.classId;
    if(dragPayload.kind === 'filefolder'){
      var f = fileFolderById(dragPayload.id);
      // A folder belongs to one class, and a folder cannot be dropped inside itself
      // or inside its own child: that would cut the branch loose from the tree.
      if(!f || f.classId !== to.classId) return false;
      if(to.folderId && fileFolderDescendants(f.id).indexOf(to.folderId) >= 0) return false;
      return (f.parentId||null) !== (to.folderId||null);
    }
    return false;
  }

  function clearFileDropMarks(){
    document.querySelectorAll('.fdrop-over').forEach(function(el){ el.classList.remove('fdrop-over'); });

    if(!zone || !fileDropAllowed(zone)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    if(!zone.classList.contains('fdrop-over')){
      clearFileDropMarks();
      zone.classList.add('fdrop-over');
    }
  });

    if(!zone || !dragPayload) return;
    // An OS file drop carries files and belongs to the upload handler, not here.
    if(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length) return;
    if(!fileDropAllowed(zone)) return;
    e.preventDefault();
    clearFileDropMarks();
    var to = fileDropTarget(zone);
    var payload = dragPayload;
    dragPayload = null;
    if(payload.kind === 'file'){
      updateMaterial(payload.id, {
        classId: to.classId === INBOX_ID ? null : to.classId,
        folderId: to.classId === INBOX_ID ? null : (to.folderId || null)
      }).then(function(){ renderView(); paintIcons(); }).catch(reportError);
    } else if(payload.kind === 'filefolder'){
      updateFileFolder(payload.id, { parentId: to.folderId || null })

  });

  /** Open the note just created in a class (or the Inbox), caret in the title. */
  function openNewestNote(classId){
    var cc = classById(classId);
    var newest = ((cc && cc.notesList) || []).slice()
      .sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); })[0];
    if(!newest) return;
    notesClassId = classId;
    notesOpenId = newest.id;
    render();
    var titleEl = document.getElementById('nt-title');
    if(titleEl) titleEl.focus();
  }

  function closeNoteMenus(){
    if(!noteMenuOpen && !noteShareOpen) return false;
    noteMenuOpen = false;
    noteShareOpen = false;
    Array.prototype.forEach.call(document.querySelectorAll('.cp-menu'), function(m){
      m.parentNode.removeChild(m);
    });
    return true;
  }

  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    var isMenuToggle = t && t.dataset.action==='class-menu-toggle';
    if(openMenuId && !isMenuToggle){
      openMenuId = null;
      if(activeTab==='class') renderView();
    }
    // Clicking bare page, with no control under it, has to dismiss an open menu too.
    // This used to sit below the guard, so a menu only closed on the next click that
    // happened to land on something.
    if(!t){ if(!e.target.closest('.cp-menu')) closeNoteMenus(); return; }
    var action = t.dataset.action;

    if(action==='class-menu-toggle'){
      openMenuId = (openMenuId===t.dataset.id) ? null : t.dataset.id;
      renderView();
      return;
    }

    if(action!=='search-backdrop' && action!=='search-stop' && action!=='open-search' && document.getElementById('search-root').firstElementChild){
      closeSearch();
    }

    // clicking any other control closes them too; the menu's own entries are exempt
    if((noteMenuOpen && action !== 'note-menu')
       || (noteShareOpen && action !== 'note-share' && action !== 'note-export' && action !== 'note-copy')){
      var keepShare = noteShareOpen && (action === 'note-export' || action === 'note-copy');
      var keepMenu = noteMenuOpen && action === 'note-menu';
      // a <select> inside the menu is how you pick a folder or class; closing on that
      // click would pull the dropdown out from under you
      var onMenuControl = e.target.closest('.cp-menu') && !e.target.closest('button');
      if(!keepShare && !keepMenu && !onMenuControl) closeNoteMenus();
    }
    if(action==='toggle-sidebar'){ setSidebarCollapsed(!sidebarCollapsed); return; }
    if(action==='toggle-nav'){ setNavOpen(!navOpen); return; }
    if(action==='close-nav'){ setNavOpen(false); return; }
    if(action==='switch-tab'){
      if(t.dataset.tab !== 'headstart'){ hsScreen = null; TH = null; }
      if(t.dataset.tab !== 'study'){ studyScreen = null; HZ.run = null; }
      activeTab = t.dataset.tab;

      render(); return;
    }
    if(action==='set-theme'){ setTheme(t.dataset.themeChoice); return; }
    if(action==='rte-cmd'){
      var rteEditor = rteEditorFor(t);
      if(rteEditor){
        rteEditor.focus();
        // Colour commands emit a deprecated <font color> tag unless the browser is
        // told to use CSS. Bold and italic are left alone, because <b> and <i> are
        // the right markup and turning this on would make them spans instead.
        var wantsCss = t.dataset.cmd === 'foreColor' || t.dataset.cmd === 'hiliteColor';
        try{ document.execCommand('styleWithCSS', false, wantsCss); }catch(e){}
        try{ document.execCommand(t.dataset.cmd, false, t.dataset.val || null); }catch(e){}
        try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
        rteTidyFontTags(rteEditor);
        rteChanged(rteEditor);
      }
      closeRteMenus();
      return;
    }
    if(action==='note-fullscreen'){
      notesFullscreen = !notesFullscreen;

      render();

      focusTaskId = '';
      if(focusState) focusState.taskItemId = null;
      renderFocusOverlay(); return;
    }
    if(action==='focus-pip'){ openFocusPip(); return; }
    if(action==='focus-set-scene'){
      focusSettings.scene = t.dataset.scene; saveFocusSettings(focusSettings); refreshFocusSettings(); return;
    }
    if(action==='focus-set-accent'){
      focusSettings.accent = t.dataset.accent; saveFocusSettings(focusSettings); refreshFocusSettings(); return;
    }
    if(action==='focus-set-ambient'){
      focusSettings.ambient = t.dataset.ambient; saveFocusSettings(focusSettings); refreshFocusSettings(); return;
    }
    if(action==='focus-set-sound'){
      focusSettings.alarmSound = t.dataset.sound; saveFocusSettings(focusSettings);
      refreshFocusSettings(); playFocusChime(); return;
    }
    if(action==='focus-toggle-setting'){
      var fk = t.dataset.key;
      focusSettings[fk] = !focusSettings[fk];
      saveFocusSettings(focusSettings); refreshFocusSettings(); return;
    }
    if(action==='focus-step'){
      var sk = t.dataset.key, delta = Number(t.dataset.delta);
      var next = Object.assign({}, focusSettings);
      next[sk] = (Number(focusSettings[sk])||0) + delta;
      focusSettings = clampFocusSettings(next);
      saveFocusSettings(focusSettings);
      applyFocusDurationChange();
      syncFocusSteppers();
      renderFocusOverlay();
      return;
    }
    if(action==='focus-toggle-pause'){ focusPrimaryAction(); return; }
    if(action==='focus-end'){
      confirmAction('End this focus session?', "You'll lose the current timer progress.", 'End session')
        .then(function(ok){ if(ok) endFocusSession(); });
      return;
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.id === 'hz-file'){ hzUpload(t.files && t.files[0]); return; }
    if(t.matches('[data-action="hz-use-voice"]')){ HZ.useVoice = t.checked; hzPaintMeter(); return; }
    if(t.id === 'item-file-input'){
      if(itemFilePickerId && t.files && t.files.length) uploadFilesToItem(itemFilePickerId, t.files);
      return;
    }
    if(t.matches('[data-action="toggle-item"]')){
      var beforeIt = items.find(function(i){ return i.id===t.dataset.id; });
      var reopenClassId = (beforeIt && beforeIt.classId && document.querySelector('.modal-wide [data-action="open-edit-class"][data-id="'+beforeIt.classId+'"]')) ? beforeIt.classId : null;
      toggleItemDone(t.dataset.id).then(function(){ if(reopenClassId) openClassDetailModal(reopenClassId); }).catch(reportError);
      return;
    }
    if(t.matches('input[data-fx-key]')){
      var ckey = t.getAttribute('data-fx-key');
      var cNext = Object.assign({}, focusSettings);
      cNext[ckey] = Number(t.value);
      focusSettings = clampFocusSettings(cNext);
      saveFocusSettings(focusSettings);
      applyFocusDurationChange();
      t.value = focusSettings[ckey];
      syncFocusSteppers();
      renderFocusOverlay();
      return;
    }
    if(t.id==='f-date'){ syncAformQuick(); return; }
    if(t.id==='f-repeat'){
      var wrap = document.getElementById('f-repeat-until-wrap');
      if(wrap) wrap.style.display = t.checked ? 'flex' : 'none';
      return;
    }
    if(t.matches('[data-sched-field]')){
      var idx = Number(t.dataset.idx);
      var field = t.dataset.schedField;
      if(field==='day') editingSchedule[idx].day = Number(t.value);
      else editingSchedule[idx][field] = t.value;
      return;
    }
    if(t.matches('[data-subtask-field]')){
      var sidx = Number(t.dataset.idx);
      var sfield = t.dataset.subtaskField;
      if(sfield==='done') editingSubtasks[sidx].done = t.checked;
      else editingSubtasks[sidx][sfield] = t.value;
      return;
    }
    if(SI && SI.draft && t.dataset && t.dataset.siKind){
      siFieldInput(t);
      if(t.tagName === 'SELECT' || t.type === 'number') renderSyllabusReview();
      return;
    }
    if(t.id === 'si-file'){
      if(t.files && t.files.length) siUpload(t.files);
      return;
    }
    if(t.id === 'files-drop-class'){
      filesUploadClassId = t.value;
      var dz = document.getElementById('files-drop');
      if(dz) dz.dataset.classid = t.value;
      return;
    }
    if(t.matches('[data-action="focus-pick-task"]')){
      flushFocusTime();   // credit the old task before switching
      focusTaskId = t.value || '';
      if(focusState) focusState.taskItemId = focusTaskId || null;
      renderFocusOverlay();
      return;
    }
    if(t.matches('[data-action="note-set-folder"]')){
      updateNote(t.dataset.id, { folderId: t.value || null }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="material-set-class"]')){
      var movedId = t.dataset.id;
      updateMaterial(movedId, { classId: t.value === INBOX_ID ? null : t.value })
        .then(function(){ openFilePreviewModal(movedId); }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="material-set-folder"]')){
      var refiledId = t.dataset.id;
      updateMaterial(refiledId, { folderId: t.value || null })
        .then(function(){ openFilePreviewModal(refiledId); }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="note-set-class"]')){
      // follow the note to its new home so it stays open in front of you
      flushNoteSave();
      noteMenuOpen = false;
      notesClassId = t.value;
      notesOpenId = t.dataset.id;
      updateNote(t.dataset.id, { classId: t.value === INBOX_ID ? null : t.value }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="toggle-event-kind"]')){
      var ek = t.dataset.kind;
      if(t.checked) hiddenEventTypes.delete(ek); else hiddenEventTypes.add(ek);
      renderView(); paintIcons();
      return;
    }
    if(t.matches('[data-action="asg-select"]')){
      if(t.checked) asgSelected.add(t.dataset.id); else asgSelected.delete(t.dataset.id);
      renderView(); paintIcons();
      return;
    }
    if(t.matches('[data-action="toggle-topic"]')){
      var tcId2 = t.dataset.class;
      toggleTopic(t.dataset.tid, t.checked).then(function(){ refreshClassContext(tcId2); }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="change-material-folder"]')){
      var mcId = t.dataset.class;
      updateMaterial(t.dataset.mid, { folderId: t.value || null })
        .then(function(){ openClassDetailModal(mcId); }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="learn-pick"]')){
      learnAnswer(t.value);
      return;
    }
    if(t.matches('[data-action="test-pick"]')){
      FC.test.answers[t.dataset.id] = t.value;
      // No redraw: it would take the caret and the scroll with it, which is the bug
      // that made the AI quiz unusable before it was fixed the same way.
      return;
    }
    if(t.matches('[data-action="rubric-link-select"]')){
      updateRubric(currentRubric.id, { itemId: t.value || null }).then(function(r){
        currentRubric = r;
        loadState();
      }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="toggle-subtask"]')){
      var it = items.find(function(i){ return i.id===t.dataset.id; });
      if(it){
        var subs = (it.subtasks||[]).map(function(s){ return Object.assign({}, s); });
        var sub = subs.find(function(s){ return s.id===t.dataset.sub; });
        if(sub) sub.done = t.checked;
        var reopenDetail = !!document.querySelector('[data-action="toggle-item-detail"][data-id="'+it.id+'"]');
        updateItem(it.id, { subtasks: subs }).then(function(){
          if(reopenDetail) openItemDetailModal(it.id);
        }).catch(reportError);
      }
      return;
    }
    if(t.matches('[data-action="material-file-input"]')){
      if(t.files && t.files.length){
        var cid = t.dataset.classid;
        var file = t.files[0];
        var guess = guessFileCategory(file.name);
        // Whatever folder is picked in the form wins; with none picked the server
        // files it by the filename guess.
        var folderSel = document.getElementById('mat-folder');
        uploadMaterialFile(file, cid, guess, null, null, folderSel ? folderSel.value : null)
          .then(function(){ openClassDetailModal(cid); }).catch(reportError);
      }
      return;
    }
  });

  var fileDragDepth = 0;
  document.addEventListener('dragenter', function(e){
    if(!e.dataTransfer || !Array.prototype.includes.call(e.dataTransfer.types || [], 'Files')) return;
    fileDragDepth++;
    document.body.classList.add('file-dragging');
  });
  document.addEventListener('dragleave', function(e){
    if(!e.dataTransfer || !Array.prototype.includes.call(e.dataTransfer.types || [], 'Files')) return;
    fileDragDepth = Math.max(0, fileDragDepth - 1);
    if(!fileDragDepth) document.body.classList.remove('file-dragging');
  });
  document.addEventListener('drop', function(){
    fileDragDepth = 0;
    document.body.classList.remove('file-dragging');
  }, true);

  document.addEventListener('dragover', function(e){
    var zone = e.target.closest('.dropzone');
    if(zone){ e.preventDefault(); zone.classList.add('drag'); }
    // Dropping outside a zone must not make the browser navigate to the file.
    else if(e.dataTransfer && Array.prototype.includes.call(e.dataTransfer.types || [], 'Files')) e.preventDefault();
  });
  document.addEventListener('dragleave', function(e){
    var zone = e.target.closest('.dropzone');
    if(zone){ zone.classList.remove('drag'); }
  });
  document.addEventListener('drop', function(e){
    var zone = e.target.closest('.dropzone');
    // Anywhere on the Files page counts: aiming at a small rectangle with a
    // fistful of files is needless precision.
    if(!zone && activeTab === 'files') zone = document.getElementById('files-drop');
    if(!zone) return;
    e.preventDefault();
    zone.classList.remove('drag');
    var files = e.dataTransfer && e.dataTransfer.files;
    if(!files || !files.length) return;
    var cid = zone.dataset.classid || filesDropClassId();
    var wasInModal = !!document.getElementById('modal-root').firstElementChild;
    uploadFilesToClass(cid, files, {
      folderId: zone.dataset.folderid || null,
      onDone: function(){ if(wasInModal && zone.dataset.classid) openClassDetailModal(zone.dataset.classid); }
    });
  });

  document.addEventListener('keydown', function(e){
    // A dialog is modal over everything, so it takes Escape and Enter first.
    if(dialogOpen()){
      if(e.key === 'Escape'){
        e.preventDefault();
        closeDialog(DLG.kind === 'error' || DLG.kind === 'notice' ? true : null);
        return;
      }
      if(e.key === 'Enter'){
        e.preventDefault();
        closeDialog(dialogValue());
        return;
      }
      return;   // nothing else reaches the page while a dialog is up
    }
    // Enter sends in a thread; shift-enter is a newline, as everywhere else.
    if(TH && e.target && e.target.id === 'th-draft' && e.key === 'Enter' && !e.shiftKey){
      e.preventDefault(); threadSend(null, false); return;
    }
    if(learnHandleKey(e)) return;
    if(fcHandleKey(e)) return;
    if(e.key === 'Tab'){
      var ed = e.target.closest && e.target.closest('.rte-editor');
      if(ed){ rteHandleTab(e, ed); return; }
    }
    // Enter on the assignment title saves, the way a one-field form would.
    if(e.key==='Enter' && e.target && e.target.id==='f-title'){
      e.preventDefault();
      var saveBtn = document.querySelector('.aform-modal [data-action="save-item"]');
      if(saveBtn) saveItemFromForm(saveBtn.dataset.id || null);
      return;
    }
    if(hsScreen && hsScreen.kind === 'thread' && TH && (e.metaKey||e.ctrlKey) && e.shiftKey
       && e.key.toLowerCase() === 'f'){
      e.preventDefault(); toggleThreadFull(); return;
    }
    if((e.metaKey||e.ctrlKey) && e.key === '\\'){ e.preventDefault(); setSidebarCollapsed(!sidebarCollapsed); return; }
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openSearch(); return; }
    if(e.key==='Escape'){
      // Escape in the Files search box clears the search rather than doing nothing,
      // which is the other half of never being stranded on a results screen.
      if(e.target && e.target.id === 'files-search' && filesFiltering()){
        clearFilesFilters(); renderView(); paintIcons();
        var esb = document.getElementById('files-search');
        if(esb) esb.focus();
        return;
      }
      if(document.getElementById('search-root').firstElementChild){ closeSearch(); return; }
      if(document.getElementById('modal-root').firstElementChild){ closeModal(); return; }
      if(navOpen){ setNavOpen(false); return; }
      if(notesFullscreen){ notesFullscreen = false; notesZen = false; render(); return; }
      if(activeTab === 'headstart' && hsScreen && hsScreen.kind === 'thread' && TH && threadFullOn()){
        toggleThreadFull(); return;
      }
      closeModal();
    }
  });

  // Cloud autosave reports its own progress, including when it is holding text
  // locally because the network went away.
  if(BE && BE.notes){
    BE.notes.onStatus(function(noteId, state, detail){
      if(state === 'saving'){ noteSaveStatus('Saving…'); return; }
      if(state === 'saved'){
        noteSavedAt = new Date().toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
        noteSaveStatus('Saved ' + noteSavedAt);
        refreshCachedState().catch(function(){});
        return;
      }
      if(state === 'offline'){ noteSaveStatus('Offline — kept on this device'); return; }
      if(state === 'error'){ noteSaveStatus("Couldn't save"); }
    });
  }

  init();
})();
</script>
</body>
</html>

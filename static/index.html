  function triggerLibraryUpload(classId, opts){
    var input = document.createElement('input');
    input.type = 'file';
    input.multiple = true;          // pick as many as you like in one go
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', function(){
      if(input.files && input.files.length) uploadFilesToClass(classId, input.files, opts || {});
      document.body.removeChild(input);
    });
    input.click();
  }

  /**
   * Upload a whole batch to one class.
   *
   * Sequential rather than parallel: a dozen simultaneous multipart posts to a
   * single-threaded dev server is how you get half of them failing. One at a time
   * is barely slower for the sizes involved and every file either lands or reports
   * why it did not.
   */
  var uploadQueueBusy = false;
  function uploadFilesToClass(classId, fileList, opts){
    opts = opts || {};
    var files = Array.prototype.slice.call(fileList || []);
    if(!files.length) return Promise.resolve();
    if(!classId){
      reportError(new Error('Pick a class for these files first.'));
      return Promise.resolve();
    }
    if(uploadQueueBusy){
      reportError(new Error('Still uploading the last batch. Give it a moment.'));
      return Promise.resolve();
    }
    uploadQueueBusy = true;

    var failed = [];
    var done = 0;
    showUploadProgress(0, files.length, files[0].name);

    return files.reduce(function(chain, file){
      return chain.then(function(){
        showUploadProgress(done, files.length, file.name);
        var fd = new FormData();
        fd.append('file', file);
        fd.append('category', guessFileCategory(file.name));
        // An explicit folder means "the one I am standing in". With none, the server
        // files it by the filename guess instead.
        if(opts.folderId) fd.append('folderId', opts.folderId);
        if(opts.itemId) fd.append('itemId', opts.itemId);
        var target = classId === INBOX_ID ? '/api/materials' : '/api/classes/'+classId+'/materials';
        return fetch(target, { method:'POST', body: fd })
          .then(checkOk)
          .then(function(){ done++; })
          .catch(function(err){ failed.push(file.name + ' (' + (err.message||'failed') + ')'); });
      });
    }, Promise.resolve()).then(function(){
      uploadQueueBusy = false;
      hideUploadProgress();
      return loadState().then(function(){
        if(opts.onDone) opts.onDone();
        if(failed.length){
          reportError(new Error(
            done + ' of ' + files.length + ' uploaded. These did not: ' + failed.join(', ')));
        }
      });
    }).catch(function(err){
      uploadQueueBusy = false;
      hideUploadProgress();
      reportError(err);
    });
  }

  function showUploadProgress(done, total, name){
    var el = document.getElementById('upload-toast');
    if(!el){
      el = document.createElement('div');
      el.id = 'upload-toast';
      el.className = 'upload-toast';
      document.body.appendChild(el);
    }
    var pct = total ? Math.round((done / total) * 100) : 0;
    el.innerHTML = '<div class="ut-row"><span class="ut-spin"></span>'
      + '<div><div class="ut-main">Uploading ' + (done + 1) + ' of ' + total + '</div>'
      + '<div class="ut-sub">' + escapeHtml(name || '') + '</div></div></div>'
      + '<div class="ut-bar"><span style="width:' + pct + '%"></span></div>';
    el.classList.add('show');
  }
  function hideUploadProgress(){
    var el = document.getElementById('upload-toast');
    if(el) el.classList.remove('show');
  }

  // ---------------- Files ----------------
  // Navigation is a real tree: All files → a class → a folder → its subfolders.
  // filesFolder holds the class being browsed and filesSubfolder the folder inside
  // it, because a folder belongs to exactly one class and the pair is what a
  // breadcrumb has to rebuild.
  var filesTab = 'all';
  var filesLayout = 'grid';
  var filesSearch = '';
  // What the server found *inside* files for the current query: {query, hits}. The
  // name match is instant and local; this arrives a moment later and is shown under it.
  var filesTextHits = null;
  var filesTextTimer = null;
  var filesFolder = null;         // class id
  var filesSubfolder = null;      // file folder id within that class
  var filesType = 'all';
  var filesWhen = 'any';
  var filesUploadClassId = null;

  /** Which class a drop on the Files page belongs to. */
  function filesDropClassId(){
    return filesUploadClassId
      || filesFolder
      || (classes[0] && classes[0].id)
      || INBOX_ID;
  }

  /** Is anything narrowing the view right now? Drives the Clear button and the banner. */
  function filesFiltering(){
    return !!filesSearch || filesType !== 'all' || filesWhen !== 'any';
  }
  function clearFilesFilters(){
    filesSearch = ''; filesType = 'all'; filesWhen = 'any';
  }

  /**
   * The Files page needs somewhere to drop onto, and a file has to belong to a
   * class, so the class picker sits inside the zone rather than in a dialog
   * afterwards. When a folder is open the drop lands in that folder.
   */
  function filesDropzoneHtml(){
    var current = filesDropClassId();
    var opts = classes.concat([inboxClass()]).map(function(c){
      return '<option value="'+c.id+'"'+(c.id===current?' selected':'')+'>'
        + escapeHtml(c.id===INBOX_ID ? 'Inbox (sort it later)' : (c.code||c.name||''))+'</option>';
    }).join('');
    var here = filesSubfolder ? fileFolderById(filesSubfolder) : null;
    var where = here
      ? '<div class="fd-sub">Landing in <b>'+escapeHtml(here.name||'this folder')+'</b>, or '
      : '<div class="fd-sub">Several at once is fine, or ';
    return '<div class="files-drop dropzone" id="files-drop" data-classid="'+(current||'')+'"'
      + ' data-folderid="'+(here ? here.id : '')+'">'
      + '<div class="fd-ic">'+iconSvg('upload')+'</div>'
      + '<div class="fd-text"><div class="fd-main">Drag files here</div>'
      + where
      + '<button type="button" class="fd-browse" data-action="files-upload-prompt">browse</button></div></div>'
      + (here ? '' : '<label class="fd-class">Into<select id="files-drop-class" data-action="files-drop-class">'+opts+'</select></label>')
      + '</div>';

  var filesStarred = new Set(loadStarredFiles());

  function loadStarredFiles(){
    try{ return JSON.parse(localStorage.getItem('vesta-starred') || '[]'); }catch(e){ return []; }
  }
  function saveStarredFiles(){
    try{ localStorage.setItem('vesta-starred', JSON.stringify(Array.from(filesStarred))); }catch(e){}
  }

  // First match wins, so the specific formats are tested before the general ones.
  // Every Office Open XML type carries the string "officedocument" — a .pptx is
  // application/vnd.openxmlformats-officedocument.presentationml.presentation — so a
  // /document/ test placed first claims slide decks and spreadsheets as documents, and
  // the Slides and Sheets filters then match nothing at all. Keep Document near the end.
  var MIME_LABEL = [
    [/pdf/i, 'PDF'],
    [/presentation|powerpoint|pptx?|odp/i, 'Presentation'],
    [/sheet|excel|xlsx?|csv|ods/i, 'Spreadsheet'],
    [/image|png|jpe?g|gif|webp|svg/i, 'Image'],
    [/zip|compressed/i, 'Archive'],
    [/word|document|docx?|odt|rtf/i, 'Document'],
    [/text|plain/i, 'Text']
  ];
  function fileTypeLabel(m){
    var probe = (m.mimetype||'') + ' ' + (m.filename||m.title||m.url||'');
    if(m.kind!=='file') return 'Link';
    for(var i=0;i<MIME_LABEL.length;i++){ if(MIME_LABEL[i][0].test(probe)) return MIME_LABEL[i][1]; }
    return 'File';
  }
  function fileSizeLabel(m){ return (m.kind==='file' && m.size!=null) ? humanSize(m.size) : '—'; }

  // The type filter groups the labels above into the handful of things worth
  // filtering by. Kept as chips rather than a select so every option is on screen.
  // Labels are short because the group is titled: the row reads "Type: All, PDF, …"
  // rather than repeating the word "type" in the first option.
  var FILE_TYPE_FILTERS = [
    ['all', 'All', null],
    ['pdf', 'PDF', ['PDF']],
    ['doc', 'Docs', ['Document', 'Text']],
    ['slides', 'Slides', ['Presentation']],
    ['sheet', 'Sheets', ['Spreadsheet']],
    ['image', 'Images', ['Image']],
    ['link', 'Links', ['Link']]
  ];
  var FILE_WHEN_FILTERS = [
    ['any', 'Any time', null],
    ['today', 'Today', 1],
    ['week', 'Week', 7],
    ['month', 'Month', 31]
  ];
  function fileMatchesType(m){
    if(filesType === 'all') return true;
    var row = FILE_TYPE_FILTERS.find(function(t){ return t[0]===filesType; });
    return !!row && row[2].indexOf(fileTypeLabel(m)) >= 0;
  }
  function fileMatchesWhen(m){
    if(filesWhen === 'any') return true;
    var row = FILE_WHEN_FILTERS.find(function(t){ return t[0]===filesWhen; });
    if(!row || !m.createdAt) return false;
    var age = (Date.now() - new Date(m.createdAt).getTime()) / 86400000;
    return age >= 0 && age < row[2];
  }
  /** The folder a file shows under, as text. Used by search results and the list view. */
  function fileFolderLabel(m){
    var path = fileFolderPath(m.folderId);
    if(!path.length) return m.cls.id===INBOX_ID ? 'Inbox' : 'Top level';
    return path.map(function(f){ return f.name; }).join(' / ');
  }

  /**
   * What the page should show.
   *
   * Searching is deliberately global: a search that only looked inside the folder
   * you happen to have open is a search that hides the answer. Browsing is the
   * opposite, and shows one folder's own files and nothing nested below it.
   */
  /**
   * Search inside the files themselves.
   *
   * Debounced, because it runs on every keystroke and a phrase is usually several.
   * The local name search never waits for it: the list filters as you type and the
   * "found inside" section fills in underneath when the answer comes back.
   */
  function filesSearchContents(){
    if(filesTextTimer) clearTimeout(filesTextTimer);
    var q = filesSearch.trim();
    if(q.length < 3){ filesTextHits = null; return; }
    filesTextTimer = setTimeout(function(){
      filesTextTimer = null;
      apiGet('/api/search/files?q=' + encodeURIComponent(q)).then(function(r){
        if((r.query || '') !== filesSearch.trim()) return;   // a later keystroke won
        filesTextHits = r;
        if(activeTab === 'files'){ renderView(); paintIcons(); }
      }).catch(function(){ /* the name search still works; no dialog for this */ });
    }, 350);
  }

  /** The files whose contents matched, minus the ones already listed by name. */
  function filesTextOnlyHits(named){
    if(!filesTextHits || (filesTextHits.query || '') !== filesSearch.trim()) return [];
    var already = {};
    named.forEach(function(m){ already[m.id] = true; });
    return (filesTextHits.hits || []).filter(function(h){ return !already[h.id]; });
  }

  function filesInsideSectionHtml(named){
    var extra = filesTextOnlyHits(named);
    if(!filesSearch.trim() || !extra.length) return '';
    return '<h2 class="files-section-h">Found inside files</h2>'
      + '<div class="files-inside">'
      + extra.map(function(h){
          var c = classById(h.classId);
          var name = h.title || h.filename || 'File';
          return '<button type="button" class="files-inside-row" data-action="preview-file" data-id="'+h.id+'">'
            + '<div class="file-ic" style="background:'+fileTypeColor(h.filename||name)+';">'
              + fileTypeInitials(h.filename||name)+'</div>'
            + '<div style="flex:1;min-width:0;">'
            + '<div class="fr-title">'+escapeHtml(name)+'</div>'
            + '<div class="files-inside-snip">'+escapeHtml(h.snippet||'')+'</div>'
            + '<div class="ac-file-meta">'+escapeHtml(c ? (c.code||c.name||'') : 'Inbox')
              + ' \u00b7 '+h.count+' mention'+(h.count===1?'':'s')+'</div>'
            + '</div></button>';
        }).join('')
      + '</div>';
  }

  function filesMatching(){
    var list = allMaterials();
    if(filesTab==='starred'){
      list = list.filter(function(m){ return filesStarred.has(m.id); });
    } else if(filesTab==='recent'){
      list = list.slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).slice(0,20);
    } else if(!filesSearch){
      if(filesFolder) list = list.filter(function(m){ return m.cls.id===filesFolder; });
      if(filesFolder) list = list.filter(function(m){ return (m.folderId||null) === (filesSubfolder||null); });
    }
    if(filesSearch){
      // Every word has to appear somewhere in the file's own text: name, class,
      // folder path or type. Word-by-word so "phil rubric" finds it.
      var words = filesSearch.toLowerCase().split(/\s+/).filter(Boolean);
      list = list.filter(function(m){
        var hay = ((m.title||'')+' '+(m.filename||'')+' '+(m.cls.code||'')+' '+(m.cls.name||'')
                   +' '+fileFolderLabel(m)+' '+fileTypeLabel(m)).toLowerCase();
        return words.every(function(w){ return hay.indexOf(w) >= 0; });
      });
    }
    return list.filter(fileMatchesType).filter(fileMatchesWhen);
  }

  /** The class cards at the top level of All Files. Each one is a drop target. */
  function folderCardsHtml(){
    var counts = {};
    allMaterials().forEach(function(m){ counts[m.cls.id] = (counts[m.cls.id]||0)+1; });
    return '<h2 class="files-section-h">Classes</h2><div class="folder-grid">'
      + classes.concat([inboxClass()]).map(function(c){
          var n = counts[c.id] || 0;
          return '<div class="folder-card" data-action="files-open-folder" data-id="'+c.id+'"'
            + ' data-fdrop="class" data-class="'+c.id+'">'
            + '<div class="folder-ic" style="background:'+c.color+'"></div>'
            + '<div style="flex:1;min-width:0;"><div class="folder-name">'+escapeHtml(c.code||c.name||'Class')+'</div>'
            + '<div class="folder-sub">'+escapeHtml(c.name||'')+'</div>'
            + '<div class="folder-count">'+n+' file'+(n===1?'':'s')+'</div></div>'
            + '<button type="button" class="btn ghost folder-menu" data-action="library-upload" data-class="'+c.id+'" title="Upload to this class">+</button>'
            + '</div>';
        }).join('')
      + '</div>';
  }

  /**
   * The folders sitting inside wherever you are. Each is draggable (to re-nest it)
   * and a drop target (for files and for other folders).
   */
  function subfolderCardsHtml(classId, parentId){
    if(!classId || classId === INBOX_ID) return '';
    var kids = fileFolderChildren(classId, parentId);
    var newBtn = '<button type="button" class="folder-card folder-card-new" data-action="file-folder-new"'
      + ' data-class="'+classId+'" data-parent="'+(parentId||'')+'">'

      + '<div style="flex:1;min-width:0;"><div class="folder-name">New folder</div>'
      + '<div class="folder-sub">inside '+escapeHtml(parentId ? (fileFolderById(parentId)||{}).name||'here' : (classById(classId)||{}).code||'this class')+'</div></div>'
      + '</button>';
    var cards = kids.map(function(f){

      return '<div class="folder-card" data-action="files-open-subfolder" data-id="'+f.id+'"'
        + ' data-fdrop="folder" data-class="'+classId+'" data-folder="'+f.id+'"'
        + ' draggable="true" data-drag="filefolder" data-dragid="'+f.id+'">'
        + '<div class="folder-ic" style="background:'+((classById(classId)||{}).color||'var(--accent)')+'"></div>'
        + '<div style="flex:1;min-width:0;"><div class="folder-name">'+escapeHtml(f.name||'Folder')+'</div>'
        + '<div class="folder-sub">'+(sub ? sub+' folder'+(sub===1?'':'s') : 'No subfolders')+'</div>'
        + '<div class="folder-count">'+n+' file'+(n===1?'':'s')+'</div></div>'
        + '<button type="button" class="btn ghost folder-menu" data-action="file-folder-menu" data-id="'+f.id+'" title="Rename or delete">⋯</button>'
        + '</div>';
    }).join('');
    return '<h2 class="files-section-h">Folders</h2><div class="folder-grid">' + cards + newBtn + '</div>';
  }

  function fileListHtml(list){
    if(list.length===0){
      // "Nothing matches" directly above a list of matches reads as a bug, so when the
      // text search found something the empty state says which search came up empty.
      var insideCount = filesSearch ? filesTextOnlyHits(list).length : 0;
      var why = insideCount
        ? 'No file <em>named</em> that. The ones below have it inside them.'
        : filesFiltering()
        ? 'Nothing matches. <button type="button" class="link-btn" data-action="files-clear-search">Clear the search and filters</button>'
        : 'No files here yet. Drag some in above.';
      return '<div class="card"><div class="empty" style="border:none;box-shadow:none;background:transparent;">'+why+'</div></div>';
    }
    if(filesLayout==='grid'){
      return '<div class="file-grid">' + list.map(function(m){
        var name = m.filename || m.title || m.url;
        return '<div class="file-tile" data-action="preview-file" data-id="'+m.id+'"'
          + ' draggable="true" data-drag="file" data-dragid="'+m.id+'" title="Drag to move into a folder">'
          + '<div class="file-ic file-ic-lg" style="background:'+fileTypeColor(name)+';">'+fileTypeInitials(name)+'</div>'
          + '<div class="file-tile-name">'+escapeHtml(m.title||name)+'</div>'
          + '<div class="file-tile-meta">'+escapeHtml(m.cls.code||'')+' · '+fileSizeLabel(m)+'</div>'
          + (filesSearch ? '<div class="file-tile-where">'+escapeHtml(fileFolderLabel(m))+'</div>' : '')
          + '<button type="button" class="file-star'+(filesStarred.has(m.id)?' on':'')+'" data-action="toggle-star" data-id="'+m.id+'" title="Star">★</button>'
          + '</div>';
      }).join('') + '</div>';
    }
    var head = '<div class="file-row-t file-head"><span>Name</span><span>Class</span><span>Folder</span><span>Type</span><span>Size</span><span>Added</span><span></span></div>';
    var rows = list.map(function(m){

  /**

      ? n + ' file' + (n===1?'':'s') + ' matching “' + escapeHtml(filesSearch) + '”'

      + '<span class="fr-count">'+what+'</span>'+where

      + '</div>';

  // ---------------- Grades (global) ----------------
  // ---------------- Grades ----------------
  var gradesView = 'course';
  // SFU marks on a 4.33 scale, where A+ is worth more than A. D+ and D- are not part
  // of SFU's scale but are kept here so a custom class scale that uses them still maps.
  var GPA_MAX = 4.33;
  var GPA_POINTS = { 'A+':4.33,'A':4.00,'A-':3.67,'B+':3.33,'B':3.00,'B-':2.67,
                     'C+':2.33,'C':2.00,'C-':1.67,'D+':1.33,'D':1.00,'D-':0.67,'F':0.00 };
  function gradePoints(letter){ return GPA_POINTS[letter] != null ? GPA_POINTS[letter] : null; }
  function gradeTier(letter){ return (letter||'').charAt(0).toUpperCase(); }
  function tierTone(letter){
    var t = gradeTier(letter);
    if(t==='A') return ['var(--success-soft)','var(--success)'];
    if(t==='B') return ['#E8EFFE','#2456C7'];
    if(t==='C') return ['var(--warn-soft)','var(--warn)'];
    if(t==='D'||t==='F') return ['var(--danger-soft)','var(--danger)'];
    return ['var(--surface-3)','var(--text-muted)'];
  }

  function classGradeRow(c){
    var st = classGradeStats(c.id);
    var letter = st.currentGrade!=null ? letterForGrade(c, st.currentGrade) : '';
    var tone = tierTone(letter);
    var weighted = items.filter(function(it){ return it.classId===c.id && itemEffectiveWeight(it)!=null; });
    var graded = weighted.filter(function(it){ return isNum(it.score); }).length;
    weighted = weighted.length;
    var lastUpdated = items.filter(function(it){ return it.classId===c.id && it.score!=null; })
      .map(function(it){ return it.dueDate||''; }).sort().pop();
    var pct = st.currentGrade!=null ? Math.round(st.currentGrade) : 0;
    return '<div class="grade-row-t" data-action="open-class-detail" data-id="'+c.id+'">'
      + '<div class="gr-course"><span class="dot" style="--c:'+c.color+'"></span>'
        + '<div style="min-width:0;"><div class="gr-code">'+escapeHtml(c.code||c.name||'')+'</div>'
        + '<div class="gr-name">'+escapeHtml(c.name||'')+'</div>'
        + (c.professor?'<div class="gr-prof">'+escapeHtml(c.professor)+'</div>':'')+'</div></div>'
      + '<div class="gr-grade">'+(letter
          ? '<span class="grade-chip" style="background:'+tone[0]+';color:'+tone[1]+';">'+letter+'</span><div class="gr-pct">'+st.currentGrade.toFixed(0)+'%</div>'
          : '<span class="grade-chip" style="background:var(--surface-3);color:var(--text-muted);">—</span><div class="gr-pct">Not graded</div>')+'</div>'
      + '<div class="gr-progress"><div class="cp-progress-bar"><span style="width:'+pct+'%;background:'+(tone[1])+';"></span></div>'
        + '<span class="gr-progress-pct">'+pct+'%</span></div>'
      + '<div class="cp-dim">'+graded+' / '+weighted+'</div>'
      + '<div class="cp-dim">'+(lastUpdated?fmtDateShort(lastUpdated):'—')+'</div>'
      + '<span class="cp-link-chev">›</span></div>';
  }

  function gradeDistributionHtml(){
    var tiers = ['A','B','C','D','F'];
    var counts = { A:0,B:0,C:0,D:0,F:0 };
    classes.forEach(function(c){
      var st = classGradeStats(c.id);
      if(st.currentGrade==null) return;
      var t = gradeTier(letterForGrade(c, st.currentGrade));
      if(counts[t]!=null) counts[t]++;
    });
    var max = Math.max(1, Math.max.apply(null, tiers.map(function(t){ return counts[t]; })));
    var colors = { A:'#1E9E5C', B:'#7ED0A5', C:'#F0C64E', D:'#F2A0A0', F:'#D9DCE3' };
    return '<div class="card"><div class="card-head"><h2>Grade Distribution</h2></div>'
      + '<div class="dist-row">' + tiers.map(function(t){
          return '<div class="dist-col"><div class="dist-bar" style="background:'+colors[t]+';opacity:'+(counts[t]?1:.35)+';height:'+Math.max(6, counts[t]/max*54)+'px;"></div>'
            + '<div class="dist-n">'+counts[t]+'</div><div class="dist-l">'+t+' range</div></div>';
        }).join('') + '</div></div>';
  }

  // GPA across terms. Loaded once per state load, because it is the only view that
  // needs more than the term you are in.
  var gpaHistory = null;
  var gpaHistoryLoading = false;

  function loadGpaHistory(){
    if(gpaHistoryLoading) return;
    gpaHistoryLoading = true;
    apiGet('/api/history').then(function(terms){
      gpaHistory = terms.map(function(t){
        var gps = (t.classes || []).map(function(c){
          var st = gradeStatsFrom(c, t.items || []);
          if(st.currentGrade == null) return null;
          return { code: c.code || c.name || '', color: c.color,
                   gp: gradePoints(letterForGrade(c, st.currentGrade)) };
        }).filter(function(x){ return x && x.gp != null; });
        return {
          id: t.id, name: t.name, status: t.status,
          classes: gps,
          gpa: gps.length ? gps.reduce(function(a, b){ return a + b.gp; }, 0) / gps.length : null
        };
      });
      gpaHistoryLoading = false;
      renderView();
    }).catch(function(){
      gpaHistoryLoading = false;      // a failed load simply shows this term only
    });
  }

  /**
   * Grade points, this term and every term before it.
   *
   * The cumulative number is the average across every graded course in every term,
   * not an average of term averages: a term with five courses should weigh more than
   * a term with one. Courses with nothing marked yet are left out entirely rather
   * than counted as a zero.
   */
  function gpaHistoryHtml(gpa){
    if(gpaHistory === null){
      loadGpaHistory();
      return gpaThisTermHtml(gpa, 'Working out your other terms…');
    }
    var withGpa = gpaHistory.filter(function(t){ return t.gpa != null; });
    if(withGpa.length <= 1) return gpaThisTermHtml(gpa, '');

    var all = [];
    gpaHistory.forEach(function(t){ t.classes.forEach(function(c){ all.push(c.gp); }); });
    var cume = all.length ? all.reduce(function(a, b){ return a + b; }, 0) / all.length : null;

    return '<div class="card"><div class="card-head"><h2>GPA by Term</h2>'
      + '<span class="hint">out of '+GPA_MAX.toFixed(2)+'</span></div>'
      + (cume != null
          ? '<div class="gpa-cume"><span class="gc-lbl">Cumulative · '+all.length
            + ' graded course'+(all.length===1?'':'s')+'</span>'
            + '<span class="gc-val">'+cume.toFixed(2)+'</span></div>'
          : '')
      + withGpa.map(function(t){
          var now = semester && t.id === semester.id;
          return '<div class="gpa-term'+(now?' is-now':'')+'">'
            + '<span class="gt-name" title="'+escapeHtml(t.name||'')+'">'+escapeHtml(t.name||'Term')+'</span>'
            + '<div class="cp-progress-bar" style="flex:1;"><span style="width:'
              + Math.min(100, t.gpa/GPA_MAX*100)+'%;background:'+(now?'var(--accent)':'var(--text-faint)')+';"></span></div>'
            + '<span class="gt-val">'+t.gpa.toFixed(2)+'</span></div>';
        }).join('')
      + '</div>';
  }

  /** The per-course breakdown for the term on screen. */
  function gpaThisTermHtml(gpa, note){
    var pts = classes.map(function(c){
      var st = classGradeStats(c.id);
      if(st.currentGrade==null) return null;
      return { code:c.code||c.name, gp:gradePoints(letterForGrade(c, st.currentGrade)), color:c.color };
    }).filter(Boolean);
    if(pts.length===0){
      return '<div class="card"><div class="card-head"><h2>Grade Points</h2></div>'
        + '<div class="cp-empty">Add scores to your assignments to see grade points here.</div></div>';
    }
    return '<div class="card"><div class="card-head"><h2>Grade Points</h2>'
      + '<span class="hint">out of '+GPA_MAX.toFixed(2)+'</span></div>'
      + pts.map(function(p){
          return '<div class="gp-row"><span class="dot" style="--c:'+p.color+'"></span>'
            + '<span class="gp-code">'+escapeHtml(p.code)+'</span>'
            + '<div class="cp-progress-bar" style="flex:1;"><span style="width:'
              + Math.min(100, p.gp/GPA_MAX*100)+'%;background:var(--accent);"></span></div>'
            + '<span class="gp-val">'+p.gp.toFixed(2)+'</span></div>';
        }).join('')
      + (note ? '<div class="hint" style="margin-top:8px;">'+escapeHtml(note)+'</div>' : '')
      + '</div>';
  }

  function gradesByAssignmentHtml(){
    var rows = items.slice()
      .sort(function(a,b){ return (b.dueDate||'').localeCompare(a.dueDate||''); });
    if(rows.length===0){
      return '<div class="card"><div class="empty" style="border:none;box-shadow:none;background:transparent;">Nothing tracked yet. Add an assignment to start grading it.</div></div>';
    }
    var head = '<div class="file-row-t file-head"><span>Assignment</span><span>Course</span><span>Type</span><span>Weight</span><span>Score</span><span></span></div>';
    return '<div class="card asg-card">'+head+rows.map(function(it){
      var cls = classById(it.classId);
      return '<div class="file-row-t" data-action="open-item-detail" data-id="'+it.id+'" style="cursor:pointer;">'
        + '<span class="file-name-txt">'+escapeHtml(it.title)+'</span>'
        + '<span class="file-cls">'+(cls?'<span class="dot" style="--c:'+cls.color+'"></span>'+escapeHtml(cls.code||''):'<span class="cp-dim">General</span>')+'</span>'
        + '<span>'+typePillHtml(it.type)+'</span>'
        + '<span>'+inlineNumCell(it, 'weight')+'</span>'
        + '<span>'+inlineNumCell(it, 'score')+'</span>'
        + '<span class="cp-link-chev">›</span></div>';
    }).join('')+'</div>';

  function viewGradesPage(){
    if(classes.length===0) return '<div class="empty">Add a class first to start tracking grades.</div>';

    var withGrades = classes.filter(function(c){ return classGradeStats(c.id).currentGrade!=null; });
    var gps = withGrades.map(function(c){ return gradePoints(letterForGrade(c, classGradeStats(c.id).currentGrade)); }).filter(function(g){ return g!=null; });
    var gpa = gps.length ? (gps.reduce(function(s,g){ return s+g; },0)/gps.length) : null;
    var completed = items.filter(function(it){ return it.status==='done'; }).length;
    var inProgress = withGrades.length;
    var toGrade = items.filter(function(it){ return itemEffectiveWeight(it)!=null && !isNum(it.score); }).length;

    var tiles = '<div class="tiles icon-tiles">'
      + iconTile('chart', '#EFE9FE', '#7C5BD8', gpa!=null?gpa.toFixed(2):'—', 'Term GPA')
      + iconTile('check', 'var(--success-soft)', 'var(--success)', completed, 'Completed')
      + iconTile('focus', 'var(--warn-soft)', 'var(--warn)', inProgress, 'Graded courses')
      + iconTile('assignments', 'var(--accent-soft)', 'var(--accent)', toGrade, 'To Be Graded')
      + '</div>';

    var toggle = '<div class="files-list-head"><h2 class="files-section-h">Course Grades</h2>'
      + '<div class="seg-tabs">'
      + '<button type="button" class="seg-tab'+(gradesView==='course'?' active':'')+'" data-action="grades-view" data-view="course">By Course</button>'
      + '<button type="button" class="seg-tab'+(gradesView==='assignment'?' active':'')+'" data-action="grades-view" data-view="assignment">By Assignment</button>'
      + '</div></div>';

    var body;
    if(gradesView==='assignment'){
      body = gradesByAssignmentHtml();
    } else {
      var head = '<div class="grade-row-t grade-head-t"><span>Course</span><span>Grade</span><span>Progress</span><span>Assignments</span><span>Last Updated</span><span></span></div>';
      body = '<div class="card asg-card">'+head+classes.map(classGradeRow).join('')+'</div>';
    }

    return tiles + toggle + body
      + '<div class="dash-row" style="margin-top:20px;">' + gradeDistributionHtml() + gpaHistoryHtml(gpa) + '</div>';
  }

  // ---------------- Focus (global) ----------------
  function focusStatRowHtml(it){

      + '<span class="u-date mono">'+formatFocusDuration(it.focusSeconds)+'</span>'
      + '</div>';
  }
  function viewFocusPage(){
    var totalSec = items.reduce(function(s,it){ return s+(it.focusSeconds||0); }, 0);
    var byItem = items.filter(function(it){ return (it.focusSeconds||0)>0; })
      .sort(function(a,b){ return (b.focusSeconds||0)-(a.focusSeconds||0); }).slice(0,10);
    var doneToday = (focusCounts.work||0);

    var tiles = '<div class="tiles icon-tiles">'
      + iconTile('focus', 'var(--accent-soft)', 'var(--accent)', '<span id="fx-today-val">'+formatFocusLive(focusCounts.seconds||0)+'</span>', 'Focused today')
      + iconTile('check', 'var(--success-soft)', 'var(--success)', doneToday, 'Sessions today')
      + iconTile('calendar', 'var(--warn-soft)', 'var(--warn)', formatFocusDuration(totalSec), 'Logged to assignments')
      + iconTile('assignments', '#EFE9FE', '#7C5BD8', byItem.length, 'Tracked assignments')

  var editingCats = null;
  function openCategoriesEditorModal(classId){
    var c = classById(classId);

  // ---------------- Modals ----------------
  /** Repaint a modal without losing the reader's place.
   *
   * `innerHTML = ...` destroys the scrolling elements, so their scrollTop goes with
   * them, and the caret goes too. Reading a layout property before restoring forces
   * the reflow that innerHTML defers; without it the element is not scrollable yet
   * and the assignment silently clamps to 0.
   */
  function paintModal(html){
    var root = document.getElementById('modal-root');
    var oldBody = root.querySelector('.modal-body');
    var oldOverlay = root.querySelector('.overlay');
    var keepBody = oldBody ? oldBody.scrollTop : 0;
    var keepOverlay = oldOverlay ? oldOverlay.scrollTop : 0;
    var act = document.activeElement;
    var keepFocus = (act && act.dataset && act.dataset.action)
      ? { action: act.dataset.action, id: act.dataset.id || '',
          start: (typeof act.selectionStart === 'number') ? act.selectionStart : null,
          end: (typeof act.selectionEnd === 'number') ? act.selectionEnd : null }
      : null;

    root.innerHTML = html;

    var body = root.querySelector('.modal-body');
    if(body && keepBody){ void body.scrollHeight; body.scrollTop = keepBody; }
    var overlay = root.querySelector('.overlay');
    if(overlay && keepOverlay){ void overlay.scrollHeight; overlay.scrollTop = keepOverlay; }
    if(keepFocus){
      var sel = '[data-action="'+keepFocus.action+'"]'
              + (keepFocus.id ? '[data-id="'+keepFocus.id+'"]' : '');
      var back = root.querySelector(sel);
      if(back){
        back.focus();
        if(keepFocus.start != null && back.setSelectionRange){
          try{ back.setSelectionRange(keepFocus.start, keepFocus.end); }catch(e){}
        }
      }
    }
  }

  /**
   * A class's folders as a <select>, so a file can be refiled without dragging.
   * Flat, with indentation showing depth: a nested <optgroup> tree is not a thing
   * browsers do, and the path is what identifies a folder anyway.
   */
  function folderSelectOptionsHtml(classId, selectedId){
    var out = ['<option value=""'+(selectedId?'':' selected')+'>Top level</option>'];
    (function walk(parentId, depth){
      fileFolderChildren(classId, parentId).forEach(function(f){
        out.push('<option value="'+f.id+'"'+(f.id===selectedId?' selected':'')+'>'
          + new Array(depth+1).join('— ') + escapeHtml(f.name||'Folder') + '</option>');
        walk(f.id, depth+1);
      });
    })(null, 1);
    return out.join('');
  }

  /** One file inside a class view: open it, refile it, or remove it. */
  function classFileRowHtml(m, c){
    var label = escapeHtml(m.title || m.filename || m.url);
    var titleAttr = m.kind==='file' && m.size!=null ? ' title="'+humanSize(m.size)+'"' : '';
    // The rubric parser only makes sense on a file that is actually a rubric, which
    // is now "lives in the Rubrics folder" rather than "was guessed as one".
    var inRubrics = (fileFolderById(m.folderId)||{}).kind === 'rubrics';
    var rubricBtn = inRubrics
      ? '<button type="button" class="btn ghost" data-action="open-rubric" data-mid="'+m.id+'" data-class="'+c.id+'">Rubric</button>'

  /**
   * Every folder in a class, in tree order, each with its own files and its own
   * drop target. Empty folders are still shown: a folder you cannot see is a folder
   * you cannot drag anything into.
   */
  function classFolderSectionsHtml(c, opts){
    opts = opts || {};
    var mats = c.materials || [];
    var loose = mats.filter(function(m){ return !m.folderId; });
    var html = '';
    if(loose.length){
      html += '<div class="detail-section" data-fdrop="class" data-class="'+c.id+'">'
        + '<h4 class="file-cat-title">Top level</h4>'
        + loose.map(function(m){ return classFileRowHtml(m, c); }).join('')
        + '</div>';
    }
    (function walk(parentId, depth){
      fileFolderChildren(c.id, parentId).forEach(function(f){
        var rows = mats.filter(function(m){ return m.folderId === f.id; });
        // The By Class overview is for reading, so an empty folder is noise there:
        // five classes times seven starting folders is a page of headings and
        // nothing else. The class's own Files tab is where you organise, and it
        // keeps every folder visible so there is always something to drag onto.
        if(opts.hideEmpty && fileFolderCount(f.id) === 0){ walk(f.id, depth+1); return; }
        var path = fileFolderPath(f.id).map(function(x){ return escapeHtml(x.name||''); }).join(' / ');
        html += '<div class="detail-section" data-fdrop="folder" data-class="'+c.id+'" data-folder="'+f.id+'">'
          + '<h4 class="file-cat-title">'+path+' <span class="hint">'+rows.length+'</span></h4>'
          + (rows.length
              ? rows.map(function(m){ return classFileRowHtml(m, c); }).join('')
              : '<div class="hint" style="margin:0 0 4px;">Empty. Drag a file here.</div>')
          + '</div>';
        walk(f.id, depth+1);
      });
    })(null, 0);
    return html;
  }

          return '<button type="button" class="rte-swatch" style="background:'+(c==='transparent'?'var(--surface-2)':c)+'" data-action="rte-cmd" data-cmd="hiliteColor" data-val="'+c+'" title="'+t+'"></button>';
        }).join('')
      + '</div>';

    var listMenu = '<button type="button" data-action="rte-cmd" data-cmd="insertUnorderedList">• Bulleted list</button>'
      + '<button type="button" data-action="rte-cmd" data-cmd="insertOrderedList">1. Numbered list</button>'
      + '<button type="button" data-action="rte-ins" data-ins="checklist">☑ Checklist</button>'

      + '<button type="button" data-action="rte-cmd" data-cmd="indent">→ Increase</button>'

      + '<button type="button" data-action="rte-ins" data-ins="callout" data-val="info">ⓘ Callout</button>'
      + '<button type="button" data-action="rte-ins" data-ins="code">&lt;/&gt; Code block</button>'
      + '<button type="button" data-action="rte-ins" data-ins="math">∑ Equation</button>'
      + '<button type="button" data-action="rte-ins" data-ins="hr">— Divider</button>'
      + '<button type="button" data-action="rte-ins" data-ins="embed">📎 Embed a file</button>'
      + '<div class="rte-dd-label">Formatting</div>'

    return '<div class="rte-toolbar" data-target="'+editorId+'">'

      + g(rteDd('Inter', fontMenu, { title:'Font' }) + rteDd('11', sizeMenu, { title:'Size' }))
      + g(rteBtn('bold','<b>B</b>','Bold')
        + rteBtn('italic','<i>I</i>','Italic')
        + rteBtn('underline','<u>U</u>','Underline')
        + rteBtn('strikeThrough','<s>S</s>','Strikethrough')
        + rteDd('<span style="text-decoration:underline;text-decoration-color:#1D4ED8;text-decoration-thickness:3px;">A</span>', colorMenu, { title:'Colour and highlight' }))
      + g(rteIns('link','🔗','Add link') + rteBtn('unlink','⛓','Remove link') + rteIns('image','🖼','Insert image'))
      + '<span class="rte-grp">'

  // ---- insertion helpers -------------------------------------------------
  // ---- markdown-style shortcuts ------------------------------------------
  // Type the marker, press Tab, get the block. This is how people already write
  // in chat apps and markdown editors, so it needs no explaining.
  var MD_TRIGGERS = [
    { re: /^\s*[*\-+]$/,  apply: function(){ document.execCommand('insertUnorderedList'); } },
    { re: /^\s*1\.$/,     apply: function(){ document.execCommand('insertOrderedList'); } },
    { re: /^\s*\[\s*\]$/, apply: function(ed){ rteInsertCommand(ed, 'checklist'); } },
    { re: /^\s*#$/,       apply: function(){ document.execCommand('formatBlock', false, 'H1'); } },
    { re: /^\s*##$/,      apply: function(){ document.execCommand('formatBlock', false, 'H2'); } },
    { re: /^\s*###$/,     apply: function(){ document.execCommand('formatBlock', false, 'H3'); } },
    { re: /^\s*>$/,       apply: function(){ document.execCommand('formatBlock', false, 'BLOCKQUOTE'); } },
    { re: /^\s*```$/,     apply: function(){ document.execCommand('formatBlock', false, 'PRE'); } },
    { re: /^\s*---$/,     apply: function(ed){ rteInsertCommand(ed, 'hr'); } }
  ];

  /** The block-level element the caret sits in, directly under the editor. */
  function rteBlockOf(editor, node){
    var el = node && node.nodeType === 1 ? node : (node && node.parentNode);
    while(el && el !== editor){
      if(el.parentNode === editor) return el;
      el = el.parentNode;
    }
    return null;
  }

  function rteHandleTab(e, editor){
    var sel = window.getSelection();
    if(!sel || !sel.rangeCount) return;
    var block = rteBlockOf(editor, sel.anchorNode);
    var text = block ? block.textContent.replace(/ /g, ' ') : '';
    var trigger = block && MD_TRIGGERS.find(function(t){ return t.re.test(text); });

    if(trigger){
      e.preventDefault();
      // clear the marker, then put the caret back where it was
      block.textContent = '';
      var range = document.createRange();
      range.setStart(block, 0);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      trigger.apply(editor);
      rteChanged(editor);
      syncBlockLabel(editor);
      return;
    }

    // Tab must never move focus out of a document. Inside a list it changes the
    // level, which is what it does in every other editor.
    e.preventDefault();
    var inList = sel.anchorNode && rteClosestTag(sel.anchorNode, 'LI');
    if(inList){
      document.execCommand(e.shiftKey ? 'outdent' : 'indent');
      rteChanged(editor);
      return;
    }
    if(!e.shiftKey){
      document.execCommand('insertHTML', false, '&nbsp;&nbsp;&nbsp;&nbsp;');
      rteChanged(editor);
    }
  }

  function rteClosestTag(node, tag){
    var el = node.nodeType === 1 ? node : node.parentNode;
    while(el){
      if(el.tagName === tag) return el;
      el = el.parentNode;
    }
    return null;
  }

  function closeRteMenus(){
    document.querySelectorAll('.rte-dd.open').forEach(function(el){ el.classList.remove('open'); });
  }
  function fontOrSize(ed){ return ed; }

  /**
   * execCommand('fontName') leaves <font face="...">, which is deprecated markup
   * that styles badly and bloats the saved note. Apply it, then swap the tags for
   * a span carrying the style, which is what everything else in the note uses.
   */
  /**
   * Sweep up any <font> the browser left behind and turn it into a span with the
   * equivalent style. These tags were removed from HTML years ago, they ignore the
   * note's own styling, and they make the saved document larger than it needs to be.
   */
  function rteTidyFontTags(editor){
    editor.querySelectorAll('font').forEach(function(f){
      var span = document.createElement('span');
      if(f.getAttribute('color')) span.style.color = f.getAttribute('color');
      if(f.getAttribute('face'))  span.style.fontFamily = "'" + f.getAttribute('face') + "', sans-serif";
      if(f.getAttribute('size'))  span.style.fontSize = FONT_SIZE_PX[f.getAttribute('size')] || null;
      while(f.firstChild) span.appendChild(f.firstChild);
      f.parentNode.replaceChild(span, f);
    });
  }
  var FONT_SIZE_PX = { '1':'10px','2':'13px','3':'16px','4':'18px','5':'24px','6':'32px','7':'48px' };

  function rteApplyFont(editor, family){
    editor.focus();
    try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
    try{ document.execCommand('fontName', false, family); }catch(e){}
    rteTidyFontTags(editor);
    rteChanged(editor);
  }

  /**
   * The browser only understands font sizes 1 to 7, which do not map to points.
   * Apply the largest, then rewrite those exact tags to the size actually asked
   * for. Size 7 is used as the marker because nothing else in a note uses it.
   */
  function rteApplySize(editor, px){
    editor.focus();
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    try{ document.execCommand('fontSize', false, '7'); }catch(e){}
    editor.querySelectorAll('font[size="7"]').forEach(function(f){
      var span = document.createElement('span');
      span.style.fontSize = px + 'px';
      while(f.firstChild) span.appendChild(f.firstChild);
      f.parentNode.replaceChild(span, f);
    });
    rteTidyFontTags(editor);
    try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
    rteChanged(editor);
  }

  /** Keep the "Normal text" control showing whatever block the caret is inside. */
  function syncBlockLabel(editor){
    var label = document.getElementById('rte-block-label');
    if(!label) return;
    var node = window.getSelection && window.getSelection().anchorNode;
    if(!node || !editor.contains(node)){ return; }
    var el = node.nodeType === 1 ? node : node.parentNode;
    while(el && el !== editor){
      var match = RTE_BLOCKS.find(function(b){ return b.tag === el.tagName; });
      if(match){ label.textContent = match.label; return; }
      el = el.parentNode;
    }
    label.textContent = 'Normal text';
  }

  function rteEditorFor(el){
    var bar = el.closest('.rte-toolbar');
    return bar ? document.getElementById(bar.dataset.target) : null;
  }
  function rteInsert(editor, html){
    editor.focus();
    try { document.execCommand('insertHTML', false, html); }
    catch(e){ editor.insertAdjacentHTML('beforeend', html); }
    rteChanged(editor);
  }
  /** Tell the autosave that the document changed, since execCommand fires no input event reliably. */
  function rteChanged(editor){
    editor.dispatchEvent(new Event('input', { bubbles: true }));
  }

  var RTE_CALLOUT_ICON = { info:'ⓘ', warn:'⚠', good:'✓' };

  function rteInsertCommand(editor, kind, val){
    if(kind === 'checklist'){
      rteInsert(editor, '<ul class="rte-check"><li data-done="0">'
        + '<input type="checkbox" contenteditable="false">'
        + '<span>&nbsp;</span></li></ul><p><br></p>');
      return;
    }
    if(kind === 'callout'){
      var tone = val || 'info';
      rteInsert(editor, '<div class="rte-callout" data-tone="'+tone+'">'
        + '<span class="rte-callout-ic" contenteditable="false">'+(RTE_CALLOUT_ICON[tone]||'ⓘ')+'</span>'
        + '<div>Write the callout here</div></div><p><br></p>');
      return;
    }
    if(kind === 'code'){
      // insertHTML rewrites <pre> into a styled span in Chrome, so turn the
      // current block into one instead. That is what formatBlock is for, and it
      // stays on the browser's own undo stack.
      editor.focus();
      try{ document.execCommand('formatBlock', false, 'PRE'); }catch(e){}
      rteChanged(editor);
      return;
    }
    if(kind === 'hr'){
      rteInsert(editor, '<hr><p><br></p>');
      return;
    }
    if(kind === 'link'){
      var sel = String(window.getSelection());
      askForText('Insert a link', { label:'Address', value:'https://', confirmLabel:'Insert' })
        .then(function(url){
          if(!url) return;
          url = rteSafeUrl(url);
          if(!url){ reportError(new Error('That link is not a web address.')); return; }
          editor.focus();
          if(sel){ try{ document.execCommand('createLink', false, url); }catch(e){} rteChanged(editor); }
          else { rteInsert(editor, '<a href="'+escapeHtml(url)+'" target="_blank" rel="noopener noreferrer">'+escapeHtml(url)+'</a>&nbsp;'); }
        });
      return;
    }
    if(kind === 'image'){
      askForText('Insert an image', { label:'Image address', placeholder:'https://…', confirmLabel:'Insert' })
        .then(function(src){
          if(!src) return;
          src = rteSafeUrl(src, true);
          if(!src){ reportError(new Error('That is not an image address I can load.')); return; }
          rteInsert(editor, '<img src="'+escapeHtml(src)+'" alt=""><p><br></p>');
        });
      return;
    }
    if(kind === 'table'){
      askForFields('Insert a table', [
        { id:'cols', label:'Columns', value:'3' },
        { id:'rows', label:'Rows, not counting the header', value:'3' }
      ], { confirmLabel:'Insert' }).then(function(v){
        if(!v) return;
        var cols = Math.max(1, Math.min(8, Number(v.cols) || 3));
        var rows = Math.max(1, Math.min(20, Number(v.rows) || 3));
        var head = '<tr>' + new Array(cols+1).join('<th>Heading</th>') + '</tr>';
        var body = '';
        for(var r=0;r<rows;r++){ body += '<tr>' + new Array(cols+1).join('<td><br></td>') + '</tr>'; }
        rteInsert(editor, '<table><thead>'+head+'</thead><tbody>'+body+'</tbody></table><p><br></p>');
      });
      return;
    }
    if(kind === 'math'){
      askForText('Insert an equation', { label:'LaTeX',
        placeholder:'E = mc^2', message:'For example  E = mc^2  or  \\frac{a}{b}',
        confirmLabel:'Insert' }).then(function(tex){
        if(!tex) return;
        var block = tex.length > 24;
        rteInsert(editor, '<span class="rte-math raw'+(block?' block':'')+'" contenteditable="false"'
          + ' data-tex="'+escapeHtml(tex)+'">'+escapeHtml(tex)+'</span>'+(block?'<p><br></p>':'&nbsp;'));
        renderMathIn(editor);
      });
      return;
    }
    if(kind === 'embed'){
      openEmbedFilePicker(editor);
      return;
    }
  }

  // ---- equations -------------------------------------------------------
  // The LaTeX itself is what gets stored, in data-tex. KaTeX is fetched only the
  // first time a note actually contains an equation, and if it never arrives the
  // note still shows the LaTeX rather than an empty gap.
  var katexState = 'idle';
  var katexPromise = null;
  function ensureKatex(){
    if(katexState === 'ready')  return Promise.resolve(true);
    if(katexState === 'failed') return Promise.resolve(false);
    if(katexPromise) return katexPromise;
    katexState = 'loading';
    katexPromise = new Promise(function(resolve){
      var css = document.createElement('link');
      css.rel = 'stylesheet';
      css.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';
      document.head.appendChild(css);
      var sc = document.createElement('script');
      sc.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';
      sc.onload  = function(){ katexState = 'ready';  resolve(true); };
      sc.onerror = function(){ katexState = 'failed'; resolve(false); };
      document.head.appendChild(sc);
    });
    return katexPromise;
  }
  function renderMathIn(root){
    var host = root || document;
    var nodes = host.querySelectorAll ? host.querySelectorAll('.rte-math[data-tex]') : [];
    if(!nodes.length) return;
    ensureKatex().then(function(ok){
      if(!ok) return;
      Array.prototype.forEach.call(nodes, function(el){
        try{
          window.katex.render(el.getAttribute('data-tex'), el, {
            throwOnError: false,
            displayMode: el.classList.contains('block')
          });
          el.classList.remove('raw');
        }catch(err){ /* leave the LaTeX showing */ }
      });
    });
  }

  /**
   * What actually gets stored for a note.
   *
   * Rendered equations are hundreds of elements of KaTeX markup. Only the LaTeX
   * is worth keeping, so it is put back before saving. The note stays small and
   * re-renders identically next time.
   */
  function noteHtmlForSave(editor){
    var clone = editor.cloneNode(true);
    Array.prototype.forEach.call(clone.querySelectorAll('.rte-math[data-tex]'), function(el){
      el.textContent = el.getAttribute('data-tex');
      el.className = 'rte-math raw' + (el.classList.contains('block') ? ' block' : '');
    });
    return clone.innerHTML;
  }

  // ---- embedding a file in a note ---------------------------------------
  // The embed is a reference, never a copy: one file on disk, named from as many
  // notes as you like. The picker reaches every class because a note about an essay
  // routinely wants a rubric or reading that lives somewhere else.
  var embedTargetEditorId = null;
  var embedPickerSearch = '';

  function embedPickerRowsHtml(){
    var cls = notesActiveClass();
    var q = embedPickerSearch.toLowerCase();
    var files = allMaterials().filter(function(m){
      if(m.kind !== 'file') return false;
      if(!q) return true;
      return ((m.title||'')+' '+(m.filename||'')+' '+(m.cls.code||'')+' '+fileFolderLabel(m))
        .toLowerCase().indexOf(q) >= 0;
    });
    // This class first: it is what you usually want, without hiding the rest.
    files.sort(function(a,b){
      var an = (cls && a.cls.id===cls.id) ? 0 : 1, bn = (cls && b.cls.id===cls.id) ? 0 : 1;
      return an-bn || (b.createdAt||'').localeCompare(a.createdAt||'');
    });
    if(!files.length){
      return '<div class="hint">'+(embedPickerSearch ? 'No file matches that.' : 'No uploaded files yet. Add one on the Files page first.')+'</div>';
    }
    return files.map(function(m){
      var name = m.filename || m.title || 'File';
      return '<button type="button" class="material-row" style="width:100%;text-align:left;cursor:pointer;background:none;border:none;"'
        + ' data-action="rte-embed-pick" data-mid="'+m.id+'">'
        + '<div class="file-ic" style="background:'+fileTypeColor(name)+';">'+fileTypeInitials(name)+'</div>'
        + '<span style="flex:1;min-width:0;"><span style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'
          + escapeHtml(m.title || name)+'</span>'
        + '<span class="hint">'+escapeHtml((m.cls.code||'Inbox')+' · '+fileFolderLabel(m))+'</span></span>'
        + '<span class="hint">'+(m.size!=null?humanSize(m.size):'')+'</span></button>';
    }).join('');
  }

  function openEmbedFilePicker(editor){
    if(editor) embedTargetEditorId = editor.id;
    embedPickerSearch = '';
    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>Embed a file</h2></div>'
      + '<div class="modal-body"><div class="hint" style="margin-bottom:10px;">'
      + 'The note points at the file. Nothing is copied, so there is still one file, '
      + 'and opening it from here opens it inside Vesta.</div>'
      + '<div class="input-search" style="margin-bottom:10px;"><span class="ic" data-icon="search"></span>'
      + '<input type="text" id="embed-search" placeholder="Search every class..." autocomplete="off"></div>'
      + '<div id="embed-rows">' + embedPickerRowsHtml() + '</div></div>'
      + '<div class="modal-foot"><span></span><div class="right">'
      + '<button class="btn" data-action="modal-close">Cancel</button></div></div></div></div>';
    paintIcons(document.getElementById('modal-root'));
    var box = document.getElementById('embed-search');
    if(box) box.focus();
  }

  function rteEmbedFile(materialId){
    var editor = embedTargetEditorId ? document.getElementById(embedTargetEditorId) : null;
    var m = allMaterials().find(function(x){ return x.id === materialId; });
    if(!editor || !m) return;
    var name = m.filename || m.title || 'File';
    closeModal();
    // No href: clicking opens Vesta's own preview rather than leaving the app.
    rteInsert(editor, '<a class="rte-embed" contenteditable="false" href="#"'
      + ' data-action="preview-file" data-id="'+escapeHtml(m.id)+'"'
      + ' data-file-id="'+escapeHtml(m.fileId||m.id)+'">'
      + '<span class="file-ic" style="background:'+fileTypeColor(name)+';">'+fileTypeInitials(name)+'</span>'
      + '<span>'+escapeHtml(m.title || name)+'</span></a><p><br></p>');
    // Record the connection properly as well, not just as markup in the body, so
    // the file shows under "What this note is about" and survives an edit that
    // deletes the chip. Both backends, not just the cloud one.
    if(notesOpenId){
      addNoteLink(notesOpenId, { type:'file', id: m.fileId || m.id }).catch(function(){});
    }
  }

  /** Only allow links the browser can actually follow, never javascript: or data:. */
  function rteSafeUrl(raw, imageOk){
    var url = String(raw || '').trim();
    if(!url) return null;
    if(/^(https?:)?\/\//i.test(url) || url.charAt(0) === '/') {
      if(/^\/\//.test(url)) url = 'https:' + url;
      return url;
    }
    if(imageOk && /^data:image\//i.test(url)) return url;
    if(/^[a-z][a-z0-9+.-]*:/i.test(url)) return null;   // some other scheme, refuse it
    return 'https://' + url;
  }

  function rteBlockHtml(editorId, initialHtml, placeholder){
    return rteToolbarHtml(editorId)
      + '<div class="rte-editor" id="'+editorId+'" contenteditable="true" data-placeholder="'+escapeHtml(placeholder||'')+'">'+(initialHtml||'')+'</div>';
  }

  // ---------------- Notes workspace ----------------
  var notesClassId = null;
  var notesOpenId = null;
  var notesOpenFolders = {};
  var noteSaveTimer = null;
  var noteSavedAt = null;

  function notesActiveClass(){
    if(notesClassId && classById(notesClassId)) return classById(notesClassId);
    return classes[0] || null;
  }
  function notesForClass(c){
    return (c.notesList||[]).slice().sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
  }
  function noteDisplayTitle(n){
    if(n.title) return n.title;
    var t = stripHtml(n.text).trim();
    return t ? t.slice(0,44) : 'Untitled note';
  }

  // Folder kinds get their own colour and glyph, because a course's folders are
  // nearly always the same handful and recognising them by shape is faster than
  // reading every name.
  var FOLDER_KINDS = [
    { key:'lecture',    label:'Lectures',    glyph:'▤', color:'#3576D9' },
    { key:'reading',    label:'Readings',    glyph:'▥', color:'#1DA6A0' },
    { key:'exam',       label:'Exam prep',   glyph:'!',  color:'#E0568F' },
    { key:'assignment', label:'Assignments', glyph:'◆', color:'#E0693C' },
    { key:'custom',     label:'Folder',      glyph:'▸', color:'#F5B301' }
  ];
  function folderKind(f){
    var k = (f && f.kind) || 'custom';
    return FOLDER_KINDS.find(function(x){ return x.key===k; }) || FOLDER_KINDS[4];
  }

  function noteTreeHtml(c){
    var all = notesForClass(c).filter(function(n){ return !n.deletedAt; });
    var folders = (c.noteFolders || []).slice()
      .sort(function(a,b){ return (a.sortOrder||0)-(b.sortOrder||0) || (a.name||'').localeCompare(b.name||''); });

    var q = (notesSearch || '').trim().toLowerCase();
    var matches = null;
    if(q){
      matches = all.filter(function(n){
        return (n.title||'').toLowerCase().indexOf(q) > -1
            || stripHtml(n.text||'').toLowerCase().indexOf(q) > -1;
      });
    }

    var html = '<div class="nt-classhead">'
      + '<span class="dot" style="--c:'+(c.color||'var(--none)')+'"></span>'
      + '<div><div class="nt-classhead-code">'+escapeHtml(c.code||c.name||'')+'</div>'
      + '<div class="nt-classhead-name">'+escapeHtml(c.name||'')+'</div></div></div>'
      + '<div class="nt-head">'
      + '<button type="button" class="nt-link-action" data-action="note-new" data-class="'+c.id+'">＋ New note</button>'
      + '<button type="button" class="nt-iconbtn" data-action="note-trash-open" title="Trash"'
        + ' aria-label="Trash">'+iconSvg('trash')+'</button>'
      + '</div>'
      + '<div class="nt-toolrow">'
      + '<span class="nt-search-box"><span class="ic">'+iconSvg('search')+'</span>'
      + '<input type="search" id="nt-search" class="nt-search" placeholder="Search notes…" value="'+escapeHtml(notesSearch||'')+'"></span>'
      + '<button type="button" class="nt-iconbtn" data-action="note-filter" title="Show pinned and starred only">'
      + (notesFilterFlagged ? '★' : '⚟') + '</button>'
      + '</div>';

    // While searching, the tree collapses to a flat list of what matched.
    if(matches){
      html += '<div class="nt-found">'+matches.length+' match'+(matches.length===1?'':'es')+'</div>';
      html += matches.length
        ? matches.map(function(n){ return noteTreeItemHtml(n, q); }).join('')
        : '<div class="nt-empty" style="padding:14px 4px;">Nothing matched.</div>';
      return html;
    }

    if(notesFilterFlagged){
      all = all.filter(function(n){ return n.pinned || n.starred; });
    }
    var pinned = all.filter(function(n){ return n.pinned; });
    if(pinned.length){
      html += '<div class="nt-section">Pinned</div>'
        + pinned.map(function(n){ return noteTreeItemHtml(n); }).join('');
    }
    var starred = all.filter(function(n){ return n.starred && !n.pinned; });
    if(starred.length){
      html += '<div class="nt-section">Starred</div>'
        + starred.map(function(n){ return noteTreeItemHtml(n); }).join('');
    }

    var byParent = {};
    folders.forEach(function(f){
      var k = f.parentId || '__root__';
      (byParent[k] = byParent[k] || []).push(f);
    });

    function renderFolder(f, depth){
      var kids = byParent[f.id] || [];
      var inFolder = all.filter(function(n){ return n.folderId===f.id && !n.pinned && !n.starred; });
      var total = inFolder.length + kids.reduce(function(sum, k){ return sum + countIn(k); }, 0);
      var open = notesOpenFolders[f.id] !== false;
      var kind = folderKind(f);
      var out = '<div class="nt-folder" data-depth="'+depth+'" style="--depth:'+depth+';">'
        + '<div class="nt-folder-head" data-action="note-folder-toggle" data-id="'+f.id+'"'
          + ' data-drop="folder" data-folder="'+f.id+'">'
        + '<span class="nt-chev">'+(open?'⌄':'›')+'</span>'
        + '<span class="nt-folder-ic" style="background:'+kind.color+'" title="'+kind.label+'"></span>'
        + '<span class="nt-folder-name" data-action="note-folder-rename" data-id="'+f.id+'" title="Rename">'+escapeHtml(f.name)+'</span>'
        + '<span class="nt-count">'+total+'</span>'
        + '<button type="button" class="nt-folder-x" data-action="note-folder-new" data-class="'+(f.classId||c.id)+'" data-parent="'+f.id+'" title="New subfolder">+</button>'
        + '<button type="button" class="nt-folder-x" data-action="note-folder-delete" data-id="'+f.id+'" title="Delete folder">✕</button>'
        + '</div>';
      if(open){
        out += '<div class="nt-folder-body">'
          + kids.map(function(k){ return renderFolder(k, depth+1); }).join('')
          + (inFolder.length ? inFolder.map(function(n){ return noteTreeItemHtml(n); }).join('')
             : (kids.length ? '' : '<div class="nt-empty">Empty</div>'))
          + '</div>';
      }
      return out + '</div>';
    }
    function countIn(f){
      var kids = byParent[f.id] || [];
      return all.filter(function(n){ return n.folderId===f.id; }).length
        + kids.reduce(function(s,k){ return s + countIn(k); }, 0);
    }

    (byParent['__root__'] || []).forEach(function(f){ html += renderFolder(f, 0); });

    var loose = all.filter(function(n){
      return !n.pinned && !n.starred
        && (!n.folderId || !folders.some(function(f){ return f.id===n.folderId; }));
    });
    if(c.id === INBOX_ID){
      // folders belong to a class, so the Inbox is just a list
      html += loose.map(function(n){ return noteTreeItemHtml(n); }).join('');
    } else {
      html += '<div class="nt-folder"><div class="nt-loose-label" data-drop="folder" data-folder="">Unfiled</div>'
        + '<div class="nt-folder-body">'
        + (loose.length ? loose.map(function(n){ return noteTreeItemHtml(n); }).join('')
           : '<div class="nt-empty">Drop a note here to unfile it</div>')
        + '</div></div>';
    }

    if(all.length===0 && folders.length===0){
      html += '<div class="nt-empty" style="padding:14px 4px;">No notes yet. Hit + New to start one.</div>';
    }
    if(c.id !== INBOX_ID){
      html += '<div class="nt-newfolder-row">'
        + '<button type="button" class="nt-link-action" data-action="note-folder-new" data-class="'+c.id+'">＋ New folder</button>'
        + '</div>';
    }
    return html;
  }

  function noteTreeItemHtml(n, highlight){
    var title = noteDisplayTitle(n);
    var shown = escapeHtml(title);
    if(highlight){
      var i = title.toLowerCase().indexOf(highlight);
      if(i > -1){
        shown = escapeHtml(title.slice(0,i)) + '<mark>' + escapeHtml(title.slice(i, i+highlight.length))
              + '</mark>' + escapeHtml(title.slice(i+highlight.length));
      }
    }
    return '<div class="nt-item'+(notesOpenId===n.id?' active':'')+'" data-action="note-open" data-id="'+n.id+'"'
      + ' draggable="true" data-drag="note">'
      + '<span class="nt-item-ic">'+iconSvg('notes')+'</span>'
      + '<span class="nt-item-title">'+shown+'</span>'
      + (n.pinned ? '<span class="nt-flag" title="Pinned">📌</span>' : '')
      + (n.starred ? '<span class="nt-flag" title="Starred">★</span>' : '')
      + '</div>';
  }

  function noteEditorHtml(c){

      + '<span class="cp-menu-wrap">'
      + '<button type="button" class="btn nt-share" data-action="note-share">Share</button>'

          + '<button type="button" data-action="note-copy" data-id="'+n.id+'">Copy the text</button>'

          + '<button type="button" data-action="note-links-open" data-id="'+n.id+'">'
            + 'What this is about'+(noteLinkCount ? ' ('+noteLinkCount+')' : '')+'</button>'
          + '<div class="cp-menu-label">Where it lives</div>'
          + '<div class="rte-dd-label" style="padding:2px 10px 2px;">Class</div>'
          + '<select class="nt-folder-select" style="width:calc(100% - 16px);margin:0 8px 8px;"'
            + ' data-action="note-set-class" data-id="'+n.id+'">'
            + classes.concat([inboxClass()]).map(function(o){
                return '<option value="'+o.id+'"'+(o.id===c.id?' selected':'')+'>'
                  + escapeHtml(o.id===INBOX_ID ? 'Inbox (no class)' : (o.code||o.name||''))+'</option>';
              }).join('')
            + '</select>'
          + (c.id === INBOX_ID ? '' :
              '<div class="rte-dd-label" style="padding:2px 10px 2px;">Folder</div>'
            + '<select class="nt-folder-select" style="width:calc(100% - 16px);margin:0 8px 8px;"'
              + ' data-action="note-set-folder" data-id="'+n.id+'">'+folderOpts+'</select>')
          + '<div class="cp-menu-sep"></div>'
          + '<button type="button" class="danger" data-action="remove-note" data-class="'+c.id+'" data-nid="'+n.id+'">Move to Trash</button>'
          + '</span>' : '')
      + '</span>'
      + '<button type="button" class="btn" data-action="note-fullscreen" title="'
        + (notesFullscreen ? 'Leave full screen (Esc)' : 'Write full screen') + '">'
        + (notesFullscreen ? '⤡' : '⤢') + '</button>'
      + (notesFullscreen
          ? '<button type="button" class="btn" data-action="note-zen">'
            + (notesZen ? 'Show list' : 'Hide list') + '</button>'
          : '')
      + '</div></div>'
      + rteToolbarHtml('nt-body', { classId: c.id })
      + '<input type="text" class="nt-title" id="nt-title" data-id="'+n.id+'" placeholder="Untitled note" value="'+escapeHtml(n.title||'')+'">'
      + '<div class="nt-meta">'+escapeHtml(c.code||c.name||'')+'  |  '+(n.updatedAt?fmtDate(n.updatedAt.slice(0,10)):'')
      + (linked ? ' · linked to <span class="class-chip" style="--c:'+c.color+'">'+escapeHtml(linked.title)+'</span>' : '')+'</div>'
      + '<hr class="nt-title-rule">'
      + '<div id="nt-suggest" class="nt-suggest" data-note="'+n.id+'">'+noteSuggestHtml(n.id)+'</div>'
      + '<div class="rte-editor nt-body" id="nt-body" contenteditable="true" data-note-id="'+n.id+'" data-placeholder="Start writing…">'+(n.text||'')+'</div>';

  var notesSearch = '';
  var notesFilterFlagged = false;
  var noteMenuOpen = false;
  var noteShareOpen = false;
  var noteLinkCount = 0;
  var notesFullscreen = false;

  /**

   * were in and how many others there were; the pills answer both at a glance and
   * switch in one click.

      + '<button type="button" class="nt-back" data-action="notes-all">← All Notes</button>'
      + '<span class="nt-class-pills">'
      + classes.concat([inboxClass()]).map(function(o){
          var n = (o.notesList||[]).filter(function(x){ return !x.deletedAt; }).length;
          return '<button type="button" class="nt-class-pill'+(o.id===c.id?' active':'')+'"'
            + ' data-action="notes-pick-class" data-id="'+o.id+'">'
            + '<span class="dot" style="--c:'+(o.color||'var(--none)')+'"></span>'

            + (n ? '<span class="nt-count">'+n+'</span>' : '')
            + '</button>';
        }).join('')

  // ---- folder create / rename ----
  function openFolderModal(opts){
    var f = opts.folder || null;
    var classId = opts.classId;
    var cls = classes.find(function(x){ return x.id===classId; });
    var all = (cls && cls.noteFolders) || [];
    var parentId = f ? (f.parentId || '') : (opts.parentId || '');

    // A folder cannot be moved inside itself or its own descendants.
    var banned = {};
    if(f){
      banned[f.id] = true;
      var changed = true;
      while(changed){
        changed = false;
        all.forEach(function(x){
          if(!banned[x.id] && x.parentId && banned[x.parentId]){ banned[x.id] = true; changed = true; }
        });
      }
    }
    var parentOpts = '<option value="">Top level</option>' + all.filter(function(x){ return !banned[x.id]; })
      .map(function(x){
        return '<option value="'+x.id+'"'+(parentId===x.id?' selected':'')+'>'+escapeHtml(x.name)+'</option>';
      }).join('');
    var kindOpts = FOLDER_KINDS.map(function(k){
      var sel = (f ? f.kind : 'custom') === k.key ? ' selected' : '';
      return '<option value="'+k.key+'"'+sel+'>'+k.label+'</option>';
    }).join('');

    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'+(f?'Rename folder':'New folder')+'</h2></div>'
      + '<div class="modal-body">'
      + '<label class="field">Name<input type="text" id="f-folder-name" placeholder="Lectures" value="'
        + escapeHtml(f ? f.name : '') + '"></label>'
      + '<label class="field" style="margin-top:10px;">Type<select id="f-folder-kind">'+kindOpts+'</select></label>'
      + '<label class="field" style="margin-top:10px;">Inside<select id="f-folder-parent">'+parentOpts+'</select></label>'
      + '<div class="hint" style="margin-top:8px;">Type only changes the colour and icon. Folders can hold other folders.</div>'
      + '</div>'
      + '<div class="modal-foot"><span></span><div class="right">'
      + '<button class="btn" data-action="modal-close">Cancel</button>'
      + '<button class="btn primary" data-action="folder-save" data-class="'+classId+'"'
        + (f?' data-id="'+f.id+'"':'')+'>Save</button>'
      + '</div></div></div></div>';
    var nameEl = document.getElementById('f-folder-name');
    if(nameEl){ nameEl.focus(); nameEl.select(); }
  }

  // ---- what a note is about -------------------------------------------
  // One note commonly refers to several lecture PDFs, a reading, the exam on the
  // calendar and the assignment itself, so this is a list rather than one field.
  var LINK_KINDS = [
    { key:'item',    label:'Assignments', plural:'assignments' },
    { key:'file',    label:'Files',       plural:'files' },
    { key:'lecture', label:'Lectures',    plural:'lectures' },
    { key:'event',   label:'Calendar',    plural:'calendar events' },
    { key:'headstart', label:'Headstart', plural:'Headstart drafts' },
    { key:'note',    label:'Notes',       plural:'notes' }
  ];

  function linkTargets(kind, cls, noteId){
    if(kind === 'item'){
      return items.filter(function(x){ return x.classId === cls.id; })
        .map(function(x){ return { id:x.id, label:x.title || 'Untitled',
          meta:(TYPE_LABELS[x.type]||x.type)+(x.dueDate?' · '+fmtDateShort(x.dueDate):'') }; });
    }
    if(kind === 'file'){
      // Every file, not just this class's. A note about an essay often wants the
      // rubric that lives in another course, and scoping the picker to one class
      // made those files unreachable from the note side.
      var own = [], rest = [];
      allMaterials().forEach(function(m){
        var row = { id:m.fileId || m.id, label:m.title || m.filename || 'File',
                    meta:(m.cls.id===cls.id ? '' : (m.cls.code||'Inbox')+' · ')
                         + fileFolderLabel(m) + ' · '
                         + (m.kind==='file' ? (m.size!=null?humanSize(m.size):'file') : 'link') };
        (m.cls.id===cls.id ? own : rest).push(row);
      });
      return own.concat(rest);
    }
    if(kind === 'lecture'){
      return (cls.schedule||[]).map(function(sc, i){
        return { id: sc.id || (cls.id + ':' + i),
                 label: (DOW_FULL[sc.day]||'') + ' lecture',
                 meta: (sc.start?fmtTime(sc.start):'') + (sc.location?' · '+sc.location:'') };
      });
    }
    if(kind === 'event'){
      return events.filter(function(x){ return !x.classId || x.classId === cls.id; })
        .map(function(x){ return { id:x.id, label:x.title || 'Event', meta:fmtDateShort(x.date) }; });
    }
    if(kind === 'headstart'){
      var out = [];
      items.filter(function(x){ return x.classId === cls.id; }).forEach(function(it){
        (it.headstarts||[]).forEach(function(h){
          out.push({ id: it.id + ':' + h.kind,
                     label: (HEADSTART_LABELS[h.kind] || h.kind) + ' — ' + (it.title||'Untitled'),
                     meta: h.status || 'draft' });
        });
      });
      return out;
    }
    if(kind === 'note'){
      return (cls.notesList||[]).filter(function(x){ return x.id !== noteId && !x.deletedAt; })
        .map(function(x){ return { id:x.id, label:noteDisplayTitle(x), meta:'note' }; });
    }
    return [];
  }

  function describeLink(l, cls){
    if(l.itemId){
      var it = items.find(function(x){ return x.id===l.itemId; });
      return { kind:'Assignment', label: it ? it.title : 'Assignment (removed)' };
    }
    if(l.fileId){
      var m = (cls.materials||[]).find(function(x){ return (x.fileId||x.id)===l.fileId; });
      return { kind:'File', label: m ? (m.title || m.filename) : 'File (removed)' };
    }
    if(l.eventId){
      var ev = events.find(function(x){ return x.id===l.eventId; });
      return { kind:'Calendar', label: ev ? ev.title : 'Event (removed)' };
    }
    if(l.lectureId){
      var sc = (cls.schedule||[]).find(function(x){ return x.id===l.lectureId; });
      return { kind:'Lecture', label: sc ? ((DOW_FULL[sc.day]||'')+' lecture') : 'Lecture' };
    }
    if(l.headstartId){
      return { kind:'Headstart', label:String(l.headstartId).split(':').slice(1).join(':') || 'Headstart draft' };
    }
    if(l.noteId){
      var nt = allNotes().find(function(x){ return x.id===l.noteId; });
      return { kind:'Note', label: nt ? noteDisplayTitle(nt) : 'Note (removed)' };
    }
    return { kind:'Link', label:'Unknown' };
  }

  var linksModalNoteId = null;
  var linksModalKind = 'item';

  function openNoteLinksModal(noteId){
    linksModalNoteId = noteId;
    var cls = notesActiveClass();
    if(!cls) return;
    fetchNoteLinks(noteId).then(function(links){
      noteLinkCount = links.length;
      var current = links.length ? links.map(function(l){
        var d = describeLink(l, cls);
        return '<div class="upcoming-row">'
          + '<span class="type-pill" style="background:var(--surface-2);color:var(--text-muted);">'+d.kind+'</span>'
          + '<div style="flex:1;min-width:0;"><div class="u-title">'+escapeHtml(d.label)+'</div></div>'
          + '<button type="button" class="btn ghost" data-action="note-unlink" data-id="'+l.id+'" title="Remove">✕</button>'
          + '</div>';
      }).join('') : '<div class="empty">Nothing linked yet.</div>';

      var tabs = LINK_KINDS.map(function(k){
        return '<button type="button" class="asg-filter'+(linksModalKind===k.key?' active':'')+'"'
          + ' data-action="note-link-kind" data-kind="'+k.key+'">'+k.label+'</button>';
      }).join('');

      var targets = linkTargets(linksModalKind, cls, noteId);
      var linkedIds = {};
      links.forEach(function(l){
        [l.itemId,l.fileId,l.eventId,l.lectureId,l.noteId].forEach(function(v){ if(v) linkedIds[v]=1; });
      });
      var options = targets.length ? targets.map(function(x){
        var already = !!linkedIds[x.id];
        return '<div class="upcoming-row">'
          + '<div style="flex:1;min-width:0;"><div class="u-title">'+escapeHtml(x.label)+'</div>'
          + '<div class="u-meta">'+escapeHtml(x.meta||'')+'</div></div>'
          + (already
              ? '<span class="hint">Linked</span>'
              : '<button type="button" class="btn" data-action="note-link-add" data-kind="'+linksModalKind+'"'
                + ' data-target="'+escapeHtml(x.id)+'">Link</button>')
          + '</div>';
      }).join('') : '<div class="empty">No '+(LINK_KINDS.find(function(k){return k.key===linksModalKind;})||{}).plural+' in this class yet.</div>';

      document.getElementById('modal-root').innerHTML =
        '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
        + '<div class="modal-head"><h2>What this note is about</h2></div>'
        + '<div class="modal-body">'
        + '<div class="detail-section"><div class="file-cat-title">Linked</div>'+current+'</div>'
        + '<div class="detail-section"><div class="file-cat-title">Add a link</div>'
        + '<div class="fx-pills" style="margin-bottom:10px;">'+tabs+'</div>'
        + options + '</div></div>'
        + '<div class="modal-foot"><span></span><div class="right">'
        + '<button class="btn primary" data-action="modal-close">Done</button></div></div></div></div>';
    }).catch(reportError);
  }

  // ---- trash ----
  function openNoteTrashModal(){
    fetchTrashedNotes().then(function(rows){
      var body = rows.length ? rows.map(function(n){
        return '<div class="upcoming-row">'
          + '<div style="flex:1;min-width:0;">'
          + '<div class="u-title">'+escapeHtml(n.title || 'Untitled note')+'</div>'
          + '<div class="u-meta">'+escapeHtml(n.classCode || '')
            + (n.deletedAt ? ' · deleted '+relTimeAgo(n.deletedAt) : '')+'</div></div>'
          + '<button type="button" class="btn" data-action="note-restore" data-id="'+n.id+'">Restore</button>'
          + '<button type="button" class="btn danger" data-action="note-purge" data-id="'+n.id+'">Delete</button>'
          + '</div>';
      }).join('') : '<div class="empty">Nothing in the trash.</div>';
      document.getElementById('modal-root').innerHTML =
        '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
        + '<div class="modal-head"><h2>Trash</h2></div>'
        + '<div class="modal-body"><div class="hint" style="margin-bottom:10px;">'
        + 'Deleted notes stay here for 30 days.</div>' + body + '</div>'
        + '<div class="modal-foot"><span></span><div class="right">'
        + '<button class="btn primary" data-action="modal-close">Done</button></div></div></div></div>';
    }).catch(reportError);
  }

  // ---- version history ----
  function openNoteHistoryModal(noteId){
    fetchNoteVersions(noteId).then(function(rows){
      var body = rows.length ? rows.map(function(v){
        var preview = stripHtml(v.text || '').slice(0, 120);
        return '<div class="upcoming-row">'
          + '<div style="flex:1;min-width:0;">'
          + '<div class="u-title">'+escapeHtml(v.title || 'Untitled')+'</div>'
          + '<div class="u-meta">'+relTimeAgo(v.createdAt)+' · '+escapeHtml(preview || 'empty')+'</div></div>'
          + '<button type="button" class="btn" data-action="note-version-restore" data-nid="'+noteId+'" data-vid="'+v.id+'">Restore</button>'
          + '</div>';
      }).join('') : '<div class="empty">No earlier versions yet. One is kept every few minutes while you write.</div>';
      document.getElementById('modal-root').innerHTML =

  // ---- export ----
  // A self-contained HTML file: opens anywhere, prints to PDF from the browser,
  // and keeps tables, callouts and equations rather than flattening them.
  function exportNote(noteId){
    var n = allNotes().find(function(x){ return x.id===noteId; });
    if(!n) return;
    var title = noteDisplayTitle(n);
    var css = 'body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;line-height:1.65;max-width:760px;'
      + 'margin:40px auto;padding:0 20px;color:#131722;}'
      + 'h1{font-size:24px;} h2{font-size:19px;} h3{font-size:16px;}'
      + 'table{border-collapse:collapse;width:100%;margin:12px 0;}'
      + 'th,td{border:1px solid #ddd;padding:6px 9px;text-align:left;} th{background:#f4f5f7;}'
      + 'blockquote{margin:10px 0;padding:4px 12px;border-left:3px solid #005FFB;color:#555;}'
      + 'mark{background:#FDE68A;} img{max-width:100%;}'
      + 'pre{background:#f4f5f7;padding:10px;border-radius:8px;overflow-x:auto;}'
      + '.rte-callout{display:flex;gap:10px;padding:10px 12px;border-radius:10px;background:#eef3ff;margin:10px 0;}'
      + '.rte-check{list-style:none;padding-left:0;} .rte-check li{display:flex;gap:8px;}'
      + '.rte-embed{display:inline-block;padding:6px 10px;border:1px solid #ddd;border-radius:8px;'
      + 'text-decoration:none;color:#131722;margin:4px 0;}'
      + '.meta{color:#6B7280;font-size:12px;margin-bottom:18px;}';
    var html = '<!doctype html><html><head><meta charset="utf-8">'
      + '<title>'+escapeHtml(title)+'</title><style>'+css+'</style></head><body>'
      + '<h1>'+escapeHtml(title)+'</h1>'
      + '<div class="meta">'+escapeHtml((classById(n.classId)||{}).code || '')
        + (n.updatedAt ? ' · last edited '+fmtDate(n.updatedAt.slice(0,10)) : '')+'</div>'
      + (n.text || '<p></p>')
      + '</body></html>';
    var blob = new Blob([html], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = title.replace(/[^\w\s.-]+/g, '').trim().slice(0, 60) + '.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }

  // ---------------- Connections ----------------

      .sort(function(a,b){ return (a.dueDate||'9999').localeCompare(b.dueDate||'9999'); })

  /** Fetch suggestions for the open note when it changed since last time, and patch them in place. */

  function loadDeepSearch(raw, localCount){

  // ---------------- Schedule from SFU ----------------
  // SFU publishes every section's meeting days, room and final exam, free and with no
  // login. The one thing it cannot know is which section is yours, so that is the only
  // question this asks. Nothing reaches a class until "Add to class" is pressed.

  var CAL = null;
  var CAL_KINDS = { lecture:'Lecture', lab:'Lab', tutorial:'Tutorial', seminar:'Seminar' };
  function calKindLabel(k){ return CAL_KINDS[k] || 'Meeting'; }

  /** "IAT 201" and "iat-201 B100" are one course; "COGS 300" is not. */
  function calSameCourse(a, b){
    function norm(s){
      var m = /([a-z]{2,5})\s*-?\s*(\d{3}[a-z]?)/i.exec(s||'');
      return m ? (m[1]+m[2]).toLowerCase() : '';
    }
    var x = norm(a), y = norm(b);
    return !x || !y || x === y;   // unparseable on either side: do not block on a guess
  }

  function openScheduleImport(classId){
    // No blind preselection. Defaulting to the first class meant a timetable could be
    // drafted for one course and written into another, and the review screen would then
    // offer to delete that other class's real lectures for not being in SFU's list.
    CAL = { stage:'pick', classId: classId || null,
            code:'', options:null, primary:null, extras:{}, draft:null, id:null, error:null };
    var c = CAL.classId ? classById(CAL.classId) : null;
    if(c) CAL.code = c.code || '';
    renderScheduleImport();
  }

  /** Every option on screen at once: you recognise your section, you don't look it up. */
  function calChip(label, sub, on, action, value){
    return '<button type="button" class="cal-sec'+(on?' on':'')+'" data-action="'+action+'"'
      + ' data-value="'+escapeHtml(String(value))+'"><b>'+escapeHtml(label)+'</b>'
      + (sub ? '<span>'+escapeHtml(sub)+'</span>' : '')+'</button>';
  }

  function calPickBody(){
    var chips = classes.map(function(c){
      return calChip(c.code||c.name||'Untitled', c.professor||'', c.id===CAL.classId, 'cal-pick-class', c.id);
    }).join('');
    return '<div class="cal-group-label">Which class</div>'
      + '<div class="cal-secs">'+(chips || '<span class="hint">Add a class first.</span>')+'</div>'
      + '<label class="field" style="margin-top:14px;">Course code'
      + '<input type="text" id="cal-code" value="'+escapeHtml(CAL.code)+'" placeholder="IAT 201"></label>'
      + '<div class="hint" style="margin-top:10px;">Vesta asks SFU for this course’s published '
      + 'timetable. It is free, needs no login, and sends nothing of yours.</div>';
  }

  function calSectionsBody(){
    var o = CAL.options, out = '';
    if(o.primary.length > 1){
      out += '<div class="cal-group-label">Your lecture section</div><div class="cal-secs">'
        + o.primary.map(function(e){
            return calChip(e.label, e.kindLabel, CAL.primary===e.value, 'cal-pick-primary', e.value);
          }).join('') + '</div>';
    }
    var picked = o.primary.filter(function(e){ return e.value===CAL.primary; })[0] || {};
    var extras = (o.secondary||{})[picked.group] || [];
    if(extras.length){
      out += '<div class="cal-group-label">Your '+escapeHtml((extras[0].kindLabel||'section').toLowerCase())
        + '</div><div class="cal-secs">'
        + extras.map(function(e){
            return calChip(e.label, e.kindLabel, !!CAL.extras[e.value], 'cal-pick-extra', e.value);
          }).join('') + '</div>'
        + '<div class="hint" style="margin-top:8px;">Pick the one you are registered in, or skip it '
        + 'if you only want the lecture.</div>';
    }
    return out || '<div class="hint">SFU lists one section for this course, so there is nothing to choose.</div>';
  }

  function renderScheduleImport(){
    if(!CAL) return;
    var body = '', foot = '';
    if(CAL.stage === 'pick'){
      body = calPickBody();
      foot = '<button class="btn" data-action="cal-cancel">Cancel</button>'
           + '<button class="btn primary" data-action="cal-find">Find my sections</button>';
    } else if(CAL.stage === 'finding'){
      body = siThinking('Asking SFU which sections this course has…');
    } else if(CAL.stage === 'sections'){
      body = calSectionsBody();
      foot = '<button class="btn" data-action="cal-back">Back</button>'
           + '<button class="btn primary" data-action="cal-draft">Get this schedule</button>';
    } else if(CAL.stage === 'loading'){
      body = siThinking('Reading SFU’s outline…');
    }
    if(CAL.error) body += '<div class="si-error">'+escapeHtml(CAL.error)+'</div>';
    document.getElementById('modal-root').innerHTML =
      '<div class="overlay"><div class="modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>Get a schedule from SFU</h2></div>'
      + '<div class="modal-body">'+body+'</div>'
      + (foot ? '<div class="modal-foot"><span></span><div class="right">'+foot+'</div></div>' : '')
      + '</div></div>';
    paintIcons();
  }

  function calFind(){
    var input = document.getElementById('cal-code');
    if(input) CAL.code = input.value.trim();
    if(!CAL.classId){ CAL.error = 'Pick which class this is for.'; renderScheduleImport(); return; }
    if(!CAL.code){ CAL.error = 'Give the course code, like IAT 201.'; renderScheduleImport(); return; }
    var picked = classById(CAL.classId);
    if(picked && picked.code && !calSameCourse(picked.code, CAL.code)){
      CAL.error = '“'+CAL.code+'” is not '+picked.code+'. Pick the class it belongs to, '
                + 'or change the code to this class’s.';
      renderScheduleImport();
      return;
    }
    CAL.stage = 'finding'; CAL.error = null;
    renderScheduleImport();
    apiGet('/api/calendar/sfu/sections?classId='+encodeURIComponent(CAL.classId)
           +'&code='+encodeURIComponent(CAL.code))
      .then(function(o){
        if(!CAL) return;
        if(o.error){ CAL.stage = 'pick'; CAL.error = o.error; renderScheduleImport(); return; }
        CAL.options = o;
        CAL.primary = (o.primary[0]||{}).value || null;
        CAL.extras = {};
        CAL.stage = 'sections';
        // one section and no labs: there is no question worth asking
        if(!o.needsChoice){ calDraft(); return; }
        renderScheduleImport();
      })
      .catch(function(){
        if(CAL){ CAL.stage = 'pick'; CAL.error = 'Could not reach SFU.'; renderScheduleImport(); }
      });
  }

  function calDraft(){
    var secs = [CAL.primary].concat(Object.keys(CAL.extras).filter(function(k){ return CAL.extras[k]; }));
    CAL.stage = 'loading'; CAL.error = null;
    renderScheduleImport();
    apiPostRaw('/api/calendar/sfu/draft',
               { classId:CAL.classId, code:CAL.code, sections:secs.filter(Boolean) })
      .then(function(r){
        if(!CAL) return;
        if(!r.ok){
          CAL.stage = 'sections';
          CAL.error = r.body.error || 'SFU had nothing usable for that section.';
          renderScheduleImport();
          return;
        }
        CAL.draft = r.body; CAL.id = r.body.id;
        document.getElementById('modal-root').innerHTML = '';
        renderCalendarReview();
        loadState();
      })
      .catch(function(){
        if(CAL){ CAL.stage = 'sections'; CAL.error = 'Could not reach Vesta.'; renderScheduleImport(); }
      });
  }

  // ---- the review screen, sharing the syllabus review's furniture ----

  function calIncludedCount(){
    var d = CAL.draft;
    return d.meetings.filter(function(m){ return m.include; }).length
         + d.items.filter(function(i){ return i.include; }).length;
  }

  function calWarningsHtml(){
    var w = CAL.draft.warnings || [];
    return w.length
      ? '<div class="hs-confirm" style="margin-bottom:16px;"><h4>Worth knowing</h4>'
        + w.map(function(x){ return '<div>'+escapeHtml(x)+'</div>'; }).join('') + '</div>'
      : '';
  }

  function calMeetingsHtml(){
    var d = CAL.draft;
    if(!d.meetings.length) return '';
    return '<section class="si-section" id="cal-meetings"><h2>Meeting times</h2>'
      + d.meetings.map(function(m){
          var badge = m.change==='new' ? '<span class="si-badge new">New</span>'
                    : m.change==='changed' ? '<span class="si-badge changed">Changed</span>'
                    : '<span class="si-badge same">Already there</span>';
          return '<label class="si-row" data-row="cal-meeting-'+m.id+'" style="grid-template-columns:22px 1fr auto;">'
            + '<input type="checkbox" data-action="cal-include" data-kind="meeting" data-id="'+m.id+'"'
            + (m.include?' checked':'')+'>'
            + '<span><b>'+escapeHtml(calKindLabel(m.kind))+'</b> · '+DOW_SHORT[m.day]+' '
            + escapeHtml(m.start||'')+(m.end?'–'+escapeHtml(m.end):'')
            + (m.location?' · '+escapeHtml(m.location):'')
            + (m.section?' · '+escapeHtml(m.section):'')+'</span>'
            + badge+'</label>';
        }).join('')
      + '</section>';
  }

  function calItemsHtml(){
    var d = CAL.draft;
    if(!d.items.length) return '';
    return '<section class="si-section" id="cal-items"><h2>Exams</h2>'
      + d.items.map(function(it){
          var badge = it.change==='new' ? '<span class="si-badge new">New</span>'
                                        : '<span class="si-badge same">Already there</span>';
          return '<label class="si-row" data-row="cal-item-'+it.id+'" style="grid-template-columns:22px 1fr auto;">'
            + '<input type="checkbox" data-action="cal-include" data-kind="item" data-id="'+it.id+'"'
            + (it.include?' checked':'')+(it.existingId?' disabled':'')+'>'
            + '<span><b>'+escapeHtml(it.title)+'</b> · '+escapeHtml(fmtDateShort(it.dueDate))
            + (it.dueTime?' at '+escapeHtml(it.dueTime):'')
            + (it.location?' · '+escapeHtml(it.location):'')+'</span>'
            + badge+'</label>';
        }).join('')
      + '</section>';
  }

  function calRemovedHtml(){
    var rm = CAL.draft.removed || [];
    if(!rm.length) return '';
    return '<section class="si-section" id="cal-removed"><h2>Already on the class, not in SFU’s list</h2>'
      + '<div class="hint">Vesta leaves these alone. Tick one only if you want it removed.</div>'
      + rm.map(function(g, i){
          return '<label class="si-row" style="grid-template-columns:22px 1fr;">'
            + '<input type="checkbox" data-action="cal-removed" data-idx="'+i+'"'+(g.include?' checked':'')+'>'
            + '<span>'+escapeHtml(g.what||'Meeting')+'</span></label>';
        }).join('')
      + '</section>';
  }

  function calFootHtml(){
    var n = calIncludedCount();
    return '<div class="si-foot"><div class="si-foot-inner">'
      + '<div class="si-left">'+n+' thing'+(n===1?'':'s')+' to add'
      + (CAL.error ? '<div class="si-msg" id="cal-msg" role="status">'+escapeHtml(CAL.error)+'</div>' : '')
      + '</div>'
      + '<button class="btn" data-action="cal-discard">Discard</button>'
      + '<button class="btn primary'+(n?'':' si-waiting')+'" data-action="cal-apply">Add to class</button>'
      + '</div></div>';
  }

  function renderCalendarReview(){
    if(!CAL || !CAL.draft) return;
    var root = document.getElementById('si-root');
    if(!root){
      root = document.createElement('div');
      root.id = 'si-root';
      document.body.appendChild(root);
    }
    var d = CAL.draft;
    var cls = classById(d.classId || CAL.classId);
    root.innerHTML = '<div class="si-panel"><div class="si-inner">'
      + '<div class="si-top"><h1>Here’s what SFU has for '+escapeHtml(d.label||'this course')+'</h1></div>'
      + '<div class="si-sub">Straight from SFU’s published outline, so none of it is a guess. '
      + 'Untick anything you do not want, then add it to '
      + escapeHtml(cls ? (cls.code||cls.name||'the class') : 'the class')+'.</div>'
      + '<div class="si-chips">'
      + '<span class="si-chip">'+d.meetings.length+' meeting time'+(d.meetings.length===1?'':'s')+'</span>'
      + (d.items.length ? '<span class="si-chip">'+d.items.length+' exam'+(d.items.length===1?'':'s')+'</span>' : '')
      + '</div>'
      + calWarningsHtml() + calMeetingsHtml() + calItemsHtml() + calRemovedHtml()
      + '</div></div>'
      + calFootHtml();
    paintIcons(root);
  }

  /** Ticking a row must not redraw the page under the cursor: only the footer changes. */
  function calRefreshFoot(){
    var root = document.getElementById('si-root');
    if(!root) return;
    var foot = root.querySelector('.si-foot');
    if(foot) foot.outerHTML = calFootHtml();
  }

  function calCloseReview(){
    var root = document.getElementById('si-root');
    if(root) root.remove();
    CAL = null;
  }

  function calApply(){
    if(!CAL || !CAL.draft) return;
    if(!calIncludedCount()){
      CAL.error = 'Nothing is ticked, so there is nothing to add.';
      calRefreshFoot();
      return;
    }
    var d = CAL.draft;
    d.classId = d.classId || CAL.classId;
    var id = CAL.id;
    apiPostRaw('/api/calendar/imports/'+id+'/apply', { draft:d, classId:d.classId })
      .then(function(r){
        if(!CAL) return;
        if(!r.ok){ CAL.error = r.body.error || 'That did not go through.'; calRefreshFoot(); return; }
        calCloseReview();
        loadState();
      })
      .catch(function(){ if(CAL){ CAL.error = 'Could not reach Vesta.'; calRefreshFoot(); } });
  }

  function calDiscard(){
    var id = CAL && CAL.id;
    calCloseReview();
    document.getElementById('modal-root').innerHTML = '';
    if(id) apiDelete('/api/calendar/imports/'+id).then(loadState).catch(function(){ loadState(); });
    else loadState();
  }

  function calResume(id){
    apiGet('/api/calendar/imports/'+id).then(function(d){
      CAL = { stage:'review', classId:d.classId||null, code:'', options:null, primary:null,
              extras:{}, draft:d, id:d.id, error:null };
      renderCalendarReview();
    }).catch(reportError);
  }

  // ---------------- Syllabus import ----------------
  // Upload, see the price, read, review, import. Nothing reaches a class until Import
  // Course is pressed, and that stays locked while anything still needs a look.

  var SI = null;

  function centsLabel(usd){ return usd < 1 ? Math.max(1, Math.round(usd*100))+'¢' : '$'+usd.toFixed(2); }
  function siThinking(text){ return '<div class="hs-thinking"><i></i>'+escapeHtml(text)+'</div>'; }

  /**
   * @param {string=} classId set when updating a class that already exists
   * @param {string=} mode    'supplement' for a document added to a class later, such as
   *                          an assignment schedule the outline left out. It is read as
   *                          extra material: it adds and fills gaps, and never clears.
   */
  function openSyllabusImport(classId, mode){
    SI = { id:null, classId: classId || null, mode: mode || null, files: [],
           filename:'', estimate:null, stage:'pick', error:null, draft:null,
           showSame:false, openGroups:{}, returnAfterSettings:false,
           color: PALETTE[classes.length % PALETTE.length] };
    renderSyllabusUpload();
  }

  function renderSyllabusUpload(){
    if(!SI) return;
    var cls = SI.classId ? classById(SI.classId) : null;
    var body = '', foot = '';
    if(SI.stage === 'pick'){
      body = '<div class="si-drop" id="si-drop">'
        + '<div class="fd-ic">'+iconSvg('upload')+'</div>'
        + '<div class="fd-main">'+(SI.mode === 'supplement' ? 'Drop the document here' : 'Drop the syllabus here')+'</div>'
        + '<div class="fd-sub">PDF, Word, text or a photo, or '
        + '<button type="button" class="fd-browse" data-action="si-browse">browse</button>. '
        + 'Several at once is fine.</div>'
        + '<input type="file" id="si-file" hidden multiple accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp,.gif,.html">'
        + '</div>'
        + '<div class="hint" style="margin-top:12px;">'
        + (SI.mode === 'supplement'
            ? 'For something the syllabus left out, like a separate assignment schedule. '
              + 'It only adds what is new and fills in what is missing; nothing already in '
              + 'the class is removed or overwritten without you ticking it.'
            : 'If the assignment schedule is in a separate document, add both: they are read '
              + 'together. Vesta shows you everything it found and imports nothing until you '
              + 'have checked it.')
        + '</div>';
      foot = '<button class="btn" data-action="si-cancel">Cancel</button>';
    } else if(SI.stage === 'uploading'){
      body = siThinking('Uploading…');
    } else if(SI.stage === 'priced'){
      var e = SI.estimate;
      var over = e.dailyCap && (e.spentToday + e.estimateUsd > e.dailyCap);
      body = SI.files.map(function(f){
          return '<div class="si-file">'+iconSvg('files')+'<b>'+escapeHtml(f.filename)+'</b></div>';
        }).join('')
        + '<button type="button" class="fd-browse si-add-more" data-action="si-browse">+ Add another file</button>'
        + '<input type="file" id="si-file" hidden multiple accept=".pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp,.gif,.html">'
        + '<div class="si-cost">Claude Opus 5 reads it for about <b>'+centsLabel(e.estimateUsd)+'</b>. '
        + 'Today so far: $'+Number(e.spentToday).toFixed(2)+' of your $'+Number(e.dailyCap).toFixed(2)+' daily limit.</div>'
        + (over
            ? '<div class="hs-confirm capped" style="margin-top:12px;"><h4>That would go past today’s limit</h4>'
              + '<div>Raise the limit to read it now, or come back tomorrow.</div>'
              + '<div class="hs-actions"><button type="button" class="btn" data-action="si-open-settings">Change the limit</button></div></div>'
            : '');
      foot = '<button class="btn" data-action="si-cancel">Cancel</button>'
        + '<button class="btn primary" data-action="si-read"'+(over?' disabled':'')+'>'
        + (SI.files.length > 1 ? 'Read all '+SI.files.length : (SI.mode === 'supplement' ? 'Read document' : 'Read syllabus'))
        + '</button>';
    } else if(SI.stage === 'reading'){
      body = siThinking('Reading the syllabus. This takes one to four minutes; you can leave this open.');
    }
    if(SI.error) body += '<div class="si-error">'+escapeHtml(SI.error)+'</div>';

    document.getElementById('modal-root').innerHTML =
      '<div class="overlay"><div class="modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'
      + (SI.mode === 'supplement' && cls ? 'Add a document to '+escapeHtml(cls.code||cls.name||'class')
         : cls ? 'Update '+escapeHtml(cls.code||cls.name||'class')+' from its syllabus' : 'Import a syllabus')
      + '</h2></div>'
      + '<div class="modal-body">'+body+'</div>'
      + (foot ? '<div class="modal-foot"><span></span><div class="right">'+foot+'</div></div>' : '')
      + '</div></div>';
    paintIcons();

    var zone = document.getElementById('si-drop');
    if(zone){
      zone.addEventListener('dragover', function(ev){ ev.preventDefault(); zone.classList.add('over'); });
      zone.addEventListener('dragleave', function(){ zone.classList.remove('over'); });
      zone.addEventListener('drop', function(ev){
        ev.preventDefault(); ev.stopPropagation();
        zone.classList.remove('over');
        if(ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files.length) siUpload(ev.dataTransfer.files);
      });
    }
  }

  /** Upload one or several files. Each is stored on its own; they are read together. */
  function siUpload(fileList){
    var files = Array.prototype.slice.call(fileList && fileList.length != null ? fileList : [fileList]);
    if(!files.length) return;
    var back = SI.files.length ? 'priced' : 'pick';
    SI.stage = 'uploading'; SI.error = null;
    renderSyllabusUpload();
    var chain = Promise.resolve();
    files.forEach(function(file){
      chain = chain.then(function(){
        if(!SI) return;
        var fd = new FormData();
        fd.append('file', file);
        if(SI.classId) fd.append('classId', SI.classId);
        return fetch('/api/syllabus', { method:'POST', body: fd })
          .then(function(r){ return r.json().catch(function(){ return {}; }).then(function(j){ return { ok:r.ok, body:j }; }); })
          .then(function(r){
            if(!SI) return;
            if(!r.ok) throw new Error((r.body.error || 'That upload did not work.') + ' (' + file.name + ')');
            SI.files.push({ id: r.body.id, filename: r.body.filename, estimate: r.body });
          });
      });
    });
    chain.then(function(){
      if(!SI) return;
      siPriceAll();
      SI.stage = SI.files.length ? 'priced' : back;
      renderSyllabusUpload();
    }).catch(function(err){
      if(!SI) return;
      siPriceAll();
      SI.stage = SI.files.length ? 'priced' : 'pick';
      SI.error = err && err.message ? err.message : 'Could not reach Vesta.';
      renderSyllabusUpload();
    });
  }

  /** The first file is the import; the others ride along. One read, so one combined price. */
  function siPriceAll(){
    if(!SI.files.length) return;
    SI.id = SI.files[0].id;
    SI.filename = SI.files.map(function(f){ return f.filename; }).join(', ');
    var first = SI.files[0].estimate;
    var usd = SI.files.reduce(function(t, f){ return t + (Number(f.estimate.estimateUsd) || 0); }, 0);
    SI.estimate = Object.assign({}, first, { estimateUsd: usd });
  }

  function siRead(){
    SI.stage = 'reading'; SI.error = null;
    renderSyllabusUpload();
    apiPostRaw('/api/syllabus/'+SI.id+'/read', {
      confirmed: true, classId: SI.classId, mode: SI.mode || null,
      alsoRead: SI.files.slice(1).map(function(f){ return f.id; })
    }).then(function(r){
      if(!SI) return;
      if(!r.ok){
        SI.stage = 'priced';
        SI.error = r.body.error || 'Vesta could not read that syllabus.';
        if(r.body.estimateUsd != null) SI.estimate = Object.assign(SI.estimate, r.body);
        renderSyllabusUpload();
        return;
      }
      if(r.body.usage) hsUsage = r.body.usage;
      SI.draft = r.body.draft;
      SI.stage = 'review';
      document.getElementById('modal-root').innerHTML = '';
      renderSyllabusReview();
    }).catch(function(){
      if(SI){ SI.stage = 'priced'; SI.error = 'Could not reach Vesta.'; renderSyllabusUpload(); }
    });
  }

  // ---------------- The review screen ----------------

  function siDraftList(kind){
    var d = SI.draft;
    return kind==='item' ? d.items : kind==='meeting' ? d.meetings : kind==='category' ? d.categories
         : kind==='topic' ? d.topics : kind==='scale' ? d.gradeScale : [];
  }
  function siFind(kind, id){
    return siDraftList(kind).find(function(x){ return String(x.id)===String(id); });
  }
  function siNeedsLook(x){ return x.include !== false && !x.sure && !x.confirmed; }

  /** Everything still standing between the student and Import Course. */
  function siLookCount(){
    var d = SI.draft;
    var n = d.items.filter(siNeedsLook).length + d.meetings.filter(siNeedsLook).length;
    n += (d.courseChecks||[]).filter(function(c){ return !c.resolved; }).length;
    return n;
  }

  function siWeightTotal(){
    var d = SI.draft;
    var cats = d.categories.filter(function(g){ return g.include !== false; });
    var ids = {};
    cats.forEach(function(g){ ids[g.id] = true; });
    return cats.reduce(function(s,g){ return s + (Number(g.weight)||0); }, 0)
      + d.items.filter(function(i){ return i.include !== false && !(i.categoryId && ids[i.categoryId]); })
          .reduce(function(s,i){ return s + (Number(i.weight)||0); }, 0);
  }

  /** Several sections of the same lab or tutorial: the student keeps exactly one. */
  function siSectionChoice(m){
    return (m.kind==='tutorial' || m.kind==='lab') && SI.draft.meetings.filter(function(o){
      return o.kind===m.kind && !o.sure;
    }).length > 1;
  }

  function siNoteHtml(kind, x){
    var bits = [];
    if(x.why) bits.push('<span class="si-why">'+escapeHtml(x.why)+'</span>');
    if(x.evidence) bits.push('<span class="si-evidence">'+escapeHtml(x.evidence)+'</span>');
    if(kind==='meeting' && siNeedsLook(x) && siSectionChoice(x)){
      bits.push('<button type="button" class="si-ok" data-action="si-my-section" data-id="'+x.id+'">This is my section</button>');
    }
    if(siNeedsLook(x)){
      bits.push('<button type="button" class="si-ok" data-action="si-ok" data-kind="'+kind+'" data-id="'+x.id+'">Looks right</button>');
    } else if(!x.sure && x.confirmed){
      bits.push('<span class="hint" style="margin:0;">Checked</span>');
    }
    return bits.length && (!x.sure || x.why) ? '<div class="si-note">'+bits.join('')+'</div>' : '';
  }

  function siRowClass(base, x){
    return 'si-row '+base+(x.include===false?' off':'')+(!x.sure ? ' look'+(x.confirmed?' ok':'') : '');
  }

  function siCourseHtml(){
    var d = SI.draft, c = d.course, diff = d.diff;
    var field = function(label, key, placeholder){
      return '<label class="field">'+label+'<input type="text" data-si-kind="course" data-si-field="'+key+'"'
        + ' value="'+escapeHtml(c[key]||'')+'" placeholder="'+escapeHtml(placeholder||'')+'"></label>';
    };
    var official = d.officialFound
      ? '<span class="si-badge official">Checked against SFU’s official outline</span>'
      : (d.officialNote ? '<span class="hint" style="margin:0;">'+escapeHtml(d.officialNote)+'</span>' : '');
    var conflicts = (d.courseChecks||[]).map(function(k, i){
      var label = { code:'Course code', professor:'Professor' }[k.field] || k.field;
      if(k.resolved){
        return '<div class="si-conflict" style="background:var(--surface-2);">'+escapeHtml(label)+': using <b>'
          + escapeHtml(c[k.field]||'')+'</b></div>';
      }
      return '<div class="si-conflict"><b>'+escapeHtml(label)+' differs.</b>'
        + ' Syllabus: '+escapeHtml(k.syllabus)+' <button type="button" class="si-ok" data-action="si-conflict" data-idx="'+i+'" data-pick="syllabus">Use this</button>'
        + ' SFU: '+escapeHtml(k.official)+' <button type="button" class="si-ok" data-action="si-conflict" data-idx="'+i+'" data-pick="official">Use this</button></div>';
    }).join('');
    var changes = diff && (diff.course||[]).length
      ? '<div class="file-cat-title" style="margin-top:14px;">Changes to the class</div>'
        + diff.course.map(function(ch, i){
            return '<label class="si-row" style="grid-template-columns:22px 1fr;">'
              + '<input type="checkbox" data-action="si-course-change" data-idx="'+i+'"'+(ch.include?' checked':'')+'>'
              + '<span class="si-change">'+escapeHtml(ch.field)+': <s>'+escapeHtml(ch.before||'empty')+'</s> → '+escapeHtml(ch.after)+'</span></label>';
          }).join('')
      : '';
    var colors = diff ? '' : '<label class="field">Colour<div class="swatches">'+PALETTE.map(function(col){
        return '<button type="button" class="swatch'+(col===SI.color?' selected':'')+'" style="--sw:'+col+'" data-action="si-color" data-color="'+col+'"></button>';
      }).join('')+'</div></label>';
    return '<section class="si-section" id="si-course"><h2>Course '+official+' '
      + siSectionBadge('course', (d.courseChecks||[]).filter(function(k){ return !k.resolved; }).length)+'</h2>'
      + (diff ? '<div class="hint">Only what you tick below changes in the class. Your grades and finished work are never touched.</div>' : '')
      + (diff ? '' : '<div class="si-grid">'
          + field('Course code','code','COGS 300') + field('Course name','name')
          + field('Section','section','D100') + field('Term','term','Fall 2026')

          + ['lecture','lab','tutorial','seminar','other'].map(function(k){
              return '<option value="'+k+'"'+(m.kind===k?' selected':'')+'>'+k.charAt(0).toUpperCase()+k.slice(1)+'</option>';
            }).join('') + '</select>'
        + '<select data-si-kind="meeting" data-si-id="'+m.id+'" data-si-field="day">'
          + days.map(function(i){ return '<option value="'+i+'"'+(Number(m.day)===i?' selected':'')+'>'+DOW_SHORT[i]+'</option>'; }).join('')

      + (diff && diff.meetingsChanged

      + (rows || '<div class="hint">No meeting times found.</div>')
      + '<button type="button" class="btn ghost" data-action="si-add-meeting" style="margin-top:8px;">+ Add meeting time</button>'

  function siGradingHtml(){
    var d = SI.draft, diff = d.diff;
    var total = siWeightTotal();
    var totalLine = total
      ? '<span class="si-badge '+(Math.abs(total-100) < 0.5 ? 'new' : 'changed')+'">Weights add up to '+Math.round(total*10)/10+'%</span>'
      : '';
    var cats = d.categories.map(function(g){
      var n = d.items.filter(function(i){ return i.categoryId===g.id && i.include!==false; }).length;
      return '<div class="si-row si-cat'+(g.include===false?' off':'')+'">'
        + '<input type="text" data-si-kind="category" data-si-id="'+g.id+'" data-si-field="name" value="'+escapeHtml(g.name||'')+'">'
        + '<label class="hint" style="margin:0;display:flex;gap:4px;align-items:center;"><input type="number" step="0.5" data-si-kind="category" data-si-id="'+g.id+'" data-si-field="weight" value="'+(g.weight!=null?g.weight:'')+'">%</label>'
        + '<label class="hint" style="margin:0;display:flex;gap:4px;align-items:center;">drop <input type="number" min="0" data-si-kind="category" data-si-id="'+g.id+'" data-si-field="dropLowest" value="'+(g.dropLowest||0)+'"></label>'
        + '<span class="hint" style="margin:0;">'+n+' item'+(n===1?'':'s')+'</span>'
        + (g.evidence ? '<div class="si-note" style="grid-column:1 / -1;"><span class="si-evidence">'+escapeHtml(g.evidence)+'</span></div>' : '')
        + '</div>';
    }).join('');
    if(d.applyScale === undefined) d.applyScale = !(diff && diff.existingScale) && !d.scaleIncomplete;
    var scale = (d.gradeScale||[]).length
      ? '<label class="si-conflict" style="background:var(--surface-2);cursor:pointer;"><input type="checkbox" data-action="si-apply-scale"'
        + (d.applyScale?' checked':'')+'> Use this letter-grade scale for the class</label>'
        + '<div style="display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;">'
        + d.gradeScale.map(function(r, i){
            return '<div class="si-row si-scale">'
              + '<input type="text" data-si-kind="scale" data-si-idx="'+i+'" data-si-field="letter" value="'+escapeHtml(r.letter)+'">'
              + '<label class="hint" style="margin:0;display:flex;gap:4px;align-items:center;"><input type="number" step="0.5" data-si-kind="scale" data-si-idx="'+i+'" data-si-field="min" value="'+r.min+'">%+</label></div>';
          }).join('') + '</div>'
      : '<div class="hint">No letter-grade cutoffs in the syllabus, so the class keeps its current scale.</div>';
    return '<section class="si-section"><h2>Grading '+totalLine+'</h2>'
      + '<div class="hint">Categories share their weight across their items, after dropping the lowest scores.</div>'
      + (cats || '<div class="hint">No grade categories. Items carry their own weights.</div>')
      + '<button type="button" class="btn ghost" data-action="si-add-category" style="margin:8px 0 14px;">+ Add category</button>'
      + '<div class="file-cat-title">Letter grades</div>' + scale
      + '</section>';

  function siFootHtml(){
    var d = SI.draft;
    var look = siLookCount();
    var nItems = d.items.filter(function(i){ return i.include !== false && i.change !== 'same'; }).length;
    if(!look) SI.blockedMsg = null;
    return '<div class="si-foot"><div class="si-foot-inner">'
      + '<div class="si-left">'+nItems+' item'+(nItems===1?'':'s')+' to '+(d.diff?'add or update':'import')
      + (look
          ? ' · <button type="button" class="si-next" data-action="si-next-look"><b class="look">'+look+' still need'
            + (look===1?'s':'')+' a look</b> · show me</button>'
          : ' · everything checked')
      + (SI.blockedMsg ? '<div class="si-msg" id="si-msg" role="status">'+escapeHtml(SI.blockedMsg)+'</div>' : '')
      + '</div>'
      + '<button class="btn" data-action="si-cancel">Discard</button>'
      + '<button class="btn primary'+(look?' si-waiting':'')+'" data-action="si-import"'
      // not aria-disabled: pressing it does something (explains and jumps), so it must stay a live control
      + (look?' aria-describedby="si-msg" title="Pressing this shows what still needs a look"':'')+'>'
      + (d.diff ? 'Update class' : 'Import course')+'</button>'
      + '</div></div>';

  function renderSyllabusReview(){
    if(!SI || !SI.draft) return;
    var root = document.getElementById('si-root');
    if(!root){
      root = document.createElement('div');
      root.id = 'si-root';
      document.body.appendChild(root);
    }
    var panel = root.querySelector('.si-panel');
    var scroll = panel ? panel.scrollTop : 0;
    // Remember which row is at the top of the view. The checklist above can change height
    // when something is checked off, and restoring scrollTop alone would slide every row
    // under the cursor up or down by that much.
    var anchor = null;
    if(panel){
      var rowsNow = panel.querySelectorAll('[data-row]');
      for(var ri=0; ri<rowsNow.length; ri++){
        var rt = rowsNow[ri].getBoundingClientRect().top;
        if(rt >= 0){ anchor = { key: rowsNow[ri].dataset.row, top: rt }; break; }
      }
    }
    var d = SI.draft;
    var cls = d.diff ? classById(d.diff.classId) : null;
    var look = siLookCount();
    var warnings = (d.warnings||[]).length
      ? '<div class="hs-confirm" style="margin-bottom:16px;"><h4>Worth double-checking</h4>'
        + d.warnings.map(function(w){ return '<div>'+escapeHtml(w)+'</div>'; }).join('') + '</div>'
      : '';
    var supplement = siIsSupplement();
    var clsName = cls ? escapeHtml(cls.code||cls.name||'this class') : '';
    root.innerHTML = '<div class="si-panel"><div class="si-inner">'
      + '<div class="si-top"><h1>'
      + (supplement ? 'Here’s what this adds to '+clsName
         : cls ? 'Here’s what changed in '+clsName : 'Here’s what Vesta found')
      + '</h1></div>'
      + '<div class="si-sub">From '+escapeHtml(SI.filename||'the syllabus')+'. '
      + (supplement
          ? 'New assignments are ticked. A date that differs from what you already have is '
            + 'shown but left unticked, so nothing changes unless you tick it.'
          : 'Check it, fix anything that is wrong, then '+(cls ? 'update the class.' : 'import the course.')
            + ' Highlighted rows are ones Vesta was not sure about.')
      + '</div>'
      + '<div class="si-chips" id="si-chips">'+siChipsHtml()+'</div>'
      + siLookPanelHtml()
      + warnings
      + (supplement
          ? '<div class="si-keep">Course details, meeting times and grading in '+clsName
            + ' stay exactly as they are. Only the assignments below are affected.</div>'
          : siCourseHtml() + siMeetingsHtml() + (SI.onlyLook ? '' : siGradingHtml()))
      + siItemsHtml()
      + (SI.onlyLook || supplement ? '' : siTopicsHtml())
      + '</div></div>'
      + siFootHtml();
    paintIcons(root);
    var np = root.querySelector('.si-panel');
    np.scrollTop = scroll;
    if(anchor){
      var same = np.querySelector('[data-row="'+anchor.key+'"]');
      if(same) np.scrollTop += same.getBoundingClientRect().top - anchor.top;
    }
  }

  var SI_BULK_LABELS = { week:'dates worked out from week numbers', pattern:'dates worked out from a repeating pattern',
                        year:'dates with a corrected year' };

  function siShortDate(iso){ return iso ? fmtDateShort(iso) : 'no date'; }

  /** Everything still to check, in page order, as rows the checklist can show and jump to. */
  function siLookRows(){
    var d = SI.draft, rows = [];
    (d.courseChecks||[]).forEach(function(k){
      if(k.resolved) return;
      rows.push({ section:'Course', what:(k.field==='professor' ? 'Professor' : 'Course code')+' differs',
                  why:'Syllabus says '+k.syllabus+'; SFU says '+k.official, sel:'#si-course' });
    });
    d.meetings.filter(siNeedsLook).forEach(function(m){
      rows.push({ section:'Meeting times',
                  what:m.kind.charAt(0).toUpperCase()+m.kind.slice(1)+' '+DOW_SHORT[m.day]+' '+(m.start||'')+(m.section?' ('+m.section+')':''),
                  why:m.why||'', sel:'[data-row="meeting-'+m.id+'"]' });
    });
    var pending = d.items.filter(siNeedsLook);
    var bulkDone = {}, groupDone = {};
    pending.forEach(function(it){
      var bulkCount = pending.filter(function(x){ return x.flag===it.flag && !x.group; }).length;
      if(!it.group && SI_BULK_LABELS[it.flag] && bulkCount >= 3){
        if(bulkDone[it.flag]) return;
        bulkDone[it.flag] = true;
        rows.push({ section:'Assignments, quizzes and exams', what:bulkCount+' '+SI_BULK_LABELS[it.flag],
                    why:'Spot-check a few against the syllabus, then confirm them together',
                    sel:'[data-row="item-'+it.id+'"]', bulk:it.flag });
        return;
      }
      if(it.group){
        if(groupDone[it.group]) return;
        groupDone[it.group] = true;
        var members = pending.filter(function(x){ return x.group===it.group; });
        rows.push({ section:'Assignments, quizzes and exams',
                    what:(it.groupLabel||it.title).split(':')[0]+(members.length>1 ? ' · '+members.length+' dates' : ' · '+siShortDate(it.dueDate)),
                    why:it.why||'', sel:'[data-row="item-'+it.id+'"]', group:it.group });
        return;
      }
      rows.push({ section:'Assignments, quizzes and exams', what:it.title+' · '+siShortDate(it.dueDate),
                  why:it.why||'', sel:'[data-row="item-'+it.id+'"]', group:null });
    });
    return rows;
  }

  function siLookPanelHtml(){
    var rows = siLookRows();
    if(!rows.length){
      return '<div class="si-look done" id="si-look"><div class="si-look-head"><h2>Everything checked</h2>'
        + '<span class="hint" style="margin:0;">Ready to import.</span>'
        + (SI.onlyLook ? '<button type="button" class="btn ghost si-look-filter" data-action="si-only-look">Show everything</button>' : '')
        + '</div></div>';
    }
    var n = siLookCount(), html = '', last = '';
    rows.forEach(function(r, i){
      if(r.section !== last){ html += '<div class="si-look-group">'+escapeHtml(r.section)+'</div>'; last = r.section; }
      html += '<div class="si-look-row">'
        + '<span class="si-look-what">'+escapeHtml(r.what)+'</span>'
        + '<span class="si-look-why" title="'+escapeHtml(r.why)+'">'+escapeHtml(r.why)+'</span>'
        + (r.bulk ? '<button type="button" class="si-ok" data-action="si-bulk-ok" data-flag="'+r.bulk+'">These look right</button>' : '')
        + '<button type="button" class="btn" data-action="si-go" data-idx="'+i+'">Go to it</button>'
        + '</div>';
    });
    return '<div class="si-look" id="si-look"><div class="si-look-head"><h2>'+n+' still need'+(n===1?'s':'')+' a look</h2>'
      + '<span class="hint" style="margin:0;">Import Course unlocks when this list is empty.</span>'
      + '<button type="button" class="btn ghost si-look-filter" data-action="si-only-look">'
      + (SI.onlyLook ? 'Show everything' : 'Show only what needs a look')+'</button></div>'
      + html + '</div>';
  }

  /** Scroll to something on the review page, opening its group first, and outline it. */
  function siGoTo(sel, group){
    if(group) SI.openGroups[group] = true;
    renderSyllabusReview();
    var el = document.querySelector('#si-root '+sel);
    if(el){
      el.scrollIntoView({ block:'center', behavior:'smooth' });
      el.classList.add('si-pulse');
      setTimeout(function(){ el.classList.remove('si-pulse'); }, 1800);
    }
  }

  function siSectionBadge(id, n){
    return '<span class="si-badge look" id="si-badge-'+id+'"'+(n?'':' hidden')+'>'+n+' need'+(n===1?'s':'')+' a look</span>';
  }

  function siChipsHtml(){
    var d = SI.draft, look = siLookCount();
    var nItems = d.items.filter(function(i){ return i.include!==false; }).length;
    var itemsChip = '<span class="si-chip">'+nItems+' item'+(nItems===1?'':'s')+'</span>';
    var lookChip = look ? '<span class="si-chip look">'+look+' need'+(look===1?'s':'')+' a look</span>' : '';
    if(siIsSupplement()){
      // "0 meeting times, 0 grade categories" would read as the class having none. A
      // supplement leaves both alone, so the only counts that mean anything are these.
      var moved = d.items.filter(function(i){
        return (i.changes||[]).some(function(c){ return c.fill === false; });
      }).length;
      return itemsChip
        + (moved ? '<span class="si-chip look">'+moved+' date'+(moved===1?'':'s')+' changed</span>' : '')
        + lookChip;
    }
    var nMeet = d.meetings.filter(function(m){ return m.include!==false; }).length;
    return itemsChip
      + '<span class="si-chip">'+nMeet+' meeting time'+(nMeet===1?'':'s')+'</span>'
      + '<span class="si-chip">'+d.categories.length+' grade categor'+(d.categories.length===1?'y':'ies')+'</span>'
      + lookChip;
  }

  /** After an edit: footer and chips follow, the page under the cursor does not move. */
  function siRefreshCounts(){
    var root = document.getElementById('si-root');
    if(!root) return;
    var foot = root.querySelector('.si-foot');
    if(foot) foot.outerHTML = siFootHtml();
    var chips = document.getElementById('si-chips');
    if(chips) chips.innerHTML = siChipsHtml();
    var look = document.getElementById('si-look');
    if(look) look.outerHTML = siLookPanelHtml();
    var d = SI.draft;
    [['meetings', d.meetings.filter(siNeedsLook).length], ['items', d.items.filter(siNeedsLook).length],
     ['course', (d.courseChecks||[]).filter(function(k){ return !k.resolved; }).length]].forEach(function(b){
      var el = document.getElementById('si-badge-'+b[0]);
      if(el){ el.textContent = b[1]+' need'+(b[1]===1?'s':'')+' a look'; el.hidden = !b[1]; }
    });
  }

  var SI_FIELD_LABELS = { dueDate:'Due date', dueTime:'Time', type:'Type', location:'Room', category:'Category', weight:'Weight' };

  /** A document added to a class that exists: read as extra material, never a replacement. */
  function siIsSupplement(){
    return !!(SI && SI.draft && (SI.draft.mode === 'supplement'
      || (SI.draft.diff && SI.draft.diff.supplement)));
  }

  function siItemRowHtml(it){
    var d = SI.draft;
    // In a supplement the import never touches an existing assignment's category or
    // weight, so a selector here would only suggest otherwise.
    var keepsCategory = siIsSupplement() && it.existingId;
    var catSel = '<select data-si-kind="item" data-si-id="'+it.id+'" data-si-field="categoryId">'
      + '<option value="">Own weight</option>'
      + d.categories.map(function(g){ return '<option value="'+g.id+'"'+(it.categoryId===g.id?' selected':'')+'>'+escapeHtml(g.name)+'</option>'; }).join('')
      + '</select>';
    var weight = keepsCategory ? '<span class="si-keeps">Keeps its category</span>'
      : it.categoryId ? catSel
      : '<span style="display:flex;gap:4px;align-items:center;">'+catSel
        + '<input type="number" step="0.5" placeholder="%" style="width:64px;" data-si-kind="item" data-si-id="'+it.id+'" data-si-field="weight" value="'+(it.weight!=null?it.weight:'')+'"></span>';
    var badge = it.change==='new' ? '<span class="si-badge new">New</span>'
              : it.change==='changed' ? '<span class="si-badge changed">Changed</span>'
              : it.change==='same' ? '<span class="si-badge same">Unchanged</span>'
              : it.source==='official' ? '<span class="si-badge official">SFU</span>' : '<span></span>';
    var changes = (it.changes||[]).map(function(ch){
      return '<span class="si-change'+(ch.fill === false ? ' si-moved' : '')+'">'
        + (ch.fill === false ? '<b>Changed in this document.</b> ' : '')
        + escapeHtml(SI_FIELD_LABELS[ch.field]||ch.field)+': <s>'+escapeHtml(ch.before==null?'none':String(ch.before))+'</s> → '
        + escapeHtml(ch.after==null?'none':String(ch.after))+'</span>';
    }).join('');
    var note = siNoteHtml('item', it);
    if(changes) note = note ? note.replace('<div class="si-note">', '<div class="si-note">'+changes) : '<div class="si-note">'+changes+'</div>';
    return '<div class="'+siRowClass('si-item', it)+'" data-row="item-'+it.id+'">'
      + '<input type="checkbox" data-action="si-include" data-kind="item" data-id="'+it.id+'"'+(it.include!==false?' checked':'')+' title="Include">'
      + '<input type="text" data-si-kind="item" data-si-id="'+it.id+'" data-si-field="title" value="'+escapeHtml(it.title||'')+'">'
      + '<select data-si-kind="item" data-si-id="'+it.id+'" data-si-field="type">'
        + Object.keys(TYPE_LABELS).map(function(k){ return '<option value="'+k+'"'+(it.type===k?' selected':'')+'>'+TYPE_LABELS[k]+'</option>'; }).join('')
        + '</select>'
      + '<input type="date" data-si-kind="item" data-si-id="'+it.id+'" data-si-field="dueDate" value="'+(it.dueDate||'')+'">'
      + '<input type="time" data-si-kind="item" data-si-id="'+it.id+'" data-si-field="dueTime" value="'+(it.dueTime||'')+'">'
      + weight + badge + note
      + '</div>';
  }

  function siItemsHtml(){
    var d = SI.draft;
    var same = d.items.filter(function(i){ return i.change==='same'; });
    var shown = d.items.filter(function(i){
      return (SI.showSame || i.change!=='same') && (!SI.onlyLook || siNeedsLook(i));
    });
    var html = '', seen = {};
    shown.forEach(function(it){
      if(!it.group){ html += siItemRowHtml(it); return; }
      if(seen[it.group]) return;
      seen[it.group] = true;
      var members = shown.filter(function(x){ return x.group===it.group; });
      var allOn = members.every(function(x){ return x.include!==false; });
      var looks = members.filter(siNeedsLook).length;
      // a group holding something that needs a look starts open; hidden rows cannot be found
      var open = SI.openGroups[it.group] !== undefined ? SI.openGroups[it.group] : looks > 0;
      html += '<div class="si-group" data-action="si-group" data-group="'+it.group+'" data-open="'+(open?'1':'0')+'">'
        + '<input type="checkbox" data-action="si-group-include" data-group="'+it.group+'"'+(allOn?' checked':'')+' title="Include every date">'
        + '<span style="flex:1;">'+escapeHtml(it.groupLabel||it.title)+' · '+members.length+' dates'
        + (looks ? ' <span class="si-badge look">'+looks+' need'+(looks===1?'s':'')+' a look</span>' : '')+'</span>'
        + (looks ? '<button type="button" class="si-ok" data-action="si-group-ok" data-group="'+it.group+'">These dates look right</button>' : '')
        + '<span>'+(open?'⌃':'⌄')+'</span></div>'
        + (open ? members.map(siItemRowHtml).join('') : '');
    });
    var removed = (d.diff && d.diff.removed || []).map(function(r, i){
      return '<label class="si-row" style="grid-template-columns:22px 1fr auto;">'
        + '<input type="checkbox" data-action="si-removed" data-idx="'+i+'"'+(r.include?' checked':'')+'>'
        + '<span>'+escapeHtml(r.title)+'</span><span class="hint" style="margin:0;">'+(r.dueDate?fmtDateShort(r.dueDate):'')+'</span></label>';
    }).join('');
    var BULK = { week:'dates worked out from week numbers', pattern:'dates worked out from a repeating pattern',
                 year:'dates with a corrected year' };
    var bulk = Object.keys(BULK).map(function(flag){
      var n = d.items.filter(function(i){ return i.flag===flag && siNeedsLook(i); }).length;
      return n >= 2
        ? '<button type="button" class="si-ok" data-action="si-bulk-ok" data-flag="'+flag+'">These '+n+' '+BULK[flag]+' look right</button>'
        : '';
    }).join('');
    return '<section class="si-section"><h2>Assignments, quizzes and exams '+siSectionBadge('items', d.items.filter(siNeedsLook).length)+'</h2>'
      + '<div class="hint">Each ticked item goes into Assignments, onto the calendar, and into Grades.</div>'
      + (bulk ? '<div class="si-conflict" style="margin-bottom:10px;">'
          + '<span>Check a few of these against the syllabus, then confirm the rest together.</span>'+bulk+'</div>' : '')
      + (same.length ? '<button type="button" class="btn ghost" data-action="si-show-same" style="margin-bottom:8px;">'
          + (SI.showSame ? 'Hide' : 'Show')+' '+same.length+' unchanged</button>' : '')
      + (html || '<div class="hint">No assessments found.</div>')
      + (removed ? '<div class="file-cat-title" style="margin-top:14px;">No longer in the syllabus</div>'
          + '<div class="hint">Tick to remove them from Vesta. Anything you have scored or finished is kept either way.</div>' + removed : '')
      + '</section>';
  }

  function siTopicsHtml(){
    var t = SI.draft.topics || [];
    if(!t.length) return '';
    return '<section class="si-section"><details><summary style="cursor:pointer;"><h2 style="display:inline;">Weekly topics ('+t.length+')</h2></summary>'
      + '<div class="hint" style="margin-top:8px;">Added to the class’s syllabus checklist.</div>'
      + t.map(function(x){
          return '<label class="si-row" style="grid-template-columns:22px 60px 1fr;">'
            + '<input type="checkbox" data-action="si-include" data-kind="topic" data-id="'+x.id+'"'+(x.include!==false?' checked':'')+'>'
            + '<span class="hint" style="margin:0;">'+(x.week?'Week '+x.week:'')+'</span><span>'+escapeHtml(x.title)+'</span></label>';
        }).join('')
      + '</details></section>';
  }

  function siFieldInput(el){
    var kind = el.dataset.siKind, field = el.dataset.siField, v = el.value, target;
    if(kind==='course') target = SI.draft.course;
    else if(kind==='scale') target = SI.draft.gradeScale[Number(el.dataset.siIdx)];
    else target = siFind(kind, el.dataset.siId);
    if(!target) return;
    if(field==='day') v = Number(v);
    else if(field==='weight' || field==='min' || field==='dropLowest') v = v==='' ? null : Number(v);
    else if(field==='categoryId') v = v || null;
    else if(v==='' && /^(dueDate|dueTime|start|end)$/.test(field)) v = null;
    target[field] = v;
    if(field==='categoryId' && v) target.weight = null;
    // changing a flagged value means it has been looked at
    if((kind==='item' || kind==='meeting') && !target.sure && !target.confirmed){
      target.confirmed = true;
      var row = el.closest('.si-row');
      if(row){
        row.classList.add('ok');
        var ok = row.querySelector('.si-ok');
        if(ok) ok.parentNode.replaceChild(document.createTextNode('Checked'), ok);
      }
    }
    siRefreshCounts();
  }

  function openSyllabusReview(id){
    apiGet('/api/syllabus/'+id).then(function(r){
      if(!r.draft){ reportError(new Error('That syllabus has not been read yet.')); return; }
      SI = { id:r.id, classId:r.classId, filename:r.filename, estimate:null, stage:'review', error:null,
             draft:r.draft, showSame:false, openGroups:{}, returnAfterSettings:false,
             color: PALETTE[classes.length % PALETTE.length] };
      renderSyllabusReview();
    }).catch(reportError);
  }

  /** The first thing still standing between the student and the import, in page order. */
  function siNextLook(){
    var d = SI.draft;
    var k = (d.courseChecks||[]).find(function(x){ return !x.resolved; });
    if(k) return { sel:'#si-course', label:'the '+(k.field==='professor' ? 'professor' : 'course code')
                   +' differs between the syllabus and SFU' };
    var m = d.meetings.find(siNeedsLook);
    if(m) return { sel:'[data-row="meeting-'+m.id+'"]',
                   label:m.kind.charAt(0).toUpperCase()+m.kind.slice(1)+' on '+DOW_SHORT[m.day]+'. '+(m.why||'') };
    var it = d.items.find(siNeedsLook);
    if(it){
      if(it.group) SI.openGroups[it.group] = true;          // a hidden row cannot be checked
      return { sel:'[data-row="item-'+it.id+'"]', label:it.title+'. '+(it.why||'') };
    }
    return null;
  }

  function siJumpToNextLook(fromImport){
    if(fromImport){
      // the checklist at the top is the answer to "what is left, and where"
      var n = siLookCount();
      SI.blockedMsg = 'Not imported yet: '+n+' still need'+(n===1?'s':'')+' a look. They are listed at the top.';
      SI.openLookOnRender = true;
      siGoTo('#si-look', null);
      return;
    }
    var next = siNextLook();
    if(next) siGoTo(next.sel, null);
  }

  function siImport(){
    if(!SI) return;
    if(siLookCount()){ siJumpToNextLook(true); return; }
    var btn = document.querySelector('[data-action="si-import"]');
    if(btn){ btn.disabled = true; btn.textContent = 'Importing…'; }
    var isUpdate = !!SI.draft.diff;
    apiPostRaw('/api/syllabus/'+SI.id+'/import', { draft:SI.draft, color:SI.color, classId:SI.classId }).then(function(r){
      if(!r.ok){
        reportError(new Error(r.body.error || 'The import did not work.'));
        renderSyllabusReview();
        return;
      }
      var cid = r.body.classId, n = r.body.counts || {};
      var root = document.getElementById('si-root');
      if(root) root.parentNode.removeChild(root);
      SI = null;
      loadState().then(function(){
        openClassDetailModal(cid);
        var c = classById(cid);
        var parts = isUpdate
          ? [n.updated+' updated', n.items+' added', n.removed+' removed'].concat(n.kept ? [n.kept+' kept because you had already worked on them'] : [])
          : [n.items+' item'+(n.items===1?'':'s'), n.meetings+' meeting time'+(n.meetings===1?'':'s'),
             n.categories+' grade categor'+(n.categories===1?'y':'ies')];
        document.getElementById('modal-root').innerHTML =
          '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
          + '<div class="modal-head"><h2>'+(isUpdate?'Updated ':'Imported ')+escapeHtml(c ? (c.code||c.name) : 'the course')+'</h2></div>'
          + '<div class="modal-body"><div id="si-summary">'+parts.join(', ')+'. The syllabus is saved in the class’s files.</div></div>'
          + '<div class="modal-foot"><span></span><div class="right"><button class="btn primary" data-action="modal-close">Done</button></div></div>'
          + '</div></div>';
      });
    }).catch(reportError);
  }

  function siDiscard(){
    if(SI && SI.id) apiDelete('/api/syllabus/'+SI.id).catch(function(){});
    SI = null;
    var panel = document.getElementById('si-root');
    if(panel) panel.parentNode.removeChild(panel);
    document.getElementById('modal-root').innerHTML = '';
  }

  // The stored mimetype is whatever the browser sent at upload time, which is
  // blank or application/octet-stream often enough that the extension is the
  // more reliable signal. Check both.
  function fileExt(m){
    var name = m.filename || m.title || '';
    var dot = name.lastIndexOf('.');
    return dot>=0 ? name.slice(dot+1).toLowerCase() : '';
  }
  function isPdfMaterial(m){
    return m.kind==='file' && ((m.mimetype||'').indexOf('pdf')>=0 || fileExt(m)==='pdf');
  }
  function isImageMaterial(m){
    return m.kind==='file' && ((m.mimetype||'').indexOf('image')>=0
      || ['png','jpg','jpeg','gif','webp','svg','bmp'].indexOf(fileExt(m))>=0);
  }
  // The file route previews inline by default; ?download=1 forces a save.
  function materialDownloadUrl(m){
    return m.kind==='file' ? m.url+'?download=1' : m.url;
  }
  var OFFICE_EXTS = ['doc','docx','odt','rtf','ppt','pptx','odp','xls','xlsx','ods'];
  function isOfficeMaterial(m){
    return m.kind==='file' && OFFICE_EXTS.indexOf(fileExt(m)) >= 0;
  }

  function openFilePreviewModal(id){
    var m = findMaterial(id);
    if(!m) return;
    var name = m.filename || m.title || m.url;
    var body;
    if(m.kind==='file' && m.missing){
      body = '<div class="preview-fallback">This file is no longer stored on the server, so there is nothing to preview.<div style="margin-top:12px;">Upload it again to restore the preview.</div></div>';
    } else if(isPdfMaterial(m)){
      body = '<iframe src="'+escapeHtml(m.url)+'#view=FitH" title="'+escapeHtml(name)+'"></iframe>';
    } else if(isImageMaterial(m)){
      body = '<img src="'+escapeHtml(m.url)+'" alt="'+escapeHtml(name)+'">';
    } else if(m.previewUrl){
      // A Word, PowerPoint or Excel file converted to PDF on upload. The original is
      // still what Download hands back; this is only what the browser can render.
      body = '<iframe src="'+escapeHtml(m.previewUrl)+'#view=FitH" title="'+escapeHtml(name)+'"></iframe>';
    } else if(m.previewStatus === 'pending'){
      body = '<div class="preview-fallback">Converting this for preview…'
        + '<div style="margin-top:12px;" class="hint">It takes a few seconds. '
        + '<button type="button" class="link-btn" data-action="preview-refresh" data-id="'+m.id+'">Check again</button></div></div>';
    } else if(m.kind!=='file'){
      body = '<div class="preview-fallback">This is a link, not an uploaded file.<div style="margin-top:12px;"><a class="btn primary" href="'+escapeHtml(m.url)+'" target="_blank" rel="noopener noreferrer">Open link →</a></div></div>';
    } else {
      var why = (isOfficeMaterial(m) && m.previewStatus === 'failed')
        ? 'This one could not be converted for preview.'
        : 'Preview isn\'t available for this file type.';
      body = '<div class="preview-fallback">'+why+'<div style="margin-top:12px;"><a class="btn primary" href="'+escapeHtml(materialDownloadUrl(m))+'">Download '+escapeHtml(name)+'</a></div></div>';
    }
    var html = '<div class="overlay" data-action="modal-backdrop"><div class="modal modal-wide" data-action="modal-stop" style="max-width:760px;">'
      + '<div class="modal-head"><h2>'+escapeHtml(m.title||name)+'</h2>'
      + '<label class="hint" style="margin-top:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;">Filed under'
      + '<select data-action="material-set-class" data-id="'+m.id+'" style="width:auto;padding:4px 8px;">'
      + classes.concat([inboxClass()]).map(function(o){
          return '<option value="'+o.id+'"'+(o.id===m.cls.id?' selected':'')+'>'
            + escapeHtml(o.id===INBOX_ID ? 'Inbox (no class)' : (o.code||o.name||''))+'</option>';
        }).join('')
      + '</select>'
      + (m.cls.id===INBOX_ID ? ''
          : 'in<select data-action="material-set-folder" data-id="'+m.id+'" style="width:auto;padding:4px 8px;">'
            + folderSelectOptionsHtml(m.cls.id, m.folderId||'') + '</select>')
      + '</label>'
      + '<div class="hint" style="margin-top:6px;">'+escapeHtml(fileTypeLabel(m))
        + (m.kind==='file' && m.size!=null ? ' · '+humanSize(m.size) : '')
        + (m.createdAt ? ' · added '+relTimeAgo(m.createdAt) : '')
        + '</div>'
      + filePreviewLinksHtml(m) + '</div>'
      + '<div class="preview-body">'+body+'</div>'
      + '<div class="modal-foot"><span></span><div class="right">'
      + (m.kind==='file' ? '<a class="btn" href="'+escapeHtml(materialDownloadUrl(m))+'">Download</a>' : '')
      + '<a class="btn" href="'+escapeHtml(m.url)+'" target="_blank" rel="noopener noreferrer">Open in new tab</a>'
      + '<button class="btn primary" data-action="modal-close">Close</button></div></div>'
      + '</div></div>';
    document.getElementById('modal-root').innerHTML = html;
    loadFileSuggestions(m.id);
  }

  // ---------------- Class page ----------------
  var TYPE_TINT = {
    assignment:['#EEF2FF','#4F62D8'], quiz:['#E7F7EE','#1E9E5C'], exam:['#FDEBEA','#DC2626'],
    reading:['#FEF3D7','#C77700'], project:['#F1EAFE','#7C5BD8'], other:['#EEF0F4','#6B7280']
  };
  function typeTint(type){ return TYPE_TINT[type] || TYPE_TINT.other; }

  function dueLeftPill(iso){
    var d = diffDaysFromToday(iso);
    var label = d<0 ? (Math.abs(d)+' days over') : d===0 ? 'Today' : d===1 ? 'Tomorrow' : (d+' days left');
    var tone = d<=3 ? 'danger' : 'accent';
    return '<span class="left-pill '+tone+'">'+label+'</span>';
  }

  function classHomeHtml(c){
    var upcoming = items.filter(function(it){ return it.classId===c.id && it.status!=='done' && it.dueDate; })
      .sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate); }).slice(0,5);
    var upcomingRows = upcoming.length ? upcoming.map(function(it){
      var tint = typeTint(it.type);
      return '<div class="cp-row" data-action="open-item-detail" data-id="'+it.id+'">'
        + '<div class="cp-row-ic" style="background:'+tint[0]+';color:'+tint[1]+';">'+iconSvg('assignments')+'</div>'
        + '<div style="flex:1;min-width:0;"><div class="cp-row-title">'+escapeHtml(it.title)+'</div>'
        + '<div class="cp-row-sub">'+(TYPE_LABELS[it.type]||'Item')+'</div></div>'
        + '<span class="cp-row-date">'+fmtDateShort(it.dueDate)+'</span>'
        + dueLeftPill(it.dueDate)
        + '</div>';
    }).join('') : '<div class="cp-empty">Nothing scheduled for this class.</div>';

    var notesList = (c.notesList||[]).slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).slice(0,3);
    var noteRows = notesList.length ? notesList.map(function(n){
      var text = stripHtml(n.text).trim() || 'Untitled note';
      return '<div class="cp-row" data-action="preview-note" data-id="'+n.id+'">'
        + '<div class="cp-row-ic" style="background:var(--surface-2);color:var(--text-muted);">'+iconSvg('notes')+'</div>'
        + '<div style="flex:1;min-width:0;"><div class="cp-row-title">'+escapeHtml(text.slice(0,70))+'</div></div>'
        + '<span class="cp-row-date">'+(n.createdAt?fmtDateShort(n.createdAt.slice(0,10)):'')+'</span>'
        + '</div>';
    }).join('') : '<div class="cp-empty">No notes yet.</div>';

    var mats = (c.materials||[]).slice().sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); }).slice(0,3);
    var fileRows = mats.length ? mats.map(function(m){
      var name = m.filename || m.title || m.url;
      return '<div class="cp-row" data-action="preview-file" data-id="'+m.id+'">'
        + '<div class="file-ic" style="background:'+fileTypeColor(name)+';">'+fileTypeInitials(name)+'</div>'
        + '<div style="flex:1;min-width:0;"><div class="cp-row-title">'+escapeHtml(m.title||name)+'</div></div>'
        + '<span class="cp-row-date">'+(m.createdAt?fmtDateShort(m.createdAt.slice(0,10)):'')+'</span>'
        + '</div>';
    }).join('') : '<div class="cp-empty">No files yet.</div>';

    // ----- right column -----
    var meetings = (c.schedule||[]).slice().sort(function(a,b){ return a.day-b.day || (a.start||'').localeCompare(b.start||''); });
    var scheduleVal = meetings.length
      ? meetings.map(function(s){ return DOW_SHORT[s.day]+' '+fmtTime(s.start)+' – '+fmtTime(s.end); }).join('<br>')
      : '<span class="cp-dim">Not set</span>';
    var locationVal = (meetings.length && meetings[0].location) ? escapeHtml(meetings[0].location) : '<span class="cp-dim">Not set</span>';
    var infoRows = [
      ['Code', escapeHtml(c.code||'') || '<span class="cp-dim">Not set</span>'],
      ['Name', escapeHtml(c.name||'') || '<span class="cp-dim">Not set</span>'],
      ['Professor', escapeHtml(c.professor||'') || '<span class="cp-dim">Not set</span>'],
      ['Schedule', scheduleVal],
      ['Location', locationVal]
    ].map(function(r){ return '<div class="cp-info-row"><span class="cp-info-k">'+r[0]+'</span><span class="cp-info-v">'+r[1]+'</span></div>'; }).join('');

    var topics = c.syllabus || [];
    var done = topics.filter(function(t){ return t.done; }).length;
    var pct = topics.length ? Math.round(done/topics.length*100) : 0;
    var progressBody = topics.length
      ? '<div class="cp-progress-bar"><span style="width:'+pct+'%"></span></div><div class="cp-progress-pct">'+pct+'%</div>'
      : '<div class="cp-empty" style="padding:2px 0 0;">No syllabus topics yet.</div>';

    var syllabusFile = (c.materials||[]).filter(function(m){ return (m.category||'')==='syllabus'; })[0];
    var links = [];
    links.push({icon:'calendar', label:'View calendar', action:'class-quick-calendar', id:c.id});
    if(syllabusFile) links.push({icon:'files', label:'Course syllabus', action:'preview-file', id:syllabusFile.id});
    if(c.website) links.push({icon:'files', label:'Course website', action:'class-open-website', id:c.id});
    links.push({icon:'notes', label:'Class notes', action:'class-tab', id:c.id, tab:'notes'});
    var linkRows = links.map(function(l){
      return '<div class="cp-link" data-action="'+l.action+'" data-id="'+l.id+'"'+(l.tab?' data-tab="'+l.tab+'"':'')+'>'
        + '<span class="cp-link-ic">'+iconSvg(l.icon)+'</span><span class="cp-link-label">'+l.label+'</span>'
        + '<span class="cp-link-chev">›</span></div>';
    }).join('');

    return '<div class="cp-grid">'
      + '<div class="cp-main">'
      + '<div class="card"><div class="card-head"><h2>Upcoming</h2><a class="see-all" href="#" data-action="class-tab" data-id="'+c.id+'" data-tab="assignments">View all</a></div>'+upcomingRows+'</div>'
      + '<div class="card"><div class="card-head"><h2>Recent Notes</h2><a class="see-all" href="#" data-action="class-tab" data-id="'+c.id+'" data-tab="notes">View all</a></div>'+noteRows+'</div>'
      + '<div class="card"><div class="card-head"><h2>Recent Files</h2><a class="see-all" href="#" data-action="class-tab" data-id="'+c.id+'" data-tab="files">View all</a></div>'+fileRows+'</div>'
      + '</div>'
      + '<div class="cp-side">'
      + '<div class="card"><div class="card-head"><h2>Course Info</h2></div>'+infoRows+'</div>'
      + '<div class="card"><div class="card-head"><h2>Progress</h2><span class="hint">'+done+' / '+topics.length+'</span></div>'
      + progressBody
      + '<button type="button" class="btn ghost" data-action="open-syllabus-editor" data-id="'+c.id+'" style="margin-top:10px;padding-left:0;">Manage syllabus</button>'
      + '</div>'
      + '<div class="card"><div class="card-head"><h2>Quick Links</h2></div>'+linkRows+'</div>'
      + '</div></div>';
  }

  // The class detail used to be a modal. It's a full page now, so every existing

    if(!classById(classId)) return;

  var currentRubricMaterialId = null;
  var currentRubricClassId = null;
  var currentRubric = null;

  function openRubricModal(materialId, classId, forItemId){
    currentRubricMaterialId = materialId;
    currentRubricClassId = classId;
    // Opened from an assignment, the rubric belongs to that assignment. Headstart
    // reads rubrics by item_id, so without this "Break down the rubric" runs with
    // no rubric at all -- which is exactly what used to happen.
    currentRubricForItem = forItemId || null;
    document.getElementById('modal-root').innerHTML = '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop"><div class="modal-body"><div class="hint">Loading…</div></div></div></div>';
    fetchRubric(materialId).then(function(rubric){
      currentRubric = rubric;
      // An already-parsed rubric opened from an assignment it is not linked to yet
      // gets linked now, for the same reason as above.
      if(rubric && rubric.id && !rubric.itemId && currentRubricForItem){
        return updateRubric(rubric.id, { itemId: currentRubricForItem }).then(function(linked){
          currentRubric = linked || rubric;
          renderRubricModal();
          loadState();
        });
      }
      renderRubricModal();
    }).catch(function(err){ closeModal(); reportError(err); });
  }

  var currentRubricForItem = null;

  function renderRubricModal(){
    var cls = classById(currentRubricClassId);
    var mat = (cls ? (cls.materials||[]).find(function(m){ return m.id===currentRubricMaterialId; }) : null)
            || findMaterial(currentRubricMaterialId);
    var body;
    if(!currentRubric){
      if(mat && !mat.hasText){
        body = '<div class="hint">No extractable text was found in this file - only PDF and DOCX get their text pulled out on upload. Try re-uploading it as one of those.</div>';
      } else {
        body = '<div class="hint" style="margin-bottom:14px;">Pull the grading criteria out of this file so they can feed the grade tracker and Headstart.</div>'
          + '<button type="button" class="btn primary" data-action="rubric-parse">Parse rubric</button>';
      }
    } else {
      var classItems = items.filter(function(it){ return it.classId===currentRubricClassId; });
      var linkOptions = '<option value="">Not linked to an assignment</option>' + classItems.map(function(it){
        return '<option value="'+it.id+'"'+(currentRubric.itemId===it.id?' selected':'')+'>'+escapeHtml(it.title)+'</option>';
      }).join('');
      var rows = currentRubric.criteria.length ? currentRubric.criteria.map(function(c){
        return '<div class="grade-row"><span>'+escapeHtml(c.name||'')+(c.description?' <span class="hint">— '+escapeHtml(c.description)+'</span>':'')+'</span><span class="mono">'+(c.points!=null?c.points:'—')+'</span><span></span></div>';
      }).join('') : '<div class="hint">No criteria found in this file.</div>';
      body = (currentRubric.totalPoints!=null ? '<div class="hint" style="margin-bottom:10px;">Total: '+currentRubric.totalPoints+' points</div>' : '')
        + '<div class="grade-table">'+rows+'</div>'
        + '<label class="field" style="margin-top:16px;">Link to assignment<select id="rubric-link" data-action="rubric-link-select">'+linkOptions+'</select></label>'
        + '<div style="display:flex;gap:8px;margin-top:14px;">'
        + '<button type="button" class="btn ghost danger" data-action="rubric-delete">Delete</button>'
        + '<button type="button" class="btn" data-action="rubric-parse">Re-parse</button>'
        + '</div>';
    }
    var html = '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'

  // The form is the detail card with every field editable, so adding an assignment
  // looks like the card you get afterwards. Class, type, status and grade category
  // are chip rows, not <select>s: the sets are small enough to show whole, and a
  // dropdown hides both what is picked and what else there was.

  // class and writes one hidden input, the same rule the Focus settings modal and
  // the notes editor follow, so the caret, the scroll position and the button under
  // the pointer all survive. The hidden inputs keep the ids the save path already
  // reads (`f-class`, `f-type`, `f-status`, `f-category`).
  var STATUS_TINT = {

  /** Move the `active` mark within one chip row without redrawing anything else. */
  function aformSetActive(action, el){
    var root = el.closest('.aform-modal') || document;
    Array.prototype.forEach.call(root.querySelectorAll('[data-action="'+action+'"]'), function(n){
      var on = n === el;
      n.classList.toggle('active', on);
      n.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }

  function aformChip(action, value, label, opts){
    opts = opts || {};
    return '<button type="button" class="aform-chip'+(opts.cls?' '+opts.cls:'')+(opts.active?' active':'')+'"'
      + ' data-action="'+action+'" data-value="'+escapeHtml(String(value))+'"'
      + ' aria-pressed="'+(opts.active?'true':'false')+'"'
      + (opts.style ? ' style="'+opts.style+'"' : '')
      + '>'+(opts.dot?'<span class="dot" style="--c:'+opts.dot+'"></span>':'')
      + escapeHtml(label)+'</button>';
  }

        + (cls ? escapeHtml(cls.code||cls.name)+' has no grade categories, so this assignment carries its own weight.'
               : 'Pick a class to file this under one of its grade categories.')
        + '</div>';
    }
    return '<div class="aform-chips">'
      + aformChip('aform-pick-cat', '', 'Own weight', { active: !selectedId })

  /** Due-date shortcuts. Typing a date is the slow path for work due this week. */
  function aformQuickDates(){
    var today = new Date();
    var tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate()+1);
    var friday = new Date();
    // always a Friday still ahead, so it never duplicates the Today chip
    var toFriday = (5 - friday.getDay() + 7) % 7 || 7;
    friday.setDate(friday.getDate() + toFriday);
    var week = new Date(); week.setDate(week.getDate()+7);
    return [
      ['Today', isoLocal(today)],
      ['Tomorrow', isoLocal(tomorrow)],
      ['Friday', isoLocal(friday)],
      ['Next week', isoLocal(week)]
    ];
  }

  // ---- Google Calendar -----------------------------------------------------
  // Deadlines and exams go out to a calendar Vesta owns. Vesta is the source of truth:
  // anything that changed on both sides keeps Vesta's version and says so here.
  var googleStatus = null;

  function googleSectionHtml(){
    var g = googleStatus;
    var head = '<div class="st-card" id="g-cal"><div class="st-card-head"><div>'
             + '<div class="st-card-title">Google Calendar</div>'
             + '<div class="st-card-sub">'+(g && g.connected ? 'Connected.' : 'Your deadlines in Google, and the Google calendars you pick in Vesta.')+'</div>'
             + '</div></div>';
    if(!g) return head + '<div class="hint">Checking…</div></div>';
    if(!g.configured){
      return head
        + '<div class="hint">Not set up yet. Add <code>GOOGLE_CLIENT_ID</code> and '
        + '<code>GOOGLE_CLIENT_SECRET</code> to Vesta’s <code>.env</code>, then restart it. '
        + 'The redirect URI to register is <code>'+escapeHtml(g.redirectUri||'')+'</code>.</div></div>';
    }
    if(!g.connected){
      return head
        + '<div class="hint">Send your deadlines and exams to a calendar called “Vesta”. '
        + 'Finished work stays, marked with a tick. Class times are not sent.</div>'
        + '<button type="button" class="btn primary" style="margin-top:10px;" '
        + 'data-action="google-connect">Connect Google Calendar</button></div>';
    }
    var when = g.lastSync ? fmtDateShort(String(g.lastSync).slice(0,10)) : 'never';
    var notes = '';
    if(g.lastError) notes += '<div class="si-error" style="margin-top:10px;">'+escapeHtml(g.lastError)+'</div>';
    if(g.conflicts) notes += '<div class="hs-confirm" style="margin-top:10px;"><h4>'
      + g.conflicts+' event'+(g.conflicts===1?'':'s')+' changed in both places</h4>'
      + '<div>Vesta’s version is the one that stands. Sync again after fixing it here.</div></div>';
    if(g.pendingReview) notes += '<div class="hint" style="margin-top:8px;">'
      + g.pendingReview+' event group from Google is waiting on the Classes page for you to check.</div>';
    return head
      + '<div class="hint">Last synced: '+escapeHtml(when)+'.</div>'
      + notes
      + calendarPickerHtml()
      + '<div class="set-actions">'
      + '<button type="button" class="btn danger" data-action="google-disconnect">Disconnect</button>'
      + '<button type="button" class="btn primary" data-action="google-sync">Sync now</button>'
      + '</div></div>';

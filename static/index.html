<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesta</title>
<link rel="icon" type="image/png" href="/vesta-favicon.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#F4F5F7;
    --surface:#FFFFFF;
    --surface-2:#EDEFF3;
    --surface-3:#E2E6EE;
    --border:#EBEEF4;
    --text:#131722;
    --text-muted:#6B7280;
    --text-faint:#9CA3AF;
    --accent:#005FFB;
    --accent-ink:#0049C4;
    --accent-solid:#243145;
    --accent-solid-ink:#161F2E;
    --accent-soft:#E5EEFE;
    --danger:#DC2626;
    --danger-soft:#FCE3E1;
    --danger-solid:#DC2626;
    --warn:#C77700;
    --warn-soft:#FCEED2;
    --success:#1E9E5C;
    --success-soft:#DFF5E7;
    --none:#9CA3AF;
    --r-card:16px;
    --r-md:10px;
    --r-sm:8px;
    --r-pill:999px;
    --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 6px 16px -8px rgba(16,24,40,.08);
    --shadow-pop:0 20px 50px -12px rgba(16,24,40,.30);
    --shadow:var(--shadow-card);
    --sidebar-bg:#F5F5F7;
    --sidebar-border:#E7E8EC;
    --sidebar-text:#131722;
    --sidebar-text-muted:#6B7280;
    --sidebar-hover:#ECEEF2;
    --sidebar-active:#E7EDF4;
    --sidebar-accent:#005FFB;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#17171D;
      --surface:#1E1F27;
      --surface-2:#24252F;
      --surface-3:#2B2D39;
      --border:#32333F;
      --text:#EDEDF2;
      --text-muted:#A3A3AF;
      --text-faint:#6E6F7C;
      --accent:#8FA6FF;
      --accent-ink:#AEC0FF;
      --accent-solid:#4C6FE0;
      --accent-solid-ink:#5C7EEA;
      --accent-soft:#232B45;
      --danger:#F0685F;
      --danger-soft:#3B211E;
      --danger-solid:#C4453B;
      --warn:#E4A93A;
      --warn-soft:#3A2E14;
      --success:#3FCB7E;
      --success-soft:#1B3327;
      --none:#75778A;
      --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
      --shadow-pop:0 24px 56px -12px rgba(0,0,0,.6);
      --shadow:var(--shadow-card);
      --sidebar-bg:#14141A;
      --sidebar-border:#2A2B35;
      --sidebar-text:#EDEDF2;
      --sidebar-text-muted:#9A9BA8;
      --sidebar-hover:#20212A;
      --sidebar-active:#252938;
      --sidebar-accent:#7FA6FF;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17171D;
    --surface:#1E1F27;
    --surface-2:#24252F;
    --surface-3:#2B2D39;
    --border:#32333F;
    --text:#EDEDF2;
    --text-muted:#A3A3AF;
    --text-faint:#6E6F7C;
    --accent:#8FA6FF;
    --accent-ink:#AEC0FF;
    --accent-solid:#4C6FE0;
    --accent-solid-ink:#5C7EEA;
    --accent-soft:#232B45;
    --danger:#F0685F;
    --danger-soft:#3B211E;
    --danger-solid:#C4453B;
    --warn:#E4A93A;
    --warn-soft:#3A2E14;
    --success:#3FCB7E;
    --success-soft:#1B3327;
    --none:#75778A;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 20px -10px rgba(0,0,0,.5);
    --shadow-pop:0 24px 56px -12px rgba(0,0,0,.6);
    --shadow:var(--shadow-card);
    --sidebar-bg:#14141A;
    --sidebar-border:#2A2B35;
    --sidebar-text:#EDEDF2;
    --sidebar-text-muted:#9A9BA8;
    --sidebar-hover:#20212A;
    --sidebar-active:#252938;
    --sidebar-accent:#7FA6FF;
  }

  *{box-sizing:border-box;}
  html,body{ margin:0; height:100%; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Inter", system-ui, sans-serif;
    font-size:14px;
    line-height:1.45;
  }
  h1,h2,h3{ font-family:"Inter", system-ui, sans-serif; font-weight:700; text-wrap:balance; margin:0; letter-spacing:-0.01em; }
  .mono{ font-family:"IBM Plex Mono", ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }
  a{ color:var(--accent); }

  #app{ display:flex; height:100vh; position:relative; }


  /* ---------- Sidebar ---------- */
  #sidebar{
    width:240px; flex:none; height:100%;
    background:var(--sidebar-bg);
    border-right:1px solid var(--sidebar-border);
    display:flex; flex-direction:column;
    padding:20px 14px;
    gap:20px;
    overflow-y:auto;
  }
  /* Collapsed: a 64px rail. The icons stay, so navigation still works, and the
     toggle sits on the edge so it is reachable in both states. */
  #app.side-collapsed #sidebar{ width:64px; padding:20px 10px; }
  #app.side-collapsed .brand-mark > span,
  #app.side-collapsed .tab-btn .lbl,
  #app.side-collapsed .nav-extra .lbl,
  #app.side-collapsed .side-search span:not(.ic),
  #app.side-collapsed .sync-row span:not(.sync-dot){ display:none; }
  #app.side-collapsed #sidebar{ overflow-x:hidden; }
  #app.side-collapsed .tab-btn,
  #app.side-collapsed .nav-extra,
  #app.side-collapsed .side-search{ justify-content:center; padding-left:0; padding-right:0; }
  #app.side-collapsed .sync-row{ justify-content:center; }
  #app.side-collapsed .brand{ display:flex; justify-content:center; }
  #app.side-collapsed .brand-mark{ font-size:20px; }

  /* Sits on the seam between the sidebar and the page. It is a child of #app, not
     of the sidebar, because the sidebar scrolls and would clip it. */
  .side-toggle{
    position:absolute; top:24px; left:240px; transform:translateX(-50%);
    width:24px; height:24px; border-radius:50%; z-index:30;
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    font-size:12px; line-height:1; box-shadow:var(--shadow-card);
    transition:left .16s ease;
  }
  .side-toggle:hover{ background:var(--surface-2); color:var(--text); }
  #app.side-collapsed .side-toggle{ left:64px; }
  #sidebar{ transition:width .16s ease, padding .16s ease; }

  .brand{ padding:2px 6px 4px; }
  .brand-mark{ font-size:19px; font-weight:800; letter-spacing:-0.01em; color:var(--sidebar-text); display:flex; align-items:center; gap:9px; }
  .brand-logo{ width:26px; height:26px; flex:none; object-fit:contain; display:block; }
  #app.side-collapsed .brand-logo{ width:28px; height:28px; }

  nav.tabs{ display:flex; flex-direction:column; gap:2px; }
  .tab-btn{
    display:flex; align-items:center; gap:10px;
    border:none; background:transparent; color:var(--sidebar-text-muted);
    padding:9px 10px; border-radius:var(--r-sm); text-align:left;
    font-size:13.5px; font-weight:500; cursor:pointer;
    transition:background .12s ease, color .12s ease;
  }
  .tab-btn:hover{ background:var(--sidebar-hover); color:var(--sidebar-text); }
  .tab-btn.active{ background:var(--sidebar-active); color:var(--sidebar-accent); font-weight:600; }
  .tab-btn.active .ic{ color:var(--sidebar-accent); opacity:1; }
  .tab-btn .ic{ width:18px; height:18px; flex:none; opacity:.75; }
  .ic svg{ width:18px; height:18px; display:block; }
  .tile-icon svg{ width:20px; height:20px; }
  .side-search .ic{ width:16px; height:16px; flex:none; }
  .side-search .ic svg{ width:16px; height:16px; }
  .search-input-row .ic svg{ width:18px; height:18px; }
  .nav-extra .ic{ width:18px; height:18px; flex:none; }

  .side-stats{ margin-top:auto; }
  /* thin rules between groups of pages, and above the settings footer */
  .side-divider{ height:1px; background:var(--sidebar-border); margin:7px 10px; flex:none; }
  #app.side-collapsed .side-divider{ margin:7px 8px; }
  .side-foot{ display:flex; flex-direction:column; gap:10px; padding-top:14px;
    border-top:1px solid var(--sidebar-border); margin:0 -14px; padding-left:14px; padding-right:14px; }
  #app.side-collapsed .side-foot{ margin:0 -10px; padding-left:10px; padding-right:10px; }

  .sync-row{ display:flex; align-items:center; gap:7px; padding:0 4px; font-size:11px; color:var(--text-faint); }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--success); flex:none; }
  .sync-dot.off{ background:var(--danger); }

  /* ---------- Main ---------- */
  #main{ flex:1; min-width:0; padding:28px 34px 60px; height:100%; overflow-y:auto; }
  /* The reading width is capped on the content, not the scroll container, so
     collapsing the sidebar recentres the page instead of leaving a gap on one
     side. The container still spans the window, so scrollbars sit at the edge. */
  /* width:100% matters: Calendar and Notes switch #main to a flex column, and on a
     flex item auto margins absorb the free space and shrink it to its content,
     which left the page heading floating in the middle of the screen */
  #main > *{ width:100%; max-width:1120px; margin-left:auto; margin-right:auto; }
  #view-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
  #view-header h1{ font-size:26px; }
  #view-header .sub{ color:var(--text-muted); font-size:13.5px; margin-top:5px; }
  .header-right{ display:flex; align-items:center; gap:14px; flex:none; }
  .header-date{ font-size:13px; color:var(--text-muted); white-space:nowrap; }
  #view-actions{ display:flex; align-items:center; justify-content:flex-end; gap:10px; margin-bottom:18px; }
  #view-actions:empty{ display:none; }
  .btn{
    border:1px solid var(--border); background:var(--surface); color:var(--text);
    padding:8px 14px; border-radius:var(--r-md); font-size:13px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px;
    transition:border-color .12s ease, background .12s ease, box-shadow .12s ease; text-decoration:none;
    box-shadow:var(--shadow-card);
  }
  .btn svg{ width:15px; height:15px; flex:none; }
  .btn:hover{ border-color:var(--text-faint); background:var(--surface-2); }
  .btn.primary{ background:var(--accent-solid); border-color:var(--accent-solid); color:#fff; }
  .btn.primary:hover{ background:var(--accent-solid-ink); border-color:var(--accent-solid-ink); color:#fff; }
  .btn.danger{ color:var(--danger); }
  .btn.danger:hover{ background:var(--danger-solid); border-color:var(--danger-solid); color:#fff; }
  .btn.ghost{ border-color:transparent; background:transparent; padding:6px 8px; box-shadow:none; }
  .btn.ghost:hover{ background:var(--surface-2); }
  .btn:focus-visible, .tab-btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .swatch:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* ---------- Stat tiles ---------- */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:26px; }
  .tile{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); padding:16px 18px; box-shadow:var(--shadow-card); }
  .tile .n{ font-family:"Inter",sans-serif; font-size:27px; font-weight:800; line-height:1; }
  .tile .l{ margin-top:5px; color:var(--text-muted); font-size:13px; font-weight:400; white-space:nowrap; }
  .tile.overdue .n{ color:var(--danger); }
  .tile.week .n{ color:var(--warn); }
  .tile.done .n{ color:var(--success); }

  section.block{ margin-bottom:28px; }
  section.block > h2{ font-size:16px; font-weight:700; margin-bottom:12px; }

  .empty{
    border:1.5px dashed var(--border); border-radius:var(--r-card); padding:26px 20px;
    color:var(--text-muted); font-size:13px; text-align:center; background:var(--surface);
  }
  .empty .btn{ margin-top:12px; }

  /* ---------- Agenda / list rows ---------- */
  .agenda-row, .todo-row{
    display:flex; align-items:center; gap:12px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    padding:11px 14px; margin-bottom:8px; box-shadow:var(--shadow-card);
  }
  .dot{ width:9px; height:9px; border-radius:50%; flex:none; background:var(--c, var(--text-faint)); }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-size:13.5px; font-weight:600; }
  .row-title.done{ text-decoration:line-through; color:var(--text-faint); }
  .row-meta{ display:flex; gap:8px; align-items:center; margin-top:4px; flex-wrap:wrap; }
  .class-chip{
    font-size:11px; padding:2px 9px; border-radius:var(--r-pill); font-weight:600;
    background:color-mix(in srgb, var(--c, var(--text-faint)) 15%, transparent);
    color:var(--c, var(--text-muted));
  }
  .type-badge{
    font-size:10.5px; padding:2px 9px; border-radius:var(--r-pill); font-weight:600;
    background:var(--surface-2); color:var(--text-muted); text-transform:uppercase; letter-spacing:.04em;
  }
  .due-label{ font-size:11.5px; font-family:"IBM Plex Mono",monospace; color:var(--text-muted); }
  .due-label.overdue{ color:var(--danger); font-weight:600; }
  .due-label.today{ color:var(--warn); font-weight:600; }
  .row-actions{ display:flex; gap:2px; flex:none; }
  /* Weight and grade riding along on a class-page assignment row. */
  .row-grades{ display:flex; align-items:center; gap:14px; flex:none; }
  .row-grade-cell{ display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
  .row-grade-lbl{ font-size:10px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    color:var(--text-faint); padding-right:8px; }
  @media (max-width:700px){ .row-grades{ display:none; } }
  input[type="checkbox"].check{ width:17px; height:17px; accent-color:var(--accent); flex:none; cursor:pointer; }

  /* ---------- Classes grid ---------- */
  .class-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:14px; }
  .class-card{
    position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    padding:16px 18px 16px; box-shadow:var(--shadow-card); cursor:pointer;
    border-top:3px solid var(--c, var(--accent));
    transition:box-shadow .12s ease;
  }
  .class-card:hover{ box-shadow:0 6px 22px -8px rgba(16,24,40,.18); }
  .class-card .code{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--text-muted); letter-spacing:.03em; }
  .class-card h3{ font-size:19px; font-weight:700; font-family:"Inter",sans-serif; letter-spacing:-0.01em; }
  .class-card .prof{ font-size:13px; color:var(--text-faint); margin-top:12px; }
  .class-card .meetings{ margin-top:10px; display:flex; flex-direction:column; gap:4px; }
  .class-card .meeting{ font-size:11.5px; color:var(--text-muted); display:flex; gap:6px; }
  .class-card .meeting .mono{ color:var(--text); }
  .class-card .notes-preview{ margin-top:10px; font-size:11.5px; color:var(--text-faint); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .card-actions{ position:absolute; top:10px; right:10px; display:flex; gap:2px; }
  .add-card{
    border:1.5px dashed var(--border); border-radius:var(--r-card); display:flex; align-items:center; justify-content:center;
    color:var(--text-muted); font-size:13px; font-weight:600; min-height:140px; cursor:pointer; background:transparent;
  }
  .add-card:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }

  /* ---------- To-do groups ---------- */
  .group-heading{ display:flex; align-items:center; gap:8px; font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); margin:20px 0 8px; }
  .group-heading:first-child{ margin-top:0; }
  .group-heading .stripe{ width:3px; height:12px; border-radius:2px; }
  details.done-group summary{ cursor:pointer; font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; margin:22px 0 10px; list-style:none; }
  details.done-group summary::-webkit-details-marker{ display:none; }
  details.done-group summary::before{ content:"▸ "; }
  details.done-group[open] summary::before{ content:"▾ "; }

  /* ---------- form controls ---------- */
  input[type="text"], input[type="date"], input[type="time"], input[type="number"],
  input[type="email"], input[type="password"], select, textarea{
    background:var(--surface); border:1px solid var(--border); color:var(--text);
    border-radius:var(--r-md); padding:8px 11px; font-size:13px; font-family:inherit; width:100%;
  }
  textarea{ resize:vertical; min-height:64px; }
  label.field{ display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--text-muted); font-weight:600; }

  /* ---------- Calendar ---------- */
  .cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; flex:none; }
  .cal-toolbar h2{ font-size:17px; min-width:170px; }
  .cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-dow{ text-align:center; font-size:11px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; padding-bottom:4px; }
  .cal-cell{
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); min-height:88px;
    padding:7px; display:flex; flex-direction:column; gap:3px; cursor:pointer; overflow:hidden;
  }

  /* Month view fills the window instead of scrolling — only kicks in when a
     .cal-grid is on screen (month view), never on List view or other tabs. */
  #main:has(.cal-grid){ display:flex; flex-direction:column; overflow:hidden; }
  #main:has(.cal-grid) #view-header{ flex:none; }
  #main:has(.cal-grid) #view{ flex:1; min-height:0; display:flex; flex-direction:column; overflow:auto; }
  #main:has(.cal-grid) .filter-row{ flex:none; }
  #main:has(.cal-grid) .cal-grid{ flex:1; min-height:0; grid-template-rows:auto repeat(6, minmax(104px, 1fr)); }
  .cal-cell:hover{ border-color:var(--accent); }
  .cal-cell.dim{ background:var(--surface-2); color:var(--text-faint); }
  .cal-cell.today{ border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 1px var(--accent) inset; }
  .cal-daynum{ font-family:"IBM Plex Mono",monospace; font-size:11.5px; font-weight:600; }
  .cal-chip{
    font-size:10px; padding:2px 7px; border-radius:var(--r-pill); line-height:1.5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    background:color-mix(in srgb, var(--c, var(--text-faint)) 20%, transparent); color:var(--text);
  }
  .cal-chip.done{ text-decoration:line-through; opacity:.55; }
  .cal-chip.lecture{ background:var(--surface-2); color:var(--text-muted); }

  /* ---------- Modal ---------- */
  .dlg-overlay{ position:fixed; inset:0; background:rgba(18,18,24,.5); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:24px 16px; overflow:auto; z-index:400; }
  .dlg{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    width:100%; max-width:400px; box-shadow:var(--shadow-pop); overflow:hidden; }
  .dlg-body{ padding:22px 22px 18px; display:flex; gap:14px; align-items:flex-start; }
  .dlg-icon{ width:34px; height:34px; border-radius:11px; flex:0 0 34px; display:flex;
    align-items:center; justify-content:center; }
  .dlg-icon svg{ width:18px; height:18px; }
  .dlg-error .dlg-icon{ background:var(--danger-soft); color:var(--danger); }
  .dlg-confirm .dlg-icon{ background:var(--danger-soft); color:var(--danger); }
  .dlg-notice .dlg-icon, .dlg-input .dlg-icon{ background:var(--accent-soft); color:var(--accent-solid); }
  .dlg-text{ min-width:0; flex:1; }
  .dlg-text h3{ font-size:15px; font-weight:650; margin:0 0 4px; }
  .dlg-text p{ font-size:13px; color:var(--text-faint); line-height:1.55; margin:0; overflow-wrap:anywhere; }
  .dlg-fields{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
  .dlg-field{ width:100%; }
  .dlg-foot{ padding:0 22px 20px; display:flex; justify-content:flex-end; gap:8px; }
  @media (max-width:520px){ .dlg-foot{ flex-direction:column-reverse; } .dlg-foot .btn{ width:100%; } }
  .overlay{ position:fixed; inset:0; background:rgba(18,18,24,.5); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto; z-index:200; }
  .modal{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); width:100%; max-width:480px; box-shadow:var(--shadow-pop); }
  .modal-head{ padding:20px 22px 0; }
  .modal-head h2{ font-size:18px; }
  .modal-body{ padding:16px 22px; display:flex; flex-direction:column; gap:12px; max-height:60vh; overflow:auto; }
  .modal-foot{ padding:14px 22px 20px; display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--border); }
  .modal-foot .right{ display:flex; gap:8px; }
  .schedule-row{ display:grid; grid-template-columns:1fr 90px 90px 1fr auto; gap:6px; align-items:center; margin-bottom:6px; }
  .swatches{ display:flex; gap:7px; flex-wrap:wrap; }
  .swatch{ width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; background:var(--sw); }
  .swatch.selected{ border-color:var(--text); }
  .field-row{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

  /* ---------- Grades ---------- */
  .grade-line{ margin-top:10px; padding-top:10px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:2px; }
  .grade-line .g-current{ font-family:"IBM Plex Mono",monospace; font-weight:600; color:var(--text); font-size:13px; }

  /* ---------- Subtasks ---------- */
  .subtask-progress{ font-size:11px; color:var(--accent); cursor:pointer; font-weight:600; }
  .todo-row.has-open-subtasks{ border-radius:var(--r-card) var(--r-card) 0 0; margin-bottom:0; border-bottom-color:transparent; box-shadow:none; }
  .subtask-list{ display:flex; flex-direction:column; gap:5px; border:1px solid var(--border); border-top:1px dashed var(--border); border-radius:0 0 var(--r-card) var(--r-card); background:var(--surface-2); padding:9px 14px 11px 36px; margin:0 0 8px; box-shadow:var(--shadow-card); }
  .subtask-list label{ display:flex; align-items:center; gap:8px; font-size:12.5px; cursor:pointer; }
  .subtask-list input[type="checkbox"]{ width:14px; height:14px; accent-color:var(--accent); flex:none; cursor:pointer; }
  .subtask-edit-row{ display:flex; gap:6px; align-items:center; margin-bottom:6px; }
  .subtask-edit-row input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--accent); flex:none; }
  .subtask-edit-row input[type="text"]{ flex:1; }

  /* ---------- Sidebar extras ---------- */
  .nav-extra{
    display:flex; align-items:center; gap:10px; border:none; background:transparent; color:var(--sidebar-text-muted);
    padding:8px 10px; border-radius:var(--r-sm); text-align:left; font-size:12.5px; font-weight:500; cursor:pointer;
  }
  .nav-extra:hover{ background:var(--sidebar-hover); color:var(--sidebar-text); }

  /* ---------- Term ---------- */
  .cal-cell.outterm .cal-daynum{ color:var(--text-faint); }
  .hint{ font-size:11.5px; color:var(--text-faint); line-height:1.5; }
  .repeat-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .repeat-row .hint{ flex:none; }
  .repeat-row input[type="date"]{ flex:1; }
  .check-label{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:500; color:var(--text); cursor:pointer; }
  .check-label input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--accent); }

  /* ---------- Calendar filter / view toggle ---------- */
  .seg{ display:flex; border:1px solid var(--border); border-radius:var(--r-pill); overflow:hidden; flex:none; background:var(--surface); }
  .seg-btn{ border:none; background:transparent; padding:7px 14px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .seg-btn.active{ background:var(--accent-soft); color:var(--accent-ink); }
  .seg-btn + .seg-btn{ border-left:1px solid var(--border); }
  .filter-row{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:16px; }
  .filter-chip{
    font-size:11.5px; padding:5px 12px; border-radius:var(--r-pill); font-weight:600; cursor:pointer;
    border:1px solid color-mix(in srgb, var(--c, var(--text-faint)) 45%, transparent);
    background:color-mix(in srgb, var(--c, var(--text-faint)) 15%, transparent);
    color:var(--c, var(--text-muted)); transition:opacity .12s ease;
  }
  .filter-chip.off{ opacity:.4; background:transparent; }

  /* ---------- Class detail ---------- */
  .modal.modal-wide{ max-width:640px; }
  .detail-section{ margin-bottom:22px; }
  .detail-section:last-child{ margin-bottom:0; }
  .file-cat-title{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin:0 0 6px; }
  .material-row{ display:flex; align-items:center; gap:8px; padding:9px 12px; border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:6px; font-size:13px; background:var(--surface); }
  .material-row a{ flex:1; min-width:0; color:var(--text); text-decoration:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .material-row a:hover{ color:var(--accent); text-decoration:underline; }
  .mat-cat-select{ width:auto; flex:none; font-size:11px; padding:4px 6px; }
  .material-add-row{ display:flex; gap:6px; margin-top:8px; }
  .material-add-row input[type="text"]{ flex:1; }
  .dropzone{
    border:1.5px dashed var(--border); border-radius:var(--r-card); padding:22px 14px; text-align:center;
    font-size:13px; color:var(--text-muted); margin-bottom:10px; transition:border-color .12s ease, background .12s ease;
  }
  .dropzone.drag{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }

  /* ---- Files page drop zone ---- */
  .files-drop{ display:flex; align-items:center; gap:14px; padding:16px 18px; margin-bottom:18px;
    text-align:left; }
  .files-drop .fd-ic{ width:38px; height:38px; border-radius:var(--r-md); flex:none;
    background:var(--surface-2); color:var(--text-muted); display:flex; align-items:center; justify-content:center; }
  .files-drop .fd-ic svg{ width:19px; height:19px; }
  .files-drop.drag .fd-ic{ background:var(--surface); color:var(--accent); }
  .fd-text{ flex:1; min-width:0; }
  .fd-main{ font-size:13.5px; font-weight:700; color:var(--text); }
  .fd-sub{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .fd-browse{ border:none; background:transparent; color:var(--accent); font-family:inherit;
    font-size:12px; font-weight:700; cursor:pointer; padding:0; text-decoration:underline; }
  .fd-class{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--text-muted);
    font-weight:600; flex:none; }
  .fd-class select{ width:auto; font-size:12.5px; padding:6px 9px; }
  /* a drag anywhere over the page lights the zone up, so the target is obvious */
  body.file-dragging .files-drop{ border-color:var(--accent); background:var(--accent-soft); }

  /* ---- upload progress ---- */
  .upload-toast{
    position:fixed; right:22px; bottom:22px; z-index:400; min-width:250px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    box-shadow:var(--shadow-pop); padding:13px 15px;
    opacity:0; transform:translateY(8px); pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
  }
  .upload-toast.show{ opacity:1; transform:translateY(0); }
  .upload-toast .ut-row{ display:flex; align-items:center; gap:11px; }
  .upload-toast .ut-main{ font-size:13px; font-weight:700; }
  .upload-toast .ut-sub{ font-size:11.5px; color:var(--text-muted); margin-top:1px;
    max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .upload-toast .ut-bar{ height:4px; border-radius:3px; background:var(--surface-2); margin-top:10px; overflow:hidden; }
  .upload-toast .ut-bar span{ display:block; height:100%; background:var(--accent); border-radius:3px;
    transition:width .2s ease; }
  .ut-spin{ width:16px; height:16px; flex:none; border-radius:50%;
    border:2px solid var(--surface-3); border-top-color:var(--accent); animation:ut-spin .7s linear infinite; }
  @keyframes ut-spin{ to{ transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce){ .ut-spin{ animation:none; } }
  .lib-dropzone{ padding:12px 14px; text-align:left; margin-bottom:14px; }

  /* ---------- Class tabs ---------- */
  .class-tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-top:14px; flex-wrap:wrap; }
  .class-tab-btn{ border:none; background:transparent; padding:9px 10px; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .class-tab-btn.active{ color:var(--accent-ink); border-bottom-color:var(--accent); }
  .grade-summary{ display:flex; align-items:baseline; gap:10px; margin-bottom:16px; }
  .grade-big{ font-family:"Inter",sans-serif; font-size:32px; font-weight:800; }
  .grade-table{ display:flex; flex-direction:column; border:1px solid var(--border); border-radius:var(--r-card); overflow:hidden; box-shadow:var(--shadow-card); }
  .grade-row{ display:grid; grid-template-columns:1fr 86px 86px; gap:8px; padding:10px 14px; font-size:13px; border-bottom:1px solid var(--border); cursor:pointer; align-items:center; }
  .grade-row > span:nth-child(2), .grade-row > span:nth-child(3){ text-align:right; }
  .grade-row:last-child{ border-bottom:none; }
  .grade-row.grade-head{ background:var(--surface-2); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--text-faint); cursor:default; }
  .grade-row:not(.grade-head):hover{ background:var(--surface-2); }
  .note-card{ border:1px solid var(--border); border-radius:var(--r-card); padding:11px 13px; margin-bottom:8px; background:var(--surface); box-shadow:var(--shadow-card); }
  .note-link{ font-size:11px; margin-bottom:6px; color:var(--text-muted); display:flex; align-items:center; gap:6px; }
  .note-body{ font-size:13px; white-space:pre-wrap; }
  .note-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:8px; }
  .note-add textarea{ min-height:70px; }
  .topic-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:8px 12px; border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:6px; font-size:13px; background:var(--surface); }
  .topic-row label{ display:flex; align-items:center; gap:8px; cursor:pointer; }
  .topic-row input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--accent); }

  /* ---------- Headstart ---------- */
  .hs-badge{ font-size:10px; padding:2px 8px; border-radius:var(--r-pill); background:var(--surface-2); color:var(--text-muted); font-weight:700; }
  .hs-badge.accepted{ background:var(--success-soft); color:var(--success); }
  .hs-dot{ width:6px; height:6px; border-radius:50%; background:var(--text-faint); display:inline-block; margin-right:6px; }
  .hs-dot.accepted{ background:var(--success); }
  .hs-content{ font-size:13.5px; line-height:1.6; }
  .hs-content h1,.hs-content h2,.hs-content h3,.hs-content h4{ font-family:"Inter",sans-serif; }
  .hs-status{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
  .type-badge.accepted{ background:var(--success-soft); color:var(--success); }
  .hs-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:14px; }


  /* ---------- Headstart, as a working surface ---------- */
  .hs-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:16px; }
  .hs-top .hint{ margin:0; max-width:52ch; }
  .hs-spend{
    display:inline-flex; align-items:center; gap:9px; padding:8px 13px; border-radius:var(--r-pill);
    border:1px solid var(--border); background:var(--surface); font-size:12px; font-weight:600;
    color:var(--text-muted); cursor:pointer; white-space:nowrap; box-shadow:var(--shadow-card);
  }
  .hs-spend:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .hs-spend .hs-meter{ width:52px; height:5px; border-radius:var(--r-pill); background:var(--surface-3); overflow:hidden; }
  .hs-spend .hs-meter i{ display:block; height:100%; background:var(--success); border-radius:var(--r-pill); }
  .hs-spend.warm .hs-meter i{ background:var(--warn); }
  .hs-spend.full .hs-meter i{ background:var(--danger); }

  .hs-pills{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:22px; }
  .hs-bar{ display:flex; align-items:center; justify-content:space-between; gap:16px;
    flex-wrap:wrap; margin-bottom:24px; }
  .hs-bar-right{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .hs-viewswitch{ display:flex; gap:2px; padding:3px; border-radius:var(--r-pill);
    background:var(--surface-2); border:1px solid var(--border); }
  .hs-viewbtn{ border:none; background:transparent; border-radius:var(--r-pill);
    padding:5px 13px; font-size:12px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .hs-viewbtn:hover{ color:var(--text); }
  .hs-viewbtn.active{ background:var(--surface); color:var(--text);
    box-shadow:var(--shadow-card); }
  .hs-list{ display:flex; flex-direction:column; }
  /* denser than the cards, which is the whole reason to switch to a list */
  .hs-list-row{ cursor:pointer; transition:border-color .12s;
    padding:9px 14px; margin-bottom:6px; border-radius:var(--r-md); }
  .hs-list-row:hover{ border-color:var(--accent); }
  .hs-list-row .hs-open{ flex:none; }

  .hs-section{ margin-bottom:28px; }
  .hs-sec-head{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .hs-sec-head h3{ font-size:14.5px; }
  .hs-sec-head .hs-sec-count{ font-size:11.5px; color:var(--text-faint); font-weight:600; }
  .hs-sec-head .hs-sec-rest{ margin-left:auto; display:flex; gap:8px; }

  .hs-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(264px,1fr)); gap:12px; }
  .hs-card{
    position:relative; text-align:left; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-card); padding:15px 16px 13px; box-shadow:var(--shadow-card); cursor:pointer;
    display:flex; flex-direction:column; gap:9px; transition:border-color .12s, transform .12s, box-shadow .12s;
  }
  .hs-card:hover{ border-color:var(--accent); transform:translateY(-1px); box-shadow:var(--shadow-pop); }
  .hs-card::before{
    content:""; position:absolute; left:0; top:14px; bottom:14px; width:3px;
    border-radius:0 3px 3px 0; background:var(--c,var(--none));
  }
  .hs-card-title{ font-size:13.5px; font-weight:650; line-height:1.35; }
  .hs-card-meta{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; font-size:11.5px; color:var(--text-muted); }
  .hs-card-foot{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:auto; padding-top:4px; }
  /* A pill inside a flex row: without flex:none it gets shrunk below its own content
     and "2 saved" wraps onto two lines, stacking inside the pill. The icon needs an
     explicit size for the same reason every other icon in here does; unsized, it is
     squeezed to whatever is left. */
  .hs-done{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700;
    padding:3px 8px; border-radius:var(--r-pill); background:var(--success-soft);
    color:var(--success); flex:none; white-space:nowrap; }
  .hs-done svg{ width:12px; height:12px; flex:none; }
  .hs-open{ font-size:11.5px; font-weight:650; color:var(--accent); }

  .hs-study{ display:flex; gap:9px; flex-wrap:wrap; align-items:stretch; margin-top:12px; }
  .hs-study-btn{
    display:flex; align-items:center; gap:9px; padding:11px 14px; border-radius:var(--r-md);
    border:1px dashed var(--border); background:var(--surface); font-size:12.5px; font-weight:600;
    color:var(--text-muted); cursor:pointer;
  }
  .hs-study-btn:hover{ border-style:solid; border-color:var(--accent); color:var(--accent-ink); }
  .hs-study-btn svg{ width:15px; height:15px; }
  .hs-saved{
    display:flex; align-items:center; gap:9px; padding:10px 13px; border-radius:var(--r-md);
    border:1px solid var(--border); background:var(--surface); font-size:12.5px; cursor:pointer;
  }
  .hs-saved:hover{ border-color:var(--accent); }
  .hs-saved b{ font-weight:650; }
  .hs-saved .hs-saved-sub{ color:var(--text-faint); font-size:11px; }

  /* ---------- The Headstart workspace ---------- */
  .modal.hs-ws{ max-width:1040px; }
  .hs-ws-head{ padding:18px 22px 0; }
  .hs-ws-body{ display:grid; grid-template-columns:296px minmax(0,1fr); gap:0;
    height:72vh; overflow:hidden; }
  .hs-ws-left{ border-right:1px solid var(--border); padding:16px 18px 20px;
    overflow-y:auto; min-height:0; }
  .hs-ws-right{ padding:16px 20px 20px; overflow-y:auto; min-height:0; }
  .hs-group{ margin-bottom:16px; }
  .hs-group-label{ font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:7px; }
  .hs-tool{
    display:block; width:100%; text-align:left; padding:9px 11px; margin-bottom:5px;
    border:1px solid transparent; border-radius:var(--r-md); background:var(--surface-2);
    font-size:12.5px; font-weight:600; color:var(--text); cursor:pointer;
  }
  .hs-tool:hover{ background:var(--surface-3); }
  .hs-tool.active{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .hs-tool small{ display:block; font-weight:500; font-size:11px; color:var(--text-muted); margin-top:2px; }
  .hs-tool.active small{ color:var(--accent-ink); opacity:.8; }

  .hs-srcbox{ border:1px solid var(--border); border-radius:var(--r-md); padding:11px 12px; background:var(--surface); }
  .hs-srcbox h4{ font-size:12px; margin-bottom:6px; }
  .hs-srclist{ font-size:11.5px; color:var(--text-muted); line-height:1.7; }
  /* a quiet swap between the automatic choice and picking by hand: it sits under a
     list of 11.5px muted text, so a full-weight button reads as a second heading */
  .hs-srcswap{ margin-top:8px; padding:4px 0; border:none; background:none;
    font-size:11.5px; font-weight:600; color:var(--accent); cursor:pointer; }
  .hs-srcswap:hover{ color:var(--accent-ink); text-decoration:underline; }
  .hs-srclist li{ list-style:none; display:flex; gap:6px; align-items:baseline; }
  .hs-srclist li::before{ content:"·"; color:var(--text-faint); }
  .hs-pickwrap{ max-height:230px; overflow:auto; margin-top:8px; }
  .hs-pick{ display:flex; align-items:center; gap:8px; padding:5px 2px; font-size:12px; cursor:pointer; }
  .hs-pick input[type="checkbox"]{ width:14px; height:14px; accent-color:var(--accent); flex:none; }
  .hs-pick span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .hs-pick.unreadable{ color:var(--text-faint); }
  .hs-pick-group{ font-size:10.5px; font-weight:700; color:var(--text-faint);
    margin:10px 0 3px; }

  .hs-runbar{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px;
    padding-top:14px; border-top:1px solid var(--border); }
  .hs-cost{ font-size:11.5px; color:var(--text-faint); }
  .hs-out{ font-size:13.5px; line-height:1.65; }
  .hs-out h1,.hs-out h2,.hs-out h3{ font-family:"Inter",sans-serif; margin:18px 0 8px; font-size:15px; }
  .hs-out ul,.hs-out ol{ padding-left:20px; margin:8px 0; }
  .hs-out p{ margin:8px 0; }
  .hs-outbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; padding-bottom:12px;
    border-bottom:1px solid var(--border); }
  .hs-placeholder{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; min-height:300px; color:var(--text-faint); font-size:13px; text-align:center; padding:0 30px; }
  .hs-placeholder svg{ width:26px; height:26px; }
  .hs-thinking{ display:flex; align-items:center; gap:10px; font-size:13px; color:var(--text-muted); padding:20px 0; }
  .hs-thinking i{ width:14px; height:14px; border-radius:50%; border:2px solid var(--surface-3);
    border-top-color:var(--accent); animation:hs-spin .7s linear infinite; display:block; }
  @keyframes hs-spin{ to{ transform:rotate(360deg); } }

  .hs-confirm{ border:1px solid var(--warn); background:var(--warn-soft); color:var(--text);
    border-radius:var(--r-md); padding:14px 16px; font-size:13px; line-height:1.6; }
  .hs-confirm h4{ font-size:13.5px; margin-bottom:5px; }
  .hs-confirm .hs-actions{ display:flex; gap:8px; margin-top:12px; }
  .hs-confirm.capped{ border-color:var(--danger); background:var(--danger-soft); }

  @media (max-width:900px){
    .hs-ws-body{ grid-template-columns:minmax(0,1fr); max-height:none; }
    .hs-ws-left{ border-right:none; border-bottom:1px solid var(--border); }
  }

  /* ---------- Quiz Me ---------- */
  .qz-head{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    margin-bottom:16px; flex-wrap:wrap; }
  .qz-progress{ font-size:11.5px; font-weight:650; color:var(--text-faint); }
  .qz-q{ border:1px solid var(--border); border-radius:var(--r-card); padding:16px 18px;
    margin-bottom:12px; background:var(--surface); }
  .qz-q-num{ font-size:11px; font-weight:700; color:var(--text-faint); margin-bottom:6px; }
  .qz-prompt{ font-size:14px; line-height:1.5; margin-bottom:12px; font-weight:600; }
  .qz-choice{ display:flex; align-items:flex-start; gap:9px; padding:9px 11px; border-radius:var(--r-md);
    border:1px solid var(--border); margin-bottom:6px; font-size:13px; cursor:pointer; line-height:1.45; }
  .qz-choice:hover{ background:var(--surface-2); }
  .qz-choice input{ margin-top:2px; accent-color:var(--accent); flex:none; }
  .qz-choice.picked{ border-color:var(--accent); background:var(--accent-soft); }
  .qz-choice.right{ border-color:var(--success); background:var(--success-soft); }
  .qz-choice.wrong{ border-color:var(--danger); background:var(--danger-soft); }
  .qz-written{ width:100%; min-height:80px; }
  .qz-mark{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:10px;
    font-size:12.5px; color:var(--text-muted); }
  .qz-verdict{ font-size:11px; font-weight:700; padding:3px 9px; border-radius:var(--r-pill); }
  .qz-verdict.right{ background:var(--success-soft); color:var(--success); }
  .qz-verdict.wrong{ background:var(--danger-soft); color:var(--danger); }
  .qz-verdict.unmarked{ background:var(--surface-2); color:var(--text-muted); }
  .qz-answer{ margin-top:10px; padding:11px 13px; border-radius:var(--r-md);
    background:var(--surface-2); font-size:12.5px; line-height:1.6; }
  .qz-answer b{ font-weight:650; }
  /* Learn: a progress bar, a typed answer box, and what you said when it was wrong. */
  .learn-bar{ height:6px; border-radius:var(--r-pill); background:var(--surface-3);
    overflow:hidden; margin:0 0 16px; }
  .learn-bar i{ display:block; height:100%; background:var(--accent);
    border-radius:var(--r-pill); transition:width .25s ease; }
  .learn-input{ width:100%; font-size:15px; padding:12px 14px; }
  .learn-given{ margin-top:8px; font-size:12.5px; color:var(--text-muted); }
  .qz-answer.right{ border-color:var(--success); background:var(--success-soft); }
  .qz-answer.wrong{ border-color:var(--danger); background:var(--danger-soft); }
  .linkish{ background:none; border:none; padding:0; font:inherit; color:var(--accent);
    cursor:pointer; text-decoration:underline; }
  .qz-score{ text-align:center; padding:22px 0 10px; }
  .qz-score .qz-pct{ font-size:44px; font-weight:700; letter-spacing:-.02em; }
  .qz-score .qz-sub{ font-size:12.5px; color:var(--text-muted); margin-top:4px; }
  .qz-history{ margin-top:16px; border-top:1px solid var(--border); padding-top:12px; }
  .qz-history-row{ display:flex; justify-content:space-between; font-size:12px;
    color:var(--text-muted); padding:5px 0; }

  /* ---------- Flashcards ---------- */
  .fc-stage{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:10px 0 4px;
    /* without a perspective the rotation reads as a flat mirror rather than a turn */
    perspective:1400px; }
  .fc-card{
    position:relative; width:100%; max-width:540px; min-height:210px; cursor:pointer;
    transform-style:preserve-3d; transition:transform .42s cubic-bezier(.2,.7,.3,1);
  }
  .fc-stage.is-flipped .fc-card{ transform:rotateY(180deg); }
  .fc-card:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:20px; }
  /* Both faces are always in the DOM; the back is pre-turned so it reads the right way
     round once the card has rotated. */
  .fc-face{
    position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
    border-radius:20px; border:1px solid var(--border); background:var(--surface);
    box-shadow:var(--shadow-card); padding:30px 32px;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    text-align:center; font-size:17px; line-height:1.45; overflow:auto;
  }
  .fc-back-face{ transform:rotateY(180deg); }
  .fc-card:hover .fc-face{ border-color:var(--accent); }
  .fc-side{ font-size:10.5px; font-weight:700; color:var(--text-faint); }
  .fc-back-text{ font-size:15.5px; line-height:1.6; color:var(--text-muted); }
  /* The grade row is present from the start so the flip does not reflow the page
     under the pointer; it simply becomes usable once the answer is showing. */
  .fc-grade{ opacity:0; pointer-events:none; transition:opacity .2s ease .18s; }
  .fc-stage.is-flipped .fc-grade{ opacity:1; pointer-events:auto; }
  .fc-hint-back{ display:none; }
  .fc-stage.is-flipped .fc-hint-front{ display:none; }
  .fc-stage.is-flipped .fc-hint-back{ display:block; }
  @media (prefers-reduced-motion: reduce){
    .fc-card{ transition:none; }
    .fc-grade{ transition:none; }
  }
  .fc-grade{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
  /* which grade the keyboard would commit; shown so the arrow keys are not invisible */
  .fc-grade .btn{ display:inline-flex; align-items:center; gap:7px; }
  .fc-grade .fc-key{ font-size:10px; line-height:1; padding:2px 4px; border-radius:4px;
    background:var(--border); color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .fc-grade .fc-picked{ border-color:var(--accent-solid); box-shadow:0 0 0 2px var(--accent-soft); }
  .fc-grade .fc-picked .fc-key{ background:var(--accent-solid); color:#fff; }
  .fc-grade .btn{ min-width:96px; }
  .fc-hint{ font-size:11.5px; color:var(--text-faint); }
  .fc-list{ display:flex; flex-direction:column; gap:8px; }
  .fc-row{ display:flex; align-items:flex-start; gap:10px; padding:11px 13px; border:1px solid var(--border);
    border-radius:var(--r-md); font-size:12.5px; line-height:1.5; background:var(--surface); }
  .fc-row-main{ flex:1; min-width:0; }
  .fc-row-front{ font-weight:650; margin-bottom:2px; }
  .fc-row-back{ color:var(--text-muted); }
  .fc-row-due{ font-size:10.5px; color:var(--text-faint); white-space:nowrap; }

  /* ---------- Connections: attachments, suggestions, deep search ---------- */
  .cx-chip{ border:1px solid var(--border); background:var(--surface-2); border-radius:var(--r-pill);
    padding:3px 10px; font-size:11.5px; font-weight:600; color:var(--text); cursor:pointer; white-space:nowrap;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; }
  .cx-chip:hover{ border-color:var(--accent); color:var(--accent-ink); }
  .nt-suggest{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:10px 0 0; }
  .nt-suggest:empty{ display:none; }
  .nt-suggest-label, .fp-links-label{ font-size:11px; font-weight:700; color:var(--text-faint); margin-right:2px; }
  /* dashed, because a suggestion is a connection that does not exist until you say so */
  .sugg-chip{ display:inline-flex; align-items:center; gap:6px; padding:3px 4px 3px 10px;
    border-radius:var(--r-pill); border:1px dashed var(--accent); background:var(--accent-soft);
    color:var(--accent-ink); font-size:12px; font-weight:600; max-width:100%; }
  .sugg-chip .sugg-kind{ font-size:10px; font-weight:700; opacity:.7; }
  .sugg-chip button{ border:none; border-radius:var(--r-pill); background:var(--surface); color:var(--accent-ink);
    font-size:11px; font-weight:700; padding:2px 9px; cursor:pointer; }
  .sugg-chip button:hover{ background:var(--accent-solid); color:#fff; }
  .sugg-chip .sugg-x{ background:transparent; color:var(--text-faint); padding:2px 6px; }
  .sugg-chip .sugg-x:hover{ background:transparent; color:var(--danger); }
  .fp-links{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:8px; }
  #fp-suggest{ display:contents; }
  .af-item{ display:flex; align-items:center; gap:8px; margin:10px 0 4px; }
  .af-file{ padding-left:12px; }
  .sr-snippet{ font-size:12px; color:var(--text-muted); margin-top:3px; line-height:1.45; }
  .sr-snippet mark{ background:var(--warn-soft); color:var(--text); border-radius:3px; padding:0 2px; }
  .sr-related{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }

  /* ---------- Syllabus import ---------- */
  .si-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 14px;
    border-radius:var(--r-md); background:var(--accent-soft); color:var(--accent-ink); font-size:13px; font-weight:600; }
  .si-drop{ border:2px dashed var(--border); border-radius:var(--r-card); padding:34px 20px; text-align:center;
    background:var(--surface); display:flex; flex-direction:column; align-items:center; gap:6px; }
  .si-drop.over{ border-color:var(--accent); background:var(--accent-soft); }
  .si-file{ display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--border);
    border-radius:var(--r-md); font-size:13px; }
  .si-file svg{ width:16px; height:16px; }
  .si-file + .si-file{ margin-top:6px; }
  .si-add-more{ margin:8px 0 12px; display:inline-block; }
  .si-adddoc{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    padding:10px 12px; border-radius:var(--r-md); background:var(--accent-soft);
    font-size:12.5px; color:var(--accent-ink); margin-bottom:12px; }
  .si-moved{ color:var(--warn); }
  .si-keeps{ font-size:12px; color:var(--text-faint); white-space:nowrap; }
  .si-keep{ padding:12px 14px; border-radius:var(--r-md); background:var(--surface);
    border:1px solid var(--border); font-size:13px; color:var(--text-muted); margin-bottom:16px; }
  .si-moved b{ font-weight:700; }
  .si-cost{ margin-top:12px; font-size:13px; line-height:1.6; color:var(--text-muted); }
  .si-cost b{ color:var(--text); }
  .si-error{ margin-top:12px; padding:10px 12px; border-radius:var(--r-md); background:var(--danger-soft);
    color:var(--danger); font-size:12.5px; font-weight:600; }

  /* the review is a page of its own, under dialogs so the AI limit can still be changed from it */
  .si-panel{ position:fixed; inset:0; z-index:190; background:var(--bg); overflow-y:auto; }
  .si-inner{ max-width:1040px; margin:0 auto; padding:28px 28px 120px; }
  .si-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px; }
  .si-top h1{ font-size:24px; }
  .si-sub{ color:var(--text-muted); font-size:13.5px; margin-bottom:18px; }
  .si-chips{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  .si-chip{ padding:5px 12px; border-radius:var(--r-pill); background:var(--surface); border:1px solid var(--border);
    font-size:12px; font-weight:600; color:var(--text-muted); }
  .si-chip.look{ background:var(--warn-soft); border-color:var(--warn); color:var(--warn); }
  .si-section{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    box-shadow:var(--shadow-card); padding:18px 20px; margin-bottom:16px; }
  .si-section > h2{ font-size:15px; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .si-section > .hint{ margin:0 0 12px; }
  .si-section summary h2{ font-size:15px; }
  .si-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px 14px; }
  .si-row{ display:grid; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--r-md);
    border:1px solid transparent; }
  .si-row + .si-row{ margin-top:4px; }
  .si-row.off{ opacity:.45; }
  .si-row.look{ background:var(--warn-soft); border-color:var(--warn); }
  .si-row.look.ok{ background:var(--surface-2); border-color:var(--border); }
  .si-row input[type="text"], .si-row input[type="date"], .si-row input[type="time"], .si-row input[type="number"],
  .si-row select{ width:100%; padding:6px 8px; font-size:12.5px; }
  .si-row input[type="checkbox"]{ width:16px; height:16px; accent-color:var(--accent); }
  .si-meet{ grid-template-columns:22px 110px 90px 116px 116px minmax(0,1fr) 64px; }
  .si-item{ grid-template-columns:22px minmax(0,1.6fr) 110px 136px 116px minmax(210px,1.2fr) 76px; }
  .si-cat{ grid-template-columns:minmax(0,2fr) 90px 110px 90px; }
  .si-scale{ grid-template-columns:70px 90px; }
  .si-note{ grid-column:2 / -1; font-size:12px; line-height:1.5; color:var(--text-muted); display:flex;
    flex-wrap:wrap; align-items:center; gap:6px 10px; }
  .si-why{ color:var(--warn); font-weight:650; }
  .si-row.ok .si-why{ color:var(--text-muted); font-weight:500; }
  .si-evidence{ font-style:italic; color:var(--text-faint); }
  .si-evidence::before{ content:"\201C"; } .si-evidence::after{ content:"\201D"; }
  .si-ok{ border:1px solid var(--warn); background:var(--surface); color:var(--warn); border-radius:var(--r-pill);
    padding:2px 10px; font-size:11.5px; font-weight:700; cursor:pointer; }
  .si-ok:hover{ background:var(--warn); color:#fff; }
  .si-badge{ font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:var(--r-pill); white-space:nowrap; }
  .si-badge.new{ background:var(--success-soft); color:var(--success); }
  .si-badge.changed{ background:var(--accent-soft); color:var(--accent-ink); }
  .si-badge.same{ background:var(--surface-2); color:var(--text-faint); }
  .si-badge.official{ background:#EFE9FE; color:#6D4BC9; }
  .si-change{ font-size:12px; color:var(--accent-ink); }
  .si-change s{ color:var(--text-faint); }
  .si-group{ margin:10px 0 4px; padding:8px 10px; border-radius:var(--r-md); background:var(--surface-2);
    display:flex; align-items:center; gap:10px; font-size:12.5px; font-weight:650; cursor:pointer; }
  .si-conflict{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:8px 10px; margin-top:8px;
    border-radius:var(--r-md); background:var(--warn-soft); font-size:12.5px; }
  .si-foot{ position:fixed; left:0; right:0; bottom:0; z-index:191; background:var(--surface);
    border-top:1px solid var(--border); box-shadow:0 -8px 24px -12px rgba(16,24,40,.18); }
  .si-foot-inner{ max-width:1040px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; gap:12px; }
  .si-foot .si-left{ font-size:13px; color:var(--text-muted); flex:1; }
  .si-foot .si-left b.look{ color:var(--warn); }
  .si-foot .si-next{ border:none; background:none; padding:0; font:inherit; color:inherit; cursor:pointer; }
  .si-foot .si-next:hover b{ text-decoration:underline; }
  .si-foot .si-msg{ font-size:12.5px; color:var(--warn); font-weight:650; margin-top:3px; }
  /* not disabled: a disabled button swallows the click and says nothing about why */
  .si-foot .btn.si-waiting{ opacity:.6; }
  .si-row.si-pulse, .si-section.si-pulse{ box-shadow:0 0 0 3px var(--warn); transition:box-shadow .25s; }

  /* Section picker. Every option is on screen at once: you recognise your section,
     you do not go hunting for it inside a menu. */
  .cal-secs{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .cal-sec{ display:flex; flex-direction:column; align-items:flex-start; gap:1px;
            padding:8px 13px; border-radius:var(--r-md); border:1.5px solid var(--border);
            background:var(--surface); font:inherit; text-align:left; cursor:pointer;
            transition:border-color .15s, background .15s, box-shadow .15s; }
  .cal-sec:hover{ border-color:var(--text-faint); }
  .cal-sec b{ font-size:13.5px; font-weight:700; color:var(--text); }
  .cal-sec span{ font-size:11.5px; color:var(--text-muted); }
  .cal-sec.on{ border-color:var(--accent); background:var(--accent-soft); box-shadow:var(--shadow-card); }
  .cal-sec.on b{ color:var(--accent-ink); }
  .cal-sec.on span{ color:var(--accent-ink); opacity:.75; }
  .cal-group-label{ font-size:12px; font-weight:700; color:var(--text-muted); margin:16px 0 2px; }
  .cal-group-label:first-child{ margin-top:0; }

  /* ---------- Sign-in screen ----------
     A page in its own right, not a dialog over the app. While it is showing, the app
     shell is hidden outright: a dimmed dashboard behind a login box implies there is
     something there to go back to, and for a signed-out visitor there is not. */
  body.signed-out #app{ display:none; }

  .auth-screen{
    position:fixed; inset:0; z-index:300; overflow:auto;
    display:flex; align-items:center; justify-content:center; padding:32px 20px;
    /* Two soft washes of the accent rather than one, placed off-centre so the card
       sits in light with some depth behind it instead of on a flat grey field. A
       single centred gradient was so faint it may as well not have been there. */
    background:
      radial-gradient(620px 400px at 16% -8%, var(--accent-soft), transparent 60%),
      radial-gradient(540px 360px at 88% 104%, var(--accent-soft), transparent 60%),
      var(--surface-2);
  }
  .auth-inner{ width:100%; max-width:406px; }

  .auth-brand{ display:flex; align-items:center; justify-content:center; gap:9px;
               margin:0 0 22px; font-size:19px; font-weight:750; letter-spacing:-.02em;
               color:var(--text); }
  .auth-brand img{ width:27px; height:27px; border-radius:7px; }

  .auth-card{ background:var(--surface); border:1px solid var(--border);
              border-radius:var(--r-card); box-shadow:var(--shadow-card);
              padding:30px 28px 22px; }
  .auth-card h1{ margin:0 0 5px; font-size:22px; font-weight:750; letter-spacing:-.02em;
                 color:var(--text); }
  .auth-sub{ margin:0 0 22px; font-size:13.5px; color:var(--text-muted); }

  .auth-field{ display:block; margin-bottom:13px; font-size:12.5px; font-weight:650;
               color:var(--text-muted); }
  .auth-field input{ width:100%; margin-top:5px; box-sizing:border-box; height:40px; }

  /* Full-width buttons inherit the toolbar button's left-aligned label, which reads as
     unfinished once the button is the width of the card. */
  .auth-primary, .auth-google{ width:100%; height:40px; font-size:14px;
                               justify-content:center; text-align:center; }
  .auth-primary{ margin-top:7px; }

  .auth-note{ margin:2px 0 12px; padding:10px 12px; border-radius:var(--r-md);
              background:var(--accent-soft); color:var(--accent-ink); font-size:12.5px; }
  .auth-error{ margin:2px 0 12px; padding:10px 12px; border-radius:var(--r-md);
               background:var(--danger); color:#fff; font-size:12.5px; }

  .auth-links{ display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:center;
               margin-top:20px; padding-top:16px; border-top:1px solid var(--border); }
  .auth-links button{ border:none; background:none; padding:0; font:inherit;
                      font-size:12.5px; color:var(--accent); cursor:pointer; }
  .auth-links button:hover{ text-decoration:underline; }

  .auth-foot{ text-align:center; margin:18px 0 0; font-size:12px; color:var(--text-faint); }
  .auth-foot a{ color:var(--text-faint); }
  .auth-foot a:hover{ color:var(--text-muted); }

  /* "or" rule between the email fields and the Google button on the sign-in screen */
  .auth-or{ display:flex; align-items:center; gap:10px; margin:16px 0 12px;
            color:var(--text-faint); font-size:12px; }
  .auth-or::before, .auth-or::after{ content:""; flex:1; height:1px; background:var(--border); }
  .si-badge.look{ background:var(--warn-soft); color:var(--warn); }
  /* the checklist of everything still standing between the student and the import */
  .si-look{ border:1px solid var(--warn); background:var(--warn-soft); border-radius:var(--r-card);
    padding:14px 16px; margin-bottom:16px; }
  .si-look.done{ border-color:var(--success); background:var(--success-soft); }
  .si-look-head{ display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .si-look-head h2{ font-size:15px; color:var(--warn); }
  .si-look.done .si-look-head h2{ color:var(--success); margin:0; }
  .si-look-head .si-look-filter{ margin-left:auto; }
  .si-look-group{ font-size:11px; font-weight:700; color:var(--text-muted); margin:10px 0 4px; }
  .si-look-row{ display:flex; align-items:center; gap:10px; padding:7px 10px; border-radius:var(--r-md);
    background:var(--surface); margin-bottom:4px; font-size:12.5px; }
  .si-look-row .si-look-what{ font-weight:650; white-space:nowrap; }
  .si-look-row .si-look-why{ color:var(--text-muted); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .si-look-row .btn{ padding:4px 12px; font-size:12px; flex:none; }
  @media (max-width:900px){
    .si-meet, .si-item{ grid-template-columns:22px 1fr 1fr; }
    .si-note{ grid-column:1 / -1; }
  }

  /* ---------- Lock In focus mode ---------- */
  .focus-overlay{ position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; align-items:center; justify-content:center; padding:24px; overflow:auto; }
  .focus-panel{ position:relative; width:100%; max-width:420px; background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:36px 32px; box-shadow:var(--shadow-pop); text-align:center; }
  .focus-panel.focus-running{ max-width:460px; }
  .focus-phase{ font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; margin-bottom:18px; }
  .focus-ring-wrap{ position:relative; width:280px; height:280px; margin:0 auto 22px; }
  .focus-ring-wrap svg{ position:absolute; top:0; left:0; }
  .focus-time{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:"IBM Plex Mono",monospace; font-size:52px; font-weight:600; }
  .focus-task{ font-size:14px; color:var(--text-muted); margin-bottom:6px; display:flex; align-items:center; justify-content:center; gap:8px; }
  .focus-task.hint{ font-style:italic; }
  .focus-session{ font-size:12.5px; color:var(--text-faint); font-weight:700; text-transform:uppercase; letter-spacing:.05em; margin-bottom:10px; }
  .focus-dots{ display:flex; justify-content:center; gap:7px; margin-bottom:22px; }
  .focus-dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-2); border:1px solid var(--border); }
  .focus-dot.filled{ background:var(--accent); border-color:var(--accent); }
  .focus-controls{ display:flex; gap:10px; justify-content:center; }
  .focus-setup-close{ position:absolute; top:16px; right:16px; }

  /* ==================== Rebuild v3 additions ==================== */

  /* ---------- Sidebar search ---------- */
  .side-search{
    display:flex; align-items:center; gap:8px; background:var(--sidebar-hover);
    border:1px solid var(--sidebar-border); border-radius:var(--r-md); padding:8px 10px;
    color:var(--sidebar-text-muted); font-size:12.5px; cursor:pointer;
  }
  .side-search:hover{ background:var(--sidebar-active); color:var(--sidebar-text); }
  .side-search .kbd{
    margin-left:auto; font-family:"IBM Plex Mono",monospace; font-size:10px; background:var(--surface);
    border:1px solid var(--sidebar-border); border-radius:5px; padding:1px 5px; flex:none; color:var(--text-faint);
  }

  /* ---------- App shell ---------- */
  .avatar{
    width:34px; height:34px; border-radius:50%; background:var(--accent-solid); color:#fff;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex:none; cursor:pointer;
  }
  .rail-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--shadow-card); padding:16px; }
  .rail-card h3{ font-size:14px; }

  /* side-panel headings, shared with the Calendar page */
  .mini-cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .mini-cal-head .btn.ghost{ padding:4px 7px; }

  /* today panel */
  .today-row{ display:flex; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .today-row:last-child{ border-bottom:none; padding-bottom:0; }
  .today-row .dot{ margin-top:5px; }
  .today-row .t-title{ font-size:12.5px; font-weight:600; }
  .today-row .t-meta{ font-size:11px; color:var(--text-muted); margin-top:1px; }

  /* ---------- Dashboard ---------- */
  .tiles.icon-tiles .tile{ display:flex; align-items:center; gap:14px; }
  .tile-link{ cursor:pointer; transition:border-color .12s ease; }
  .tile-link:hover{ border-color:var(--accent); }
  .tile-icon{
    width:42px; height:42px; border-radius:var(--r-md); flex:none; display:flex; align-items:center; justify-content:center;
    font-size:17px; background:var(--tint-bg, var(--surface-2)); color:var(--tint-fg, var(--text-muted));
  }
  .dash-row{ display:grid; grid-template-columns:1.3fr 1fr; gap:16px; align-items:start; margin-bottom:20px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); box-shadow:var(--shadow-card); padding:18px; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .card-head h2{ font-size:15px; display:flex; align-items:center; gap:6px; }
  .card-head .see-all{ font-size:12px; font-weight:600; color:var(--accent); text-decoration:none; }
  .focus-highlight{
    background:var(--accent-soft); border-radius:var(--r-md); padding:14px 16px; display:flex; gap:14px; align-items:flex-start;
  }
  .focus-highlight .fh-icon{ width:38px; height:38px; border-radius:var(--r-sm); background:var(--surface); color:var(--accent); flex:none; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .focus-highlight .fh-top{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:4px; }
  .focus-highlight h3{ font-size:15px; margin:2px 0 4px; }
  .focus-highlight p{ margin:0; font-size:12.5px; color:var(--text-muted); line-height:1.5; }
  .focus-highlight .fh-actions{ display:flex; align-items:center; gap:14px; margin-top:12px; }
  .focus-highlight .fh-actions a{ font-size:12.5px; font-weight:600; color:var(--text); text-decoration:none; }

  .upcoming-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border); }
  .upcoming-row:last-child{ border-bottom:none; padding-bottom:0; }
  .upcoming-row .bar{ width:3px; align-self:stretch; border-radius:2px; background:var(--c, var(--text-faint)); flex:none; }
  .upcoming-row .u-ic{ font-size:14px; color:var(--text-faint); flex:none; }
  .upcoming-row .u-title{ font-size:13px; font-weight:600; }
  .upcoming-row .u-meta{ font-size:11px; color:var(--text-muted); margin-top:1px; }
  .upcoming-row .u-date{ margin-left:auto; font-size:12px; color:var(--text-muted); flex:none; }

  .grade-badge{ font-size:11px; padding:2px 8px; border-radius:var(--r-pill); font-weight:700; background:color-mix(in srgb, var(--c, var(--text-faint)) 16%, transparent); color:var(--c, var(--text-muted)); }
  .class-card .cc-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .class-card .cc-name{ font-size:14px; color:var(--text-muted); margin-top:3px; }
  .class-card .cc-meta{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .class-card .cc-meta-row{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-muted); }
  .class-card .cc-meta-row .mi{ color:var(--text-faint); flex:none; width:14px; text-align:center; }
  .cc-next{ margin-top:14px; padding-top:12px; border-top:1px solid var(--border); }
  .cc-next-label{ font-size:12px; color:var(--text-faint); margin-bottom:8px; }
  .cc-next-row{ display:flex; align-items:center; gap:10px; cursor:pointer; }
  .cc-next-ic{ width:30px; height:30px; border-radius:var(--r-sm); background:var(--surface-2); color:var(--text-muted); display:flex; align-items:center; justify-content:center; font-size:13px; flex:none; }
  .cc-next-title{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cc-next-date{ font-size:12px; color:var(--text-muted); margin-top:1px; }
  .cc-next-chev{ color:var(--text-faint); flex:none; font-size:17px; line-height:1; }
  .cc-next-none{ font-size:13px; color:var(--text-faint); }

  .file-row, .note-row{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); }
  .file-row:last-child, .note-row:last-child{ border-bottom:none; padding-bottom:0; }
  .file-ic{ width:30px; height:30px; border-radius:8px; flex:none; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:#fff; }
  .file-row .fr-main, .note-row .fr-main{ flex:1; min-width:0; cursor:pointer; }
  .file-row .fr-title, .note-row .fr-title{ font-size:12.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-row .fr-meta, .note-row .fr-meta{ font-size:11px; color:var(--text-muted); margin-top:1px; }

  /* ---------- Rich text editor ---------- */
  /* No overflow here. A scroll container clips absolutely-positioned children, and
     every dropdown in this bar hangs below it, so overflow:auto made them invisible.
     It wraps instead on a narrow window. */
  .rte-toolbar{ display:flex; flex-wrap:wrap; gap:2px; border:1px solid var(--border); border-bottom:none; border-radius:var(--r-md) var(--r-md) 0 0; background:var(--surface-2); padding:6px; }
  .rte-btn{ border:none; background:transparent; color:var(--text-muted); width:28px; height:28px; border-radius:var(--r-sm); cursor:pointer; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .rte-btn:hover{ background:var(--surface-3); color:var(--text); }
  .rte-btn.active{ background:var(--accent-soft); color:var(--accent-ink); }
  .rte-sep{ width:1px; background:var(--border); margin:3px 4px; }
  .rte-editor{
    border:1px solid var(--border); border-radius:0 0 var(--r-md) var(--r-md); padding:14px 16px; min-height:160px;
    font-size:13.5px; line-height:1.65; background:var(--surface);
  }
  .rte-editor:focus{ outline:2px solid var(--accent); outline-offset:-1px; }
  .rte-editor:empty:before{ content:attr(data-placeholder); color:var(--text-faint); pointer-events:none; }
  .rte-editor h2{ font-size:17px; margin:14px 0 6px; }
  .rte-editor h3{ font-size:15px; margin:12px 0 5px; }
  .rte-editor p{ margin:0 0 8px; }
  .rte-editor ul, .rte-editor ol{ margin:0 0 8px; padding-left:22px; }
  .rte-editor blockquote{ margin:8px 0; padding:4px 12px; border-left:3px solid var(--accent); color:var(--text-muted); font-style:italic; }
  .rte-editor mark{ background:#FDE68A; color:#1a1608; border-radius:2px; padding:0 2px; }
  .rte-content h2{ font-size:17px; margin:14px 0 6px; }
  .rte-content h3{ font-size:15px; margin:12px 0 5px; }
  .rte-content p{ margin:0 0 8px; }
  .rte-content ul, .rte-content ol{ margin:0 0 8px; padding-left:22px; }
  .rte-content blockquote{ margin:8px 0; padding:4px 12px; border-left:3px solid var(--accent); color:var(--text-muted); font-style:italic; }
  .rte-content mark{ background:#FDE68A; color:#1a1608; border-radius:2px; padding:0 2px; }

  /* ---- document editor: the block types a note can contain ---- */
  .rte-toolbar{ position:sticky; top:0; z-index:5; align-items:center; padding:7px 8px;
    background:var(--surface); border-color:var(--border); }
  .rte-grp{ display:flex; gap:2px; align-items:center; flex:none; }
  .rte-sep{ flex:none; }
  .rte-btn.wide{ width:auto; padding:0 9px; font-size:12.5px; gap:5px; }
  .rte-btn svg{ width:15px; height:15px; }

  /* a control that opens a small menu, the way the mockup's Normal text / font / size do */
  .rte-dd{ position:relative; display:inline-flex; }
  .rte-dd > .rte-btn{ font-weight:600; color:var(--text); }
  .rte-dd-caret{ font-size:9px; opacity:.55; margin-left:2px; }
  .rte-dd-menu{ display:none; position:absolute; top:100%; left:0; margin-top:5px; z-index:30;
    min-width:150px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-md); box-shadow:var(--shadow-pop); padding:5px; }
  .rte-dd.open > .rte-dd-menu{ display:block; }
  .rte-dd.right > .rte-dd-menu{ left:auto; right:0; }
  .rte-dd-menu button{ display:flex; align-items:center; gap:8px; width:100%; text-align:left;
    border:none; background:transparent; color:var(--text); font-family:inherit; font-size:13px;
    padding:7px 9px; border-radius:var(--r-sm); cursor:pointer; line-height:1.35; }
  .rte-dd-menu button > span{ display:block; }
  .rte-dd-menu button:hover{ background:var(--surface-2); }
  .rte-dd-menu .rte-dd-label{ font-size:10.5px; font-weight:700; text-transform:uppercase;
    letter-spacing:.06em; color:var(--text-faint); padding:6px 9px 3px; }
  .rte-swatches{ display:grid; grid-template-columns:repeat(6,1fr); gap:5px; padding:6px; }
  .rte-swatch{ width:20px; height:20px; border-radius:50%; border:1px solid rgba(0,0,0,.12);
    cursor:pointer; padding:0; }
  .rte-swatch:hover{ transform:scale(1.12); }

  .rte-editor h1, .rte-content h1{ font-size:22px; margin:16px 0 8px; font-weight:800; letter-spacing:-.01em; }
  .rte-editor h4, .rte-content h4{ font-size:13.5px; margin:10px 0 4px; font-weight:700; color:var(--text-muted); }
  .rte-editor a, .rte-content a{ color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
  .rte-editor hr, .rte-content hr{ border:none; border-top:1px solid var(--border); margin:16px 0; }
  .rte-editor img, .rte-content img{ max-width:100%; border-radius:var(--r-md); margin:8px 0; display:block; }

  /* checklists: a real checkbox, so it behaves like one for keyboard and screen readers */
  ul.rte-check, .rte-content ul.rte-check{ list-style:none; padding-left:2px; margin:0 0 8px; }
  ul.rte-check li{ display:flex; align-items:flex-start; gap:8px; margin:2px 0; }
  ul.rte-check input[type="checkbox"]{ margin-top:3px; width:14px; height:14px; flex:none; accent-color:var(--accent); cursor:pointer; }
  ul.rte-check li[data-done="1"]{ color:var(--text-faint); text-decoration:line-through; }

  /* callouts */
  .rte-callout, .rte-content .rte-callout{
    display:flex; gap:10px; align-items:flex-start; margin:10px 0; padding:10px 12px;
    border-radius:var(--r-md); border:1px solid var(--border); background:var(--surface-2); font-size:13px;
  }
  .rte-callout .rte-callout-ic{ flex:none; font-size:14px; line-height:1.4; }
  .rte-callout[data-tone="info"]{ background:var(--accent-soft); border-color:transparent; }
  .rte-callout[data-tone="warn"]{ background:#FEF6DF; border-color:transparent; color:#6b4e05; }
  .rte-callout[data-tone="good"]{ background:var(--success-soft); border-color:transparent; }

  /* tables */
  .rte-editor table, .rte-content table{ border-collapse:collapse; width:100%; margin:10px 0; font-size:13px; }
  .rte-editor th, .rte-editor td,
  .rte-content th, .rte-content td{ border:1px solid var(--border); padding:6px 9px; text-align:left; vertical-align:top; }
  .rte-editor th, .rte-content th{ background:var(--surface-2); font-weight:700; }
  .rte-table-wrap{ overflow-x:auto; }

  /* code */
  .rte-editor pre, .rte-content pre{
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md);
    padding:10px 12px; margin:10px 0; overflow-x:auto; font-family:var(--mono, ui-monospace, monospace); font-size:12.5px;
  }
  .rte-editor code, .rte-content code{ font-family:var(--mono, ui-monospace, monospace); font-size:12.5px;
    background:var(--surface-2); border-radius:4px; padding:1px 4px; }
  .rte-editor pre code, .rte-content pre code{ background:none; padding:0; }

  /* maths: KaTeX renders it when it loads, the LaTeX shows plainly if it does not */
  .rte-math{ display:inline-block; padding:0 3px; }
  .rte-math.raw{ font-family:var(--mono, ui-monospace, monospace); font-size:12.5px;
    background:var(--surface-2); border-radius:4px; padding:1px 5px; color:var(--accent-ink); }
  .rte-math.block{ display:block; margin:10px 0; text-align:center; }

  /* an attached file, embedded inline */
  .rte-embed, .rte-content .rte-embed{
    display:flex; align-items:center; gap:10px; margin:8px 0; padding:9px 11px;
    border:1px solid var(--border); border-radius:var(--r-md); background:var(--surface-2);
    font-size:12.5px; text-decoration:none; color:var(--text);
  }
  .rte-embed:hover{ background:var(--surface-3); }
  .rte-embed .file-ic{ width:26px; height:26px; font-size:9px; }

  /* full screen writing: the note takes the window, navigation gets out of the way */
  /* Below .overlay (200) and .search-overlay (210) on purpose: at 300 this covered
     every dialog opened from inside full screen, so Trash and History did nothing. */
  .nt-wrap.fullscreen{
    position:fixed; inset:0; z-index:100; background:var(--bg);
    grid-template-columns:270px minmax(0,1fr); gap:0; padding:0; margin:0;
    align-items:stretch; overflow:hidden;
  }
  .nt-wrap.fullscreen .nt-tree{ border-radius:0; border-top:none; border-bottom:none; border-left:none;
    overflow-y:auto; max-height:100vh; }
  .nt-wrap.fullscreen .nt-editor{ border:none; border-radius:0; overflow-y:auto; max-height:100vh;
    padding:26px 40px 80px; }
  .nt-wrap.fullscreen .nt-body{ min-height:64vh; border:none; background:transparent; padding-left:0; padding-right:0; }
  .nt-wrap.fullscreen .nt-body:focus{ outline:none; }
  .nt-wrap.fullscreen .rte-toolbar{ background:var(--bg); border-left:none; border-right:none; border-top:none; }
  /* zen: even the note list goes */
  .nt-wrap.fullscreen.zen{ grid-template-columns:minmax(0,1fr); }
  .nt-wrap.fullscreen.zen .nt-tree, .nt-wrap.fullscreen.zen .nt-ctx{ display:none; }
  .nt-wrap.fullscreen .nt-editor > *{ max-width:840px; margin-left:auto; margin-right:auto; }

  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .rte-editor mark,
    :root:not([data-theme="light"]) .rte-content mark{ background:#8a6d1f; color:#fff; }
  }
  :root[data-theme="dark"] .rte-editor mark,
  :root[data-theme="dark"] .rte-content mark{ background:#8a6d1f; color:#fff; }

  /* ---------- Search palette ---------- */
  .search-overlay{ position:fixed; inset:0; background:rgba(18,18,24,.5); backdrop-filter:blur(2px); z-index:210; display:flex; align-items:flex-start; justify-content:center; padding:80px 16px; overflow:auto; }
  .search-panel{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card); width:100%; max-width:560px; box-shadow:var(--shadow-pop); overflow:hidden; }
  .search-input-row{ display:flex; align-items:center; gap:10px; padding:14px 18px; border-bottom:1px solid var(--border); }
  .search-input-row .ic{ color:var(--text-faint); }
  .search-input-row input{ border:none; outline:none; font-size:15px; flex:1; background:transparent; color:var(--text); }
  .search-results{ max-height:60vh; overflow:auto; padding:8px; }
  .search-group-label{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); padding:10px 10px 4px; }
  .search-result{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:var(--r-sm); cursor:pointer; }
  .search-result:hover, .search-result.sel{ background:var(--surface-2); }
  .search-result .sr-ic{ color:var(--text-faint); flex:none; }
  .search-result .sr-title{ font-size:13px; font-weight:600; }
  .search-result .sr-meta{ font-size:11px; color:var(--text-muted); }
  .search-empty{ padding:30px 18px; text-align:center; color:var(--text-faint); font-size:13px; }

  /* ---------- Grade scale editor ---------- */
  .scale-row{ display:grid; grid-template-columns:1fr 90px auto; gap:8px; align-items:center; margin-bottom:6px; }
  .scale-row input{ text-align:center; }
  .scale-row input[type="text"]{ text-align:left; }

  /* ---------- File preview ---------- */
  .preview-body{ display:flex; align-items:center; justify-content:center; background:var(--surface-2); min-height:60vh; }
  .preview-body iframe{ width:100%; height:74vh; border:none; }
  .preview-body img{ max-width:100%; max-height:74vh; object-fit:contain; }

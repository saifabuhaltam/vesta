  /** The Headstart tab inside an assignment. Same tools, already pointed at this piece of work. */
  function itemCardHeadstartHtml(it){
    var hs = it.headstarts || [];
    var rows = hs.map(function(h){
      return '<button type="button" class="hs-saved" style="width:100%;margin-bottom:6px;" '
        + 'data-action="hs-open-saved" data-id="'+it.id+'" data-hs="'+(h.id||'')+'">'
        + '<b>'+escapeHtml(HEADSTART_LABELS[h.kind] || h.kind)+'</b>'
        + '<span class="hs-saved-sub">'+escapeHtml(h.updatedAt ? 'saved '+relTimeAgo(h.updatedAt) : 'saved earlier')+'</span></button>';
    }).join('');
    // Quizzes, practice tests and decks carry an itemId too, and this card used to
    // read `headstarts` alone -- so it claimed nothing had been generated while a
    // practice test for the same assignment sat one screen away.
    rows += hsQuizzes.filter(function(q){ return q.itemId === it.id; }).map(function(q){
      return '<button type="button" class="hs-saved" style="width:100%;margin-bottom:6px;" '
        + 'data-action="hs-open-quiz" data-id="'+q.id+'">'
        + '<b>'+escapeHtml(q.title || (q.kind==='practice_test' ? 'Practice test' : 'Quiz'))+'</b>'
        + '<span class="hs-saved-sub">'+q.questionCount+' question'+(q.questionCount===1?'':'s')
        + (q.bestScore!=null ? ' · best '+q.bestScore+'%' : ' · not taken yet')+'</span></button>';
    }).join('');
    rows += hsDecks.filter(function(d){ return d.itemId === it.id; }).map(function(d){
      return '<button type="button" class="hs-saved" style="width:100%;margin-bottom:6px;" '
        + 'data-action="hs-open-deck" data-id="'+d.id+'">'
        + '<b>'+escapeHtml(d.name || 'Flashcards')+'</b>'
        + '<span class="hs-saved-sub">'+d.cardCount+' card'+(d.cardCount===1?'':'s')
        + (d.dueCount ? ' · '+d.dueCount+' due' : '')+'</span></button>';
    }).join('');
    return '<div class="ac-card">'
      + '<div class="ac-card-head"><h3>Headstart</h3>'
      + '<button type="button" class="btn primary" data-action="hs-open-item" data-id="'+it.id+'">'
      + 'Open Headstart</button></div>'
      + '<div class="hs-study" style="margin-top:0;">'
      + '<button type="button" class="hs-study-btn" data-action="hs-new-quiz" '
        + 'data-class="'+it.classId+'" data-item="'+it.id+'">'+iconSvg('check')+'Quiz me on this</button>'
      + '<button type="button" class="hs-study-btn" data-action="hs-new-test" '
        + 'data-class="'+it.classId+'" data-item="'+it.id+'">'+iconSvg('assignments')+'Practice test</button>'
      + '<button type="button" class="hs-study-btn" data-action="hs-new-cards" '
        + 'data-class="'+it.classId+'" data-item="'+it.id+'">'+iconSvg('notes')+'Flashcards</button>'
      + '</div>'
      + (rows
          ? '<div style="margin-top:12px;"><div class="hs-group-label">Earlier results</div>'+rows+'</div>'
          : '<div class="ac-empty-box" style="margin-top:12px;">Nothing generated for this assignment yet. '
            + 'Headstart reads your files and notes, and shows what it will cost before it runs.</div>')
      + '</div>';
  }

  /**
   * Does this note point at this assignment?
   *
   * Two mechanisms grew up separately: `linkedItemId`, the single column written when
   * a note is started from an assignment, and `note_links`, the many-to-many the
   * Links menu writes. The card used to read only the first, so a note linked to two
   * assignments from the note side appeared on neither card.
   */
  function noteIsAbout(n, itemId){
    if(!n || !itemId) return false;
    if(n.linkedItemId === itemId) return true;
    return (n.linkedItemIds || []).indexOf(itemId) > -1;
  }

  function itemCardNotesHtml(it, cls){
    // A note attached from another class still belongs on this card, so look at
    // every note rather than only the ones filed under this assignment's class.
    var linked = allNotes().filter(function(n){
      return !n.deletedAt && noteIsAbout(n, it.id);
    });
    var rows = linked.length ? linked.map(function(n){
      return '<div class="ac-file">'
        + '<div class="file-ic" style="background:'+(n.cls.color||'var(--accent)')+';">N</div>'
        + '<div style="flex:1;min-width:0;"><div class="ac-file-name">'+escapeHtml(noteDisplayTitle(n))+'</div>'
        + '<div class="ac-file-meta">'+escapeHtml(n.cls.id===INBOX_ID ? 'Inbox' : (n.cls.code||n.cls.name||''))
          + (n.updatedAt?' \u00b7 Edited '+relTimeAgo(n.updatedAt):'')+'</div></div>'
        + '<button type="button" class="btn" data-action="notes-open-any" data-id="'+n.id+'" data-class="'+n.cls.id+'">Open</button>'
        + '<button type="button" class="btn ghost" data-action="item-note-detach" data-nid="'+n.id+'" data-id="'+it.id+'"'
          + ' title="Leave the note where it is, just not on this assignment">Detach</button>'
        + '</div>';
    }).join('') : '';
    return '<div class="ac-card">'
      + '<div class="ac-card-head"><h3>Notes about this</h3>'
      + '<div class="ac-card-actions">'
      + '<button type="button" class="btn" data-action="item-note-attach" data-id="'+it.id+'">'
        + iconSvg('link')+' Attach existing</button>'
      + '<button type="button" class="btn" data-action="item-note-new" data-id="'+it.id+'" data-class="'+(cls ? cls.id : INBOX_ID)+'">'
        + iconSvg('plus')+' New note</button>' 
      + '</div></div>'
      + (rows || '<div class="ac-empty-box">No notes linked to this assignment yet.</div>')
      + '</div>';
  }

  // ---- attach a note you already wrote to an assignment ----------------
  // Writing a fresh note every time buried the one that already said the thing,
  // so this reaches across every class and files an existing note here instead.
  var attachNoteItemId = null;
  var attachNoteSearch = '';

  function attachNoteListHtml(it){
    var q = attachNoteSearch.trim().toLowerCase();
    var pool = allNotes().filter(function(n){
      return !n.deletedAt && !noteIsAbout(n, it.id);
    });
    if(q){
      pool = pool.filter(function(n){
        return (noteDisplayTitle(n)+' '+stripHtml(n.text||'')+' '+(n.cls.code||n.cls.name||''))
          .toLowerCase().indexOf(q) > -1;
      });
    }
    if(!pool.length){
      return '<div class="ac-empty-box">'
        + (q ? 'No notes match that.' : 'Every note you have is already on this assignment.')
        + '</div>';
    }
    // This assignment's own class first: that is where the note you are reaching
    // for almost always lives. Most recently edited wins inside each group.
    pool.sort(function(a,b){
      var am = a.cls.id === it.classId ? 0 : 1, bm = b.cls.id === it.classId ? 0 : 1;
      if(am !== bm) return am - bm;
      return (b.updatedAt||'').localeCompare(a.updatedAt||'');
    });
    return pool.slice(0, 80).map(function(n){
      var held = n.linkedItemId ? items.find(function(x){ return x.id===n.linkedItemId; }) : null;
      return '<button type="button" class="an-row" data-action="item-note-attach-pick"'
        + ' data-nid="'+n.id+'" data-id="'+it.id+'">'
        + '<span class="file-ic" style="background:'+(n.cls.color||'var(--none)')+';">N</span>'
        + '<span class="an-row-main">'
        + '<span class="an-row-title">'+escapeHtml(noteDisplayTitle(n))+'</span>'
        + '<span class="an-row-meta">'
          + escapeHtml(n.cls.id===INBOX_ID ? 'Inbox' : (n.cls.code||n.cls.name||''))
          + (n.updatedAt ? ' \u00b7 Edited '+relTimeAgo(n.updatedAt) : '')
          + (held ? ' \u00b7 now on '+escapeHtml(held.title||'another assignment') : '')
        + '</span></span>'
        + '<span class="an-row-add">Attach</span>'
        + '</button>';
    }).join('');
  }

  function openAttachNoteModal(itemId){
    var it = items.find(function(x){ return x.id===itemId; });
    if(!it) return;
    attachNoteItemId = itemId;
    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>Attach a note</h2></div>'
      + '<div class="modal-body">'
      + '<input type="text" class="an-search" id="an-search" placeholder="Search your notes\u2026" value="'
        + escapeHtml(attachNoteSearch)+'">'
      + '<div class="an-list" id="an-list">'+attachNoteListHtml(it)+'</div>'
      + '<div class="hint" style="margin-top:10px;">A note sits on one assignment at a time, '
        + 'so attaching one that is already somewhere else moves it here.</div>'
      + '</div>'
      + '<div class="modal-foot"><span></span><div class="right">'
      + '<button class="btn" data-action="item-note-attach-back" data-id="'+itemId+'">Back to the assignment</button>'
      + '</div></div></div></div>';
    paintIcons();
    var box = document.getElementById('an-search');
    if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  }

  function refreshAttachNoteList(){
    var list = document.getElementById('an-list');
    var it = items.find(function(x){ return x.id===attachNoteItemId; });
    if(!list || !it) return;
    list.innerHTML = attachNoteListHtml(it);
    paintIcons(list);
  }

  function saveClassFromForm(id){
    var code = document.getElementById('f-code').value.trim();
    var name = document.getElementById('f-name').value.trim();
    if(!name){ document.getElementById('f-name').focus(); return; }
    var data = {
      code: code, name: name,
      professor: document.getElementById('f-prof').value.trim(),
      color: editingColor,
      schedule: editingSchedule.filter(function(s){ return s.start && s.end; }),
      website: document.getElementById('f-website').value.trim(),
      notes: document.getElementById('f-notes').value.trim()
    };
    var p = id ? updateClass(id, data) : addClass(data);
    p.then(closeModal).catch(reportError);
  }

  function saveItemFromForm(id){
    var titleEl = document.getElementById('f-title');
    var title = titleEl.value.trim();
    if(!title){
      // the title is the whole heading of this card, so say it is missing there
      titleEl.classList.add('missing');
      titleEl.placeholder = 'Give this assignment a name';
      titleEl.focus();
      return;
    }
    titleEl.classList.remove('missing');
    var weightVal = document.getElementById('f-weight').value;
    var scoreEl = document.getElementById('f-score');
    var scoreVal = scoreEl ? scoreEl.value : '';
    var subtasks = editingSubtasks.filter(function(s){ return s.title && s.title.trim(); }).map(function(s){ return { id:s.id, title:s.title.trim(), done:!!s.done }; });
    var base = {
      title: title,
      classId: document.getElementById('f-class').value || null,
      type: document.getElementById('f-type').value,
      dueTime: document.getElementById('f-time').value || null,
      weight: weightVal!=='' ? Number(weightVal) : null,
      score: scoreVal!=='' ? Number(scoreVal) : null,
      categoryId: (function(){
        var sel = document.getElementById('f-category');
        var cls = classById(document.getElementById('f-class').value);
        var ok = sel && sel.value && cls && (cls.gradeCategories||[]).some(function(g){ return g.id===sel.value; });
        return ok ? sel.value : null;     // a category belongs to its class
      })(),
      subtasks: subtasks,
      notes: document.getElementById('f-inotes').value.trim()
    };
    var dueDate = document.getElementById('f-date').value || null;
    if(base.categoryId) base.weight = null;       // it shares the category's weight instead

    if(id){
      var st = document.getElementById('f-status').value;
      var patch = Object.assign({ dueDate: dueDate, status: st }, base);
      patch.completedAt = st==='done' ? (items.find(function(i){return i.id===id;}) || {}).completedAt || todayIso() : null;
      updateItem(id, patch).then(closeModal).catch(reportError);
      return;
    }

    var repeatEl = document.getElementById('f-repeat');
    var repeat = !!(repeatEl && repeatEl.checked);
    var until = repeat ? document.getElementById('f-repeat-until').value : '';

    // The form has always shown Status while adding and then ignored it. It is a
    // visible control now, so it has to mean something: a repeated item still starts
    // at todo, since "done" cannot describe next month's copy.
    var newStatus = (document.getElementById('f-status') || {}).value || 'todo';
    var newDone = newStatus==='done' ? todayIso() : null;

    var creates = [];
    if(repeat && dueDate && until && until>=dueDate){
      var cursor = parseISODate(dueDate);
      var untilD = parseISODate(until);
      while(cursor<=untilD){
        creates.push(Object.assign({}, base, { dueDate: isoLocal(cursor), status:'todo', completedAt:null }));
        cursor.setDate(cursor.getDate()+7);
      }
    } else {
      creates.push(Object.assign({}, base, { dueDate: dueDate, status:newStatus, completedAt:newDone }));
    }
    Promise.all(creates.map(function(d){
      return route('addItem', [d], function(){ return apiPost('/api/items', d); });
    })).then(loadState).then(closeModal).catch(reportError);
  }

  // ---------------- The Headstart workspace ----------------
  // One panel for one piece of work. The left side is what goes in: which tool, and
  // which of your own material it reads. The right side is what comes out.

  var HW = null;

  function hsBackBtnHtml(){
    if(!hsBackItemId) return '';
    return '<button type="button" class="btn" data-action="hs-back">← Back to the assignment</button>';
  }

  function hsBlankSelection(){
    return { materialIds:[], noteIds:[], folderIds:[], syllabusIds:[] };
  }

  /**
   * @param {{itemId?:string, classId?:string, tool?:string}} opts
   */
  function openHeadstartWorkspace(opts){
    opts = opts || {};
    var it = opts.itemId ? items.find(function(i){ return i.id===opts.itemId; }) : null;
    var classId = opts.classId || (it && it.classId) || hsClassId || (classes[0] && classes[0].id);
    HW = {
      itemId: it ? it.id : null,
      classId: classId,
      tool: opts.tool || (it ? 'explain' : 'summarize'),
      selection: hsBlankSelection(),
      picking: false,
      text: '',
      instructions: '',
      result: null,
      sources: null,
      estimate: null,
      confirm: null,
      busy: false,
      ctx: null,
      viewing: null
    };
    hsRenderWorkspace();
    if(classId){
      apiGet('/api/ai/context/'+classId).then(function(ctx){
        // this only feeds the picker, so it must not redraw the panel underneath you
        if(HW){ HW.ctx = ctx; hsPaintSources(); }
      }).catch(function(){});
    }
    hsRefreshEstimate();
  }

  function hsWorkItem(){
    return HW && HW.itemId ? items.find(function(i){ return i.id===HW.itemId; }) : null;
  }

  function hsSelectionPayload(){
    var s = HW.selection;
    var any = s.materialIds.length || s.noteIds.length || s.folderIds.length || s.syllabusIds.length;
    return any ? s : null;   // null lets the server choose what looks relevant
  }

  function hsRunBody(extra){
    var body = {
      tool: HW.tool,
      itemId: HW.itemId,
      classId: HW.classId,
      selection: hsSelectionPayload(),
      text: HW.text,
      instructions: HW.instructions
    };
    Object.keys(extra||{}).forEach(function(k){ body[k] = extra[k]; });
    return body;
  }

  /** Price the run as it is currently set up, without running it. */
  function hsRefreshEstimate(){
    if(!HW) return;
    apiPost('/api/ai/estimate', hsRunBody()).then(function(e){
      if(!HW) return;
      HW.estimate = e;
      var host = document.getElementById('hs-cost');
      if(host) host.innerHTML = hsCostText(e);
      var src = document.getElementById('hs-autosrc');
      if(src && !HW.picking) src.innerHTML = hsSourceListHtml(e.sources);
    }).catch(function(){});
  }

  function hsCostText(e){
    if(!e) return '';
    return 'About $'+e.estimateUsd.toFixed(3)+' · reads '+e.sources.length
      + ' source'+(e.sources.length===1?'':'s');
  }

  function hsSourceListHtml(sources){
    if(!sources || !sources.length){
      return '<div class="hint" style="margin:0;">Nothing selected yet.</div>';
    }
    return '<ul class="hs-srclist">' + sources.map(function(s){
      return '<li><span>'+escapeHtml(s.title||'Untitled')+'</span></li>';
    }).join('') + '</ul>';
  }

  function hsToolsHtml(){
    return HS_TOOL_GROUPS.map(function(g){
      return '<div class="hs-group"><div class="hs-group-label">'+g.label+'</div>'
        + g.tools.map(function(k){
            var t = HS_TOOLS[k];
            return '<button type="button" class="hs-tool'+(HW.tool===k?' active':'')+'" '
              + 'data-action="hs-pick-tool" data-tool="'+k+'">'+escapeHtml(t.label)
              + '<small>'+escapeHtml(t.blurb)+'</small></button>';
          }).join('')
        + '</div>';
    }).join('');
  }

  /** The material picker, shared by the workspace and the quiz and card makers. */
  var hsPickState = null;

  function hsPickerHtml(st){
    hsPickState = st;
    var ctx = st.ctx;
    if(!ctx) return '<div class="hint" style="margin:0;">Loading your material…</div>';
    var sel = st.selection;
    function row(kind, id, label, extra, disabled){
      var list = { file:'materialIds', note:'noteIds', folder:'folderIds', topic:'syllabusIds' }[kind];
      var on = sel[list].indexOf(id) >= 0;
      return '<label class="hs-pick'+(disabled?' unreadable':'')+'">'
        + '<input type="checkbox" data-action="hs-toggle-src" data-kind="'+kind+'" data-id="'+id+'"'
        + (on?' checked':'') + (disabled?' disabled':'') + '>'
        + '<span>'+escapeHtml(label)+'</span>'
        + (extra ? '<span class="fc-row-due" style="margin-left:auto;">'+escapeHtml(extra)+'</span>' : '')
        + '</label>';
    }
    var out = '';
    if(ctx.files.length){
      out += '<div class="hs-pick-group">Files</div>'
        + ctx.files.map(function(f){
            return row('file', f.id, f.title, f.readable ? '' : 'not readable', !f.readable);
          }).join('');
    }
    if(ctx.folders.length){
      // A folder stands for the notes inside it, so an empty one is not worth offering.
      out += '<div class="hs-pick-group">Note folders</div>'
        + ctx.folders.map(function(f){
            var n = f.noteCount || 0;
            return row('folder', f.id, f.name,
                       n ? n + (n===1 ? ' note' : ' notes') : 'empty', !n);
          }).join('');
    }
    if(ctx.notes.length){
      // An empty note is skipped when the context is gathered, so do not offer it
      // here as though ticking it would add anything.
      out += '<div class="hs-pick-group">Notes</div>'
        + ctx.notes.map(function(n){
            return row('note', n.id, n.title, n.chars ? '' : 'empty', !n.chars);
          }).join('');
    }
    if(ctx.syllabus.length){
      out += '<div class="hs-pick-group">Syllabus topics</div>'
        + ctx.syllabus.map(function(t){ return row('topic', t.id, t.title, ''); }).join('');
    }
    if(!out) out = '<div class="hint" style="margin:0;">This class has no files or notes yet.</div>';
    return '<div class="hs-pickwrap">'+out+'</div>';
  }

  function hsEarlierHtml(){
    var it = hsWorkItem();
    var saved = (it && it.headstarts) || [];
    if(!saved.length) return '';
    return '<div class="hs-group" style="margin-top:16px;">'
      + '<div class="hs-group-label">Earlier results</div>'
      + saved.map(function(h){
          return '<button type="button" class="hs-saved" style="width:100%;margin-bottom:5px;" '
            + 'data-action="hs-view-saved" data-id="'+h.id+'">'
            + '<b>'+escapeHtml(HEADSTART_LABELS[h.kind] || h.kind)+'</b></button>';
        }).join('')
      + '</div>';
  }

  function hsOutputHtml(){
    if(HW.confirm){
      var c = HW.confirm;
      var capped = c.reason === 'daily_cap';
      return '<div class="hs-confirm'+(capped?' capped':'')+'">'
        + '<h4>'+escapeHtml(capped ? 'That is today’s limit' : 'This one is bigger than usual')+'</h4>'
        + '<div>'+escapeHtml(c.error||'')+'</div>'
        + (capped
            ? '<div style="margin-top:8px;">Spent today: $'+(c.spentToday||0).toFixed(2)
              + ' of $'+(c.dailyCap||0).toFixed(2)+'.</div>'
              + '<div class="hs-actions">'
              + '<button type="button" class="btn" data-action="hs-open-settings">Change the limit</button>'
              + '<button type="button" class="btn ghost" data-action="hs-dismiss-confirm">Not now</button></div>'
            : '<div style="margin-top:8px;">It reads about '+(c.inputTokens||0).toLocaleString()
              + ' tokens and would cost roughly <b>$'+(c.estimateUsd||0).toFixed(3)+'</b>.</div>'
              + '<div class="hs-actions">'
              + '<button type="button" class="btn primary" data-action="hs-run" data-confirmed="1">Run it anyway</button>'
              + '<button type="button" class="btn ghost" data-action="hs-dismiss-confirm">Cancel</button></div>')
        + '</div>';
    }
    if(HW.busy){
      return '<div class="hs-thinking"><i></i>Working through your material. This can take a minute.</div>';
    }
    if(HW.result){
      return '<div class="hs-outbar">'
        + '<button type="button" class="btn" data-action="hs-copy">Copy</button>'
        + '<button type="button" class="btn" data-action="hs-to-note">Save as a note</button>'
        + '<button type="button" class="btn ghost" data-action="hs-run">Run again</button>'
        + (HW.sources && HW.sources.length
            ? '<span class="hs-cost" style="margin-left:auto;align-self:center;">Read '
              + HW.sources.length+' source'+(HW.sources.length===1?'':'s')+'</span>' : '')
        + '</div>'
        + '<div class="hs-out" id="hs-out">'+mdLite(HW.result)+'</div>';
    }
    var t = HS_TOOLS[HW.tool];
    return '<div class="hs-placeholder">'+iconSvg('zap')
      + '<div><b>'+escapeHtml(t.label)+'</b></div>'
      + '<div>'+escapeHtml(t.blurb)+'</div>'
      + '<div style="font-size:11.5px;">Check what it will read, then run it.</div></div>';
  }

  function hsSourcesHtml(){
    return '<div class="hs-srcbox" style="margin-bottom:14px;">'
      + '<h4>What it will read</h4>'
      + (HW.picking
          ? hsPickerHtml(HW)
            + '<button type="button" class="hs-srcswap" '
            + 'data-action="hs-auto-src">Let Vesta choose instead</button>'
          : '<div id="hs-autosrc">'+hsSourceListHtml(HW.estimate && HW.estimate.sources)+'</div>'
            + '<button type="button" class="hs-srcswap" '
            + 'data-action="hs-pick-src">Choose it myself</button>')
      + '</div>';
  }

  function hsTextHtml(){
    if(!HS_NEEDS_TEXT[HW.tool]) return '';
    return '<label class="field" style="margin-bottom:12px;">Your writing'
      + '<textarea id="hs-text" placeholder="Paste the paragraph, section or whole draft you want worked on."'
      + ' style="min-height:120px;">'+escapeHtml(HW.text)+'</textarea></label>';
  }

  // Each region repaints on its own. Rebuilding the whole panel to switch tools threw
  // away the scroll position and the caret in whatever you were typing.
  function hsPaintTools(){
    Array.prototype.forEach.call(document.querySelectorAll('.hs-tool'), function(b){
      b.classList.toggle('active', b.dataset.tool === HW.tool);
    });
  }
  function hsPaintSources(){
    var el = document.getElementById('hs-sources');
    if(el) el.innerHTML = hsSourcesHtml();
  }
  function hsPaintText(){
    var el = document.getElementById('hs-textwrap');
    if(el) el.innerHTML = hsTextHtml();
  }
  /** Open a saved generation. Its text is not in `state`, so fetch the row for it. */
  function hsShowSaved(hsId){
    if(!HW || !hsId) return;
    var it = hsWorkItem();
    if(!it) return;
    HW.confirm = null;
    HW.sources = null;
    HW.busy = true;
    hsPaintOutput();
    fetchHeadstarts(it.id).then(function(rows){
      var found = (rows || []).find(function(h){ return h.id === hsId; });
      HW.busy = false;
      if(!found || !found.content){
        reportError(new Error('That saved result could not be loaded.'));
        hsPaintOutput();
        return;
      }
      HW.result = found.content;
      HW.savedId = found.id;
      if(HW.tool !== toolKeyForKind(found.kind)) HW.tool = toolKeyForKind(found.kind) || HW.tool;
      hsPaintTools();
      hsPaintOutput();
    }).catch(function(err){
      HW.busy = false;
      hsPaintOutput();
      reportError(err);
    });
  }

  /** The tool that produced a saved kind, so reopening one selects the right tool. */
  function toolKeyForKind(kind){
    var map = { essay_outline:'outline', explain:'explain', draft:'draft',
                study_outline:'study_plan', synthesis:'summarize' };
    return map[kind] || null;
  }

  function hsPaintOutput(){
    var el = document.getElementById('hs-outwrap');
    if(el){ el.innerHTML = hsOutputHtml(); paintIcons(); }
  }
  function hsPaintSpend(){
    // the chip appears both behind the panel and inside it, so it is a class, not an id
    Array.prototype.forEach.call(document.querySelectorAll('.hs-spend'), function(el){
      el.outerHTML = hsSpendChipHtml();
    });
  }

  /** Switch tool without disturbing anything the person is in the middle of. */
  function hsSetTool(key){
    hsCaptureInputs();
    HW.tool = key;
    HW.result = null;
    HW.confirm = null;
    hsPaintTools();
    hsPaintText();
    hsPaintOutput();
    hsRefreshEstimate();
  }

  /** Builds the panel. Called when it opens; after that the regions repaint themselves. */
  function hsRenderWorkspace(){
    if(!HW) return;
    var it = hsWorkItem();
    var c = classById(HW.classId);
    var col = (c && c.color) || 'var(--none)';

    var left = hsToolsHtml() + hsEarlierHtml();

    var right = '<div id="hs-sources">'+hsSourcesHtml()+'</div>'
      + '<div id="hs-textwrap">'+hsTextHtml()+'</div>'
      + '<label class="field" style="margin-bottom:4px;">Anything else it should know'
      + '<input type="text" id="hs-instructions" placeholder="Optional. e.g. keep it under 500 words"'
      + ' value="'+escapeHtml(HW.instructions)+'"></label>'
      + '<div class="hs-runbar">'
      + '<button type="button" class="btn primary" data-action="hs-run">Run</button>'
      + '<span class="hs-cost" id="hs-cost">'+hsCostText(HW.estimate)+'</span>'
      + '</div>'
      + '<div id="hs-outwrap" style="margin-top:16px;">'+hsOutputHtml()+'</div>';

    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal hs-ws" data-action="modal-stop">'
      + '<div class="hs-ws-head">'
      + '<div class="hs-top" style="margin-bottom:10px;">'
      + '<div><div class="row-meta" style="margin-bottom:4px;">'
        + '<span class="class-chip" style="--c:'+col+'">'
        + escapeHtml(c ? (c.code||c.name||'') : 'General')+'</span>'
        + (it ? '<span class="type-badge">'+(TYPE_LABELS[it.type]||'Other')+'</span>' : '')
        + (it && it.dueDate ? '<span class="due-label">'+urgencyLabel(it.dueDate)+'</span>' : '')
      + '</div>'
      + '<h2>'+escapeHtml(it ? (it.title||'Untitled') : ((c && (c.name||c.code)) || 'Class material'))+'</h2></div>'
      + hsSpendChipHtml()
      + '</div></div>'
      + '<div class="hs-ws-body">'
      + '<div class="hs-ws-left">'+left+'</div>'
      + '<div class="hs-ws-right">'+right+'</div>'
      + '</div>'
      + '<div class="modal-foot">'+(hsBackBtnHtml()||'<span></span>')+'<div class="right">'
      + '<button class="btn" data-action="modal-close">Close</button></div></div>'
      + '</div></div>';
    paintIcons();
  }

  /** Keep whatever is typed, so a re-render does not throw it away. */
  function hsCaptureInputs(){
    if(!HW) return;
    var t = document.getElementById('hs-text');
    if(t) HW.text = t.value;
    var i = document.getElementById('hs-instructions');
    if(i) HW.instructions = i.value;
  }

  function hsRun(confirmed){
    hsCaptureInputs();
    if(HS_NEEDS_TEXT[HW.tool] && !HW.text.trim()){
      reportError(new Error('Paste the writing you want me to work on first.'));
      return;
    }
    HW.busy = true; HW.confirm = null; HW.result = null;
    hsPaintOutput();
    apiPostRaw('/api/ai/run', hsRunBody({ confirmed: !!confirmed })).then(function(r){
      HW.busy = false;
      if(r.status === 409 || r.status === 402){ HW.confirm = r.body; hsPaintOutput(); return; }
      if(!r.ok) throw new Error(r.body.error || 'That did not work.');
      HW.result = r.body.content;
      HW.sources = r.body.sources;
      if(r.body.usage){ hsUsage = r.body.usage; hsPaintSpend(); }
      hsPaintOutput();
      if(r.body.savedId) loadState();
    }).catch(function(err){
      HW.busy = false;
      hsPaintOutput();
      reportError(err);
    });
  }

  function hsToggleSource(kind, id, on){
    var st = hsPickState || HW;
    if(!st) return;
    var list = { file:'materialIds', note:'noteIds', folder:'folderIds', topic:'syllabusIds' }[kind];
    var arr = st.selection[list];
    var at = arr.indexOf(id);
    if(on && at < 0) arr.push(id);
    if(!on && at >= 0) arr.splice(at, 1);
    if(st === HW) hsRefreshEstimate(); else hsRenderMaker();
    // the workspace picker stays as it is; only the estimate under it moves
  }

  function hsSaveAsNote(){
    if(!HW || !HW.result) return;
    var it = hsWorkItem();
    var title = (HS_TOOLS[HW.tool].label) + (it ? ' — ' + (it.title||'') : '');
    addNote(HW.classId, { title: title, text: mdLite(HW.result) }).then(function(){
      notify('Saved to Notes', 'Filed under “' + title + '”.');
    }).catch(reportError);
  }

  // ---------------- Making a quiz, a practice test or a deck ----------------
  // The maker is the same panel in all three cases: what to build it from, how much
  // of it, and what it will cost.

  var QM = null;

  var QZ_KINDS = [
    { key:'multiple_choice', label:'Multiple choice' },
    { key:'true_false',      label:'True or false' },
    { key:'short_answer',    label:'Short answer' },
    { key:'concept',         label:'Applied concept' }
  ];

  function openHeadstartMaker(mode, opts){
    opts = opts || {};
    var it = opts.itemId ? items.find(function(i){ return i.id===opts.itemId; }) : null;
    var classId = opts.classId || (it && it.classId) || hsClassId || (classes[0] && classes[0].id);
    QM = {
      mode: mode,                       // 'quiz' | 'test' | 'cards'
      classId: classId,
      itemId: it ? it.id : null,
      selection: hsBlankSelection(),
      ctx: null,
      count: mode === 'cards' ? 20 : 10,
      difficulty: 'mixed',
      kinds: ['multiple_choice','short_answer'],
      style: 'mixed',
      busy: false,
      confirm: null
    };
    hsRenderMaker();
    apiGet('/api/ai/context/'+classId).then(function(ctx){
      if(QM) QM.ctx = ctx;
      hsRenderMaker();
    }).catch(function(){});
  }

  function hsMakerTitle(){
    return { quiz:'Quiz me', test:'Build a practice test', cards:'Make flashcards' }[QM.mode];
  }

  function hsRenderMaker(){
    if(!QM) return;
    var c = classById(QM.classId);
    var isCards = QM.mode === 'cards';
    var body;

    if(QM.busy){
      body = '<div class="hs-thinking"><i></i>Reading your material and writing '
           + (isCards ? 'cards' : 'questions') + '. This can take a minute.</div>';
    } else if(QM.confirm){
      var capped = QM.confirm.reason === 'daily_cap';
      body = '<div class="hs-confirm'+(capped?' capped':'')+'">'
        + '<h4>'+escapeHtml(capped ? 'That is today’s limit' : 'This one is bigger than usual')+'</h4>'
        + '<div>'+escapeHtml(QM.confirm.error||'')+'</div>'
        + (capped
            ? '<div class="hs-actions">'
              + '<button type="button" class="btn" data-action="hs-open-settings">Change the limit</button>'
              + '<button type="button" class="btn ghost" data-action="qm-dismiss">Not now</button></div>'
            : '<div style="margin-top:8px;">Roughly <b>$'
              + (QM.confirm.estimateUsd||0).toFixed(3)+'</b>.</div>'
              + '<div class="hs-actions">'
              + '<button type="button" class="btn primary" data-action="qm-build" data-confirmed="1">Build it anyway</button>'
              + '<button type="button" class="btn ghost" data-action="qm-dismiss">Cancel</button></div>')
        + '</div>';
    } else {
      var counts = isCards ? [10,20,30,50] : [5,10,15,20];
      body = '<div class="hs-srcbox" style="margin-bottom:14px;">'
        + '<h4>What to build it from</h4>' + hsPickerHtml(QM) + '</div>'
        + '<label class="field">How many'
        + '<div class="hs-pills" style="margin:6px 0 0;">'
        + counts.map(function(n){
            return '<button type="button" class="nt-class-pill'+(QM.count===n?' active':'')+'" '
              + 'data-action="qm-count" data-n="'+n+'">'+n+'</button>';
          }).join('') + '</div></label>'
        + (isCards
            ? '<label class="field">Card style'
              + '<div class="hs-pills" style="margin:6px 0 0;">'
              + [['mixed','Mixed'],['term','Term and definition'],['question','Question and answer'],
                 ['concept','Concept and explanation']].map(function(o){
                  return '<button type="button" class="nt-class-pill'+(QM.style===o[0]?' active':'')+'" '
                    + 'data-action="qm-style" data-v="'+o[0]+'">'+o[1]+'</button>';
                }).join('') + '</div></label>'
            : '<label class="field">Question types'
              + '<div class="hs-pills" style="margin:6px 0 0;">'
              + QZ_KINDS.map(function(k){
                  var on = QM.kinds.indexOf(k.key) >= 0;
                  return '<button type="button" class="nt-class-pill'+(on?' active':'')+'" '
                    + 'data-action="qm-kind" data-k="'+k.key+'">'+k.label+'</button>';
                }).join('') + '</div></label>'
              + '<label class="field">Difficulty'
              + '<div class="hs-pills" style="margin:6px 0 0;">'
              + [['easy','Easy'],['mixed','Mixed'],['hard','Hard']].map(function(o){
                  return '<button type="button" class="nt-class-pill'+(QM.difficulty===o[0]?' active':'')+'" '
                    + 'data-action="qm-diff" data-v="'+o[0]+'">'+o[1]+'</button>';
                }).join('') + '</div></label>')
        + '<div class="hs-runbar">'
        + '<button type="button" class="btn primary" data-action="qm-build">Build it</button>'
        + '<span class="hs-cost">Costs a little; you will be asked before anything large.</span>'
        + '</div>';
    }

    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal modal-wide" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'+hsMakerTitle()+'</h2>'
      + '<div class="row-meta" style="margin-top:6px;">'
      + '<span class="class-chip" style="--c:'+((c&&c.color)||'var(--none)')+'">'
      + escapeHtml(c ? (c.code||c.name||'') : 'General')+'</span></div></div>'
      + '<div class="modal-body">'+body+'</div>'
      + '<div class="modal-foot">'+(hsBackBtnHtml()||'<span></span>')+'<div class="right">'
      + '<button class="btn" data-action="modal-close">Close</button></div></div>'
      + '</div></div>';
  }

  function hsBuild(confirmed){
    if(!QM) return;
    var isCards = QM.mode === 'cards';
    var sel = QM.selection;
    var any = sel.materialIds.length || sel.noteIds.length || sel.folderIds.length || sel.syllabusIds.length;
    var body = {
      classId: QM.classId, itemId: QM.itemId,
      selection: any ? sel : null,
      count: QM.count, confirmed: !!confirmed
    };
    if(isCards){ body.style = QM.style; }
    else { body.kinds = QM.kinds; body.difficulty = QM.difficulty; body.practiceTest = QM.mode === 'test'; }

    QM.busy = true; QM.confirm = null;
    hsRenderMaker();
    apiPostRaw(isCards ? '/api/ai/flashcards' : '/api/ai/quiz', body).then(function(r){
      QM.busy = false;
      if(r.status === 409 || r.status === 402){ QM.confirm = r.body; hsRenderMaker(); return; }
      if(!r.ok) throw new Error(r.body.error || 'That did not work.');
      if(r.body.usage) hsUsage = r.body.usage;
      var newId = r.body.id;
      var wasCards = isCards;
      QM = null;
      hsLoadSide().then(function(){
        if(wasCards) openDeck(newId); else openQuiz(newId);
      });
    }).catch(function(err){
      if(QM){ QM.busy = false; hsRenderMaker(); }
      reportError(err);
    });
  }

  // ---------------- Taking a quiz ----------------
  // The answers stay on the server until the attempt is submitted, so a practice
  // test is something you sit rather than something you read.

  var QZ = null;

  function openQuiz(qid){
    apiGet('/api/quizzes/'+qid).then(function(quiz){
      QZ = { quiz: quiz, answers: {}, results: null, attemptId: null,
             startedAt: new Date().toISOString(), score: null, history: [] };
      renderQuiz();
      return apiGet('/api/quizzes/'+qid+'/attempts');
    }).then(function(h){
      if(QZ){ QZ.history = h || []; renderQuiz(); }
    }).catch(reportError);
  }

  function qzResultFor(id){
    if(!QZ.results) return null;
    for(var i=0;i<QZ.results.length;i++){ if(QZ.results[i].id===id) return QZ.results[i]; }
    return null;
  }

  function qzQuestionHtml(q, i){
    var res = qzResultFor(q.id);
    var given = QZ.answers[q.id];
    var body;

    if(q.choices && q.choices.length){
      body = q.choices.map(function(ch){
        var picked = given === ch;
        var tone = '';
        if(res){
          if(res.answer === ch) tone = ' right';
          else if(picked) tone = ' wrong';
        } else if(picked) tone = ' picked';
        return '<label class="qz-choice'+tone+'">'
          + '<input type="radio" name="q-'+q.id+'" data-action="qz-pick" data-id="'+q.id+'" '
          + 'data-val="'+escapeHtml(ch)+'"'+(picked?' checked':'')+(res?' disabled':'')+'>'
          + '<span>'+escapeHtml(ch)+'</span></label>';
      }).join('');
    } else {
      body = '<textarea class="qz-written" data-action="qz-write" data-id="'+q.id+'" '
        + (res?'disabled ':'') + 'placeholder="Your answer">'+escapeHtml(given||'')+'</textarea>';
    }

    var after = '';
    if(res){
      var verdict = res.correct === true ? '<span class="qz-verdict right">Right</span>'
                  : res.correct === false ? '<span class="qz-verdict wrong">Wrong</span>'
                  : '<span class="qz-verdict unmarked">Your call</span>';
      after = '<div class="qz-answer"><b>Answer:</b> '+escapeHtml(res.answer||'')
        + (res.explanation ? '<div style="margin-top:6px;">'+escapeHtml(res.explanation)+'</div>' : '')
        + '</div>';
      if(!res.objective){
        after += '<div class="qz-mark">'+verdict+'<span>Did you get it?</span>'
          + '<button type="button" class="btn ghost" data-action="qz-self" data-id="'+q.id+'" data-v="1">Yes</button>'
          + '<button type="button" class="btn ghost" data-action="qz-self" data-id="'+q.id+'" data-v="0">No</button>'
          + '</div>';
      } else {
        after += '<div class="qz-mark">'+verdict+'</div>';
      }
    }

    return '<div class="qz-q">'
      + '<div class="qz-q-num">Question '+(i+1)+'</div>'
      + '<div class="qz-prompt">'+escapeHtml(q.prompt||'')+'</div>'
      + body + after + '</div>';
  }

  function renderQuiz(){
    if(!QZ) return;
    var q = QZ.quiz;
    // The modal is rebuilt wholesale, so remember where the reader was and what they
    // were typing in. Without this, answering question 8 throws you back to question 1.
    var prevBody = document.querySelector('#modal-root .modal-body');
    var keepScroll = prevBody ? prevBody.scrollTop : 0;
    var active = document.activeElement;
    var keepFocus = (active && active.dataset && active.dataset.action === 'qz-write')
      ? { id: active.dataset.id, start: active.selectionStart, end: active.selectionEnd } : null;
    var answered = q.questions.filter(function(x){
      var a = QZ.answers[x.id];
      return a !== undefined && a !== null && String(a).trim() !== '';
    }).length;

    var head = '<div class="qz-head">'
      + '<span class="qz-progress">'+answered+' of '+q.questions.length+' answered</span>'
      + (QZ.score != null
          ? '<span class="qz-progress">Scored '+QZ.score+'%</span>'
          : '<button type="button" class="btn primary" data-action="qz-submit">'
            + (q.kind === 'practice_test' ? 'Finish and mark it' : 'Check my answers')+'</button>')
      + '</div>';

    var score = '';
    if(QZ.score != null){
      score = '<div class="qz-score"><div class="qz-pct">'+QZ.score+'%</div>'
        + '<div class="qz-sub">'+QZ.correct+' right out of '+QZ.graded+' marked'
        + (QZ.graded < q.questions.length
            ? ' · mark the written ones below to finish' : '')+'</div></div>';
    }

    var history = QZ.history && QZ.history.length
      ? '<div class="qz-history"><div class="hs-group-label">Earlier attempts</div>'
        + QZ.history.map(function(a){
            return '<div class="qz-history-row"><span>'+escapeHtml(fmtDate(a.completedAt.slice(0,10)))+'</span>'
              + '<span>'+(a.score!=null ? a.score+'%' : '—')+' · '+a.correct+'/'+a.total+'</span></div>';
          }).join('') + '</div>'
      : '';

    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal modal-wide" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'+escapeHtml(q.title||'Quiz')+'</h2>'
      + '<div class="row-meta" style="margin-top:6px;"><span class="type-badge">'
      + (q.kind==='practice_test' ? 'Practice test' : 'Quiz')+'</span>'
      + '<span class="type-badge">'+escapeHtml(q.difficulty||'mixed')+'</span></div></div>'
      + '<div class="modal-body">'+score+head
      + q.questions.map(qzQuestionHtml).join('') + history + '</div>'
      + '<div class="modal-foot">'
      + '<span style="display:flex;gap:8px;">'+hsBackBtnHtml()
      + '<button class="btn ghost danger" data-action="qz-delete" data-id="'+q.id+'">Delete</button></span>'
      + '<div class="right">'
      + (QZ.score != null ? '<button class="btn" data-action="qz-retake" data-id="'+q.id+'">Take it again</button>' : '')
      + '<button class="btn" data-action="modal-close">Close</button></div></div>'
      + '</div></div>';

    var body = document.querySelector('#modal-root .modal-body');
    if(body && keepScroll){
      // Read a layout property first: a freshly written element that has not been
      // laid out yet reports no scrollable height, and the assignment below would
      // then clamp to 0 instead of landing where the reader was.
      void body.scrollHeight;
      body.scrollTop = keepScroll;
    }
    if(keepFocus){
      var back = document.querySelector('[data-action="qz-write"][data-id="'+keepFocus.id+'"]');
      if(back){
        back.focus();
        try{ back.setSelectionRange(keepFocus.start, keepFocus.end); }catch(e){}
      }
    }
  }

  /** The answered counter, updated without rebuilding the quiz under the reader. */
  function qzPaintProgress(){
    if(!QZ) return;
    var answered = QZ.quiz.questions.filter(function(x){
      var a = QZ.answers[x.id];
      return a !== undefined && a !== null && String(a).trim() !== '';
    }).length;
    var el = document.querySelector('#modal-root .qz-head .qz-progress');
    if(el) el.textContent = answered + ' of ' + QZ.quiz.questions.length + ' answered';
  }

  function qzSubmit(){
    if(!QZ) return;
    var payload = {};
    QZ.quiz.questions.forEach(function(q){
      var a = QZ.answers[q.id];
      payload[q.id] = (a && typeof a === 'object') ? a : { value: a || '' };
    });
    apiPost('/api/quizzes/'+QZ.quiz.id+'/attempts',
            { responses: payload, attemptId: QZ.attemptId, startedAt: QZ.startedAt })
      .then(function(r){
        QZ.attemptId = r.attemptId;
        QZ.results = r.results;
        QZ.score = r.score;
        QZ.correct = r.correct;
        QZ.graded = r.graded;
        renderQuiz();
        hsLoadSide();
      }).catch(reportError);
  }

  // ---------------- Flashcards ----------------

  var FC = null;

  function openDeck(did){
    apiGet('/api/decks/'+did).then(function(deck){
      FC = { deck: deck, mode: 'list', queue: [], at: 0, flipped: false, done: 0 };
      renderDeck();
    }).catch(reportError);
  }

  function fcStartReview(){
    var today = new Date().toISOString().slice(0,10);
    var due = FC.deck.cards.filter(function(c){
      return !c.suspended && (!c.due || c.due <= today);
    });
    if(!due.length) due = FC.deck.cards.filter(function(c){ return !c.suspended; });
    FC.queue = due;
    FC.at = 0; FC.flipped = false; FC.done = 0; FC.pick = FC_DEFAULT_PICK;
    FC.mode = due.length ? 'review' : 'list';
    renderDeck();
  }

  function fcReviewHtml(){
    var card = FC.queue[FC.at];
    if(!card){
      return '<div class="qz-score"><div class="qz-pct">'+FC.done+'</div>'
        + '<div class="qz-sub">card'+(FC.done===1?'':'s')+' reviewed. Come back when the next ones are due.</div>'
        + '<div style="margin-top:16px;"><button type="button" class="btn" data-action="fc-list">Back to the deck</button></div></div>';
    }
    var label = card.kind==='question' ? 'Question' : (card.kind==='concept' ? 'Concept' : 'Term');
    return '<div class="fc-stage'+(FC.flipped?' is-flipped':'')+'" id="fc-stage">'
      + '<div class="qz-progress">'+(FC.at+1)+' of '+FC.queue.length+'</div>'
      + '<div class="fc-card" data-action="fc-flip" tabindex="0" role="button"'
      + ' aria-label="Show the answer">'
      + '<div class="fc-face fc-front">'
      + '<div class="fc-side">'+escapeHtml(label)+'</div>'
      + '<div>'+escapeHtml(card.front||'')+'</div></div>'
      + '<div class="fc-face fc-back-face">'
      + '<div class="fc-side">Answer</div>'
      + '<div class="fc-back-text">'+escapeHtml(card.back||'')+'</div></div>'
      + '</div>'
      + '<div class="fc-grade">'
            + FC_GRADES.map(function(gr, i){
                var picked = (typeof FC.pick === 'number' ? FC.pick : FC_DEFAULT_PICK) === i;
                return '<button type="button" class="btn'
                  + (gr.g === 1 ? ' ghost danger' : '')
                  + (picked ? ' fc-picked' : '')
                  + '" data-action="fc-grade" data-g="'+gr.g+'">'
                  + escapeHtml(gr.label) + '<span class="fc-key">'+(i+1)+'</span></button>';
              }).join('')
      + '</div>'
      + '<div class="fc-hint fc-hint-front">Click the card, or press space, to see the answer.</div>'
      + '<div class="fc-hint fc-hint-back">Arrow keys choose, space or enter confirms, 1-4 pick directly.</div>'
      + '</div>';
  }

  /** Flip without re-rendering, so the card has something to animate between. */
  function fcSetFlipped(on){
    if(!FC) return;
    FC.flipped = on;
    FC.pick = FC_DEFAULT_PICK;
    var stage = document.getElementById('fc-stage');
    if(stage) stage.classList.toggle('is-flipped', on);
    else renderDeck();
    if(on) fcPaintPick();
  }

  /** Move the armed grade without rebuilding the card mid-flip. */
  function fcPaintPick(){
    var stage = document.getElementById('fc-stage');
    if(!stage) return;
    var pick = typeof FC.pick === 'number' ? FC.pick : FC_DEFAULT_PICK;
    Array.prototype.forEach.call(stage.querySelectorAll('.fc-grade .btn'), function(b, i){
      b.classList.toggle('fc-picked', i === pick);
    });
  }

  function fcListHtml(){
    var today = new Date().toISOString().slice(0,10);
    if(!FC.deck.cards.length){
      return '<div class="empty">This deck is empty. Add a card to get going.</div>';
    }
    return '<div class="fc-list">' + FC.deck.cards.map(function(c){
      var due = !c.due || c.due <= today ? 'due now'
              : 'in ' + Math.max(1, Math.round((new Date(c.due+'T12:00:00') - new Date())/86400000)) + 'd';
      return '<div class="fc-row">'
        + '<div class="fc-row-main">'
        + '<div class="fc-row-front">'+escapeHtml(c.front||'')+'</div>'
        + '<div class="fc-row-back">'+escapeHtml(c.back||'')+'</div></div>'
        + '<span class="fc-row-due">'+due+'</span>'
        + '<button type="button" class="btn ghost" data-action="fc-edit" data-id="'+c.id+'">Edit</button>'
        + '<button type="button" class="btn ghost row-x" data-action="fc-delete" title="Delete this card" data-id="'+c.id+'">✕</button>'
        + '</div>';
    }).join('') + '</div>';
  }

  function renderDeck(){
    if(!FC) return;
    if(activeTab === 'study' && studyScreen && studyScreen.kind === 'set'){
      renderView();
      paintIcons();
      // A typed Learn answer should be ready to type into: reaching for the mouse to
      // click the box every time is what makes a drill tiring.
      var lbox = document.getElementById('learn-input');
      if(lbox) lbox.focus();
      return;
    }
    var today = new Date().toISOString().slice(0,10);
    var due = FC.deck.cards.filter(function(c){ return !c.suspended && (!c.due || c.due <= today); }).length;
    paintModal(
      '<div class="overlay" data-action="modal-backdrop"><div class="modal modal-wide" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'+escapeHtml(FC.deck.name||'Deck')+'</h2>'
      + '<div class="row-meta" style="margin-top:6px;">'
      + '<span class="type-badge">'+FC.deck.cards.length+' card'+(FC.deck.cards.length===1?'':'s')+'</span>'
      + '<span class="type-badge">'+due+' due</span></div></div>'
      + '<div class="modal-body">'
      + (FC.mode==='review' ? fcReviewHtml() : fcListHtml())
      + '</div>'
      + '<div class="modal-foot">'
      + '<span style="display:flex;gap:8px;">'
      + (FC.mode==='review'
          ? '<button class="btn" data-action="fc-list">Back to the deck</button>'
          : hsBackBtnHtml()
            + '<button class="btn ghost danger" data-action="fc-delete-deck" data-id="'+FC.deck.id+'">Delete deck</button>')
      + '</span>'
      + '<div class="right">'
      + (FC.mode==='review' ? ''
          : '<button class="btn" data-action="fc-add">Add a card</button>'
            + '<button class="btn primary" data-action="fc-review">Review'+(due?' '+due:'')+'</button>')
      + '<button class="btn" data-action="modal-close">Close</button></div></div>'
      + '</div></div>');
  }

  // The four grade buttons, left to right, so the arrow keys and the number keys
  // agree with what is on screen.
  var FC_GRADES = [
    { g:1, label:'Missed it' },
    { g:3, label:'Hard' },
    { g:4, label:'Good' },
    { g:5, label:'Easy' }
  ];
  var FC_DEFAULT_PICK = 2;   // Good: the honest default, not the flattering one

  /** Keyboard for the review loop. Returns true when the key was ours. */
  /**
   * Learn from the keyboard.
   *
   * Multiple choice takes 1 to 4, a typed answer takes Enter, and the result screen
   * takes Enter to carry on -- so a round can be done without reaching for the mouse,
   * which is the whole point of a drill.
   */
  function learnHandleKey(e){
    if(!FC || FC.mode !== 'learn' || !FC.learn) return false;
    if(e.metaKey || e.ctrlKey || e.altKey) return false;
    var card = FC.learn.queue[FC.learn.at];
    if(!card) return false;
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA'
                              || e.target.isContentEditable);

    if(FC.learn.answered){
      if(e.key === 'Enter' || e.key === ' ' || e.key === 'Spacebar'){
        e.preventDefault(); learnNext(); return true;
      }
      return false;
    }
    if((FC.learn.levels[card.id] || 0) >= 1){
      // typed answer: Enter checks it, and everything else belongs to the box
      if(e.key === 'Enter'){
        e.preventDefault();
        var box = document.getElementById('learn-input');
        learnAnswer(box ? box.value : '');
        return true;
      }
      return false;
    }
    if(typing) return false;
    if(['1','2','3','4'].indexOf(e.key) > -1){
      var opts = document.querySelectorAll('[data-action="learn-pick"]');
      var chosen = opts[Number(e.key) - 1];
      if(chosen){ e.preventDefault(); learnAnswer(chosen.value); return true; }
    }
    return false;
  }

  function fcHandleKey(e){
    if(!FC || FC.mode !== 'review') return false;
    if(e.metaKey || e.ctrlKey || e.altKey) return false;
    // never steal a key from something the user is typing into
    var el = e.target;
    if(el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable)) return false;
    if(!FC.queue[FC.at]) return false;

    var key = e.key;

    if(!FC.flipped){
      // Face down there is only one thing to do, so every obvious key does it.
      if(key === ' ' || key === 'Spacebar' || key === 'Enter' || key === 'ArrowRight' || key === 'ArrowDown'){
        e.preventDefault();
        fcSetFlipped(true);
        return true;
      }
      return false;
    }

    if(key === 'ArrowLeft' || key === 'ArrowRight'){
      e.preventDefault();
      if(typeof FC.pick !== 'number') FC.pick = FC_DEFAULT_PICK;
      FC.pick = Math.max(0, Math.min(FC_GRADES.length - 1, FC.pick + (key === 'ArrowRight' ? 1 : -1)));
      fcPaintPick();
      return true;
    }
    if(key === ' ' || key === 'Spacebar' || key === 'Enter'){
      e.preventDefault();
      fcGrade(FC_GRADES[typeof FC.pick === 'number' ? FC.pick : FC_DEFAULT_PICK].g);
      return true;
    }
    if(key >= '1' && key <= '4'){
      e.preventDefault();
      fcGrade(FC_GRADES[Number(key) - 1].g);
      return true;
    }
    if(key === 'ArrowUp' || key === 'ArrowDown'){
      e.preventDefault();   // stop the modal scrolling under a held arrow
      return true;
    }
    return false;
  }

  function fcGrade(g){
    var card = FC.queue[FC.at];
    if(!card) return;
    apiPost('/api/cards/'+card.id+'/review', { grade: g }).then(function(updated){
      for(var i=0;i<FC.deck.cards.length;i++){
        if(FC.deck.cards[i].id === updated.id) FC.deck.cards[i] = updated;
      }
      FC.done++;
      FC.at++;
      FC.flipped = false;
      FC.pick = FC_DEFAULT_PICK;
      renderDeck();
      if(FC.at >= FC.queue.length) hsLoadSide();
    }).catch(reportError);
  }

  // ---------------- Threads ----------------
  // A thread is the Headstart workspace with a memory: its sources are pinned once and
  // its turns are kept, so "now do discussion 2" can build on discussion 1 instead of
  // starting from nothing. The tools still exist here, as one-click ways to open.

  var TH = null;   // the open thread

  /** Open a set in the Study section, as a screen rather than a panel. */
  function openStudySet(did){
    closeModal();
    studyScreen = { kind: 'set', id: did };
    if(activeTab !== 'study'){ activeTab = 'study'; render(); }
    apiGet('/api/decks/'+did).then(function(deck){
      FC = { deck: deck, mode: 'list', queue: [], at: 0, flipped: false, done: 0,
             pick: FC_DEFAULT_PICK };
      renderView();
      paintIcons();
    }).catch(function(err){ studyScreen = null; renderView(); reportError(err); });
  }

  function openThread(tid){
    // Close first, then build: closeModal clears every open workspace including TH, so
    // setting up the thread before it would wipe the thread we are opening.
    closeModal();            // a thread may have been reached from a modal; leave it behind
    TH = { id: tid, loading: true, data: null, draft: '', busy: false, confirm: null,
           picking: false, ctx: null, srcOpen: false };
    hsScreen = { kind: 'thread', id: tid };
    // A thread can be opened from an assignment, which lives on another tab. Opening
    // one is navigation, so it moves you to Headstart rather than rendering nothing.
    if(activeTab !== 'headstart'){ activeTab = 'headstart'; render(); }
    renderThread();
    apiGet('/api/threads/'+tid).then(function(d){
      if(!TH || TH.id !== tid) return;
      TH.loading = false;
      TH.data = d;
      renderThread();
      if(d.classId){
        apiGet('/api/ai/context/'+d.classId).then(function(ctx){
          if(TH && TH.id === tid){ TH.ctx = ctx; }
        }).catch(function(){});
      }
    }).catch(function(err){ closeModal(); reportError(err); });
  }

  function threadBubbleHtml(m){
    var who = m.role === 'user' ? 'you' : 'Vesta';
    var body = m.role === 'user'
      ? '<div class="th-text">'+escapeHtml(m.content||'')+'</div>'
      : '<div class="th-text th-md">'+mdLite(m.content||'')+'</div>';
    return '<div class="th-msg th-'+m.role+'">'
      + '<div class="th-who">'+who
      + (m.tool && HS_TOOLS[m.tool] ? ' · '+escapeHtml(HS_TOOLS[m.tool].label) : '')+'</div>'
      + body
      // the server marks a reply stopped part way with tool 'stopped'
      + (m.role === 'assistant' && (m.stopped || m.tool === 'stopped') ? '<div class="th-stopped">Stopped</div>' : '')
      + (m.role === 'assistant'
          ? '<div class="th-msg-acts">'
            + '<button type="button" class="btn ghost" data-action="th-copy" data-id="'+m.id+'">Copy</button>'
            + '<button type="button" class="btn ghost" data-action="th-to-note" data-id="'+m.id+'">Save as a note</button>'
            + '</div>'
          : '')
      + '</div>';
  }

  /** The opening moves, shown only on an empty thread so they do not crowd a conversation. */
  function threadStartersHtml(){
    return '<div class="th-starters">'
      + '<div class="hs-group-label">Start with</div>'
      + HS_TOOL_GROUPS.map(function(g){
          return g.tools.filter(function(k){ return !HS_NEEDS_TEXT[k]; }).map(function(k){
            return '<button type="button" class="hs-study-btn" data-action="th-tool" data-tool="'+k+'">'
              + escapeHtml(HS_TOOLS[k].label)+'</button>';
          }).join('');
        }).join('')
      + '</div>';
  }

  function threadSourcesHtml(){
    // `pinned` is everything attached; `sources` is only what had readable text in it.
    // Showing the second alone means ticking three files and seeing one, with nothing
    // saying why the others went missing.
    var pinned = (TH.data && TH.data.pinned) || [];
    var unreadable = pinned.filter(function(s){ return !s.readable; }).length;
    var summary = pinned.length
      ? pinned.length + ' source' + (pinned.length===1?'':'s')
        + (unreadable ? ' · ' + unreadable + ' unreadable' : '')
      : 'Nothing pinned yet';
    return '<div class="th-srcbar'+(TH.srcOpen?' th-open':'')+'">'
      + '<div class="th-srchead">'
      + '<span class="th-srclabel">Reads</span>'
      + '<span class="th-srcsummary">'+escapeHtml(summary)+'</span>'
      + '<button type="button" class="th-srctoggle" data-action="th-src-open">'
      + (TH.srcOpen ? 'Hide' : 'Show') + '</button>'
      + '<button type="button" class="btn ghost" data-action="th-pick">Change</button>'
      + '</div>'
      + '<span class="th-srcfull">'
      + (pinned.length
          ? pinned.map(function(s){
              return '<span class="th-src'+(s.readable?'':' th-src-dim')+'"'
                + (s.readable ? '' : ' title="No text could be read out of this one, so it is not sent."')
                + '>'+escapeHtml(s.title||'Source')+'</span>';
            }).join('')
          : '<span class="th-none">Nothing pinned yet. It will answer from the '
            + 'conversation alone until you attach something.</span>')
      + (unreadable
          ? '<span class="th-srcwarn">'
            + (unreadable===1
                ? 'One of these has no text Vesta can read, so it is not being sent.'
                : unreadable+' of these have no text Vesta can read, so they are not being sent.')
            + ' Scanned PDFs and images have no text layer.</span>'
          : '')
      + '</span>'
      + '</div>';
  }

  function renderThread(){
    if(!TH) return;
    if(hsScreen && hsScreen.kind === 'thread'){
      renderView();
      paintIcons();
      var sc0 = document.getElementById('th-scroll');
      if(sc0 && TH.data && (TH.data.messages||[]).length) sc0.scrollTop = sc0.scrollHeight;
      var ta0 = document.getElementById('th-draft');
      if(ta0 && !TH.busy){ ta0.focus(); ta0.setSelectionRange(ta0.value.length, ta0.value.length); }
      return;
    }
    var d = TH.data;
    var body;
    if(TH.loading){
      body = '<div class="hs-thinking"><i></i>Opening the chat…</div>';
    } else if(TH.picking){
      body = threadPickerHtml();
    } else {
      var msgs = (d.messages||[]).map(threadBubbleHtml).join('');
      body = threadSourcesHtml()
        + '<div class="th-scroll" id="th-scroll">'
        + (msgs || (TH.stream ? '' : '<div class="th-empty">Nothing here yet. Ask for anything, or start with one of these.</div>'))
        + threadLiveOrBusyHtml()
        + ((d.messages||[]).length || TH.stream ? '' : threadStartersHtml())
        + '</div>'
        + (TH.confirm ? threadConfirmHtml() : '')
        + threadComposerHtml();
    }
    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal modal-wide th-modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'+escapeHtml(d ? (d.title||'Chat') : 'Chat')+'</h2>'
      + (d ? '<div class="row-meta" style="margin-top:6px;">'
             + '<span class="type-badge">'+escapeHtml(classLabel(d.classId))+'</span>'
             + '<span class="type-badge">'+((d.messages||[]).length)+' message'
             + (((d.messages||[]).length)===1?'':'s')+'</span></div>' : '')
      + '</div>'
      + '<div class="modal-body th-body">'+body+'</div>'
      + '<div class="modal-foot">'
      + '<span style="display:flex;gap:8px;">'
      + '<button class="btn" data-action="th-rename">Rename</button>'
      + '<button class="btn ghost danger" data-action="th-delete">Delete chat</button></span>'
      + '<div class="right"><button class="btn" data-action="modal-close">Close</button></div>'
      + '</div></div></div>';
    paintIcons();
    var sc = document.getElementById('th-scroll');
    if(sc) sc.scrollTop = sc.scrollHeight;
    var ta = document.getElementById('th-draft');
    if(ta && !TH.busy){ ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }

  function threadConfirmHtml(){
    var c = TH.confirm;
    return '<div class="hs-confirm"><b>'+escapeHtml(c.error||'This is a big one.')+'</b>'
      + (c.reason === 'confirm'
          ? '<div style="margin-top:8px;">It reads about '+(c.inputTokens||0).toLocaleString()
            + ' tokens and would cost roughly <b>$'+(c.estimateUsd||0).toFixed(3)+'</b>.</div>'
            + '<div class="hs-actions">'
            + '<button type="button" class="btn primary" data-action="th-send" data-confirmed="1">Send it anyway</button>'
            + '<button type="button" class="btn ghost" data-action="th-dismiss">Cancel</button></div>'
          : '<div class="hs-actions">'
            + '<button type="button" class="btn" data-action="hs-open-settings">Change the limit</button>'
            + '<button type="button" class="btn ghost" data-action="th-dismiss">Not now</button></div>')
      + '</div>';
  }

  /** Same picker as the one-shot workspace, writing to the thread instead of a run. */
  function threadPickerHtml(){
    var ctx = TH.ctx;
    if(!ctx) return '<div class="hs-thinking"><i></i>Loading what this class has…</div>';
    var sel = TH.data.selection || { materialIds:[], noteIds:[] };
    function row(kind, id, label, sub, on){
      return '<label class="hs-srcrow"><input type="checkbox" data-action="th-src-toggle"'
        + ' data-kind="'+kind+'" data-id="'+id+'"'+(on?' checked':'')+'>'
        + '<span><b>'+escapeHtml(label)+'</b>'
        + (sub ? '<span class="hs-saved-sub"> '+escapeHtml(sub)+'</span>' : '')+'</span></label>';
    }
    var files = (ctx.files||[]).map(function(f){
      return row('material', f.id, f.title, f.readable ? '' : 'no readable text',
                 (sel.materialIds||[]).indexOf(f.id) >= 0);
    }).join('');
    var notes = (ctx.notes||[]).map(function(nt){
      return row('note', nt.id, nt.title, '', (sel.noteIds||[]).indexOf(nt.id) >= 0);
    }).join('');
    return '<div class="th-picker">'
      + '<div class="hs-group-label">Files</div>'+(files || '<div class="hs-none">No files in this class yet.</div>')
      + '<div class="hs-group-label" style="margin-top:12px;">Notes</div>'
      + (notes || '<div class="hs-none">No notes in this class yet.</div>')
      + '<div class="hs-actions" style="margin-top:14px;">'
      + '<button type="button" class="btn primary" data-action="th-pick-done">Done</button></div>'
      + '</div>';
  }

  /** Open the thread about an assignment, making it the first time round.
   *
   * Assignments used to open a one-shot run that was thrown away when you closed it.
   * They open a conversation now, so the work survives and can be carried on.
   */
  function openItemThread(itemId){
    var it = items.find(function(i){ return i.id===itemId; });
    if(!it) return;
    var existing = hsThreads.find(function(t){ return t.itemId === itemId; });
    if(existing){ openThread(existing.id); return; }
    openDraftThread({ classId: it.classId, itemId: itemId,
                      title: it.title || 'Untitled assignment' });
  }

  /** A thread that exists on screen but not yet in the database.
   *
   * Nothing is written until the first message, so looking at an assignment does not
   * leave an empty thread behind it. `threadSend` promotes it on the way past.
   */
  function openDraftThread(seed){
    closeModal();
    TH = { id: null, draftThread: seed, loading: false, busy: false, confirm: null,
           picking: false, ctx: null, srcOpen: false, draft: '',
           data: { id: null, title: seed.title, classId: seed.classId, itemId: seed.itemId,
                   messages: [], pinned: [], sources: [], selection: null } };
    hsScreen = { kind: 'thread', id: null };
    if(activeTab !== 'headstart'){ activeTab = 'headstart'; render(); }
    renderThread();
    if(seed.classId){
      apiGet('/api/ai/context/'+seed.classId)
        .then(function(ctx){ if(TH) TH.ctx = ctx; }).catch(function(){});
    }
  }

  /** The whole page, given over to one conversation. */
  function threadScreenHtml(){
    if(!TH || TH.loading || !TH.data){
      return '<div class="th-screen"><div class="hs-thinking"><i></i>Opening the chat…</div></div>';
    }
    var d = TH.data;
    var siblings = hsThreads.filter(function(t){ return t.classId === d.classId; });
    var rail = '<aside class="th-rail">'
      + '<div class="th-rail-head">Chats</div>'
      + siblings.map(function(t){
          return '<button type="button" class="th-rail-item'+(t.id===d.id?' active':'')+'"'
            + ' data-action="hs-open-thread" data-id="'+t.id+'">'
            + '<span class="th-rail-name">'+escapeHtml(t.title||'Chat')+'</span>'
            + '<span class="th-rail-sub">'+t.messageCount+' message'+(t.messageCount===1?'':'s')+'</span>'
            + '</button>';
        }).join('')
      + '<button type="button" class="th-rail-new" data-action="hs-new-thread" data-class="'+d.classId+'">'
      + iconSvg('plus')+'New chat</button>'
      + '</aside>';

    var msgs = (d.messages||[]).map(threadBubbleHtml).join('');
    var main = '<div class="th-main">'
      + threadSourcesHtml()
      + '<div class="th-scroll" id="th-scroll">'
      + (msgs || (TH.stream ? '' : threadEmptyHtml()))
      + threadLiveOrBusyHtml()
      + '</div>'
      + (TH.confirm ? threadConfirmHtml() : '')
      + threadComposerHtml()
      + '</div>';

    var full = threadFullOn();
    thFullLast = full;
    return '<div class="th-screen'+(full ? ' fullscreen' : '')+'">'
      + '<div class="th-screen-head">'
      + '<button type="button" class="th-back" data-action="hs-home">‹ Headstart</button>'
      + '<div class="th-screen-title">'
      + '<span class="dot" style="--c:'+(classColor(d.classId)||'var(--none)')+'"></span>'
      + '<h2>'+escapeHtml(d.title||'Thread')+'</h2>'
      + '<span class="type-badge">'+escapeHtml(classLabel(d.classId))+'</span></div>'
      + '<div class="th-screen-acts">'+hsSpendChipHtml()
      + '<button type="button" class="btn th-full-btn" data-action="th-full"'
      + ' title="'+(full ? 'Leave full screen (Esc)' : 'Full screen (⌘⇧F)')+'">'
      + iconSvg(full ? 'shrink' : 'expand')+'<span>'+(full ? 'Exit full screen' : 'Full screen')+'</span></button>'
      // A drafted thread has nothing to rename or delete yet: it is written the first
      // time you say something, so both would be acting on a row that does not exist.
      + (TH.id
          ? '<button type="button" class="btn" data-action="th-rename">Rename</button>'
            + '<button type="button" class="btn ghost danger" data-action="th-delete">Delete</button>'
          : '<span class="th-draft-note">Saved when you send the first message</span>')
      + '</div>'
      + '</div>'
      + (TH.picking ? '<div class="th-body-wrap">'+threadPickerHtml()+'</div>'
                    : '<div class="th-body-wrap">'+rail+main+'</div>')
      + '</div>';
  }

  /** The first thing someone sees in a new thread, so it has to say what to do. */
  function threadEmptyHtml(){
    return '<div class="th-start">'
      + '<h3>What do you want to get done?</h3>'
      + '<p>Attach the readings and notes this is about, then ask. Vesta works from your '
      + 'material, and remembers this conversation, so you can keep going without '
      + 'setting it all up again.</p>'
      + '<div class="th-start-tools">'
      + HS_TOOL_GROUPS.map(function(g){
          return '<div class="th-start-group"><div class="th-start-label">'+escapeHtml(g.label)+'</div>'
            + '<div class="th-start-items">'
            + g.tools.map(function(k){
                return '<button type="button" class="th-start-btn" data-action="th-tool" data-tool="'+k+'">'
                  + '<b>'+escapeHtml(HS_TOOLS[k].label)+'</b>'
                  + '<span>'+escapeHtml(HS_TOOLS[k].blurb)+'</span></button>';
              }).join('')
            + '</div></div>';

      + '</div></div>';

  /** Ask which class, unless the answer is already obvious. */
  function pickClassThen(preset, question, go){
    if(preset){ go(preset); return; }
    if(classes.length === 1){ go(classes[0].id); return; }
    document.getElementById('modal-root').innerHTML =
      '<div class="overlay" data-action="modal-backdrop"><div class="modal" data-action="modal-stop">'
      + '<div class="modal-head"><h2>'+escapeHtml(question)+'</h2></div>'
      + '<div class="modal-body">'
      + classes.map(function(c){

            + '<span class="dot" style="--c:'+(c.color||'var(--none)')+'"></span>'
            + '<b>'+escapeHtml(c.code || c.name || 'Class')+'</b>'

        }).join('')
      + '</div>'
      + '<div class="modal-foot"><span></span><div class="right">'
      + '<button class="btn" data-action="modal-close">Cancel</button></div></div>'

  var pendingClassPick = null;

  function startNamedThread(cid){
    askForText('New chat', { label:'What is it about?', placeholder:'Discussions',
                               confirmLabel:'Create' }).then(function(name){
      if(name === null) return;
      return apiPost('/api/threads', { classId: cid, title: (name||'').trim() || 'New chat' })
        .then(function(th){ return hsLoadSide().then(function(){ openThread(th.id); }); });
    }).catch(reportError);

  /** Every thread in a class, for when the strip only had room for three. */
  function openThreadList(cid){
    var mine = hsThreads.filter(function(t){ return t.classId===cid; });
    document.getElementById('modal-root').innerHTML =

  function threadSend(toolKey, confirmed){
    if(!TH || TH.busy) return;
    if(!TH.id && TH.draftThread){
      // First thing said in a drafted thread: write the thread, then send into it.
      var seed = TH.draftThread, ta0 = document.getElementById('th-draft');
      if(ta0) TH.draft = ta0.value;
      if(!toolKey && !(TH.draft||'').trim()) return;
      TH.busy = true; renderThread();
      apiPost('/api/threads', { classId: seed.classId, itemId: seed.itemId, title: seed.title })
        .then(function(th){
          if(!TH) return;
          TH.id = th.id;
          TH.draftThread = null;
          TH.data.id = th.id;
          hsScreen = { kind: 'thread', id: th.id };
          TH.busy = false;
          threadSend(toolKey, confirmed);
          return hsLoadSide();
        })
        .catch(function(err){ if(TH){ TH.busy = false; renderThread(); } reportError(err); });
      return;
    }
    var ta = document.getElementById('th-draft');
    if(ta) TH.draft = ta.value;
    var text = (TH.draft||'').trim();
    // "Send it anyway" answers the question the refusal kept, rather than asking it twice
    var retry = confirmed && TH.retry ? TH.retry : null;
    if(!toolKey && !text && !retry) return;
    var th = TH;
    var fast = threadFastOn();
    var ctrl = window.AbortController ? new AbortController() : null;
    TH.busy = true; TH.confirm = null; TH.retry = null;
    TH.stream = { phase:'waiting', text:'', thinking:'', fast:fast, ctrl:ctrl,
                  user: retry ? null : { role:'user', tool: toolKey || null,
                                         content: toolKey ? ((HS_TOOLS[toolKey]||{}).label || '') : text } };
    if(!retry) TH.draft = '';
    renderThread();
    var payload = retry
      ? { retryOf: retry, confirmed: true, stream: true, fast: fast }
      : { text: toolKey ? '' : text, tool: toolKey || null, confirmed: !!confirmed, stream: true, fast: fast };
    fetch('/api/threads/'+TH.id+'/messages', { method:'POST', headers:{'Content-Type':'application/json'},
                                                body: JSON.stringify(payload), signal: ctrl ? ctrl.signal : undefined })
      .then(function(r){
        if((r.headers.get('content-type') || '').indexOf('text/event-stream') !== 0){
          return r.json().catch(function(){ return {}; }).then(function(j){
            threadRefused(th, r.status, j, text, toolKey);
          });
        }
        return readEventStream(r, function(name, data){ threadStreamEvent(th, name, data); })
          .then(function(){ if(th.stream) threadStopped(th); });   // ended without saying done
      })
      .catch(function(err){
        if(err && err.name === 'AbortError'){ threadStopped(th); return; }
        if(th.stream) threadStopped(th);
        reportError(err);
      });
  }

  /** Server-sent events off a fetch response. EventSource cannot POST, so this reads them by hand. */
  function readEventStream(r, onEvent){
    var reader = r.body.getReader(), dec = new TextDecoder(), buf = '';
    function pump(){
      return reader.read().then(function(chunk){
        if(chunk.done) return;
        buf += dec.decode(chunk.value, { stream:true });
        var cut;
        while((cut = buf.indexOf('\n\n')) >= 0){
          var raw = buf.slice(0, cut), name = 'message', data = '';
          buf = buf.slice(cut + 2);
          raw.split('\n').forEach(function(line){
            if(line.indexOf('event:') === 0) name = line.slice(6).trim();
            else if(line.indexOf('data:') === 0) data += line.slice(5).trim();
          });
          if(!data) continue;                 // a keep-alive comment
          var parsed = null;
          try{ parsed = JSON.parse(data); }catch(e){ continue; }
          onEvent(name, parsed);
        }
        return pump();
      });
    }
    return pump();
  }

  /** Full screen: the account's choice, or on for a phone when nothing has been chosen. */
  function threadFullOn(){
    var p = PREFS && PREFS.threadFullscreen;

    return window.innerWidth <= 720;

  function threadFastTitle(on){

  function threadLiveOrBusyHtml(){

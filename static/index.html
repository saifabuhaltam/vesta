      + '<div class="field-row" style="margin-top:14px;">'
      + '<label class="field">Work (min)<input type="number" id="focus-work" min="25" max="90" value="'+focusSettings.work+'"></label>'
      + '<label class="field">Short break (min)<input type="number" id="focus-short" min="3" max="15" value="'+focusSettings.shortBreak+'"></label>'
      + '</div>'
      + '<div class="field-row" style="margin-top:10px;">'
      + '<label class="field">Long break (min)<input type="number" id="focus-long" min="10" max="30" value="'+focusSettings.longBreak+'"></label>'
      + '<label class="field">Sessions before long break<input type="number" id="focus-count" min="2" max="6" value="'+focusSettings.sessionsBeforeLong+'"></label>'
      + '</div>'
      + '<button type="button" class="btn primary" data-action="focus-start" style="margin-top:22px;width:100%;">Start focusing</button>'
      + '</div></div>';
  }

  function focusRunningHtml(){
    var fs = focusState;
    var total = fs.totalSeconds;
    var left = fs.secondsLeft;
    var pct = total>0 ? (left/total) : 0;
    var circumference = 2*Math.PI*120;
    var offset = circumference * (1-pct);
    var mm = Math.floor(left/60), ss = left%60;
    var timeStr = String(mm).padStart(2,'0')+':'+String(ss).padStart(2,'0');
    var it = fs.taskItemId ? items.find(function(i){ return i.id===fs.taskItemId; }) : null;
    var cls = it ? classById(it.classId) : null;
    var color = FOCUS_PHASE_COLOR[fs.phase];
    var dots = '';
    for(var i=0;i<focusSettings.sessionsBeforeLong;i++){
      dots += '<span class="focus-dot'+(i<fs.sessionNumber?' filled':'')+'"></span>';
    }

    return '<div class="focus-overlay">'
      + '<div class="focus-panel focus-running">'
      + '<div class="focus-phase" style="color:'+color+';">'+FOCUS_PHASE_LABEL[fs.phase]+'</div>'
      + '<div class="focus-ring-wrap">'
      + '<svg width="280" height="280" viewBox="0 0 280 280">'
      + '<circle cx="140" cy="140" r="120" fill="none" stroke="var(--surface-2)" stroke-width="14"/>'
      + '<circle cx="140" cy="140" r="120" fill="none" stroke="'+color+'" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+circumference+'" stroke-dashoffset="'+offset+'" transform="rotate(-90 140 140)"/>'
      + '</svg>'
      + '<div class="focus-time mono">'+timeStr+'</div>'
      + '</div>'
      + (it ? ('<div class="focus-task">'+(cls?'<span class="class-chip" style="--c:'+(cls.color||'var(--none)')+'">'+escapeHtml(cls.code)+'</span>':'')+escapeHtml(it.title)+'</div>') : '<div class="focus-task hint">No specific task</div>')
      + '<div class="focus-session">Session '+fs.sessionNumber+' of '+focusSettings.sessionsBeforeLong+'</div>'
      + '<div class="focus-dots">'+dots+'</div>'
      + '<div class="focus-controls">'
      + '<button type="button" class="btn primary" data-action="focus-toggle-pause">'+(fs.paused?'Resume':'Pause')+'</button>'
      + '<button type="button" class="btn danger" data-action="focus-end">End session</button>'
      + '</div>'
      + '</div></div>';
  }

  function playFocusChime(){
    try{
      var ctx = new (window.AudioContext||window.webkitAudioContext)();
      var o = ctx.createOscillator(); var g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.15, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.6);
      o.start(); o.stop(ctx.currentTime+0.6);
    } catch(e){}
  }

  function advanceFocusPhase(){
    playFocusChime();
    var fs = focusState;
    if(fs.phase === 'work'){
      fs.workSecondsLogged = (fs.workSecondsLogged||0) + fs.totalSeconds;
      if(fs.sessionNumber >= focusSettings.sessionsBeforeLong){
        fs.phase = 'long_break';
        fs.totalSeconds = focusSettings.longBreak*60;
      } else {
        fs.phase = 'short_break';
        fs.totalSeconds = focusSettings.shortBreak*60;
      }
    } else {
      if(fs.phase === 'long_break'){ fs.sessionNumber = 1; } else { fs.sessionNumber += 1; }
      fs.phase = 'work';
      fs.totalSeconds = focusSettings.work*60;
    }
    fs.secondsLeft = fs.totalSeconds;
    renderFocusOverlay();
  }

  function focusTick(){
    if(!focusState || focusState.paused) return;
    focusState.secondsLeft -= 1;
    if(focusState.secondsLeft <= 0){ advanceFocusPhase(); }
    else { renderFocusOverlay(); }
  }

  function startFocusSession(){
    focusSettings = clampFocusSettings({
      work: document.getElementById('focus-work').value,
      shortBreak: document.getElementById('focus-short').value,
      longBreak: document.getElementById('focus-long').value,
      sessionsBeforeLong: document.getElementById('focus-count').value
    });
    saveFocusSettings(focusSettings);
    focusTaskId = document.getElementById('focus-task').value || '';

    focusState = {
      phase: 'work',
      totalSeconds: focusSettings.work*60,
      secondsLeft: focusSettings.work*60,
      sessionNumber: 1,
      paused: false,
      taskItemId: focusTaskId || null,
      workSecondsLogged: 0
    };
    renderFocusOverlay();
    if(focusTickHandle) clearInterval(focusTickHandle);
    focusTickHandle = setInterval(focusTick, 1000);
  }

  function toggleFocusPause(){
    if(!focusState) return;
    focusState.paused = !focusState.paused;
    renderFocusOverlay();
  }

  function endFocusSession(){
    if(focusTickHandle){ clearInterval(focusTickHandle); focusTickHandle = null; }
    var fs = focusState;
    if(fs){
      var totalWork = fs.workSecondsLogged || 0;
      if(fs.phase === 'work'){ totalWork += Math.max(0, fs.totalSeconds - fs.secondsLeft); }
      if(fs.taskItemId && totalWork > 0){
        logFocusTime(fs.taskItemId, totalWork).then(loadState).catch(function(){});
      }
    }
    focusState = null;
    document.getElementById('focus-root').innerHTML = '';
  }

  function saveTermFromForm(){
    var data = {
      name: document.getElementById('f-term-name').value.trim(),
      startDate: document.getElementById('f-term-start').value || '',
      endDate: document.getElementById('f-term-end').value || ''
    };
    saveTermSettings(data).then(closeModal).catch(reportError);
  }

  // ---------------- events ----------------
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-action]');
    if(!t) return;
    var action = t.dataset.action;

    if(action==='switch-tab'){ activeTab = t.dataset.tab; render(); return; }
    if(action==='open-add-class'){ openClassModal(null); return; }
    if(action==='open-edit-class'){ openClassModal(classById(t.dataset.id)); return; }
    if(action==='delete-class'){
      if(confirmAction('Delete this class?', 'This also removes its to-dos. This can\'t be undone.')){ deleteClass(t.dataset.id).catch(reportError); }
      return;
    }
    if(action==='open-add-item'){ openItemModal(null, t.dataset.date||null, t.dataset.classid||null); return; }
    if(action==='open-class-detail'){ openClassDetailModal(t.dataset.id); return; }
    if(action==='class-tab'){ classDetailTab = t.dataset.tab; openClassDetailModal(t.dataset.id); return; }
    if(action==='detail-delete-class'){
      if(confirmAction('Delete this class?', 'This also removes its to-dos. This can\'t be undone.')){ deleteClass(t.dataset.id).then(closeModal).catch(reportError); }
      return;
    }
    if(action==='browse-file'){ var fi=document.getElementById('file-input'); if(fi) fi.click(); return; }
    if(action==='add-material-link'){
      var mc = t.dataset.class;
      var mTitle = document.getElementById('mat-title').value.trim();
      var mUrl = document.getElementById('mat-url').value.trim();
      var mCat = document.getElementById('mat-category') ? document.getElementById('mat-category').value : 'other';
      if(mUrl){
        addMaterialLink(mc, { title: mTitle||mUrl, url: mUrl, category: mCat })
          .then(function(){ openClassDetailModal(mc); }).catch(reportError);
      }
      return;
    }
    if(action==='remove-material'){
      var rcId = t.dataset.class;
      removeMaterial(t.dataset.mid).then(function(){ openClassDetailModal(rcId); }).catch(reportError);
      return;
    }
    if(action==='add-note'){
      var ncId = t.dataset.class;
      var noteText = document.getElementById('note-text').value.trim();
      if(noteText){
        addNote(ncId, noteText).then(function(){ openClassDetailModal(ncId); }).catch(reportError);
      }
      return;
    }
    if(action==='remove-note'){
      var rncId = t.dataset.class;
      removeNote(t.dataset.nid).then(function(){ openClassDetailModal(rncId); }).catch(reportError);
      return;
    }
    if(action==='add-topic'){
      var tcId = t.dataset.class;
      var topicTitle = document.getElementById('topic-title').value.trim();
      if(topicTitle){
        addTopic(tcId, topicTitle).then(function(){ openClassDetailModal(tcId); }).catch(reportError);
      }
      return;
    }
    if(action==='remove-topic'){
      var rtcId = t.dataset.class;
      removeTopic(t.dataset.tid).then(function(){ openClassDetailModal(rtcId); }).catch(reportError);
      return;
    }
    if(action==='open-edit-item'){ openItemModal(items.find(function(i){return i.id===t.dataset.id;})); return; }
    if(action==='delete-item'){
      if(confirmAction('Delete this item?', 'This can\'t be undone.')){ deleteItem(t.dataset.id).catch(reportError); }
      return;
    }
    if(action==='save-item-delete'){
      if(confirmAction('Delete this item?', 'This can\'t be undone.')){ deleteItem(t.dataset.id).then(closeModal).catch(reportError); }
      return;
    }
    if(action==='save-class-delete'){
      if(confirmAction('Delete this class?', 'This also removes its to-dos. This can\'t be undone.')){ deleteClass(t.dataset.id).then(closeModal).catch(reportError); }
      return;
    }
    if(action==='modal-close' || action==='modal-backdrop'){ closeModal(); return; }
    if(action==='modal-stop'){ e.stopPropagation(); return; }
    if(action==='pick-color'){ editingColor = t.dataset.color; document.querySelectorAll('.swatch').forEach(function(s){ s.classList.toggle('selected', s.dataset.color===editingColor); }); return; }
    if(action==='add-schedule-row'){ editingSchedule.push({day:1, start:'', end:'', location:''}); renderScheduleRows(); return; }
    if(action==='remove-schedule-row'){ editingSchedule.splice(Number(t.dataset.idx),1); renderScheduleRows(); return; }
    if(action==='save-class'){ saveClassFromForm(t.dataset.id||null); return; }
    if(action==='save-item'){ saveItemFromForm(t.dataset.id||null); return; }
    if(action==='cal-prev'){ calMonth.setMonth(calMonth.getMonth()-1); renderView(); return; }
    if(action==='cal-next'){ calMonth.setMonth(calMonth.getMonth()+1); renderView(); return; }
    if(action==='cal-today'){ var d=new Date(); d.setDate(1); d.setHours(0,0,0,0); calMonth=d; renderView(); return; }
    if(action==='add-subtask-row'){ editingSubtasks.push({id:uid(), title:'', done:false}); renderSubtaskRows(); return; }
    if(action==='remove-subtask-row'){ editingSubtasks.splice(Number(t.dataset.idx),1); renderSubtaskRows(); return; }
    if(action==='toggle-expand'){
      var eid = t.dataset.id;
      if(expandedItems.has(eid)) expandedItems.delete(eid); else expandedItems.add(eid);
      renderView();
      return;
    }
    if(action==='open-term-settings'){ openTermModal(); return; }
    if(action==='save-term'){ saveTermFromForm(); return; }
    if(action==='cal-view'){ calView = t.dataset.view; renderView(); return; }
    if(action==='toggle-filter'){
      var key = t.dataset.key;
      if(hiddenClassIds.has(key)) hiddenClassIds.delete(key); else hiddenClassIds.add(key);
      renderView();
      return;
    }
    if(action==='open-item-detail'){ openItemDetailModal(t.dataset.id); return; }
    if(action==='toggle-item-detail'){ toggleItemDone(t.dataset.id).then(function(){ openItemDetailModal(t.dataset.id); }).catch(reportError); return; }
    if(action==='edit-from-detail'){ openItemModal(items.find(function(i){ return i.id===t.dataset.id; })); return; }
    if(action==='detail-delete-item'){
      if(confirmAction('Delete this item?', 'This can\'t be undone.')){ deleteItem(t.dataset.id).then(closeModal).catch(reportError); }
      return;
    }
    if(action==='open-headstart'){ openHeadstartModal(t.dataset.id); return; }
    if(action==='open-rubric'){ openRubricModal(t.dataset.mid, t.dataset.class); return; }
    if(action==='rubric-parse'){
      var rBody = document.querySelector('.modal-body');
      if(rBody) rBody.innerHTML = '<div class="hint">Reading the rubric… this can take up to a minute.</div>';
      parseRubric(currentRubricMaterialId).then(function(r){
        currentRubric = r;
        renderRubricModal();
        loadState();
      }).catch(function(err){ renderRubricModal(); reportError(err); });
      return;
    }
    if(action==='rubric-delete'){
      if(confirmAction('Delete this rubric?', 'This removes the parsed criteria. The file itself stays.')){
        deleteRubricRecord(currentRubric.id).then(function(){
          currentRubric = null;
          renderRubricModal();
          loadState();
        }).catch(reportError);
      }
      return;
    }
    if(action==='hs-select-kind'){ headstartActiveKind = t.dataset.kind; headstartRevisingKind = null; renderHeadstartModal(); return; }
    if(action==='hs-generate'){ submitHeadstart(currentHeadstartItemId, t.dataset.kind, 'generate', ''); return; }
    if(action==='hs-regenerate'){
      if(confirmAction('Regenerate this?', "This replaces the current content and can't be undone.")){
        submitHeadstart(currentHeadstartItemId, t.dataset.kind, 'generate', '');
      }
      return;
    }
    if(action==='hs-request-changes'){ headstartRevisingKind = t.dataset.kind; renderHeadstartModal(); return; }
    if(action==='hs-cancel-revise'){ headstartRevisingKind = null; renderHeadstartModal(); return; }
    if(action==='hs-submit-revise'){
      var instrEl = document.getElementById('hs-instructions');
      var instr = instrEl ? instrEl.value.trim() : '';
      if(!instr) return;
      submitHeadstart(currentHeadstartItemId, t.dataset.kind, 'revise', instr);
      return;
    }
    if(action==='hs-accept'){
      updateHeadstart(t.dataset.id, { status:'accepted' }).then(function(hs){
        var idx = currentHeadstarts.findIndex(function(h){ return h.id===hs.id; });
        if(idx>=0) currentHeadstarts[idx] = hs;
        renderHeadstartModal();
        loadState();
      }).catch(reportError);
      return;
    }
    if(action==='hs-edit'){
      var editHs = currentHeadstarts.find(function(h){ return h.id===t.dataset.id; });
      if(!editHs) return;
      var editBody = document.querySelector('.modal-body');
      editBody.innerHTML = '<textarea id="hs-edit-text" style="min-height:260px;">'+escapeHtml(editHs.content)+'</textarea>'
        + '<div style="display:flex;gap:8px;margin-top:8px;">'
        + '<button type="button" class="btn" data-action="hs-cancel-edit">Cancel</button>'
        + '<button type="button" class="btn primary" data-action="hs-save-edit" data-id="'+editHs.id+'">Save</button>'
        + '</div>';
      return;
    }
    if(action==='hs-cancel-edit'){ renderHeadstartModal(); return; }
    if(action==='hs-save-edit'){
      var newContentEl = document.getElementById('hs-edit-text');
      var newContent = newContentEl ? newContentEl.value : '';
      updateHeadstart(t.dataset.id, { content:newContent }).then(function(hs){
        var idx = currentHeadstarts.findIndex(function(h){ return h.id===hs.id; });
        if(idx>=0) currentHeadstarts[idx] = hs;
        renderHeadstartModal();
      }).catch(reportError);
      return;
    }
    if(action==='hs-delete'){
      if(confirmAction('Delete this?', 'This removes the generated content for this option. You can generate it again later.')){
        var delId = t.dataset.id;
        deleteHeadstart(delId).then(function(){
          currentHeadstarts = currentHeadstarts.filter(function(h){ return h.id!==delId; });
          var curIt = items.find(function(i){ return i.id===currentHeadstartItemId; });
          headstartActiveKind = kindsForType(curIt ? curIt.type : 'other')[0] || null;
          renderHeadstartModal();
          loadState();
        }).catch(reportError);
      }
      return;
    }
    if(action==='open-focus'){ openFocusOverlay(); return; }
    if(action==='focus-backdrop'){ document.getElementById('focus-root').innerHTML=''; return; }
    if(action==='focus-stop'){ e.stopPropagation(); return; }
    if(action==='focus-close-setup'){ document.getElementById('focus-root').innerHTML=''; return; }
    if(action==='focus-start'){ startFocusSession(); return; }
    if(action==='focus-toggle-pause'){ toggleFocusPause(); return; }
    if(action==='focus-end'){
      if(confirmAction('End this focus session?', "You'll lose the current timer progress.")){ endFocusSession(); }
      return;
    }
  });

  document.addEventListener('change', function(e){
    var t = e.target;
    if(t.matches('[data-action="toggle-item"]')){
      var beforeIt = items.find(function(i){ return i.id===t.dataset.id; });
      var reopenClassId = (beforeIt && beforeIt.classId && document.querySelector('.modal-wide [data-action="open-edit-class"][data-id="'+beforeIt.classId+'"]')) ? beforeIt.classId : null;
      toggleItemDone(t.dataset.id).then(function(){ if(reopenClassId) openClassDetailModal(reopenClassId); }).catch(reportError);
      return;
    }
    if(t.id==='f-repeat'){
      var wrap = document.getElementById('f-repeat-until-wrap');
      if(wrap) wrap.style.display = t.checked ? 'flex' : 'none';
      return;
    }
    if(t.matches('[data-sched-field]')){
      var idx = Number(t.dataset.idx);
      var field = t.dataset.schedField;
      if(field==='day') editingSchedule[idx].day = Number(t.value);
      else editingSchedule[idx][field] = t.value;
      return;
    }
    if(t.matches('[data-subtask-field]')){
      var sidx = Number(t.dataset.idx);
      var sfield = t.dataset.subtaskField;
      if(sfield==='done') editingSubtasks[sidx].done = t.checked;
      else editingSubtasks[sidx][sfield] = t.value;
      return;
    }
    if(t.matches('[data-action="toggle-topic"]')){
      var tcId2 = t.dataset.class;
      toggleTopic(t.dataset.tid, t.checked).then(function(){ openClassDetailModal(tcId2); }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="change-material-category"]')){
      var mcId = t.dataset.class;
      updateMaterial(t.dataset.mid, { category: t.value }).then(function(){ openClassDetailModal(mcId); }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="rubric-link-select"]')){
      updateRubric(currentRubric.id, { itemId: t.value || null }).then(function(r){
        currentRubric = r;
        loadState();
      }).catch(reportError);
      return;
    }
    if(t.matches('[data-action="toggle-subtask"]')){
      var it = items.find(function(i){ return i.id===t.dataset.id; });
      if(it){
        var subs = (it.subtasks||[]).map(function(s){ return Object.assign({}, s); });
        var sub = subs.find(function(s){ return s.id===t.dataset.sub; });
        if(sub) sub.done = t.checked;
        var reopenDetail = !!document.querySelector('[data-action="toggle-item-detail"][data-id="'+it.id+'"]');
        updateItem(it.id, { subtasks: subs }).then(function(){
          if(reopenDetail) openItemDetailModal(it.id);
        }).catch(reportError);
      }
      return;
    }
    if(t.matches('[data-action="material-file-input"]')){
      if(t.files && t.files.length){
        var cid = t.dataset.classid;
        var file = t.files[0];
        var guess = guessFileCategory(file.name);
        var catSel = document.getElementById('mat-category');
        if(catSel) catSel.value = guess;
        uploadMaterialFile(file, cid, guess).then(function(){ openClassDetailModal(cid); }).catch(reportError);
      }
      return;
    }
  });

  document.addEventListener('dragover', function(e){
    var zone = e.target.closest('.dropzone');
    if(zone){ e.preventDefault(); zone.classList.add('drag'); }
  });
  document.addEventListener('dragleave', function(e){
    var zone = e.target.closest('.dropzone');
    if(zone){ zone.classList.remove('drag'); }
  });
  document.addEventListener('drop', function(e){
    var zone = e.target.closest('.dropzone');
    if(!zone) return;
    e.preventDefault();
    zone.classList.remove('drag');
    var files = e.dataTransfer && e.dataTransfer.files;
    if(files && files.length){
      var cid = zone.dataset.classid;
      var file = files[0];
      var guess = guessFileCategory(file.name);
      var catSel = document.getElementById('mat-category');
      if(catSel) catSel.value = guess;
      uploadMaterialFile(file, cid, guess).then(function(){ openClassDetailModal(cid); }).catch(reportError);
    }
  });

  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  init();
})();
</script>

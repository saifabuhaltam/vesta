  /**
   * Which Google calendars Vesta reads.
   *
   * Every calendar is a row with its own switch, rather than a count or a dropdown:
   * this is a consent decision about someone's personal calendar, so what is being read
   * has to be readable at a glance. Nothing is on until it is turned on here.
   */
  var googleFeeds = null;

  function calendarPickerHtml(){
    var head = '<div id="g-feeds" style="margin-top:14px;">'
      + '<div class="set-sub" style="margin-top:0;">Calendars to read</div>';
    if(googleFeeds === null) return head + '<div class="hint">Loading your calendars…</div></div>';
    if(!googleFeeds.length) return head + '<div class="hint">No calendars found on this account.</div></div>';
    return head
      + googleFeeds.map(function(f){
          return '<label class="feed-row">'
            + '<input type="checkbox" data-action="toggle-feed" data-cal="'+escapeHtml(f.calendarId)+'"'
              + (f.enabled ? ' checked' : '')+(f.isVesta ? ' disabled' : '')+'>'
            + '<span class="feed-dot" style="background:'+escapeHtml(f.colour||'#999')+';"></span>'
            + '<span class="feed-name">'+escapeHtml(f.name||'')+'</span>'
            + (f.isVesta ? '<span class="tp-tag">Vesta\u2019s own</span>'
                         : (f.writable ? '' : '<span class="tp-tag">Read-only</span>'))
            + '</label>'
            + (f.lastError ? '<div class="si-error" style="margin:2px 0 8px;">'+escapeHtml(f.lastError)+'</div>' : '');
        }).join('')
      + '<div class="hint" style="margin-top:8px;">Events from the calendars you tick appear in Vesta and '
      + 'update when you change them in Google. They stay read-only here, because Google owns them. '
      + 'Vesta\u2019s own calendar is where your deadlines are written, so it is always on.</div>'
      + '</div>';
  }

  function loadGoogleFeeds(){
    return apiGet('/api/calendar/google/calendars').then(function(list){
      googleFeeds = list;
      var host = document.getElementById('g-feeds');
      if(host) host.outerHTML = calendarPickerHtml();
    }).catch(function(){
      googleFeeds = [];
      var host = document.getElementById('g-feeds');
      if(host) host.outerHTML = calendarPickerHtml();
    });
  }

  function toggleFeed(calendarId, on){
    if(!googleFeeds) return;
    googleFeeds = googleFeeds.map(function(f){
      return f.calendarId === calendarId ? Object.assign({}, f, { enabled: on }) : f;
    });
    var ids = googleFeeds.filter(function(f){ return f.enabled; })
                         .map(function(f){ return f.calendarId; });
    apiPut('/api/calendar/google/calendars', { calendarIds: ids }).then(function(list){
      googleFeeds = list;
      // Ticking a calendar is a request to see it, so read it now rather than waiting
      // for the next time something else triggers a sync.
      return on ? syncGoogleQuietly() : null;
    }).catch(reportError);
  }

  function syncGoogleQuietly(){
    return runGoogleSync('manual').then(function(){
      // Refresh the section too, or it keeps claiming "Last synced: never" directly
      // underneath a sync that just finished.
      return loadGoogleStatus();
    });
  }

  /**
   * Keeping the two calendars level without anyone pressing anything.
   *
   * Google will not tell Vesta when something changes here -- that needs watch
   * channels, which need a public URL and a cron to renew them. Until then the page
   * asks, at the moments a person would actually notice a difference: when it opens,
   * when the tab is looked at again, a little after a local change, and on a slow
   * timer while it is open. Incremental sync tokens make a no-op sync cheap, which is
   * what makes asking this often reasonable.
   */
  var gsyncOn = false;            // is there a Google account to sync with at all
  var gsyncBusy = false;
  var gsyncLastAt = 0;
  var gsyncFailures = 0;
  var gsyncTimer = null;
  var gsyncAfterEdit = null;
  var SYNC_MIN_GAP = 45 * 1000;   // never twice inside this, however many triggers fire
  var SYNC_POLL = 3 * 60 * 1000;  // while the tab is open and visible
  var SYNC_MAX_BACKOFF = 15 * 60 * 1000;

  function syncGap(){
    // After a failure, back off rather than retrying into a wall every 45 seconds.
    return gsyncFailures ? Math.min(SYNC_MIN_GAP * Math.pow(2, gsyncFailures), SYNC_MAX_BACKOFF)
                         : SYNC_MIN_GAP;
  }

  function runGoogleSync(reason){
    if(gsyncBusy) return Promise.resolve(false);
    // An archived term refuses writes, and a sync writes. Asking anyway would just
    // collect 423s every few minutes for as long as the term stayed open.
    if(termLocked) return Promise.resolve(false);
    if(reason !== 'manual' && Date.now() - gsyncLastAt < syncGap()) return Promise.resolve(false);
    gsyncBusy = true;
    return apiPostRaw('/api/calendar/google/sync', {}).then(function(r){
      gsyncBusy = false;
      gsyncLastAt = Date.now();
      if(!r.ok){ gsyncFailures++; return false; }
      gsyncFailures = 0;
      // Only re-render when something actually moved: a silent no-op sync every few
      // minutes should not make the page flicker or lose a half-typed note.
      // Counts come back keyed by action, and the set of actions is the server's to
      // change, so count anything that is not explicitly a no-op rather than listing
      // the names that mean "something happened" and going stale when one is added.
      var c = (r.body && r.body.counts) || {};
      var QUIET = { clean:1, ignore:1, unreadable:1 };
      var changed = 0;
      Object.keys(c).forEach(function(k){
        if(QUIET[k] || typeof c[k] !== 'number') return;
        changed += c[k];
      });
      var ab = c.absorbed || {};
      changed += (ab.added || 0) + (ab.updated || 0) + (ab.removed || 0);
      return changed ? loadState().then(function(){ return true; }) : false;
    }).catch(function(){
      gsyncBusy = false;
      gsyncLastAt = Date.now();
      gsyncFailures++;
      return false;                 // a failed background sync is not worth a dialog
    });
  }

  /** A local change should reach Google without waiting for the next poll. */
  function syncSoon(){
    if(!gsyncOn) return;
    clearTimeout(gsyncAfterEdit);
    gsyncAfterEdit = setTimeout(function(){ runGoogleSync('edit'); }, 4000);
  }

  function startGoogleSync(){
    if(gsyncTimer) return;
    gsyncTimer = setInterval(function(){
      if(document.visibilityState === 'visible') runGoogleSync('poll');
    }, SYNC_POLL);
    document.addEventListener('visibilitychange', function(){
      if(document.visibilityState === 'visible') runGoogleSync('focus');
    });
    window.addEventListener('focus', function(){ runGoogleSync('focus'); });
  }

  /** Refresh just this section, so opening Settings never waits on the network. */
  function loadGoogleStatus(){
    return apiGet('/api/calendar/google/status').then(function(g){
      googleStatus = g;
      if(g && g.connected && googleFeeds === null) loadGoogleFeeds();
      var host = document.getElementById('g-cal');
      if(host) host.outerHTML = googleSectionHtml();
    }).catch(function(){
      googleStatus = { configured:false, connected:false, redirectUri:'' };
      var host = document.getElementById('g-cal');
      if(host) host.outerHTML = googleSectionHtml();
    });
  }

  function googleConnect(){
    apiGet('/api/calendar/google/start').then(function(r){
      if(r && r.url) window.location.href = r.url;
    }).catch(reportError);
  }

  function googleSync(){
    var host = document.getElementById('g-cal');
    if(host) host.outerHTML = '<div class="st-card" id="g-cal"><div class="st-card-head"><div>'
      + '<div class="st-card-title">Google Calendar</div></div></div>'+siThinking('Syncing…')+'</div>';
    apiPostRaw('/api/calendar/google/sync', {}).then(function(r){
      if(!r.ok){
        googleStatus = Object.assign(googleStatus||{}, { lastError: r.body.error || 'Sync failed.' });
        var h = document.getElementById('g-cal');
        if(h) h.outerHTML = googleSectionHtml();
        return;
      }
      loadState();
      loadGoogleStatus();
    }).catch(function(){ loadGoogleStatus(); });
  }

  // ---------------- Settings ----------------
  // Laid out after reference/settings inspo.png: sections down the left with an icon and
  // a one-line summary, and each section a stack of cards.
  //
  // Only things that cannot be set anywhere else live here. Anything with its own control
  // on the page it affects (calendar view and detail, Files layout, every Focus and
  // Headstart setting, the sidebar's collapsed state) is set there and remembered there,
  // so it does not get a second copy in this window. That leaves four sections, not the
  // eleven the mockup shows.
  var SETTINGS_SECTIONS = [
    { id:'account',  label:'Account',      sub:'Profile, password and your data.',   icon:'user' },
    { id:'semester', label:'Semester',     sub:'Terms and the grading scale.',       icon:'cap' },
    { id:'prefs',    label:'Preferences',  sub:'Theme, sidebar, editor, alerts.',   icon:'sliders' },
    { id:'calendar', label:'Integrations', sub:'Sync with Google Calendar.',         icon:'link' }
  ];
  // Sections that were folded into the four above, so an old link still lands somewhere.
  var SETTINGS_ALIASES = { notifications:'prefs', notes:'prefs', appearance:'prefs',
                           grades:'semester', data:'account' };
  var settingsSection = 'account';

  // -- small builders, so every row in every section looks and behaves the same ----
  function setRow(label, help, control){
    return '<div class="set-row"><div><div class="set-label">'+escapeHtml(label)+'</div>'
      + (help ? '<div class="set-help">'+escapeHtml(help)+'</div>' : '')
      + '</div><div class="set-control">'+control+'</div></div>';
  }
  function setCard(title, sub, body, headRight){
    return '<div class="st-card"><div class="st-card-head"><div>'
      + '<div class="st-card-title">'+escapeHtml(title)+'</div>'
      + (sub ? '<div class="st-card-sub">'+escapeHtml(sub)+'</div>' : '')
      + '</div>'+(headRight||'')+'</div>'+(body||'')+'</div>';
  }
  function prefValue(key){
    if(!PREFS) return null;
    if(key.indexOf('focus.') === 0) return (PREFS.focus||{})[key.slice(6)];
    return PREFS[key];

  function prefSeg(key, options){

  /**
   * Inputs save themselves on change.
   *
   * A Settings screen with a Save button invites you to change four things and lose
   * all four by closing the window, so there is no Save button and no draft state:
   * every control writes when you leave it.
   */
  function wireSettingsInputs(root){
    root.querySelectorAll('[data-pref]').forEach(function(el){
      el.addEventListener('change', function(){
        var key = el.dataset.pref;
        var val = el.type === 'checkbox' ? el.checked
                : el.type === 'number' ? Number(el.value)
                : el.value;
        if(key.indexOf('focus.') === 0){
          var f = Object.assign({}, (PREFS && PREFS.focus) || {});
          f[key.slice(6)] = val;
          savePrefs({ focus:f }).then(function(){ openSettingsModal(); });
        } else {
          var patch = {}; patch[key] = val;
          savePrefs(patch).then(function(){ openSettingsModal(); });
        }
      });
    });
  }

  /** Attach files to an assignment, from the picker or from a drop. */
  function uploadFilesToItem(itemId, fileList){
    var it = items.find(function(i){ return i.id===itemId; });
    if(!it) return;
    var list = Array.prototype.slice.call(fileList || []);
    if(!list.length) return;
    // An assignment with no class used to refuse the upload outright. The Inbox is
    // already the home for a file with nowhere to live, so it goes there and stays
    // attached to the assignment either way; filing it is a separate decision.
    var target = it.classId ? '/api/classes/'+it.classId+'/materials' : '/api/materials';
    list.reduce(function(chain, file){
      return chain.then(function(){
        var fd = new FormData();
        fd.append('file', file);
        fd.append('itemId', itemId);
        fd.append('category', guessFileCategory(file.name));
        return fetch(target, { method:'POST', body: fd }).then(checkOk);
      });
    }, Promise.resolve())
      .then(loadState)
      .then(function(){ openItemDetailModal(itemId); })
      .catch(reportError);
  }

  function itemCardDetailsHtml(it, cls){

      ? '<textarea id="ac-desc" rows="4" style="width:100%;" placeholder="What does this assignment ask for?">'

        + '<div style="flex:1;min-width:0;">'
        + '<div class="ac-file-name">'+escapeHtml(m.title || name)+'</div>'
        + '<div class="ac-file-meta">'+(m.size!=null?humanSize(m.size)+' • ':'')
          + (m.createdAt ? 'Uploaded '+relTimeAgo(m.createdAt) : 'Linked')
          + (m.cls && m.cls.id !== it.classId ? ' • lives in '+escapeHtml(m.cls.code||'Inbox') : '')

        + '<button type="button" class="btn ghost" data-action="item-file-detach" data-mid="'+m.id+'" data-id="'+it.id+'" title="Remove from this assignment">✕</button>'
        + '</div>';

    // Once a rubric is attached, it is shown here, because this is the card that
    // Headstart reads it from. Before this existed the only route to a rubric was
    // the class Files page, and "Break down the rubric" ran with nothing.
    var rubricCard = '';

      rubricCard = '<div class="ac-card"><div class="ac-card-head"><h3>Rubric</h3>'
        + '<div class="ac-card-actions"><span class="hint">'
        + (it.rubric.totalPoints!=null ? it.rubric.totalPoints+' points' : (it.rubric.criteria.length+' criteria'))
        + '</span></div></div>'
        + '<div class="grade-table">'
        + it.rubric.criteria.map(function(c){
            return '<div class="grade-row"><span>'+escapeHtml(c.name||'')

              + '</span><span class="mono">'+(c.points!=null?c.points:'—')+'</span><span></span></div>';

        + iconSvg('plus')+' Add</button></span></div>'

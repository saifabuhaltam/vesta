  // ---------------- Calendar ----------------
  // ---------------- Calendar ----------------
  var EVENT_KINDS = {
    assignment: { label:'Assignments', color:'#EF4444' },
    exam:       { label:'Exams',       color:'#8B5CF6' },
    quiz:       { label:'Quizzes',     color:'#9CA3AF' },
    discussion: { label:'Discussions', color:'#22A06B' },
    lecture:    { label:'Lectures',    color:'#7DD3FC' },
    other:      { label:'Other',       color:'#F5B301' },
    // Mirrored in from a Google calendar the student chose to read. Its own bucket, so
    // it can be hidden from the legend like anything else: a work rota on the same
    // grid as coursework is useful right up until it is not.
    external:   { label:'From Google',  color:'#4285F4' }
  };
  /** Never let an unknown kind crash a render: an event on the wrong day is a bug, a
      blank calendar is a broken app. */
  function eventKind(k){ return EVENT_KINDS[k] || EVENT_KINDS.other; }

  // An assignment's item type decides which legend bucket it lands in.
  function itemEventKind(it){
    if(it.type==='exam') return 'exam';
    if(it.type==='quiz') return 'quiz';
    if(it.type==='discussion') return 'discussion';
    return 'assignment';
  }
  function kindVisible(k){ return !hiddenEventTypes.has(k); }

  // Everything that can land on a calendar day, normalised.
  function calEntriesForDate(iso){
    var out = [];
    var d = parseISODate(iso);
    var dow = d.getDay();
    var inTerm = !(termSettings.startDate && iso<termSettings.startDate) && !(termSettings.endDate && iso>termSettings.endDate);
    if(inTerm && kindVisible('lecture')){
      classes.forEach(function(c){
        if(hiddenClassIds.has(c.id)) return;
        (c.schedule||[]).forEach(function(s){
          if(s.day!==dow) return;
          out.push({ kind:'lecture', title:(c.code||c.name)+' lecture', cls:c, start:s.start, end:s.end,
                     location:s.location||'', color:c.color, sortKey:s.start||'00:00' });
        });
      });
    }
    items.forEach(function(it){
      if(it.dueDate!==iso || !isVisibleInCalendar(it)) return;
      var k = itemEventKind(it);
      if(!kindVisible(k)) return;
      var cls = classById(it.classId);
      out.push({ kind:k, title:it.title, cls:cls, itemId:it.id, done:it.status==='done',
                 color:(cls?cls.color:EVENT_KINDS[k].color), start:it.dueTime||'', sortKey:it.dueTime||'zz' });
    });
    events.forEach(function(ev){
      if(ev.date!==iso) return;
      if(ev.classId && hiddenClassIds.has(ev.classId)) return;
      if(!ev.classId && hiddenClassIds.has('__general__')) return;
      if(!kindVisible(ev.kind)) return;
      var cls = ev.classId ? classById(ev.classId) : null;
      out.push({ kind:ev.kind, title:ev.title, cls:cls, eventId:ev.id, start:ev.start||'', end:ev.end||'',
                 allDay:ev.allDay, location:ev.location, color:(cls?cls.color:eventKind(ev.kind).color),
                 sortKey: ev.allDay ? '00:00' : (ev.start||'zz') });
    });
    out.sort(function(a,b){ return (a.sortKey||'').localeCompare(b.sortKey||''); });
    return out;
  }

  // How much an event shows in the month and week grids. Detailed names the class and
  // the kind alongside the title; simple is the title alone, still in its class colour.
  var CAL_DETAIL_KEY = 'vesta_cal_detail';
  var calDetail = (function(){
    try { return localStorage.getItem(CAL_DETAIL_KEY) === 'simple' ? 'simple' : 'detailed'; }
    catch(err){ return 'detailed'; }
  })();

  function calChipHtml(e){
    var attrs = e.itemId ? ' data-action="open-item-detail" data-id="'+e.itemId+'"'
              : e.eventId ? ' data-action="open-event-modal" data-id="'+e.eventId+'"' : '';
    var simple = calDetail === 'simple';
    var time = e.allDay ? '' : fmtTimeChip(e.start);
    // the tooltip still carries the full picture, so nothing is lost by simplifying
    var full = (time ? time + ' · ' : '') + e.title + (e.cls ? ' · ' + (e.cls.code||e.cls.name) : '')
             + ' · ' + eventKind(e.kind).label.replace(/s$/,'');
    return '<div class="cal-ev'+(e.done?' done':'')+(simple?' simple':'')+'"'
      + ' style="--c:'+(e.color||eventKind(e.kind).color)+'"'+attrs
      + ' title="'+escapeHtml(full)+'">'
      + '<span class="cal-ev-line">'
      + (time ? '<span class="cal-ev-time">'+escapeHtml(time)+'</span>' : '')
      + '<span class="cal-ev-title">'+escapeHtml(e.title)+'</span></span>'
      + (simple ? '' :
          (e.cls ? '<span class="cal-ev-cls">'+escapeHtml(e.cls.code||e.cls.name)+'</span>' : '')
          + '<span class="cal-ev-kind" style="background:'+eventKind(e.kind).color+'22;color:'
          + eventKind(e.kind).color+';">'+eventKind(e.kind).label.replace(/s$/,'')+'</span>')
      + '</div>';
  }

  function monthGridHtml(){
    // a simple chip is one line rather than three, so more of the day fits before
    // the cell has to fall back to "+N more"
    var calShown = calDetail === 'simple' ? 4 : 2;
    var year = calMonth.getFullYear(), month = calMonth.getMonth();
    var firstOfMonth = new Date(year, month, 1);
    var gridStart = new Date(year, month, 1 - firstOfMonth.getDay());
    var todayS = todayIso();
    // The wrapper is what scrolls on a narrow screen; see the phone styles.
    var html = '<div class="cal-scroll"><div class="cal-grid">';
    DOW_SHORT.forEach(function(d){ html += '<div class="cal-dow">'+d+'</div>'; });
    for(var i=0;i<42;i++){
      var d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
      var iso = isoLocal(d);
      var inMonth = d.getMonth()===month;
      var entries = calEntriesForDate(iso);
      html += '<div class="cal-cell'+(inMonth?'':' dim')+(iso===todayS?' today':'')+(calSelectedDay===iso?' sel':'')+'"'
        + ' data-action="cal-pick-day" data-date="'+iso+'">'
        + '<div class="cal-daynum">'+d.getDate()+'</div>'
        + entries.slice(0, calShown).map(calChipHtml).join('')
        + (entries.length>calShown
            ? '<div class="cal-more">+'+(entries.length-calShown)+' more</div>' : '')
        + '</div>';
    }
    return html + '</div></div>';
  }

  function weekGridHtml(){
    var base = calSelectedDay ? parseISODate(calSelectedDay) : new Date();
    var start = new Date(base); start.setDate(base.getDate() - base.getDay()); start.setHours(0,0,0,0);
    var todayS = todayIso();
    var html = '<div class="cal-week">';
    for(var i=0;i<7;i++){
      var d = new Date(start); d.setDate(start.getDate()+i);
      var iso = isoLocal(d);
      var entries = calEntriesForDate(iso);
      html += '<div class="cal-week-col'+(iso===todayS?' today':'')+'" data-action="cal-pick-day" data-date="'+iso+'">'
        + '<div class="cal-week-head"><span class="cal-week-dow">'+DOW_SHORT[d.getDay()]+'</span>'
        + '<span class="cal-week-num">'+d.getDate()+'</span></div>'
        + '<div class="cal-week-body">'
        + (entries.length ? entries.map(calChipHtml).join('') : '<div class="cal-week-empty">—</div>')
        + '</div></div>';
    }
    return html + '</div>';
  }

  function calDayPanelHtml(){
    var iso = calSelectedDay || todayIso();
    var entries = calEntriesForDate(iso);
    var label = parseISODate(iso).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
    var rows = entries.length ? entries.map(function(e){
      var time = e.allDay ? 'All day' : (e.start ? fmtTime(e.start)+(e.end?' – '+fmtTime(e.end):'') : '');
      var attrs = e.itemId ? ' data-action="open-item-detail" data-id="'+e.itemId+'"'
                : e.eventId ? ' data-action="open-event-modal" data-id="'+e.eventId+'"' : '';
      return '<div class="today-row"'+attrs+(attrs?' style="cursor:pointer;"':'')+'>'
        + '<span class="dot" style="--c:'+(e.color||eventKind(e.kind).color)+'"></span>'
        + '<div><div class="t-title">'+escapeHtml(e.title)+'</div>'
        + '<div class="t-meta">'+(e.cls?escapeHtml(e.cls.code||e.cls.name):eventKind(e.kind).label.replace(/s$/,''))
        + (time?' · '+time:'') + (e.location?' · '+escapeHtml(e.location):'') + '</div></div></div>';
    }).join('') : '<div class="hint">Nothing on this day.</div>';
    return '<div class="rail-card">'
      + '<div class="mini-cal-head" style="margin-bottom:6px;"><h3>'+label+'</h3><span class="hint">'+entries.length+' event'+(entries.length===1?'':'s')+'</span></div>'
      + rows
      + '<button type="button" class="btn" data-action="open-event-modal" data-date="'+iso+'" style="width:100%;margin-top:12px;">+ Add event</button>'
      + '</div>';
  }

  function eventTypesCardHtml(){
    return '<div class="rail-card"><div class="mini-cal-head" style="margin-bottom:8px;"><h3>Event Types</h3></div>'
      + Object.keys(EVENT_KINDS).map(function(k){
          var on = kindVisible(k);
          return '<label class="cal-legend"><input type="checkbox" data-action="toggle-event-kind" data-kind="'+k+'"'+(on?' checked':'')+'>'
            + '<span class="cal-legend-sw" style="background:'+EVENT_KINDS[k].color+'"></span>'
            + '<span>'+EVENT_KINDS[k].label+'</span></label>';
        }).join('')
      + '</div>';
  }

  function viewCalendar(){
    var label = calView==='week'
      ? (function(){
          var base = calSelectedDay ? parseISODate(calSelectedDay) : new Date();
          var s = new Date(base); s.setDate(base.getDate()-base.getDay());
          var e = new Date(s); e.setDate(s.getDate()+6);
          return s.toLocaleDateString(undefined,{month:'short', day:'numeric'})+' – '+e.toLocaleDateString(undefined,{month:'short', day:'numeric', year:'numeric'});
        })()
      : calMonth.toLocaleDateString(undefined, {month:'long', year:'numeric'});

    var toolbar = '<div class="cal-toolbar">'
      + '<button type="button" class="btn ghost" data-action="cal-prev">‹</button>'
      + '<button type="button" class="btn" data-action="cal-today">Today</button>'
      + '<button type="button" class="btn ghost" data-action="cal-next">›</button>'
      + '<h2>'+label+'</h2>'
      + '<div class="seg-tabs" style="margin-left:auto;">'
      + ['month','week','list'].map(function(v){
          return '<button type="button" class="seg-tab'+(calView===v?' active':'')+'" data-action="cal-view" data-view="'+v+'">'+v.charAt(0).toUpperCase()+v.slice(1)+'</button>';
        }).join('')
      + '</div>'
      + (calView === 'list' ? '' :
          '<div class="seg-tabs">'
          + [['simple','Simple'],['detailed','Detailed']].map(function(o){
              return '<button type="button" class="seg-tab'+(calDetail===o[0]?' active':'')+'"'
                + ' data-action="cal-detail" data-v="'+o[0]+'">'+o[1]+'</button>';
            }).join('')
          + '</div>')
      + '<button type="button" class="btn primary" data-action="open-event-modal" data-date="'+(calSelectedDay||todayIso())+'">+ Add event</button>'
      + '<a class="btn" href="/api/export.ics" download>Export</a>'
      + '</div>';

    var body = calView==='week' ? weekGridHtml() : calView==='list' ? listAgendaHtml() : monthGridHtml();
    return toolbar + filterChipsHtml() + '<div class="cal-layout"><div class="cal-main">' + body + '</div>'
      + '<div class="cal-rail">' + calDayPanelHtml() + eventTypesCardHtml() + '</div></div>';
  }

  function filterChipsHtml(){
    if(classes.length===0) return '';
    var chips = classes.map(function(c){
      var hidden = hiddenClassIds.has(c.id);
      return '<button type="button" class="filter-chip'+(hidden?' off':'')+'" style="--c:'+c.color+'" data-action="toggle-filter" data-key="'+c.id+'">'+escapeHtml(c.code||c.name)+'</button>';
    }).join('');
    var generalHidden = hiddenClassIds.has('__general__');
    chips += '<button type="button" class="filter-chip'+(generalHidden?' off':'')+'" data-action="toggle-filter" data-key="__general__">General</button>';
    return '<div class="filter-row">'+chips+'</div>';
  }


  function listAgendaHtml(){
    var visible = items.filter(function(it){ return it.dueDate && isVisibleInCalendar(it); });
    if(visible.length===0){
      return '<div class="empty">Nothing on the calendar yet.'+(classes.length===0 ? '<div><button class="btn primary" data-action="open-add-class">+ Add a class</button></div>' : '')+'</div>';
    }
    visible.sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate) || (a.dueTime||'').localeCompare(b.dueTime||''); });
    var html = '';
    var lastDate = null;
    visible.forEach(function(it){
      if(it.dueDate !== lastDate){
        lastDate = it.dueDate;
        var diff = diffDaysFromToday(lastDate);
        var stripe = diff<0 ? 'var(--danger)' : diff===0 ? 'var(--warn)' : 'var(--text-faint)';
        html += '<div class="group-heading"><span class="stripe" style="background:'+stripe+'"></span>'+fmtDate(lastDate)+'</div>';
      }
      html += calListRowHtml(it);
    });
    return html;
  }

  function calListRowHtml(it, opts){
    opts = opts || {};
    var col = classColor(it.classId) || 'var(--none)';
    var cls = classById(it.classId);
    var st = statusOf(it);
    var urgencyClass = st==='overdue' ? 'overdue' : (st==='today' ? 'today' : '');
    return '<div class="todo-row" data-action="open-item-detail" data-id="'+it.id+'" style="cursor:pointer;">'
      + '<input type="checkbox" class="check" data-action="toggle-item" data-id="'+it.id+'" '+(it.status==='done'?'checked':'')+'>'
      + '<span class="dot" style="--c:'+col+'"></span>'
      + '<div class="row-main">'
      + '<div class="row-title'+(it.status==='done'?' done':'')+'">'+escapeHtml(it.title)+'</div>'
      + '<div class="row-meta">'
      + (cls ? '<span class="class-chip" style="--c:'+col+'">'+escapeHtml(cls.code)+'</span>' : '<span class="class-chip">General</span>')
      + '<span class="type-badge">'+(TYPE_LABELS[it.type]||'Other')+'</span>'
      + (it.dueTime ? '<span class="due-label mono">'+fmtTime(it.dueTime)+'</span>' : '')
      + '<span class="due-label '+urgencyClass+'">'+(it.status==='done'?'Completed':urgencyLabel(it.dueDate))+'</span>'
      + '</div></div>'
      + (opts.withGrade
          ? '<div class="row-grades">'
            + '<div class="row-grade-cell"><span class="row-grade-lbl">Weight</span>'+inlineNumCell(it, 'weight')+'</div>'
            + '<div class="row-grade-cell"><span class="row-grade-lbl">Grade</span>'+inlineNumCell(it, 'score')+'</div>'
            + '</div>'
          : '')
      + '</div>';
  }

  // ---------------- To-Do ----------------
  function todoRowHtml(it, compact){
    var col = classColor(it.classId) || 'var(--none)';
    var cls = classById(it.classId);
    var st = statusOf(it);
    var dueTxt = it.dueDate
      ? fmtDate(it.dueDate) + (it.dueTime ? ' · '+fmtTime(it.dueTime) : '') + (it.status!=='done' ? ' · '+urgencyLabel(it.dueDate) : '')
      : 'No due date';
    var dueClass = st==='overdue' ? 'overdue' : (st==='today' ? 'today' : '');

    var subtasksBlock = '';
    var progressChip = '';
    if(!compact && it.subtasks && it.subtasks.length){
      var doneCount = it.subtasks.filter(function(s){ return s.done; }).length;
      var expanded = expandedItems.has(it.id);
      progressChip = '<span class="subtask-progress" data-action="toggle-expand" data-id="'+it.id+'">'+doneCount+'/'+it.subtasks.length+' steps '+(expanded?'▾':'▸')+'</span>';
      if(expanded){
        subtasksBlock = '<div class="subtask-list">' + it.subtasks.map(function(s){
          return '<label><input type="checkbox" data-action="toggle-subtask" data-id="'+it.id+'" data-sub="'+s.id+'" '+(s.done?'checked':'')+'><span'+(s.done?' style="text-decoration:line-through;color:var(--text-faint);"':'')+'>'+escapeHtml(s.title)+'</span></label>';
        }).join('') + '</div>';
      }
    }
    var rowClass = (compact?'agenda-row':'todo-row') + (subtasksBlock ? ' has-open-subtasks' : '');

    return '<div class="'+rowClass+'">'
      + (compact ? '' : '<input type="checkbox" class="check" data-action="toggle-item" data-id="'+it.id+'" '+(it.status==='done'?'checked':'')+'>')
      + '<span class="dot" style="--c:'+col+'"></span>'
      + '<div class="row-main">'
      + '<div class="row-title'+(it.status==='done'?' done':'')+'">'+escapeHtml(it.title)+'</div>'
      + '<div class="row-meta">'
      + (cls ? '<span class="class-chip" style="--c:'+col+'">'+escapeHtml(cls.code)+'</span>' : '<span class="class-chip">General</span>')
      + '<span class="type-badge">'+(TYPE_LABELS[it.type]||'Other')+'</span>'
      + '<span class="due-label '+dueClass+'">'+dueTxt+'</span>'
      + progressChip
      + '</div></div>'
      + (compact ? '' : '<div class="row-actions"><button class="btn ghost" data-action="open-edit-item" data-id="'+it.id+'">Edit</button><button class="btn ghost" data-action="delete-item" data-id="'+it.id+'">✕</button></div>')
      + '</div>'
      + subtasksBlock;
  }

  // ---------------- Assignments ----------------
  var asgView = 'all';
  var asgFilter = 'all';
  var asgSearch = '';
  var asgSort = { key:'dueDate', dir:'asc' };
  var asgPage = 1;
  var asgSelected = new Set();
  var asgCollapsed = new Set();
  var ASG_PAGE_SIZE = 12;

  function asgMatchesFilter(it){
    var k = workStatusKey(it);
    if(asgFilter==='all') return true;
    if(asgFilter==='completed') return k==='done';
    if(asgFilter==='overdue') return k==='overdue';
    // the remaining date filters are about work still to do
    if(it.status==='done') return false;
    if(asgFilter==='today') return it.dueDate && diffDaysFromToday(it.dueDate)===0;
    if(asgFilter==='week'){ if(!it.dueDate) return false; var d=diffDaysFromToday(it.dueDate); return d>=0 && d<=7; }
    if(asgFilter==='upcoming') return it.dueDate && diffDaysFromToday(it.dueDate) > 0;
    return true;
  }
  function asgMatchesSearch(it){
    if(!asgSearch) return true;
    var q = asgSearch.toLowerCase();
    var cls = classById(it.classId);
    return ((it.title||'')+' '+(it.notes||'')+' '+(cls?cls.code+' '+cls.name:'')).toLowerCase().indexOf(q) >= 0;
  }
  function asgFiltered(){
    return items.filter(function(it){ return asgMatchesFilter(it) && asgMatchesSearch(it); });
  }
  function asgSorted(list){
    var k = asgSort.key, dir = asgSort.dir==='desc' ? -1 : 1;
    return list.slice().sort(function(a,b){
      var av, bv;
      if(k==='title'){ av=(a.title||'').toLowerCase(); bv=(b.title||'').toLowerCase(); }
      else if(k==='course'){ var ca=classById(a.classId), cb=classById(b.classId); av=(ca?ca.code:'zzz').toLowerCase(); bv=(cb?cb.code:'zzz').toLowerCase(); }
      else if(k==='type'){ av=a.type||''; bv=b.type||''; }
      else if(k==='status'){ av=workStatusKey(a); bv=workStatusKey(b); }
      else if(k==='weight'){ var wa=itemEffectiveWeight(a), wb=itemEffectiveWeight(b); av=(wa==null?-1:wa); bv=(wb==null?-1:wb); }
      else if(k==='score'){ av=(a.score==null?-1:Number(a.score)); bv=(b.score==null?-1:Number(b.score)); }
      else { av=a.dueDate||'9999-99-99'; bv=b.dueDate||'9999-99-99'; }
      if(av<bv) return -1*dir;
      if(av>bv) return 1*dir;
      return 0;
    });
  }

  function asgSubtitle(it){
    var n = (it.notes||'').split('\n')[0].trim();
    return n ? escapeHtml(n.slice(0,60)) + (n.length>60?'…':'') : '';
  }

  function asgHeadCell(key, label, extraClass){
    var active = asgSort.key===key;
    var arrow = active ? (asgSort.dir==='asc' ? ' ↑' : ' ↓') : '';
    return '<button type="button" class="asg-th'+(active?' active':'')+(extraClass?' '+extraClass:'')+'" data-action="asg-sort" data-key="'+key+'">'+label+arrow+'</button>';
  }

  function asgRowHtml(it, opts){
    opts = opts || {};
    var cls = classById(it.classId);
    var col = cls ? cls.color : 'var(--none)';
    var overdue = workStatusKey(it)==='overdue';
    var sub = asgSubtitle(it);
    var cells = '<label class="asg-check"><input type="checkbox" data-action="asg-select" data-id="'+it.id+'"'+(asgSelected.has(it.id)?' checked':'')+'></label>'
      + '<div class="asg-cell asg-name" data-action="open-item-detail" data-id="'+it.id+'">'
        + '<div class="asg-title">'+escapeHtml(it.title||'Untitled')+'</div>'
        + (sub ? '<div class="asg-sub">'+sub+'</div>' : '')
      + '</div>';
    if(!opts.hideCourse){
      cells += '<div class="asg-cell asg-course asg-col-course">'+(cls
        ? '<span class="dot" style="--c:'+col+'"></span><span>'+escapeHtml(cls.code||cls.name)+'</span>'
        : '<span class="cp-dim">General</span>')+'</div>';
    }
    cells += '<div class="asg-cell asg-due asg-col-due'+(overdue?' is-over':'')+'">'+(it.dueDate?fmtDateShort(it.dueDate)+', '+parseISODate(it.dueDate).getFullYear():'<span class="cp-dim">No date</span>')+'</div>'
      + '<div class="asg-cell asg-col-type">'+typePillHtml(it.type)+'</div>'
      + '<div class="asg-cell asg-col-status">'+statusPillHtml(it)+'</div>'
      + '<div class="asg-cell asg-weight asg-col-weight">'+inlineNumCell(it, 'weight')+'</div>';
    if(opts.withGrade){
      cells += '<div class="asg-cell asg-grade asg-col-grade">'+inlineNumCell(it, 'score')+'</div>';
    }
    cells += '<button type="button" class="btn ghost asg-row-menu" data-action="open-edit-item" data-id="'+it.id+'" title="Edit">'+DOTS+'</button>';
    return '<div class="asg-row'+(opts.withGrade?' has-grade':'')+(opts.hideCourse?' no-course':'')+'">'+cells+'</div>';
  }

  function asgTableHtml(){
    var list = asgSorted(asgFiltered());
    var total = list.length;
    var pages = Math.max(1, Math.ceil(total/ASG_PAGE_SIZE));
    if(asgPage > pages) asgPage = pages;
    var slice = list.slice((asgPage-1)*ASG_PAGE_SIZE, asgPage*ASG_PAGE_SIZE);

    if(total===0){
      return '<div class="card"><div class="empty" style="border:none;box-shadow:none;background:transparent;">No assignments match this filter.</div></div>';
    }
    var head = '<div class="asg-row asg-head has-grade">'
      + '<span class="asg-check"></span>'
      + asgHeadCell('title','Assignment')
      + asgHeadCell('course','Course','asg-col-course')
      + asgHeadCell('dueDate','Due Date','asg-col-due')
      + asgHeadCell('type','Type','asg-col-type')
      + asgHeadCell('status','Status','asg-col-status')
      + asgHeadCell('weight','Weight','asg-weight asg-col-weight')
      + asgHeadCell('score','Grade','asg-grade asg-col-grade')
      + '<span></span></div>';
    var body = slice.map(function(it){ return asgRowHtml(it, {withGrade:true}); }).join('');
    var pager = '';
    if(pages > 1){
      var btns = '';
      for(var i=1;i<=pages;i++){
        btns += '<button type="button" class="asg-page'+(i===asgPage?' active':'')+'" data-action="asg-page" data-page="'+i+'">'+i+'</button>';
      }
      pager = '<div class="asg-pager">'
        + '<button type="button" class="asg-page" data-action="asg-page" data-page="'+Math.max(1,asgPage-1)+'">‹</button>'
        + btns
        + '<button type="button" class="asg-page" data-action="asg-page" data-page="'+Math.min(pages,asgPage+1)+'">›</button></div>';
    }
    return '<div class="card asg-card">'+head+body
      + '<div class="asg-foot"><span class="hint">'+total+' assignment'+(total===1?'':'s')+'</span>'+pager+'</div></div>';
  }

  function asgByClassHtml(){
    var list = asgSorted(asgFiltered());
    if(list.length===0){
      return '<div class="card"><div class="empty" style="border:none;box-shadow:none;background:transparent;">No assignments match this filter.</div></div>';
    }
    var byClass = {};
    list.forEach(function(it){ var k = it.classId || '__general__'; (byClass[k] = byClass[k] || []).push(it); });
    var order = classes.filter(function(c){ return byClass[c.id]; });
    var html = '';
    order.forEach(function(c){
      var rows = byClass[c.id];
      var collapsed = asgCollapsed.has(c.id);
      html += '<div class="asg-group" style="--c:'+c.color+'">'
        + '<div class="asg-group-head" data-action="asg-toggle-group" data-id="'+c.id+'">'
        + '<span class="asg-group-code">'+escapeHtml(c.code||'')+'</span>'
        + '<span class="asg-group-name">'+escapeHtml(c.name||'')+'</span>'
        + '<span class="asg-group-count">'+rows.length+'</span>'
        + '<span class="asg-group-chev">'+(collapsed?'⌄':'⌃')+'</span></div>';
      if(!collapsed){
        html += '<div class="asg-group-body">'
          + '<div class="asg-row asg-head no-course"><span class="asg-check"></span>'
          + asgHeadCell('title','Assignment') + asgHeadCell('dueDate','Due Date','asg-col-due')
          + asgHeadCell('type','Type','asg-col-type') + asgHeadCell('status','Status','asg-col-status')
          + asgHeadCell('weight','Weight','asg-weight asg-col-weight')
          + asgHeadCell('score','Grade','asg-grade asg-col-grade') + '<span></span></div>'
          + rows.map(function(it){ return asgRowHtml(it, {hideCourse:true, withGrade:true}); }).join('')
          + '</div>';
      }
      html += '</div>';
    });
    if(byClass['__general__']){
      html += '<div class="asg-group" style="--c:var(--none)"><div class="asg-group-head"><span class="asg-group-code">General</span>'
        + '<span class="asg-group-count">'+byClass['__general__'].length+'</span></div>'
        + '<div class="asg-group-body">'+byClass['__general__'].map(function(it){ return asgRowHtml(it, {hideCourse:true, withGrade:true}); }).join('')+'</div></div>';
    }
    return html;
  }

  function viewAssignments(){
    if(items.length===0){
      return '<div class="empty">Nothing tracked yet.'
        + (termLocked ? '' : '<div><button class="btn primary" data-action="open-add-item">+ Add your first assignment</button></div>')
        + '</div>';
    }
    var tabs = '<div class="seg-tabs">'
      + '<button type="button" class="seg-tab'+(asgView==='all'?' active':'')+'" data-action="asg-view" data-view="all">All Assignments</button>'
      + '<button type="button" class="seg-tab'+(asgView==='byclass'?' active':'')+'" data-action="asg-view" data-view="byclass">By Class</button>'
      + '</div>';
    var toolbar = '<div class="asg-toolbar">'+tabs
      + '<div class="asg-toolbar-right">'
      + '<div class="input-search"><span class="ic" data-icon="search"></span>'
      + '<input type="text" id="asg-search" placeholder="Search assignments..." value="'+escapeHtml(asgSearch)+'"></div>'
      + (termLocked ? '' : '<button type="button" class="btn primary" data-action="open-add-item">+ Add assignment</button>')
      + '</div></div>';

    var filters = [['all','All'],['today','Today'],['week','This Week'],['upcoming','Upcoming'],['overdue','Overdue'],['completed','Completed']];
    var filterRow = '<div class="asg-filters">'+filters.map(function(f){
      return '<button type="button" class="asg-filter'+(asgFilter===f[0]?' active':'')+'" data-action="asg-filter" data-filter="'+f[0]+'">'+f[1]+'</button>';
    }).join('')+'</div>';

    var bulk = '';
    if(asgSelected.size){
      // The button follows the selection. Offering "Mark complete" for things that are
      // already complete is a button that does nothing, which reads as a broken app.
      var selected = Array.from(asgSelected).map(function(id){
        return items.find(function(i){ return i.id===id; });
      }).filter(Boolean);
      var allDone = selected.length > 0 && selected.every(function(i){ return i.status==='done'; });
      bulk = '<div class="asg-bulk"><span>'+asgSelected.size+' selected</span>'
        + '<button type="button" class="btn" data-action="asg-bulk-complete" data-undo="'+(allDone?'1':'')+'">'
        + (allDone ? 'Mark not done' : 'Mark complete') + '</button>'
        + '<button type="button" class="btn danger" data-action="asg-bulk-delete">Delete</button>'
        + '<button type="button" class="btn ghost" data-action="asg-clear-selection">Clear</button></div>';
    }

    var expandLinks = asgView==='byclass'
      ? '<div class="asg-expand"><button type="button" class="link-btn" data-action="asg-expand-all">Expand all</button>'
        + '<button type="button" class="link-btn" data-action="asg-collapse-all">Collapse all</button></div>'
      : '';

    return toolbar + filterRow + expandLinks + bulk
      + '<div id="asg-body">' + (asgView==='byclass' ? asgByClassHtml() : asgTableHtml()) + '</div>';
  }

  // ---------------- Headstart ----------------
  // Headstart is where the AI lives, and it is laid out the way the work actually
  // arrives: by class, most pressing first. Every run states what it will read and
  // what it will cost before it spends anything, and nothing it produces is written
  // into a note or an assignment unless you say so.

  var HS_TOOLS = {
    explain:    { label:'Explain the instructions', blurb:'What is actually being asked, and what is optional.' },
    rubric:     { label:'Break down the rubric',    blurb:'Criterion by criterion, and where marks get lost.' },
    concepts:   { label:'Find the key concepts',    blurb:'The terms worth knowing, defined plainly.' },
    summarize:  { label:'Summarise the material',   blurb:'The argument first, then what holds it up.' },
    outline:    { label:'Build an outline',         blurb:'The shape of the argument, section by section.' },
    study_plan: { label:'Make a study plan',        blurb:'Sessions working back from the due date.' },
    gaps:       { label:'Find the gaps',            blurb:'What your notes are missing, and what to read.' },
    draft:      { label:'Draft it',                 blurb:'A first draft to react to, not to hand in.' },
    revise:     { label:'Review my draft',          blurb:'What works, what does not, and what to change.' },
    refine:     { label:'Refine my writing',        blurb:'Clearer wording, your meaning and your voice.' }
  };
  var HS_TOOL_GROUPS = [
    { label:'Understand it', tools:['explain','rubric','concepts','summarize'] },
    { label:'Plan it',       tools:['outline','study_plan','gaps'] },
    { label:'Work on it',    tools:['draft','revise','refine'] }
  ];
  // Tools that need you to paste something in.
  var HS_NEEDS_TEXT = { revise:true, refine:true };

  var hsThreads = [];        // continuing conversations, newest first
  // null means the Headstart home screen; otherwise {kind:'thread', id} and the page
  // is given over to that piece of work.
  var hsScreen = null;
  var hsShowLater = false;   // the long tail, counted but folded away
  var hsClassId = null;      // null means every class
  var HS_VIEW_KEY = 'vesta_headstart_view';
  var hsView = (function(){
    try { return localStorage.getItem(HS_VIEW_KEY) === 'list' ? 'list' : 'cards'; }
    catch(err){ return 'cards'; }
  })();
  var hsUsage = null;        // today's spend, as reported by the server
  var hsSettings = null;
  var hsDecks = [];
  var hsQuizzes = [];
  var hsSideLoaded = false;

  /** Lower is more pressing. Days until due, pulled forward for the heavier work. */
  function hsPriority(it){
    var weight = { exam:-2.5, project:-1.5, quiz:-1, assignment:-0.5 }[it.type] || 0;
    if(!it.dueDate) return 999;
    var days = Math.round((new Date(it.dueDate+'T12:00:00') - new Date()) / 86400000);
    return days + weight;
  }

  function hsOpenItems(classId){
    return items.filter(function(it){
      return it.status!=='done' && (!classId || it.classId===classId);
    }).sort(function(a,b){ return hsPriority(a) - hsPriority(b); });
  }

  /** Classes with something open, most pressing first; then the quiet ones. */
  function hsClassOrder(){
    return classes.slice().sort(function(a,b){
      var pa = hsOpenItems(a.id), pb = hsOpenItems(b.id);
      var sa = pa.length ? hsPriority(pa[0]) : 9999;
      var sb = pb.length ? hsPriority(pb[0]) : 9999;
      if(sa !== sb) return sa - sb;
      return (a.code||a.name||'').localeCompare(b.code||b.name||'');
    });
  }

  /** Settings, decks and quizzes are only needed on this page, so they load with it. */
  function hsLoadSide(){
    return Promise.all([
      apiGet('/api/ai/settings').catch(function(){ return null; }),
      apiGet('/api/decks').catch(function(){ return []; }),
      apiGet('/api/quizzes').catch(function(){ return []; }),
      apiGet('/api/threads').catch(function(){ return []; })
    ]).then(function(r){
      if(r[0]){ hsSettings = r[0]; hsUsage = r[0].usage; }
      hsDecks = r[1] || [];
      hsQuizzes = r[2] || [];
      hsThreads = r[3] || [];
      hsSideLoaded = true;
      // Study reads the same sets, so it needs the repaint too; without it the section
      // renders its empty state once and never corrects itself.
      if(activeTab==='headstart' || activeTab==='study'){ renderView(); paintIcons(); }
    });
  }

  function hsSpendChipHtml(){
    if(!hsSettings) return '';
    var spent = (hsUsage && hsUsage.usd) || 0;
    var cap = hsSettings.daily_cap_usd || 0;
    var pct = cap > 0 ? Math.min(100, Math.round(100*spent/cap)) : 0;
    var tone = pct >= 100 ? ' full' : (pct >= 70 ? ' warm' : '');
    return '<button type="button" class="hs-spend'+tone+'" data-action="hs-open-settings" '
      + 'title="What Headstart has spent today. Click to change the limit.">'
      + '<span>$'+spent.toFixed(2)+' of $'+cap.toFixed(2)+' today</span>'
      + '<span class="hs-meter"><i style="width:'+pct+'%"></i></span></button>';
  }

  function hsViewToggleHtml(){
    return '<div class="hs-viewswitch">'
      + [['cards','Cards'],['list','List']].map(function(o){
          return '<button type="button" class="hs-viewbtn'+(hsView===o[0]?' active':'')+'" '
            + 'data-action="hs-view" data-v="'+o[0]+'">'+o[1]+'</button>';
        }).join('')
      + '</div>';
  }

  function hsClassPillsHtml(){
    if(classes.length < 2) return '<span></span>';
    var all = '<button type="button" class="nt-class-pill'+(hsClassId?'':' active')+'" '
      + 'data-action="hs-pick-class" data-id="">All classes</button>';
    return '<div class="hs-pills" style="margin:0;">' + all + hsClassOrder().map(function(c){
      var n = hsOpenItems(c.id).length;
      return '<button type="button" class="nt-class-pill'+(hsClassId===c.id?' active':'')+'" '
        + 'data-action="hs-pick-class" data-id="'+c.id+'">'
        + '<span class="dot" style="--c:'+(c.color||'var(--none)')+'"></span>'
        + escapeHtml(c.code||c.name||'')
        + (n ? '<span class="nt-count">'+n+'</span>' : '') + '</button>';
    }).join('') + '</div>';
  }

  function hsCardHtml(it){
    var col = classColor(it.classId) || 'var(--none)';
    var st = statusOf(it);
    var urgency = st==='overdue' ? 'overdue' : (st==='today' ? 'today' : '');
    var done = (it.headstarts||[]).length;
    return '<button type="button" class="hs-card" style="--c:'+col+'" '
      + 'data-action="hs-open-item" data-id="'+it.id+'">'
      + '<div class="hs-card-title">'+escapeHtml(it.title||'Untitled')+'</div>'
      + '<div class="hs-card-meta">'
      + '<span class="type-badge">'+(TYPE_LABELS[it.type]||'Other')+'</span>'
      + (it.dueDate ? '<span class="due-label '+urgency+'">'+urgencyLabel(it.dueDate)+'</span>'
                    : '<span class="due-label">No due date</span>')
      + '</div>'
      + '<div class="hs-card-foot">'
      + (done ? '<span class="hs-done">'+iconSvg('check')+done+' saved</span>' : '')
      + '<span class="hs-open" style="margin-left:auto;">Open →</span>'
      + '</div></button>';
  }

  /** The same assignment as a row. Cards suit browsing; a list suits scanning a lot at once. */
  function hsRowHtml(it){
    var col = classColor(it.classId) || 'var(--none)';
    var st = statusOf(it);
    var urgency = st==='overdue' ? 'overdue' : (st==='today' ? 'today' : '');
    var done = (it.headstarts||[]).length;
    return '<div class="todo-row hs-list-row" data-action="hs-open-item" data-id="'+it.id+'">'
      + '<span class="dot" style="--c:'+col+'"></span>'
      + '<div class="row-main">'
      + '<div class="row-title">'+escapeHtml(it.title||'Untitled')+'</div>'
      + '<div class="row-meta">'
      + '<span class="type-badge">'+(TYPE_LABELS[it.type]||'Other')+'</span>'
      + (it.dueDate ? '<span class="due-label '+urgency+'">'+urgencyLabel(it.dueDate)+'</span>'
                    : '<span class="due-label">No due date</span>')
      + (done ? '<span class="hs-done">'+iconSvg('check')+done+' saved</span>' : '')
      + '</div></div>'
      + '<span class="hs-open">Open →</span>'
      + '</div>';
  }

  /* Three labelled rows instead of one flat strip. The strip mixed assignments,
     threads, generator buttons and saved quizzes at the same visual weight, which is
     readable once you know the product and opaque before that. */
  function hsThreadRowHtml(c){
    var mine = hsThreads.filter(function(t){ return t.classId===c.id; });
    var shown = mine.slice(0, 4).map(function(t){
      return '<button type="button" class="hs-saved" data-action="hs-open-thread" data-id="'+t.id+'">'
        + '<b>'+escapeHtml(t.title||'Chat')+'</b>'
        + '<span class="hs-saved-sub">'+t.messageCount+' message'+(t.messageCount===1?'':'s')
        + (t.lastMessageAt ? ' · '+relTimeAgo(t.lastMessageAt) : ' · not started')+'</span></button>';
    }).join('');
    return '<div class="hs-row">'
      + '<div class="hs-row-label">Chats</div>'
      + '<div class="hs-row-items">'
      + '<button type="button" class="hs-study-btn primary-ish" data-action="hs-new-thread" data-class="'+c.id+'">'
        + iconSvg('plus')+'New chat</button>'
      + shown
      + (mine.length > 4
          ? '<button type="button" class="hs-study-btn" data-action="hs-all-threads" data-class="'+c.id+'">'
            + (mine.length - 4) + ' more</button>'
          : '')
      + (mine.length ? '' : '<span class="hs-row-hint">Ask Vesta about this class. It reads your '
          + 'files and notes, and remembers the conversation.</span>')
      + '</div></div>';
  }

  function hsStudyRowHtml(c){
    var decks = hsDecks.filter(function(d){ return d.classId===c.id; });
    var quizzes = hsQuizzes.filter(function(q){ return q.classId===c.id; });
    var saved = decks.slice(0,3).map(function(d){
      return '<button type="button" class="hs-saved" data-action="hs-open-deck" data-id="'+d.id+'">'
        + '<b>'+escapeHtml(d.name||'Deck')+'</b>'
        + '<span class="hs-saved-sub">'+d.cardCount+' card'+(d.cardCount===1?'':'s')
        + (d.dueCount ? ' · '+d.dueCount+' due' : '')+'</span></button>';
    }).join('') + quizzes.slice(0,3).map(function(q){
      return '<button type="button" class="hs-saved" data-action="hs-open-quiz" data-id="'+q.id+'">'
        + '<b>'+escapeHtml(q.title||'Quiz')+'</b>'
        + '<span class="hs-saved-sub">'+q.questionCount+' question'+(q.questionCount===1?'':'s')
        + (q.bestScore!=null ? ' · best '+q.bestScore+'%' : ' · not taken yet')+'</span></button>';
    }).join('');
    return '<div class="hs-row">'
      + '<div class="hs-row-label">Study</div>'
      + '<div class="hs-row-items">'
      + '<button type="button" class="hs-study-btn" data-action="hs-new-cards" data-class="'+c.id+'">'
        + iconSvg('notes')+'Make flashcards</button>'
      + '<button type="button" class="hs-study-btn" data-action="hs-new-quiz" data-class="'+c.id+'">'
        + iconSvg('check')+'Quiz me</button>'
      + '<button type="button" class="hs-study-btn" data-action="hs-new-test" data-class="'+c.id+'">'
        + iconSvg('assignments')+'Practice test</button>'
      + saved
      + '</div></div>';
  }

  /* Grouped by when, not by class.
   *
   * Class grouping is how the data is stored, not how the decision is made. With 28
   * open items in one course, four of them landing on the same day, the cluster that
   * matters is invisible inside a per-class list, and the class pills at the top
   * already filter by class, so grouping by it as well spends the page's structure
   * twice on one axis. Class survives as the dot and the code on every row.
   */
  var HS_BUCKETS = [
    { key:'week',  label:'This week',      within:7 },
    { key:'two',   label:'Next two weeks', within:21 },
    { key:'later', label:'Later',          within:Infinity }
  ];

  function hsBucketOf(it){
    if(!it.dueDate) return 'later';
    var d = diffDaysFromToday(it.dueDate);
    if(d <= 7) return 'week';
    if(d <= 21) return 'two';
    return 'later';
  }

  /** One row, carrying its class because the rows are no longer grouped by one. */
  function hsDueRowHtml(it){
    var c = classById(it.classId);
    var col = classColor(it.classId) || 'var(--none)';
    var st = statusOf(it);
    var urgency = st==='overdue' ? 'overdue' : (st==='today' ? 'today' : '');
    var done = (it.headstarts||[]).length;
    return '<div class="hs-due-row" data-action="hs-open-item" data-id="'+it.id+'">'
      + '<span class="dot" style="--c:'+col+'"></span>'
      + '<span class="hs-due-class">'+escapeHtml(c ? (c.code || c.name || '') : '')+'</span>'
      + '<span class="hs-due-title">'+escapeHtml(it.title||'Untitled')+'</span>'
      + '<span class="type-badge">'+(TYPE_LABELS[it.type]||'Other')+'</span>'
      + '<span class="due-label '+urgency+'">'+urgencyLabel(it.dueDate)+'</span>'
      + (done ? '<span class="hs-done">'+iconSvg('check')+done+' saved</span>' : '')
      + '<span class="hs-open">Open →</span>'
      + '</div>';
  }

  function hsDueSectionsHtml(){
    var open = hsOpenItems(hsClassId).slice().sort(function(a, b){
      if(!a.dueDate) return 1;
      if(!b.dueDate) return -1;
      return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
    });
    if(!open.length){
      return '<div class="empty">Nothing open. Add an assignment, or import a syllabus.</div>';
    }
    var by = { week:[], two:[], later:[] };
    open.forEach(function(it){ by[hsBucketOf(it)].push(it); });

    return HS_BUCKETS.map(function(b){
      var rows = by[b.key];
      if(!rows.length) return '';
      // "Later" is the long tail: counted and one click away rather than capped and
      // silently cut, which is what used to happen to 22 of 28 items.
      var collapsed = b.key === 'later' && !hsShowLater;
      return '<section class="hs-bucket">'
        + '<div class="hs-bucket-head">'
        + '<h3>'+escapeHtml(b.label)+'</h3>'
        + '<span class="hs-bucket-count">'+rows.length+'</span>'
        + (b.key === 'later'
            ? '<button type="button" class="hs-bucket-toggle" data-action="hs-toggle-later">'
              + (hsShowLater ? 'Hide' : 'Show') + '</button>'
            : '')
        + '</div>'
        + (collapsed ? '' : '<div class="hs-due-list">'+rows.map(hsDueRowHtml).join('')+'</div>')
        + '</section>';
    }).join('');
  }

  /** Every thread, across classes. One copy of the button, not one per course. */
  function hsThreadsSectionHtml(){
    var mine = hsClassId ? hsThreads.filter(function(t){ return t.classId===hsClassId; }) : hsThreads;
    return '<section class="hs-bucket hs-threads-sec">'
      + '<div class="hs-bucket-head"><h3>Chats</h3>'
      + (mine.length ? '<span class="hs-bucket-count">'+mine.length+'</span>' : '')+'</div>'
      + '<div class="hs-row-items">'
      + '<button type="button" class="hs-study-btn primary-ish" data-action="hs-pick-thread-class">'
        + iconSvg('plus')+'New chat</button>'
      + mine.slice(0, 6).map(function(t){
          return '<button type="button" class="hs-saved" data-action="hs-open-thread" data-id="'+t.id+'">'
            + '<span class="dot" style="--c:'+(classColor(t.classId)||'var(--none)')+'"></span>'
            + '<b>'+escapeHtml(t.title||'Chat')+'</b>'
            + '<span class="hs-saved-sub">'+t.messageCount+' message'+(t.messageCount===1?'':'s')
            + (t.lastMessageAt ? ' · '+relTimeAgo(t.lastMessageAt) : '')+'</span></button>';
        }).join('')
      + (mine.length > 6
          ? '<button type="button" class="hs-study-btn" data-action="hs-all-threads" data-class="'
            + (hsClassId||'') + '">'+(mine.length - 6)+' more</button>'
          : '')
      + (mine.length ? '' : '<span class="hs-row-hint">Ask Vesta about a course. It reads your '
          + 'files and notes, and remembers the conversation.</span>')
      + '</div></section>';
  }

  function viewHeadstart(){
    if(!hsSideLoaded) hsLoadSide();
    // Working on something takes over the page. Browsing and working were both
    // happening on one screen with panels stacked over it, which is why a thread
    // ended up with a fifth of the window.
    if(hsScreen && hsScreen.kind === 'thread') return threadScreenHtml();
    if(classes.length===0){
      return '<div class="empty">Add a class first. Headstart works from your own material, '
           + 'so it needs somewhere to read from.</div>';
    }
    // The page header already says what this is for, so the only chrome here is the
    // class filter and what the day has cost so far.
    return '<div class="hs-bar">' + hsClassPillsHtml()
      + '<div class="hs-bar-right">' + hsSpendChipHtml() + '</div></div>'
      + hsThreadsSectionHtml()
      + hsDueSectionsHtml();
  }

  // ---------------- Study ----------------
  // Its own section, because drilling and talking to your material are different
  // activities with different session shapes. A set is just terms; Flashcards, Learn
  // and Test are three ways to study the same set rather than three things you make.

  var studyScreen = null;    // null is the list of sets; {kind:'set', id} is one of them

  function studySets(){
    return hsDecks.slice().sort(function(a, b){
      return (b.dueCount||0) - (a.dueCount||0);
    });
  }

  function viewStudy(){
    if(!hsSideLoaded) hsLoadSide();
    if(studyScreen && studyScreen.kind === 'set') return setScreenHtml();
    if(studyPane === 'humanizer') return hzViewHtml();
    var sets = studySets();
    if(!sets.length){
      return studyTabsHtml() + '<div class="empty">No sets yet. Make one from a class\'s material in '
           + 'Headstart, or start an empty set here.'
           + '<div style="margin-top:14px;">'
           + '<button type="button" class="btn" data-action="study-generate">Build from my material</button> '
           + '<button type="button" class="btn primary" data-action="study-new-set">New set</button>'
           + '</div></div>';
    }
    var due = sets.reduce(function(t, d){ return t + (d.dueCount||0); }, 0);
    return studyTabsHtml() + '<div class="hs-bar">'
      + '<div class="study-summary">'
      + (due ? '<b>'+due+'</b> card'+(due===1?'':'s')+' ready to review'
             : 'Nothing due right now. Everything is scheduled ahead.')
      + '</div>'
      + '<div class="hs-bar-right">'
      + '<button type="button" class="btn" data-action="study-generate">Build from my material</button>'
      + '<button type="button" class="btn primary" data-action="study-new-set">New set</button>'
      + '</div></div>'
      + '<div class="set-grid">'
      + sets.map(function(d){
          var c = classById(d.classId);
          return '<button type="button" class="set-card" data-action="study-open-set" data-id="'+d.id+'">'
            + '<span class="dot" style="--c:'+(classColor(d.classId)||'var(--none)')+'"></span>'
            + '<span class="set-card-class">'+escapeHtml(c ? (c.code||c.name||'') : 'No class')+'</span>'
            + '<span class="set-card-name">'+escapeHtml(d.name||'Untitled set')+'</span>'
            + '<span class="set-card-meta">'+d.cardCount+' term'+(d.cardCount===1?'':'s')
            + (d.dueCount ? ' · <b>'+d.dueCount+' due</b>' : '')+'</span>'
            + '</button>';
        }).join('')
      + '</div>';
  }

  // ---------------- Study: the Humanizer ----------------
  // A second pane of Study beside the sets. It rewrites AI-sounding prose and marks each
  // habit it removed on the original, so the rewrite comes with its reasons. The prompt
  // is blader/humanizer (MIT), vendored in vendor/humanizer and sent by humanizer.py.

  var studyPane = 'sets';     // 'sets' or 'humanizer', switched by the tabs at the top of Study
  var HZ = { loaded:false, loading:false, voice:'', runs:[], maxWords:4000, promptTokens:7500,
             prices:[2, 10], confirmOverUsd:0.05,
             text:'', source:null, useVoice:true,
             busy:false, extracting:false, confirm:null,
             run:null, runLoading:false, copied:false, savedTo:null,
             pick:null };      // an open picker: {kind:'note', filter} or {kind:'thread', thread}

  var HZ_SOURCES = [['paste','Paste or type','pen'], ['note','From a note','notes'],
                    ['thread','From a chat','chat'], ['file','Upload a file','upload']];

  function hzLoad(){
    if(HZ.loading) return;
    HZ.loading = true;
    apiGet('/api/humanizer').then(function(d){
      HZ.voice = d.voice || '';
      HZ.runs = d.runs || [];
      HZ.maxWords = d.maxWords || HZ.maxWords;
      HZ.promptTokens = d.promptTokens || HZ.promptTokens;
      HZ.prices = d.prices || HZ.prices;
      HZ.confirmOverUsd = d.confirmOverUsd;
      HZ.loaded = true;
    }).catch(reportError).then(function(){
      HZ.loading = false;
      if(activeTab === 'study' && studyPane === 'humanizer'){ renderView(); paintIcons(); }
    });
  }

  function hzWords(text){ return (text||'').split(/\s+/).filter(Boolean).length; }

  /** What a pass should cost, worked out the way humanizer.py works it out. */
  function hzEstimate(text){
    var tt = Math.max(1, Math.floor((text||'').length / 4));
    var input = HZ.promptTokens + tt + Math.floor((HZ.useVoice ? HZ.voice.length : 0) / 4) + 50;
    var output = Math.floor(tt * 2.5) + 1500;
    return (input * HZ.prices[0] + output * HZ.prices[1]) / 1e6;
  }

  function studyTabsHtml(){
    return '<div class="seg-tabs study-tabs">'

  function hzViewHtml(){

    return studyTabsHtml() + hzHomeHtml();
  }

      + HZ.maxWords.toLocaleString()+' words</span>'
      + (over ? '<span class="hz-over">Too long for one pass. Run it a section at a time.</span>'
              : (n ? '<span class="hz-cost">about $'+hzEstimate(HZ.text).toFixed(2)+'</span>' : ''));

  var HZ_KIND_LABEL = { paste:'Pasted', note:'Note', thread:'Chat', file:'File' };

  function hzHistoryHtml(){
    return '<div class="tile hz-card">'
      + '<div class="hz-card-head"><h4>Past rewrites</h4>'

          ? '<div class="hz-hist-list">' + HZ.runs.map(function(r){

  /** The tells in reading order, numbered the same way in the text and in the list. */
  function hzOrderedTells(run){
    var found = (run.tells||[]).filter(function(t){ return t.start >= 0; })
      .sort(function(a, b){ return a.start - b.start; });
    var lost = (run.tells||[]).filter(function(t){ return !(t.start >= 0); });
    return found.concat(lost);
  }

  /** The original with each habit wrapped in a numbered mark. Overlaps keep the first. */
  function hzMarkedHtml(text, tells){
    // A habit inside another's quote (a dash inside a not-X-but-Y) cannot have its own
    // mark, so it borrows the one around it: hovering or jumping to it still lands.
    var spans = [];
    tells.forEach(function(t, i){
      if(!(t.start >= 0)) return;
      var end = t.start + t.quote.length;
      var host = spans.filter(function(sp){ return t.start < sp.end && end > sp.start; })[0];
      if(host) host.also.push(i);
      else spans.push({ i:i, start:t.start, end:end, also:[] });
    });
    var out = '', at = 0;
    spans.forEach(function(sp){
      out += escapeHtml(text.slice(at, sp.start))
        + '<mark class="hz-mark" data-action="hz-jump" data-hz-i="'+sp.i+'" data-to="tell"'
        + (sp.also.length ? ' data-hz-also="'+sp.also.join(' ')+'"' : '')+'>'
        + escapeHtml(text.slice(sp.start, sp.end))
        + '<sup>'+[sp.i].concat(sp.also).map(function(k){ return k+1; }).join(',')+'</sup></mark>';
      at = sp.end;
    });
    return out + escapeHtml(text.slice(at));
  }

      + '<span class="type-badge">'+tells.length+' habit'+(tells.length===1?'':'s')+' marked</span>'
      + (r.usedVoice ? '<span class="type-badge">In your voice</span>' : '')
      + '</div>'
      + '<div class="th-screen-acts">'

      + (HZ.savedTo ? 'Saved to '+escapeHtml(HZ.savedTo) : 'Save as a note')+'</button>'
      + '<button type="button" class="btn primary" data-action="hz-copy">'+(HZ.copied ? 'Copied' : 'Copy rewrite')+'</button>'
      + '</div></div>'
      + ((r.questions||[]).length
          ? '<div class="hz-questions"><h4>It needs these from you</h4>'

      + '<div class="hz-compare">'

      + '<section class="tile hz-pane"><div class="hz-pane-head"><h4>Rewrite</h4>'
      + '<span>'+hzWords(r.final).toLocaleString()+' words</span></div>'
      + '<div class="hz-prose">'+escapeHtml(r.final)+'</div></section>'
      + '</div>'
      + '<section class="hz-found"><div class="set-terms-head"><h3>What it found</h3>'
      + '<span class="hs-bucket-count">'+tells.length+'</span></div>'
      + (tells.length
          ? '<div class="hz-found-list">' + tells.map(function(t, i){
              return '<div class="hz-tell" id="hz-tell-'+i+'" data-action="hz-jump" data-hz-i="'+i+'" data-to="mark">'
                + '<span class="hz-num">'+(i+1)+'</span><div class="hz-tell-body">'
                + '<div class="hz-tell-name"><b>'+escapeHtml(t.name||'Pattern')+'</b>'
                + (t.pattern ? '<span class="hz-pat">#'+t.pattern+'</span>' : '')+'</div>'
                + '<q>'+escapeHtml(t.quote)+'</q>'
                + '<p>'+escapeHtml(t.why)+'</p></div></div>';
            }).join('') + '</div>'
          : '<div class="empty">It found nothing that reads as AI-generated, so the text is unchanged.</div>')
      + '</section>'
      + ((r.stillOff||[]).length
          ? '<section class="tile hz-card hz-still"><h4>Left on purpose</h4><ul>'
            + r.stillOff.map(function(s){ return '<li>'+escapeHtml(s)+'</li>'; }).join('')+'</ul></section>'
          : '')
      + '<p class="hz-by">The 25 patterns come from Wikipedia\'s "Signs of AI writing", by way of the open-source '
      + 'humanizer skill (blader/humanizer, MIT).</p>'
      + '</div>';
  }

  /** A note's HTML as plain paragraphs, which is what the rewrite works on. */
  function hzNoteToPlain(html){
    var d = document.createElement('div');
    d.innerHTML = html || '';
    d.querySelectorAll('br').forEach(function(el){ el.replaceWith('\n'); });
    d.querySelectorAll('li').forEach(function(el){ el.insertAdjacentText('afterbegin', '- '); el.insertAdjacentText('beforeend', '\n'); });
    d.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,blockquote,ul,ol,table').forEach(function(el){ el.insertAdjacentText('beforeend', '\n\n'); });
    return (d.textContent || '').replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  /** Plain paragraphs back into note HTML. */
  function hzPlainToHtml(text){
    return (text||'').split(/\n\s*\n/).map(function(p){
      return p.trim() ? '<p>'+escapeHtml(p.trim()).replace(/\n/g, '<br>')+'</p>' : '';
    }).join('');
  }

  /** Put new text in the box, asking first if it would replace something typed there. */
  function hzLoadText(text, source){
    var go = function(){
      HZ.text = text; HZ.source = source; HZ.confirm = null;
      renderView(); paintIcons();
      var ta = document.getElementById('hz-text'); if(ta) ta.focus();
    };
    if(HZ.text.trim() && HZ.text.trim() !== (text||'').trim()){
      return confirmAction('Replace the text in the box?', 'What is there now will be cleared.', 'Replace')
        .then(function(ok){ if(ok) go(); });
    }
    go();
  }

            return '<button type="button" class="hz-pick hz-pick-msg" data-action="hz-pick-msg" data-i="'+x.i+'">'

  /** How far along a run is. The rewrite streams in as JSON, so its length is the gauge. */
  function hzProgressHtml(){
    var p = HZ.progress || { phase:'waiting', chars:0 };
    var pct = p.phase === 'writing' ? Math.min(96, Math.max(3, Math.round(100 * p.chars / (HZ.expectChars || 1)))) : 0;
    var label = p.phase === 'writing' ? 'Writing the rewrite'
              : p.phase === 'thinking' ? 'Reading it and marking the AI habits'
              : 'Sending it over';
    return '<div class="hz-progress-head"><i class="th-spin"></i><b>'+label+'…</b>'
      + (p.phase === 'writing' ? '<span>'+pct+'%</span>' : '')+'</div>'
      + '<div class="hz-bar"><i style="width:'+(p.phase === 'writing' ? pct : (p.phase === 'thinking' ? 2 : 0))+'%"></i></div>'
      + '<div class="hz-muted">A long piece can take a few minutes. You can leave this page: '
      + 'it lands in Past rewrites when it is done.</div>';
  }

  function hzPaintProgress(){
    var el = document.getElementById('hz-progress');
    if(el) el.innerHTML = hzProgressHtml();
  }

  function hzRun(confirmed){
    if(HZ.busy) return;
    var ta = document.getElementById('hz-text');
    if(ta) HZ.text = ta.value;
    var words = hzWords(HZ.text);
    if(!words) return;
    HZ.busy = true; HZ.confirm = null;
    HZ.progress = { phase:'waiting', chars:0 };
    // the JSON that comes back: the rewrite, plus about one marked habit per 15 words
    HZ.expectChars = HZ.text.length * 1.05 + (words / 15) * 220 + 300;
    renderView(); paintIcons();
    var done = false;
    function finish(){
      HZ.busy = false;
      if(activeTab === 'study' && studyPane === 'humanizer'){ renderView(); paintIcons(); window.scrollTo(0, 0); }
    }
    fetch('/api/humanizer/run', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ text: HZ.text, source: HZ.source || { kind:'paste' },
                             useVoice: !!(HZ.voice && HZ.useVoice), confirmed: !!confirmed, stream: true }) })
      .then(function(r){
        if((r.headers.get('content-type') || '').indexOf('text/event-stream') !== 0){
          return r.json().catch(function(){ return {}; }).then(function(j){
            if(r.status === 409 || r.status === 402) HZ.confirm = j;
            else reportError(new Error(j.error || ('The rewrite failed ('+r.status+').')));
            done = true; finish();
          });
        }
        return readEventStream(r, function(name, data){
          if(name === 'progress'){ HZ.progress = data; hzPaintProgress(); return; }
          if(name === 'error'){ done = true; finish(); reportError(new Error(data.error || 'The rewrite failed.')); return; }
          if(name === 'done'){
            done = true;
            var run = data;
            HZ.runs.unshift({ id:run.id, title:run.title, sourceKind:run.sourceKind, sourceLabel:run.sourceLabel,
                              words:run.words, tellCount:run.tellCount, createdAt:run.createdAt });
            HZ.run = run; HZ.copied = false; HZ.savedTo = null;
            HZ.text = ''; HZ.source = null;
            if(hsSideLoaded) hsLoadSide();       // the spend chip should reflect this pass
            finish();
          }
        }).then(function(){
          if(!done){
            // The connection dropped. The run carries on on the server and lands in
            // Past rewrites, so say that rather than calling it a failure.
            finish();
            notify('Still working on it', 'The connection dropped, but the rewrite carries on. '
                   + 'It will be in Past rewrites in a minute or two.');
            setTimeout(function(){ HZ.loaded = false; if(activeTab === 'study' && studyPane === 'humanizer'){ renderView(); paintIcons(); } }, 60000);
          }
        });
      })
      .catch(function(err){ finish(); reportError(err); });
  }

  function setTermRowHtml(card){

  // ---------------- Learn and Test ----------------
  //
  // Both are built from the set's own terms, in the browser, so neither costs
  // anything to run: making your own cards should not put a price on studying them.
  //
  // Learn is a loop, not a quiz. A term is "learned" at level 2: recognised once from
  // four choices, then typed correctly from memory. Getting one wrong drops it to 0
  // and puts it back in the round, so the set narrows to what you do not know yet.
  // The level lives on the card in the database, so closing the tab, or picking the
  // set up on a phone, carries on where you left off.
  //
  // Test is one scored sitting: a fixed paper of mixed questions, answered in any
  // order, marked at the end. Written answers are marked leniently on purpose
  // (case, spaces and punctuation ignored) and anything it is unsure about is handed
  // back to you to mark, exactly as the AI quiz player already does.

  /** What the Learn button says: progress if there is any, what it does if not. */
  function learnSubtitle(d){
    var cards = (d.cards||[]).filter(function(c){ return !c.suspended && c.front && c.back; });
    var done = cards.filter(function(c){ return (c.learnLevel||0) >= 2; }).length;
    if(!cards.length) return 'Add a few terms and it will drill you on them.';
    if(!done) return 'Multiple choice, then typed, until you know them.';
    if(done >= cards.length) return 'Every term learned. Start again to go round once more.';
    return done + ' of ' + cards.length + ' learned so far.';
  }

  var LEARN_GOAL = 2;                 // level at which a term counts as learned
  var TEST_DEFAULT = 20;              // questions in a test, when the set is big enough

  /** Four options for one term: the right answer plus three of the set's others. */
  function studyChoices(card, pool, key){
    var right = (card[key] || '').trim();
    var others = pool.filter(function(c){
      return c.id !== card.id && (c[key] || '').trim() && (c[key] || '').trim() !== right;
    });
    var picked = [];
    var bag = others.slice();
    while(picked.length < 3 && bag.length){
      picked.push(bag.splice(Math.floor(Math.random() * bag.length), 1)[0][key]);
    }
    var opts = picked.concat([right]);
    for(var i = opts.length - 1; i > 0; i--){        // shuffle, so the answer moves
      var j = Math.floor(Math.random() * (i + 1));
      var t = opts[i]; opts[i] = opts[j]; opts[j] = t;
    }
    return opts;
  }

  /** Lenient comparison: what a person typed against what the card says. */
  function studySame(a, b){
    function flat(s){
      return (s || '').toLowerCase()
        .replace(/[‘’“”]/g, "'")
        .replace(/[^a-z0-9' ]+/g, ' ')
        .replace(/\b(a|an|the)\b/g, ' ')
        .replace(/\s+/g, ' ').trim();
    }
    var x = flat(a), y = flat(b);
    if(!x || !y) return false;
    return x === y;
  }

  function shuffled(list){
    var out = list.slice();
    for(var i = out.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = out[i]; out[i] = out[j]; out[j] = t;
    }
    return out;
  }

  function learnableCards(){
    return (FC.deck.cards || []).filter(function(c){
      return !c.suspended && (c.front || '').trim() && (c.back || '').trim();
    });
  }

  // ---- Learn ----------------------------------------------------------------

  function learnStart(){
    var cards = learnableCards();
    if(cards.length < 2){
      notify('Not enough terms yet', 'Learn needs at least two terms with both a front and a back.');
      return;
    }
    FC.learn = {
      levels: {},                 // id -> 0, 1 or 2, seeded from the server
      queue: [],
      at: 0,
      answered: null,             // {right, given, answer} while the result shows
      round: 1,
      dirty: {}
    };
    cards.forEach(function(c){ FC.learn.levels[c.id] = c.learnLevel || 0; });
    learnBuildRound();
    FC.mode = 'learn';
    renderDeck();
  }

  /** A round is up to seven terms, the least-known first. */
  function learnBuildRound(){
    var L = FC.learn;
    var pending = learnableCards().filter(function(c){ return (L.levels[c.id] || 0) < LEARN_GOAL; });
    pending.sort(function(a, b){ return (L.levels[a.id] || 0) - (L.levels[b.id] || 0); });
    L.queue = shuffled(pending.slice(0, 7));
    L.at = 0;
    L.answered = null;
  }

  function learnProgress(){
    var cards = learnableCards();
    var done = cards.filter(function(c){ return (FC.learn.levels[c.id] || 0) >= LEARN_GOAL; }).length;
    return { done: done, total: cards.length,
             pct: cards.length ? Math.round(done / cards.length * 100) : 0 };
  }

  /** Save what this round changed. One request, and nothing waits for it. */
  function learnSaveProgress(){
    var L = FC.learn;
    if(!L || !Object.keys(L.dirty).length) return;
    var levels = L.dirty;
    L.dirty = {};
    apiPost('/api/decks/' + FC.deck.id + '/learn', { levels: levels })
      .then(function(r){
        // Keep the card rows honest, so leaving Learn shows the same progress.
        (FC.deck.cards || []).forEach(function(c){
          if(r && r.levels && r.levels[c.id] != null) c.learnLevel = r.levels[c.id];
        });
      })
      .catch(function(){ /* a lost round of progress is not worth an error dialog */ });
  }

  function learnAnswer(given){
    var L = FC.learn;
    if(L.answered) return;
    var card = L.queue[L.at];
    if(!card) return;
    var level = L.levels[card.id] || 0;
    var right = studySame(given, card.back);
    if(right){
      L.levels[card.id] = Math.min(LEARN_GOAL, level + 1);
    } else {
      L.levels[card.id] = 0;
      L.queue.push(card);                 // it comes back before the round ends
    }
    L.dirty[card.id] = L.levels[card.id];
    L.answered = { right: right, given: given, answer: card.back };
    renderDeck();
  }

  function learnNext(){
    var L = FC.learn;
    L.answered = null;
    L.at += 1;
    if(L.at >= L.queue.length){
      learnSaveProgress();
      var p = learnProgress();
      if(p.done >= p.total){ FC.mode = 'learn-done'; renderDeck(); return; }
      L.round += 1;
      learnBuildRound();
    }
    renderDeck();
  }

  function learnHtml(){
    var L = FC.learn;
    var p = learnProgress();
    var card = L.queue[L.at];
    if(!card){ return learnDoneHtml(); }
    var level = L.levels[card.id] || 0;
    var typed = level >= 1;                 // recognised already: now type it
    var head = '<div class="qz-head"><div>'
      + '<div class="qz-progress">Round ' + L.round + ' · ' + (L.at + 1) + ' of ' + L.queue.length + '</div>'
      + '</div><div class="qz-progress">' + p.done + ' of ' + p.total + ' learned</div></div>'
      + '<div class="learn-bar"><i style="width:' + p.pct + '%"></i></div>';

    var body;
    if(L.answered){
      var tone = L.answered.right ? 'right' : 'wrong';
      body = '<div class="qz-q">'
        + '<div class="qz-q-num">' + (typed ? 'Typed answer' : 'Multiple choice') + '</div>'
        + '<div class="qz-prompt">' + escapeHtml(card.front || '') + '</div>'
        + '<div class="qz-answer ' + tone + '">'
        + (L.answered.right ? '<b>Right.</b> ' : '<b>Not quite.</b> ')
        + escapeHtml(card.back || '')
        + (L.answered.right || !L.answered.given ? ''
            : '<div class="learn-given">You said: ' + escapeHtml(L.answered.given) + '</div>')
        + '</div>'
        + '<div class="hs-runbar"><button type="button" class="btn primary" data-action="learn-next">Continue</button>'
        + '<span class="hs-cost">Enter</span></div>'
        + '</div>';
    } else if(typed){
      body = '<div class="qz-q">'
        + '<div class="qz-q-num">Type the answer</div>'
        + '<div class="qz-prompt">' + escapeHtml(card.front || '') + '</div>'
        + '<input type="text" class="learn-input" id="learn-input" autocomplete="off" '
        + 'placeholder="What does it mean?" data-action="learn-typing">'
        + '<div class="hs-runbar"><button type="button" class="btn primary" data-action="learn-submit">Check</button>'
        + '<span class="hs-cost">Enter to check · <button type="button" class="linkish" data-action="learn-dontknow">I do not know</button></span>'
        + '</div></div>';
    } else {
      var opts = studyChoices(card, learnableCards(), 'back');
      body = '<div class="qz-q">'
        + '<div class="qz-q-num">Pick the answer</div>'
        + '<div class="qz-prompt">' + escapeHtml(card.front || '') + '</div>'
        + opts.map(function(o, i){
            return '<label class="qz-choice"><input type="radio" name="learn-opt" '
              + 'data-action="learn-pick" value="' + escapeHtml(o) + '">'
              + '<span><b>' + (i + 1) + '.</b> ' + escapeHtml(o) + '</span></label>';
          }).join('')
        + '<div class="hs-runbar"><span class="hs-cost">Press 1 to 4, or click</span></div>'
        + '</div>';
    }
    return head + body;
  }

  function learnDoneHtml(){
    var p = learnProgress();
    return '<div class="qz-score"><div class="qz-pct">' + p.done + '/' + p.total + '</div>'
      + '<div class="qz-sub">Every term in this set is learned. Come back tomorrow and see what sticks.</div>'
      + '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">'
      + '<button type="button" class="btn" data-action="fc-list">Back to the set</button>'
      + '<button type="button" class="btn primary" data-action="learn-restart">Start again</button>'
      + '</div></div>';
  }

  // ---- Test -----------------------------------------------------------------

  function testStart(){
    var cards = learnableCards();
    if(cards.length < 2){
      notify('Not enough terms yet', 'A test needs at least two terms with both a front and a back.');
      return;
    }
    var picked = shuffled(cards).slice(0, Math.min(TEST_DEFAULT, cards.length));
    FC.test = {
      questions: picked.map(function(c, i){
        // Written questions need something to type; true/false and multiple choice
        // need at least one other term to draw a wrong answer from.
        var kind = cards.length < 4 ? (i % 2 ? 'written' : 'truefalse')
                 : ['choice', 'choice', 'written', 'truefalse'][i % 4];
        var q = { id: c.id, kind: kind, prompt: c.front || '', answer: c.back || '' };
        if(kind === 'choice'){ q.options = studyChoices(c, cards, 'back'); }
        if(kind === 'truefalse'){
          var wrong = shuffled(cards.filter(function(x){ return x.id !== c.id; }))[0];
          q.claim = (Math.random() < 0.5 || !wrong) ? c.back : wrong.back;
          q.truth = q.claim === c.back;
        }
        return q;
      }),
      answers: {},
      marks: null,
      submitted: false
    };
    FC.mode = 'test';
    renderDeck();
  }

  function testSubmit(){
    var T = FC.test;
    var marks = {};
    T.questions.forEach(function(q){
      var given = T.answers[q.id];
      if(q.kind === 'truefalse'){
        marks[q.id] = given == null ? false : (String(given) === String(q.truth));
      } else if(q.kind === 'choice'){
        marks[q.id] = studySame(given, q.answer);
      } else {
        // Written: right if it matches, otherwise handed back for you to mark, since
        // a phrase can be correct without being the words on the card.
        marks[q.id] = studySame(given, q.answer) ? true : null;
      }
    });
    T.marks = marks;
    T.submitted = true;
    renderDeck();
  }

  function testScore(){
    var T = FC.test;
    var right = 0, marked = 0;
    T.questions.forEach(function(q){
      var m = T.marks[q.id];
      if(m === null) return;              // still yours to mark
      marked += 1;
      if(m) right += 1;
    });
    return { right: right, marked: marked, total: T.questions.length,
             pct: marked ? Math.round(right / marked * 100) : 0 };
  }

  function testHtml(){
    var T = FC.test;
    var answered = T.questions.filter(function(q){ return T.answers[q.id] != null && T.answers[q.id] !== ''; }).length;
    var head = '<div class="qz-head"><div class="qz-progress">'
      + (T.submitted ? 'Marked' : answered + ' of ' + T.questions.length + ' answered')
      + '</div>'
      + (T.submitted ? '' : '<button type="button" class="btn primary" data-action="test-submit">Finish and mark it</button>')
      + '</div>';

    var body = T.questions.map(function(q, i){
      var given = T.answers[q.id];
      var mark = T.submitted ? T.marks[q.id] : undefined;
      var inner = '<div class="qz-q-num">Question ' + (i + 1) + '</div>';
      if(q.kind === 'truefalse'){
        inner += '<div class="qz-prompt">' + escapeHtml(q.prompt) + ' — "' + escapeHtml(q.claim) + '"</div>'
          + [['true', 'True'], ['false', 'False']].map(function(o){
              var picked = String(given) === o[0];
              var tone = '';
              if(T.submitted && picked) tone = mark ? ' right' : ' wrong';
              return '<label class="qz-choice' + (picked ? ' picked' : '') + tone + '">'
                + '<input type="radio" name="t-' + q.id + '" data-action="test-pick" data-id="' + q.id + '"'
                + ' value="' + o[0] + '"' + (picked ? ' checked' : '') + (T.submitted ? ' disabled' : '') + '>'
                + '<span>' + o[1] + '</span></label>';
            }).join('');
      } else if(q.kind === 'choice'){
        inner += '<div class="qz-prompt">' + escapeHtml(q.prompt) + '</div>'
          + (q.options || []).map(function(o){
              var picked = given === o;
              var tone = '';
              if(T.submitted){
                if(o === q.answer) tone = ' right';
                else if(picked) tone = ' wrong';
              }
              return '<label class="qz-choice' + (picked ? ' picked' : '') + tone + '">'
                + '<input type="radio" name="t-' + q.id + '" data-action="test-pick" data-id="' + q.id + '"'
                + ' value="' + escapeHtml(o) + '"' + (picked ? ' checked' : '') + (T.submitted ? ' disabled' : '') + '>'
                + '<span>' + escapeHtml(o) + '</span></label>';
            }).join('');
      } else {
        inner += '<div class="qz-prompt">' + escapeHtml(q.prompt) + '</div>'
          + '<textarea class="qz-written" data-action="test-write" data-id="' + q.id + '"'
          + (T.submitted ? ' disabled' : '') + ' placeholder="In your own words">'
          + escapeHtml(given || '') + '</textarea>';
      }
      if(T.submitted){
        var verdict = mark === true ? '<span class="qz-verdict right">Right</span>'
                    : mark === false ? '<span class="qz-verdict wrong">Wrong</span>'
                    : '<span class="qz-verdict unmarked">Your call</span>';
        inner += '<div class="qz-answer"><b>Answer:</b> ' + escapeHtml(q.answer) + '</div>';
        inner += '<div class="qz-mark">' + verdict
          + (mark === null
              ? '<span>Did you get it?</span>'
                + '<button type="button" class="btn ghost" data-action="test-self" data-id="' + q.id + '" data-v="1">Yes</button>'
                + '<button type="button" class="btn ghost" data-action="test-self" data-id="' + q.id + '" data-v="0">No</button>'
              : '')
          + '</div>';
      }
      return '<div class="qz-q">' + inner + '</div>';
    }).join('');

    var foot = '';
    if(T.submitted){
      var sc = testScore();
      foot = '<div class="qz-score"><div class="qz-pct">' + sc.pct + '%</div>'
        + '<div class="qz-sub">' + sc.right + ' of ' + sc.marked + ' marked right'
        + (sc.marked < sc.total ? ' · ' + (sc.total - sc.marked) + ' still yours to mark' : '')
        + '</div>'
        + '<div style="margin-top:16px;display:flex;gap:8px;justify-content:center;">'
        + '<button type="button" class="btn" data-action="fc-list">Back to the set</button>'
        + '<button type="button" class="btn primary" data-action="test-restart">Take it again</button>'
        + '</div></div>';
    }
    return head + body + foot;
  }

  // ---------------- Notes (global) ----------------
  function viewNotesPage(){
    // with no classes the Inbox is the only place a note can go, so open it directly
    if(classes.length===0 && notesClassId!==INBOX_ID) notesClassId = INBOX_ID;
    if(!notesClassId) return notesAllViewHtml();
    return notesWorkspaceHtml(classById(notesClassId), { withSwitcher:true });
  }

  /** Every note you have, grouped by class. This is what "All Notes" goes back to. */
  function notesAllViewHtml(){
    var q = (notesSearch || '').trim().toLowerCase();
    var everything = [];
    classes.concat([inboxClass()]).forEach(function(c){
      (c.notesList || []).forEach(function(n){
        if(n.deletedAt) return;
        everything.push({ note:n, cls:c });
      });
    });

    var html = '<div class="nt-all-head">'
      + '<span class="nt-search-box nt-all-search"><span class="ic">'+iconSvg('search')+'</span>'
      + '<input type="search" id="nt-all-search" class="nt-search" placeholder="Search every note…" value="'
        + escapeHtml(notesSearch||'') + '"></span>'
      + '<button type="button" class="btn primary" data-action="notes-new-in" data-class="'+INBOX_ID+'"'
        + ' title="Write it now, file it under a class later">＋ Quick note</button>'
      + '<button type="button" class="btn ghost" data-action="note-trash-open" title="Trash">'
        + iconSvg('trash')+'Trash</button>'
      + '</div>';

    if(q){
      var hits = everything.filter(function(x){
        return (x.note.title||'').toLowerCase().indexOf(q) > -1
            || stripHtml(x.note.text||'').toLowerCase().indexOf(q) > -1;
      });
      html += '<div class="nt-found">'+hits.length+' match'+(hits.length===1?'':'es')+' across '
        + classes.length+' class'+(classes.length===1?'':'es')+'</div>';
      html += hits.length
        ? '<div class="nt-card-grid">'+hits.map(function(x){ return noteCardHtml(x.note, x.cls, q); }).join('')+'</div>'
        : '<div class="empty">Nothing matched. Try a word from inside the note.</div>';
      return html;
    }

    var waiting = (inbox.notesList||[]).filter(function(n){ return !n.deletedAt; })
      .sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });
    if(waiting.length){
      html += '<section class="block">'
        + '<div class="card-head"><h2><span class="dot" style="--c:var(--none);margin-right:8px;"></span>Inbox</h2>'
        + '<a class="see-all" href="#" data-action="notes-pick-class" data-id="'+INBOX_ID+'">'
        + 'Open ('+waiting.length+') →</a></div>'

        + 'Open one and use … then File under to put it away.</div>'
        + '<div class="nt-card-grid">'+waiting.slice(0,6).map(function(n){ return noteCardHtml(n, inboxClass()); }).join('')
        + '</div></section>';

    var flagged = everything.filter(function(x){ return x.note.pinned || x.note.starred; });
    if(flagged.length){

        + '<div class="nt-card-grid">'

        .sort(function(a,b){ return (b.updatedAt||'').localeCompare(a.updatedAt||''); });

        + '<div class="card-head"><h2>'
        + '<span class="dot" style="--c:'+(c.color||'var(--none)')+';margin-right:8px;"></span>'
        + escapeHtml(c.code||c.name||'')+'</h2>'

            ? '<div class="nt-card-grid">'+mine.slice(0,6).map(function(n){ return noteCardHtml(n, c); }).join('')+'</div>'

              + '＋ Start one</button></div>')

    return html;

  // ---------------- Files (global) ----------------
  function noteRowHtml(n, classId){

  .preview-fallback{ padding:50px 20px; text-align:center; color:var(--text-muted); font-size:13px; }

  /* ---------- Letter-grade scale badges (misc) ---------- */
  .empty-icon{ font-size:22px; margin-bottom:8px; opacity:.6; }

  /* ---------- Lock In / focus timer ---------- */
  /* Default look is plain Vesta: app surfaces, app buttons, app text. A background scene is
     opt-in, and only then does the timer switch to the light-on-dark immersive treatment. */
  .fx-card{ --fx-accent:var(--accent); display:flex; flex-direction:column; align-items:center;
    gap:18px; padding:26px 22px; margin-bottom:22px; }
  #focus-timer-host{ display:flex; flex-direction:column; align-items:center; gap:18px; width:100%; }

  .fx-modes .seg-tab{ display:flex; align-items:center; gap:8px; }
  .fx-tab-n{ background:var(--surface-3); color:var(--text-muted); border-radius:var(--r-pill);
    font-size:11.5px; font-weight:700; min-width:20px; padding:1px 6px; text-align:center; }
  .seg-tab.active .fx-tab-n{ background:var(--fx-accent); color:#fff; }

  .fx-ring-wrap{ position:relative; width:240px; height:240px; }
  .fx-ring{ position:absolute; inset:0; width:100%; height:100%; }
  .fx-ring-track{ stroke:var(--surface-3); }
  .fx-center{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:10px; }
  .fx-time{ font-size:52px; font-weight:700; letter-spacing:-1.5px; line-height:1;
    font-variant-numeric:tabular-nums; color:var(--text); }
  .fx-phase{ display:flex; align-items:center; gap:7px; background:var(--surface-2);
    border-radius:var(--r-pill); padding:5px 13px; font-size:12.5px; color:var(--text-muted); }
  .fx-phase-dot{ width:7px; height:7px; border-radius:50%; background:var(--fx-accent); }

  .fx-task{ display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--text-muted); min-height:34px; }
  .fx-task-select{ width:auto; min-width:230px; }

  .fx-dots{ display:flex; gap:7px; }
  .fx-dot{ width:8px; height:8px; border-radius:50%; background:var(--surface-3); }
  .fx-dot.filled{ background:var(--fx-accent); }

  .fx-controls{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; justify-content:center; }
  .fx-controls .btn svg{ width:15px; height:15px; }
  .fx-start{ min-width:120px; justify-content:center; background:var(--fx-accent); border-color:var(--fx-accent); }
  .fx-start:hover{ background:var(--fx-accent); border-color:var(--fx-accent); filter:brightness(1.08); }

  /* settings modal rows */
  .fx-set-row{ padding:9px 0; }
  .fx-set-row.inline{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .fx-set-label{ font-size:13.5px; color:var(--text); font-weight:500; display:block; margin-bottom:8px; }
  .fx-set-row.inline .fx-set-label{ margin-bottom:0; }
  .fx-pills{ display:flex; gap:6px; flex-wrap:wrap; }
  .fx-pills .asg-filter{ background:var(--surface-2); }
  .fx-pills .asg-filter.active{ background:var(--accent-soft); color:var(--accent-ink); }
  .fx-swatches{ display:flex; gap:9px; }
  .fx-swatch{ width:26px; height:26px; border-radius:50%; border:2px solid transparent; cursor:pointer; padding:0; }
  .fx-swatch.active{ border-color:var(--text); box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--text); }
  .fx-stepper{ display:flex; align-items:center; background:var(--surface-2); border-radius:var(--r-md); overflow:hidden; }
  .fx-stepper button{ border:none; background:transparent; color:var(--text-muted); cursor:pointer;
    font-size:15px; width:34px; height:36px; font-family:inherit; }
  .fx-stepper button:hover:not(:disabled){ background:var(--surface-3); color:var(--text); }
  .fx-stepper button:disabled{ opacity:.35; cursor:default; }
  input.fx-stepper-val{ font-size:13px; width:44px; flex:0 0 44px; text-align:center; color:var(--text);
    background:transparent; border:1px solid transparent; border-radius:8px; outline:none;
    padding:5px 2px; margin:4px 0; font-family:inherit; -moz-appearance:textfield; }
  input.fx-stepper-val::-webkit-outer-spin-button,
  input.fx-stepper-val::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input.fx-stepper-val:focus{ background:var(--surface); border-color:var(--accent); }
  #fx-alarm-wrap[data-state="off"]{ opacity:.42; }
  #fx-alarm-wrap[data-state="off"] .asg-filter{ cursor:default; }
  .fx-stepper-unit{ font-size:12px; color:var(--text-muted); padding-right:10px; white-space:nowrap; }
  .fx-switch{ width:46px; height:26px; border-radius:var(--r-pill); border:none; cursor:pointer; flex:none;
    background:var(--surface-3); position:relative; transition:background .15s ease; }
  .fx-switch span{ position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.25); transition:transform .15s ease; }
  .fx-switch.on{ background:var(--accent); }
  .fx-switch.on span{ transform:translateX(20px); }

  /* full screen */
  .fx-overlay{ position:fixed; inset:0; z-index:120; display:flex; align-items:center; justify-content:center;
    background:var(--bg); background-size:cover; background-position:center; overflow:hidden; }
  .fx-ambient{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .fx-stage{ position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:20px;
    padding:24px; max-height:100vh; }
  .fx-close{ position:absolute; top:20px; right:20px; z-index:3; width:36px; height:36px; border-radius:50%;
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:13px; }
  .fx-close:hover{ color:var(--text); }

  /* immersive treatment, only with a scene picked */
  .fx-overlay.has-scene{ color:#fff; }
  .fx-overlay.has-scene .fx-time{ color:#fff; font-weight:300; font-size:60px; }
  .fx-overlay.has-scene .fx-ring{ filter:drop-shadow(0 0 16px color-mix(in srgb, var(--fx-accent) 55%, transparent)); }
  .fx-overlay.has-scene .fx-ring-track{ stroke:rgba(255,255,255,.2); }
  .fx-overlay.has-scene .fx-phase{ background:rgba(20,20,30,.5); border:1px solid rgba(255,255,255,.14);
    color:rgba(255,255,255,.9); backdrop-filter:blur(14px); }
  .fx-overlay.has-scene .fx-task{ color:rgba(255,255,255,.85); }
  .fx-overlay.has-scene .fx-task-select,
  .fx-overlay.has-scene .fx-close,
  .fx-overlay.has-scene .btn{ background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.2);
    color:#fff; backdrop-filter:blur(14px); box-shadow:none; }
  .fx-overlay.has-scene .btn:hover{ background:rgba(255,255,255,.2); }
  .fx-overlay.has-scene .fx-start{ background:var(--fx-accent); border-color:var(--fx-accent);
    box-shadow:0 0 28px color-mix(in srgb, var(--fx-accent) 50%, transparent); }
  .fx-overlay.has-scene .seg-tabs{ background:rgba(20,20,30,.5); border:1px solid rgba(255,255,255,.13);
    backdrop-filter:blur(16px); }
  .fx-overlay.has-scene .seg-tab{ color:rgba(255,255,255,.62); }
  .fx-overlay.has-scene .seg-tab.active{ background:rgba(255,255,255,.14); color:#fff; }
  .fx-overlay.has-scene .fx-tab-n{ background:rgba(255,255,255,.16); color:rgba(255,255,255,.85); }
  .fx-overlay.has-scene .seg-tab.active .fx-tab-n{ background:var(--fx-accent); color:#fff; }
  .fx-overlay.has-scene .fx-dot{ background:rgba(255,255,255,.25); }

  @media (max-height:780px){
    .fx-ring-wrap{ width:200px; height:200px; }
    .fx-time{ font-size:44px; }
    .fx-overlay.has-scene .fx-time{ font-size:50px; }
  }

  /* ---------- Notes workspace ---------- */
  .nt-wrap{ display:grid; grid-template-columns:270px minmax(0,1fr); gap:16px; align-items:start; }
  .nt-wrap.with-ctx{ grid-template-columns:300px minmax(0,1fr); }
  /* the class this list belongs to, at the top of the list itself */
  /* ---- assignment card: the detail sheet from the mockup ---- */
  .ac-modal{ max-width:660px; }
  .ac-head{ position:relative; padding:22px 26px 0; }
  .ac-close{ position:absolute; top:16px; right:18px; width:32px; height:32px; border-radius:50%;
    border:none; background:var(--surface-2); color:var(--text-muted); font-size:15px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; }
  .ac-close:hover{ background:var(--surface-3); color:var(--text); }
  .ac-class{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600;
    color:var(--text-muted); margin-bottom:10px; }
  .ac-title{ font-size:30px; font-weight:800; letter-spacing:-0.02em; line-height:1.15; margin-bottom:10px; }
  .ac-when{ display:flex; align-items:stretch; gap:0; margin:20px 0 4px; }
  .ac-when-cell{ display:flex; align-items:center; gap:12px; flex:1; padding:2px 0; }
  .ac-when-cell + .ac-when-cell{ border-left:1px solid var(--border); padding-left:26px; }
  .ac-when-ic{ width:34px; height:34px; border-radius:var(--r-md); background:var(--surface-2);
    color:var(--text-muted); display:flex; align-items:center; justify-content:center; flex:none; }
  .ac-when-ic svg{ width:17px; height:17px; }
  .ac-when-label{ font-size:11.5px; color:var(--text-faint); }
  .ac-when-value{ font-size:14px; font-weight:700; color:var(--text); }
  .ac-tabs{ display:flex; gap:26px; border-bottom:1px solid var(--border); padding:0 26px; margin-top:18px; }
  .ac-tab{ display:flex; align-items:center; gap:7px; border:none; background:transparent;
    font-family:inherit; font-size:13.5px; font-weight:600; color:var(--text-muted);
    padding:12px 0; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .ac-tab:hover{ color:var(--text); }
  .ac-tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .ac-tab svg{ width:15px; height:15px; }
  .ac-panel{ padding:20px 26px 4px; }
  .ac-card{ border:1px solid var(--border); border-radius:var(--r-card); padding:16px; margin-bottom:14px; }
  .ac-card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .ac-card-head h3{ font-size:15px; font-weight:700; }
  .ac-empty-box{ background:var(--surface-2); border-radius:var(--r-md); padding:14px;
    font-size:13px; color:var(--text-faint); }
  .ac-drop{ border:1.5px dashed var(--border); border-radius:var(--r-md); padding:26px 14px;
    text-align:center; color:var(--text-muted); cursor:pointer; transition:border-color .12s, background .12s; }
  .ac-drop:hover, .ac-drop.over{ border-color:var(--accent); background:var(--accent-soft); }
  .ac-drop-ic{ display:flex; justify-content:center; margin-bottom:8px; color:var(--text-faint); }
  .ac-drop-ic svg{ width:26px; height:26px; }
  .ac-drop-main{ font-size:13.5px; font-weight:700; color:var(--text); }
  .ac-drop-sub{ font-size:12px; color:var(--text-faint); margin-top:2px; }
  .ac-file{ display:flex; align-items:center; gap:12px; padding:10px 4px; }
  .ac-file + .ac-file{ border-top:1px solid var(--border); }
  .ac-file-name{ font-size:13px; font-weight:600; }
  .ac-file-meta{ font-size:11.5px; color:var(--text-faint); margin-top:1px; }
  .ac-foot{ display:flex; align-items:center; justify-content:space-between;
    padding:16px 26px 22px; border-top:1px solid var(--border); margin-top:8px; }
  .ac-del{ display:inline-flex; align-items:center; gap:7px; border:none; background:transparent;
    color:var(--danger); font-family:inherit; font-size:13.5px; font-weight:700; cursor:pointer;
    padding:8px 6px; border-radius:var(--r-sm); }
  .ac-del:hover{ background:var(--danger-soft); }
  .ac-foot .right{ display:flex; gap:9px; }
  /* inline SVGs have no intrinsic size; without this they render at whatever the
     browser guesses, which was a giant tick and an invisible bin */
  .ac-del svg{ width:15px; height:15px; flex:none; }
  .ac-foot .btn{ display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
  .ac-foot .btn svg{ width:15px; height:15px; flex:none; }
  .ac-card-head .btn{ display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .ac-card-head .btn svg{ width:14px; height:14px; flex:none; }
  .ac-card-actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  /* ---- new / edit assignment: the detail card's twin, but every field editable ----
     Same head, same bordered cards, same foot as .ac-modal, so adding an assignment
     looks like the thing you get afterwards. Every choice with a small fixed set of
     options (class, type, status, grade category) is a visible control, never a
     <select>: what you picked and what else there was both have to be readable
     without opening anything. */
  .aform-modal{ max-width:660px; }
  .aform-head{ position:relative; padding:22px 26px 18px; }
  .aform-kicker{ font-size:13px; font-weight:600; color:var(--text-muted); }
  input.aform-title{ display:block; width:100%; margin:8px 0 2px; padding:0 0 8px; border:none;
    border-bottom:1.5px solid var(--border); border-radius:0; background:transparent;
    font-family:inherit; font-size:30px; font-weight:800; letter-spacing:-0.02em; line-height:1.2;
    color:var(--text); transition:border-color .14s cubic-bezier(.22,1,.36,1); }
  input.aform-title::placeholder{ color:var(--text-faint); font-weight:700; }
  input.aform-title:focus{ outline:none; border-bottom-color:var(--accent); }
  input.aform-title.missing{ border-bottom-color:var(--danger); }
  .aform-label{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:8px; }
  .aform-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .aform-chip{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); font-family:inherit; font-size:12.5px;
    font-weight:600; padding:6px 12px; border-radius:var(--r-pill); cursor:pointer;
    transition:background .14s cubic-bezier(.22,1,.36,1), color .14s cubic-bezier(.22,1,.36,1); }
  .aform-chip:hover{ background:var(--surface-2); color:var(--text); }
  .aform-chip:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .aform-chip.active{ border-color:transparent; background:var(--accent-soft); color:var(--accent-ink); }
  /* a type chip carries its own colour once chosen, the same pair the type pill uses
     everywhere else, so the chip and the pill it becomes are the same object */
  .aform-chip.type.active{ background:var(--tp-bg); color:var(--tp-ink); }
  /* status keeps the colours of the status pill it will become */
  .aform-chip.status.active{ background:var(--st-bg); color:var(--st-ink); }
  .aform-chip .dot{ width:8px; height:8px; }

  .aform-body{ padding:0 26px 4px; display:flex; flex-direction:column; gap:14px;
    max-height:58vh; overflow:auto; }
  .aform-card{ border:1px solid var(--border); border-radius:var(--r-card); padding:16px; }
  .aform-card-head{ display:flex; align-items:center; justify-content:space-between;
    gap:10px; margin-bottom:12px; }
  .aform-card-head h3{ font-size:15px; font-weight:700; }
  .aform-hint{ font-size:12px; color:var(--text-faint); }

  /* the Due row mirrors .ac-when: icon tile, label, value — except the value is typed */
  .aform-when{ display:flex; align-items:stretch; gap:0; }
  .aform-when-cell{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
  .aform-when-cell + .aform-when-cell{ border-left:1px solid var(--border); padding-left:22px; margin-left:22px; }
  .aform-when-ic{ width:34px; height:34px; border-radius:var(--r-md); background:var(--surface-2);
    color:var(--text-muted); display:flex; align-items:center; justify-content:center; flex:none; }
  .aform-when-ic svg{ width:17px; height:17px; }
  .aform-when-field{ flex:1; min-width:0; }
  .aform-when-field .aform-label{ margin-bottom:2px; }
  .aform-when-field input{ border:none; background:transparent; padding:2px 0; font-size:14px;
    font-weight:700; color:var(--text); }
  .aform-when-field input:focus-visible{ outline:2px solid var(--accent); outline-offset:2px;
    border-radius:4px; }
  .aform-quick{ display:flex; flex-wrap:wrap; gap:6px; margin-top:14px; }
  .aform-quick .aform-chip{ font-size:12px; padding:5px 11px; }

  .aform-switch{ display:flex; align-items:center; gap:9px; font-size:13px; font-weight:600;
    color:var(--text); cursor:pointer; margin-top:14px; padding-top:14px;
    border-top:1px solid var(--border); }
  .aform-switch input[type="checkbox"]{ width:15px; height:15px; accent-color:var(--accent); flex:none; }
  .aform-switch .aform-hint{ font-weight:400; }

  .aform-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .aform-num{ display:flex; flex-direction:column; gap:6px; }
  .aform-num input{ font-family:"IBM Plex Mono",monospace; }
  .aform-num.off input{ background:var(--surface-2); color:var(--text-faint); }

  .aform-steps{ display:flex; flex-direction:column; gap:6px; margin-bottom:10px; }
  .aform-divide{ border-top:1px solid var(--border); margin:16px 0 14px; }

  @media (max-width:560px){
    input.aform-title{ font-size:24px; }
    .aform-when{ display:block; }
    .aform-when-cell + .aform-when-cell{ border-left:none; padding-left:0; margin-left:0;
      margin-top:14px; padding-top:14px; border-top:1px solid var(--border); }
    .aform-grid{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion:reduce){
    .aform-chip, input.aform-title{ transition:none; }
  }

  /* ---- Attach an existing note to an assignment ---- */
  .an-search{ width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:var(--r-md);
    background:var(--surface-2); font-family:inherit; font-size:13.5px; color:var(--text); }
  .an-search:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .an-list{ margin-top:12px; max-height:46vh; overflow:auto; display:flex; flex-direction:column; gap:4px; }
  .an-row{ display:flex; align-items:center; gap:11px; width:100%; text-align:left; cursor:pointer;
    padding:9px 10px; border:1px solid transparent; border-radius:var(--r-md); background:transparent;
    font-family:inherit; color:var(--text);
    transition:background .14s cubic-bezier(.22,1,.36,1), transform .14s cubic-bezier(.22,1,.36,1); }
  .an-row:hover{ background:var(--surface-2); transform:translateX(2px); }
  .an-row:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .an-row:active{ transform:translateX(2px) scale(.99); }
  .an-row-main{ flex:1; min-width:0; display:block; }
  .an-row-title{ display:block; font-size:13px; font-weight:600; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .an-row-meta{ display:block; font-size:11.5px; color:var(--text-faint); margin-top:1px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .an-row-add{ flex:none; font-size:11.5px; font-weight:700; color:var(--accent); opacity:0; }
  .an-row:hover .an-row-add, .an-row:focus-visible .an-row-add{ opacity:1; }

  /* ---- All Notes: every note you have, grouped by class ---- */
  .nt-all-head{ display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .nt-search-box.nt-all-search{ max-width:420px; flex:0 1 420px; }
  .nt-card-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:12px; }
  .nt-card{ text-align:left; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-card); box-shadow:var(--shadow-card); padding:14px;
    font-family:inherit; cursor:pointer; display:flex; flex-direction:column; gap:6px;
    min-height:120px; transition:border-color .12s, transform .12s; }
  .nt-card:hover{ border-color:var(--accent); transform:translateY(-1px); }
  .nt-card-top{ display:flex; align-items:center; gap:6px; }
  .nt-card-title{ font-size:13.5px; font-weight:700; color:var(--text); line-height:1.35;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .nt-card-preview{ font-size:12px; color:var(--text-muted); line-height:1.5; flex:1;
    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .nt-card-meta{ font-size:11px; color:var(--text-faint); }

  /* one pill per class, so the current one and the alternatives are both obvious */
  .nt-class-pills{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .nt-class-pill{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--border);
    background:var(--surface); color:var(--text-muted); font-family:inherit; font-size:12.5px;
    font-weight:600; padding:6px 11px; border-radius:999px; cursor:pointer; }
  .nt-class-pill:hover{ background:var(--surface-2); color:var(--text); }
  .nt-class-pill.active{ background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); }
  .nt-class-pill .dot{ width:8px; height:8px; }
  .nt-class-pill .nt-count{ background:var(--surface-2); }
  .nt-class-pill.active .nt-count{ background:rgba(255,255,255,.65); }
  .nt-backbar{ flex-wrap:wrap; }

  .nt-classhead{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .nt-classhead .dot{ width:12px; height:12px; }
  .nt-classhead-code{ font-size:17px; font-weight:800; letter-spacing:-.01em; line-height:1.2; }
  .nt-classhead-name{ font-size:12.5px; color:var(--text-muted); }
  .nt-backbar{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .nt-back{ display:inline-flex; align-items:center; gap:7px; border:none; background:transparent;
    color:var(--text); font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
    padding:5px 8px; border-radius:var(--r-sm); }
  .nt-back:hover{ background:var(--surface-2); }
  /* a text action, the way the mockup writes New note and New folder */
  .nt-link-action{ display:inline-flex; align-items:center; gap:6px; border:none; background:transparent;
    color:var(--accent); font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
    padding:5px 4px; border-radius:var(--r-sm); }
  .nt-link-action:hover{ background:var(--accent-soft); }
  .nt-toolrow{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .nt-search-box{ display:flex; align-items:center; gap:8px; flex:1;
    background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-md);
    padding:8px 10px; }
  .nt-search-box:focus-within{ border-color:var(--accent); background:var(--surface); }
  .nt-search-box .ic{ width:16px; height:16px; flex:none; display:flex; color:var(--text-faint); }
  .nt-search-box .ic svg{ width:16px; height:16px; }
  .nt-iconbtn{ flex:none; width:32px; height:32px; border-radius:var(--r-md);
    border:1px solid var(--border); background:var(--surface); color:var(--text-muted);
    cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:13px; }
  .nt-iconbtn svg{ width:16px; height:16px; }
  .nt-iconbtn:hover{ background:var(--surface-2); color:var(--text); }
  /* folder rows: controls appear on hover, as in the mockup */
  .nt-folder-head .nt-folder-x{ opacity:0; }
  .nt-folder-head:hover .nt-folder-x{ opacity:1; }
  .nt-folder-name{ font-weight:700; }
  #main:has(.nt-wrap){ display:flex; flex-direction:column; overflow:hidden; }
  #main:has(.nt-wrap) #view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  #main:has(.nt-wrap) .nt-wrap{ flex:1; min-height:0; }
  #main:has(.nt-wrap) .nt-tree, #main:has(.nt-wrap) .nt-ctx{ max-height:100%; overflow-y:auto; }
  #main:has(.nt-wrap) .nt-editor{ max-height:100%; overflow-y:auto; }

  .nt-ctx{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    box-shadow:var(--shadow-card); padding:14px; }
  .nt-ctx-cur{ display:flex; align-items:flex-start; gap:9px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .nt-ctx-cur .dot{ margin-top:5px; }
  .nt-ctx-code{ font-size:14px; font-weight:700; }
  .nt-ctx-name{ font-size:12px; color:var(--text-muted); }
  .nt-ctx-label{ font-size:11px; font-weight:600; color:var(--text-faint); text-transform:uppercase;
    letter-spacing:.05em; margin:12px 0 6px; }
  .nt-ctx-item{ display:flex; align-items:center; gap:9px; padding:7px 8px; border-radius:var(--r-sm);
    font-size:13px; cursor:pointer; }
  .nt-ctx-item:hover{ background:var(--surface-2); }

  .nt-tree{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    box-shadow:var(--shadow-card); padding:14px; }
  .nt-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
  .nt-head h3{ font-size:15px; }
  .nt-new{ padding:6px 12px; font-size:12.5px; }
  .nt-folder{ margin-bottom:6px; }

  input.nt-search{ width:100%; min-width:0; background:transparent; border:none; padding:0;
    font-size:12.5px; font-family:inherit; color:var(--text); }
  input.nt-search:focus{ outline:none; }
  input.nt-search::placeholder{ color:var(--text-faint); }
  .nt-section{ font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
    color:var(--text-faint); margin:10px 0 4px; }
  .nt-found{ font-size:11.5px; color:var(--text-muted); margin:2px 0 6px; }
  .nt-flag{ font-size:10px; flex:none; opacity:.85; }
  .nt-newfolder-row{ margin-top:8px; }
  /* what a note is being dragged onto */
  .nt-drop-target{ background:var(--accent-soft) !important; outline:2px dashed var(--accent); outline-offset:-2px; }
  .nt-item.dragging{ opacity:.4; }
  .nt-loose-label[data-drop]{ border-radius:var(--r-sm); padding:4px 6px; }
  .nt-folder-head{ display:flex; align-items:center; gap:7px; padding:6px 6px; border-radius:var(--r-sm);
    cursor:pointer; font-size:13px; font-weight:600; }
  .nt-folder-head:hover{ background:var(--surface-2); }
  .nt-chev{ color:var(--text-faint); font-size:11px; width:10px; flex:none; }
  .nt-folder-ic{ width:15px; height:12px; border-radius:3px; background:#F5B301; flex:none; position:relative; }
  .nt-folder-ic:before{ content:''; position:absolute; top:-3px; left:1px; width:6px; height:3px;
    border-radius:2px 2px 0 0; background:inherit; }
  .nt-folder-name{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nt-count{ font-size:11.5px; color:var(--text-faint); }
  .nt-folder-x{ border:none; background:transparent; color:var(--text-faint); cursor:pointer; font-size:11px; padding:2px 4px; }
  .nt-folder-x:hover{ color:var(--danger); }
  .nt-folder-body{ padding-left:16px; }
  .nt-loose-label{ font-size:11px; font-weight:600; color:var(--text-faint); text-transform:uppercase;
    letter-spacing:.05em; padding:8px 6px 4px; }
  .nt-item{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:var(--r-sm);
    font-size:13px; cursor:pointer; }
  .nt-item:hover{ background:var(--surface-2); }
  .nt-item.active{ background:var(--accent-soft); color:var(--accent-ink); font-weight:600; }
  .nt-item-ic{ color:var(--text-faint); flex:none; display:flex; }
  .nt-item-ic svg{ width:14px; height:14px; }
  .nt-item.active .nt-item-ic{ color:var(--accent); }
  .nt-item-title{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nt-empty{ font-size:12.5px; color:var(--text-faint); padding:4px 8px; }
  .nt-newfolder{ display:block; width:100%; text-align:left; border:none; background:transparent; color:var(--accent);
    font-size:12.5px; font-weight:600; cursor:pointer; padding:9px 6px 2px; font-family:inherit; }

  .nt-editor{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    box-shadow:var(--shadow-card); padding:20px 22px; min-height:420px; }
  .nt-editor-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; flex-wrap:wrap; }
  .nt-saved-wrap{ display:flex; align-items:center; gap:6px; margin-left:auto; }
  .nt-saved-tick{ width:22px; height:22px; border-radius:50%; background:var(--success-soft);
    color:var(--success); display:flex; align-items:center; justify-content:center; font-size:11px; }
  .nt-share{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700; }
  .nt-share:hover{ background:var(--accent-ink); border-color:var(--accent-ink); }
  .nt-title-rule{ border:none; border-top:1px solid var(--border); margin:10px 0 18px; }
  .nt-crumbs{ font-size:12.5px; color:var(--text-muted); min-width:0;
    display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .nt-saved{ font-size:11.5px; color:var(--text-faint); margin-left:auto; }
  .nt-editor-actions{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .nt-editor-actions .btn{ padding:6px 10px; font-size:12.5px; }
  .nt-editor-actions .btn.ghost{ padding:6px 8px; }
  .nt-editor-actions .spacer{ flex:1; }
  .nt-folder-select{ width:auto; font-size:12.5px; padding:7px 10px; }
  input.nt-title{ width:100%; border:none; outline:none; background:transparent; font-family:inherit;
    font-size:34px; font-weight:800; letter-spacing:-0.02em; color:var(--text);
    padding:0; margin-bottom:4px; line-height:1.15; }
  input.nt-title:focus{ outline:none; box-shadow:none; border:none; }
  /* headings inside a note read as navy in the mockup, which separates the
     document's own structure from the app's blue interface accents */
  .rte-editor h1, .rte-editor h2, .rte-editor h3,
  .rte-content h1, .rte-content h2, .rte-content h3{ color:var(--note-heading, #1D4ED8); }
  :root{ --note-heading:#1D4ED8; }
  :root[data-theme="dark"]{ --note-heading:#93B4FF; }
  .nt-title::placeholder{ color:var(--text-faint); }
  .nt-meta{ font-size:12.5px; color:var(--text-muted); margin-bottom:16px; }
  .nt-body{ min-height:340px; border:none; border-radius:0; background:transparent;
    padding:16px 0 40px; font-size:14px; }
  .nt-body:focus{ outline:none; }
  /* the toolbar becomes a rule under the header rather than a bordered tray */
  .nt-editor .rte-toolbar{ border:none; border-top:1px solid var(--border);
    border-bottom:1px solid var(--border); border-radius:0; background:var(--surface);
    padding:6px 0; margin-bottom:22px; }
  .nt-title-rule{ margin:12px 0 0; }
  .nt-editor-empty{ display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:380px; color:var(--text-faint); font-size:13.5px; gap:4px; }
  .nt-editor-empty svg{ width:26px; height:26px; }

  @media (max-width:1150px){
    .nt-wrap, .nt-wrap.with-ctx{ grid-template-columns:minmax(0,1fr); }
  }

  /* ---------- Grades page ---------- */
  .grade-row-t{ display:grid; grid-template-columns:minmax(0,2.2fr) 1fr 1.2fr .8fr 1fr 24px; gap:14px;
    align-items:center; padding:13px 16px; border-bottom:1px solid var(--border); font-size:13px; cursor:pointer; }
  .grade-row-t:last-child{ border-bottom:none; }
  .grade-row-t:not(.grade-head-t):hover{ background:var(--surface-2); }
  .grade-head-t{ background:var(--surface-2); font-size:11.5px; font-weight:600; color:var(--text-muted); cursor:default; }
  .gr-course{ display:flex; align-items:flex-start; gap:10px; min-width:0; }
  .gr-course .dot{ margin-top:5px; }
  .gr-code{ font-size:14px; font-weight:700; }
  .gr-name{ font-size:12.5px; color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gr-prof{ font-size:12px; color:var(--text-faint); margin-top:1px; }
  .grade-chip{ display:inline-block; font-size:13px; font-weight:700; padding:4px 12px; border-radius:var(--r-sm); }
  .gr-pct{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .gr-progress{ display:flex; align-items:center; gap:9px; }
  .gr-progress .cp-progress-bar{ flex:1; }
  .gr-progress-pct{ font-size:12.5px; color:var(--text-muted); flex:none; }

  .dist-row{ display:flex; align-items:flex-end; gap:10px; }
  .dist-col{ flex:1; text-align:center; }
  .dist-bar{ border-radius:6px; margin-bottom:9px; }
  .dist-n{ font-size:16px; font-weight:700; }
  .dist-l{ font-size:11.5px; color:var(--text-muted); margin-top:1px; }

  .gp-row{ display:flex; align-items:center; gap:10px; padding:8px 0; }
  .gp-code{ font-size:12.5px; font-weight:600; width:74px; flex:none; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gp-val{ font-size:12.5px; font-weight:700; width:30px; text-align:right; flex:none; }

  @media (max-width:1050px){
    .grade-row-t{ grid-template-columns:minmax(0,2fr) 1fr 24px; }
    .grade-row-t > .gr-progress, .grade-row-t > .cp-dim{ display:none; }
  }

  /* ---------- Files page ---------- */
  .files-section-h{ font-size:16px; font-weight:700; margin-bottom:12px; }
  .files-list-head{ display:flex; align-items:center; justify-content:space-between; margin:22px 0 12px; }
  .files-list-head .files-section-h{ margin-bottom:0; }
  .layout-toggle{ display:flex; gap:2px; background:var(--surface-2); border-radius:var(--r-md); padding:3px; }
  .lt-btn{ border:none; background:transparent; padding:6px 11px; border-radius:7px; cursor:pointer;
    font-size:13px; color:var(--text-muted); font-family:inherit; }
  .lt-btn.active{ background:var(--surface); color:var(--accent); box-shadow:var(--shadow-card); }

  .folder-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; }
  .folder-card{ display:flex; align-items:flex-start; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-card); box-shadow:var(--shadow-card); padding:15px 16px; cursor:pointer; }
  .folder-card:hover{ box-shadow:0 6px 22px -8px rgba(16,24,40,.18); }
  .folder-ic{ width:34px; height:28px; border-radius:7px; flex:none; position:relative; }
  .folder-ic:before{ content:''; position:absolute; top:-5px; left:2px; width:14px; height:6px;
    border-radius:3px 3px 0 0; background:inherit; }
  .folder-name{ font-size:14.5px; font-weight:700; }
  .folder-sub{ font-size:12.5px; color:var(--text-muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .folder-count{ font-size:12px; color:var(--text-faint); margin-top:8px; }
  .folder-menu{ padding:2px 8px; font-size:16px; line-height:1; color:var(--text-faint); box-shadow:none; }

  .file-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:14px; }
  .file-tile{ position:relative; background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    box-shadow:var(--shadow-card); padding:16px; cursor:pointer; }
  .file-tile:hover{ box-shadow:0 6px 22px -8px rgba(16,24,40,.18); }
  .file-ic-lg{ width:40px; height:40px; border-radius:var(--r-sm); font-size:12px; margin-bottom:11px; }
  .file-tile-name{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-tile-meta{ font-size:12px; color:var(--text-muted); margin-top:3px; }
  .file-star{ position:absolute; top:10px; right:10px; border:none; background:transparent; cursor:pointer;
    color:var(--border); font-size:15px; line-height:1; padding:2px; }
  .file-star.on{ color:#F5B301; }
  .file-star:hover{ color:#F5B301; }

  .file-row-t{ display:grid; grid-template-columns:minmax(0,2.1fr) .9fr 1fr .8fr .7fr .9fr 76px; gap:12px;
    align-items:center; padding:11px 16px; border-bottom:1px solid var(--border); font-size:13px; }
  .file-row-t:last-child{ border-bottom:none; }
  .file-row-t:not(.file-head):hover{ background:var(--surface-2); }
  .file-head{ background:var(--surface-2); font-size:11.5px; font-weight:600; color:var(--text-muted); }
  .file-name-cell{ display:flex; align-items:center; gap:10px; min-width:0; cursor:pointer; }
  .file-name-txt{ font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-name-cell:hover .file-name-txt{ color:var(--accent); }
  .file-cls{ display:flex; align-items:center; gap:7px; color:var(--text-muted); }
  .file-row-actions{ display:flex; align-items:center; gap:2px; justify-content:flex-end; }
  .file-row-t .file-star{ position:static; }

  @media (max-width:1050px){
    .file-row-t{ grid-template-columns:minmax(0,2fr) 1fr 76px; }
    .file-row-t > span:nth-child(3), .file-row-t > span:nth-child(4),
    .file-row-t > span:nth-child(5), .file-row-t > span:nth-child(6){ display:none; }
  }

  /* ---- folders, drag targets, filters and the way out of a search ---- */

  /* The one visual answer to "will it land here": every drop target lights up the
     same way, whether it is a class card, a folder card or a breadcrumb. */
  .fdrop-over{ outline:2px dashed var(--accent); outline-offset:-2px;
    background:var(--accent-soft) !important; }
  .file-tile[draggable="true"], .file-row-t[draggable="true"]{ cursor:grab; }
  .file-tile.dragging, .file-row-t.dragging, .folder-card.dragging{ opacity:.45; }
  .file-tile-where{ font-size:11.5px; color:var(--text-faint); margin-top:5px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .folder-card-new{ border-style:dashed; box-shadow:none; background:transparent;
    text-align:left; font-family:inherit; color:var(--text-muted); align-items:center; }
  .folder-card-new:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
  .folder-ic-new{ display:flex; align-items:center; justify-content:center;
    background:var(--surface-2); color:var(--text-faint); }
  .folder-ic-new:before{ display:none; }
  .folder-ic-new svg{ width:16px; height:16px; }

  /* Two grouped controls rather than eleven loose chips. Same construction as the
     .seg-tabs above the page, so the filters read as part of the same system. Every
     option stays on screen: the grouping is visual, nothing is folded into a menu. */
  .files-filters{ display:flex; align-items:center; flex-wrap:wrap; gap:10px 18px; margin:0 0 16px; }
  .ff-group{ display:flex; align-items:center; gap:9px; min-width:0; }
  .ff-label{ font-size:11.5px; font-weight:700; letter-spacing:.02em; color:var(--text-faint);
    text-transform:uppercase; flex:none; min-width:42px; }
  .ff-track{ display:inline-flex; background:var(--surface-2); border-radius:var(--r-md);
    padding:3px; gap:2px; flex-wrap:wrap; }
  .ff-track .asg-filter{ padding:6px 12px; border-radius:7px; }
  /* The chosen one is a raised white pill, so the eye lands on it before the label. */
  .ff-track .asg-filter.active{ background:var(--surface); color:var(--text);
    box-shadow:0 1px 2px rgba(16,24,40,.09); }
  /* On a dark page --surface is darker than the track, so the chosen pill would read
     as a hole rather than a raised control, and at these values it is nearly invisible.
     Step up a surface instead, and drop the shadow, which does no work on dark. */
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .ff-track .asg-filter.active{
      background:var(--surface-3); box-shadow:none; }
  }
  :root[data-theme="dark"] .ff-track .asg-filter.active{
    background:var(--surface-3); box-shadow:none; }
  @media (max-width:820px){
    .files-filters{ gap:10px; }
    .ff-group{ width:100%; }
  }

  /* A class block is three labelled rows now. The label is the whole point: it says
     what a row of pills actually is, which the flat strip never did. */
  .hs-row{ display:flex; gap:12px; align-items:flex-start; margin-top:12px; }
  .hs-row-label{ width:62px; flex:none; font-size:11px; font-weight:700; text-transform:uppercase;
    color:var(--text-faint); padding-top:9px; }
  .hs-row-items{ flex:1; min-width:0; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
  .hs-row-hint{ font-size:12.5px; color:var(--text-faint); max-width:52ch; }
  .hs-row > .hs-grid, .hs-row > .hs-list{ flex:1; min-width:0; }
  .hs-study-btn.primary-ish{ border-color:var(--accent); color:var(--accent-ink); }
  .hs-study-btn.primary-ish:hover{ background:var(--accent-soft); }
  @media (max-width:760px){
    .hs-row{ flex-direction:column; gap:6px; }
    .hs-row-label{ width:auto; padding-top:0; }
  }

  /* A section per time bucket. The heading carries the count, so the size of what is
     coming is legible before you read a single row. */
  .hs-bucket{ margin-bottom:22px; }
  .hs-bucket-head{ display:flex; align-items:center; gap:9px; margin:0 0 9px; }
  .hs-bucket-head h3{ font-size:14px; font-weight:700; }
  .hs-bucket-count{ font-size:11.5px; font-weight:700; color:var(--text-faint);
    background:var(--surface-2); border-radius:var(--r-pill); padding:2px 8px; }
  .hs-bucket-toggle{ margin-left:auto; border:none; background:transparent; font:inherit;
    font-size:12.5px; font-weight:600; color:var(--accent); cursor:pointer; padding:2px 6px;
    border-radius:6px; }
  .hs-bucket-toggle:hover{ background:var(--accent-soft); }

  /* One line per item. The old row gave a title and a date the full page width and left
     about 900px of it empty; this fills the line instead of stretching across it. */
  .hs-due-list{ display:flex; flex-direction:column; gap:4px; }
  .hs-due-row{ display:flex; align-items:center; gap:10px; padding:9px 14px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    cursor:pointer; }
  .hs-due-row:hover{ border-color:var(--accent); }
  .hs-due-class{ font-size:11.5px; font-weight:700; color:var(--text-faint); flex:none;
    min-width:62px; }
  /* The type belongs to the title, not to the metadata: letting the title stretch to
     fill left "Quiz 02" alone with a thousand pixels of gap before its own badge. The
     pair sits together and the empty space goes after them. */
  .hs-due-title{ font-size:13.5px; font-weight:600; color:var(--text); flex:0 1 auto;
    min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hs-due-row .type-badge{ flex:none; margin-right:auto; }
  .hs-due-row .due-label{ flex:none; }
  .hs-due-row .hs-open{ flex:none; font-size:12.5px; }
  .hs-threads-sec .hs-row-items{ gap:8px; }
  .hs-saved .dot{ margin-right:2px; }
  @media (max-width:720px){
    .hs-due-row{ flex-wrap:wrap; }
    .hs-due-title{ flex-basis:100%; order:-1; white-space:normal; }
  }

  /* ---------- Study ---------- */
  .study-summary{ font-size:13.5px; color:var(--text-muted); }
  .study-summary b{ color:var(--text); font-weight:700; }
  .set-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(232px, 1fr)); gap:12px; }
  .set-card{ display:flex; flex-direction:column; gap:3px; align-items:flex-start; text-align:left;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    padding:14px 16px; cursor:pointer; font:inherit; box-shadow:var(--shadow-card); }
  .set-card:hover{ border-color:var(--accent); }
  .set-card-class{ font-size:11px; font-weight:700; color:var(--text-faint);
    text-transform:uppercase; letter-spacing:.04em; }
  .set-card-name{ font-size:14.5px; font-weight:650; color:var(--text); }
  .set-card-meta{ font-size:12px; color:var(--text-faint); }
  .set-card-meta b{ color:var(--accent-ink); font-weight:700; }
  .set-card .dot{ margin-bottom:4px; }

  .set-screen{ display:flex; flex-direction:column; gap:16px; }
  /* Three ways into the same terms, side by side, so it is obvious they are modes
     rather than three different things you have to create. */
  .set-modes{ display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:10px; }
  .set-mode{ display:flex; flex-direction:column; align-items:flex-start; gap:2px; text-align:left;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    padding:14px 16px; cursor:pointer; font:inherit; }
  .set-mode:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .set-mode svg{ width:20px; height:20px; color:var(--accent); margin-bottom:6px; }
  .set-mode b{ font-size:14px; font-weight:650; color:var(--text); }
  .set-mode span{ font-size:12.5px; color:var(--text-faint); }
  /* Deleting one card of forty should not be the most repeated colour on the screen.
     The control stays visible and one click away -- nothing is folded into a menu --
     it just stops shouting until you reach for it. */
  .row-x{ color:var(--text-faint); font-size:13px; line-height:1; padding:6px 9px; }
  .row-x:hover, .row-x:focus-visible{ color:var(--danger); border-color:var(--danger); background:var(--danger-soft); }
  .set-mode.is-soon{ opacity:.72; }
  .set-mode.is-soon svg{ color:var(--text-faint); }

  .set-terms-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .set-terms-head h3{ font-size:14px; font-weight:700; }
  .set-term-list{ display:flex; flex-direction:column; gap:4px; }
  /* Term and definition in two columns, the way a set reads on paper. */
  .set-term{ display:grid; grid-template-columns:minmax(140px, 1fr) 2fr auto auto auto;
    align-items:center; gap:12px; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-md); padding:10px 14px; }
  .set-term-front{ font-size:13.5px; font-weight:650; color:var(--text); }
  .set-term-back{ font-size:13px; color:var(--text-muted); }
  .set-term-due{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; }
  /* Row actions stay quiet until the row is pointed at. A red Delete on every one of
     27 terms makes the destructive action the loudest thing on a study screen, which
     is the wall of red the old deck modal had. */
  .set-term .btn{ opacity:0; transition:opacity .12s ease; }
  .set-term:hover .btn, .set-term:focus-within .btn{ opacity:1; }
  @media (hover:none){ .set-term .btn{ opacity:1; } }
  .set-mode-body{ background:var(--surface); border:1px solid var(--border);
    border-radius:var(--r-card); padding:20px; }
  @media (max-width:720px){
    .set-term{ grid-template-columns:1fr auto; }
    .set-term-back{ grid-column:1 / -1; }
  }

  /* ---------- Study: the Humanizer ---------- */
  .study-tabs{ margin-bottom:18px; }
  .hz-layout{ display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:16px; align-items:start; }
  .hz-main{ display:flex; flex-direction:column; gap:14px; padding:20px 22px; }
  .hz-intro h3{ font-size:17px; font-weight:700; margin-bottom:4px; }
  .hz-intro p{ font-size:13px; color:var(--text-muted); line-height:1.55; max-width:640px; }
  /* Four ways in, all on show: which one you want should never be behind a menu. */
  .hz-sources{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
  .hz-src{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); background:var(--surface);
    border-radius:var(--r-md); padding:10px 12px; font:inherit; font-size:12.5px; font-weight:600;
    color:var(--text-muted); cursor:pointer; text-align:left; }
  .hz-src svg{ width:16px; height:16px; flex:none; color:var(--text-faint); }
  .hz-src:hover{ border-color:var(--accent); color:var(--text); }
  .hz-src.active{ border-color:var(--accent); background:var(--accent-soft); color:var(--accent-ink); }
  .hz-src.active svg{ color:var(--accent); }
  .hz-src:disabled{ opacity:.55; cursor:default; }
  .hz-from{ display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--text-muted);
    background:var(--surface-2); border-radius:var(--r-md); padding:8px 10px 8px 12px; }
  .hz-from svg{ width:15px; height:15px; flex:none; color:var(--accent); }
  .hz-from span{ flex:1; min-width:0; }
  .hz-from b{ color:var(--text); }
  .hz-text{ width:100%; min-height:300px; resize:vertical; border:1px solid var(--border);
    border-radius:var(--r-md); background:var(--surface); color:var(--text); padding:14px 16px;
    font:inherit; font-size:14px; line-height:1.65; }
  .hz-text:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .hz-text:disabled{ background:var(--surface-2); color:var(--text-muted); }
  .hz-foot{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .hz-meter{ display:flex; align-items:center; gap:10px; flex:1; min-width:0; font-size:12.5px; }
  .hz-count{ color:var(--text-faint); font-weight:600; }
  .hz-count.over{ color:var(--danger); }
  .hz-over{ color:var(--danger); }
  .hz-cost{ color:var(--text-faint); }
  .hz-voice-toggle{ display:flex; align-items:center; gap:7px; font-size:12.5px; font-weight:600;
    color:var(--text-muted); cursor:pointer; }
  .hz-voice-toggle.is-off{ color:var(--text-faint); cursor:default; }
  .hz-side{ display:flex; flex-direction:column; gap:12px; }
  .hz-card{ display:flex; flex-direction:column; gap:9px; align-items:flex-start; }
  .hz-card-head{ display:flex; align-items:center; gap:8px; width:100%; }
  .hz-card-head h4{ font-size:13.5px; font-weight:700; margin-right:auto; }
  .hz-card p, .hz-intro p, .hz-questions p{ margin:0; }
  .hz-muted{ font-size:12.5px; color:var(--text-faint); line-height:1.5; }
  .hz-voice-preview{ font-size:12.5px; color:var(--text-muted); line-height:1.55; font-style:italic;
    border-left:3px solid var(--surface-3); padding-left:10px; }
  .hz-hist-list{ display:flex; flex-direction:column; gap:2px; width:100%; max-height:420px; overflow:auto; }
  .hz-hist{ display:flex; flex-direction:column; gap:2px; text-align:left; border:none; background:transparent;
    border-radius:var(--r-md); padding:8px 10px; margin:0 -10px; font:inherit; cursor:pointer; }
  .hz-hist:hover{ background:var(--surface-2); }
  .hz-hist-title{ font-size:13px; font-weight:650; color:var(--text); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .hz-hist-meta{ font-size:11.5px; color:var(--text-faint); }
  .hz-voice-input{ min-height:260px; }
  .hz-pick-filter{ width:100%; margin-bottom:10px; }
  .hz-pick-list{ display:flex; flex-direction:column; gap:6px; max-height:52vh; overflow:auto; }
  .hz-pick{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; text-align:left; width:100%;
    border:1px solid var(--border); background:var(--surface); border-radius:var(--r-md);
    padding:10px 12px; font:inherit; cursor:pointer; }
  .hz-pick:hover{ border-color:var(--accent); }
  .hz-pick b{ font-size:13.5px; font-weight:650; color:var(--text); }
  .hz-pick-sub{ font-size:12px; color:var(--text-faint); }
  .hz-pick-msg{ flex-direction:column; align-items:flex-start; gap:4px; }
  .hz-pick-preview{ font-size:12.5px; color:var(--text-muted); line-height:1.5; }

  .hz-questions{ border:1px solid var(--warn); background:var(--warn-soft); border-radius:var(--r-card);
    padding:14px 18px; font-size:13px; line-height:1.55; }
  .hz-questions h4{ font-size:13.5px; font-weight:700; margin-bottom:3px; }
  .hz-questions p{ color:var(--text-muted); margin-bottom:6px; }
  .hz-questions ul, .hz-still ul{ padding-left:18px; display:flex; flex-direction:column; gap:3px; }
  .hz-compare{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; align-items:start; }
  .hz-pane{ display:flex; flex-direction:column; gap:10px; padding:18px 20px; }
  .hz-pane-head{ display:flex; align-items:baseline; gap:8px; }
  .hz-pane-head h4{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--text-muted); margin-right:auto; }
  .hz-pane-head span{ font-size:11.5px; color:var(--text-faint); }
  .hz-prose{ white-space:pre-wrap; font-size:14px; line-height:1.75; color:var(--text);
    max-height:62vh; overflow:auto; overflow-wrap:anywhere; }
  .hz-mark{ background:var(--warn-soft); color:inherit; border-radius:4px; padding:1px 2px;
    box-shadow:inset 0 -2px 0 var(--warn); cursor:pointer; transition:background .12s; }
  .hz-mark sup{ font-size:9.5px; font-weight:800; color:var(--warn); margin-left:2px; }
  .hz-mark.is-hot{ background:var(--accent-soft); box-shadow:inset 0 -2px 0 var(--accent); }
  .hz-mark.is-hot sup{ color:var(--accent); }
  .hz-found-list{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:8px; }
  .hz-tell{ display:flex; gap:11px; align-items:flex-start; background:var(--surface);
    border:1px solid var(--border); border-radius:var(--r-md); padding:11px 13px; cursor:pointer;
    transition:border-color .12s, background .12s; }
  .hz-tell.is-hot{ border-color:var(--accent); background:var(--accent-soft); }
  .hz-num{ flex:none; width:22px; height:22px; border-radius:50%; background:var(--warn-soft); color:var(--warn);
    font-size:11px; font-weight:800; display:flex; align-items:center; justify-content:center; }
  .hz-tell.is-hot .hz-num{ background:var(--accent); color:#fff; }
  .hz-tell-body{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .hz-tell-name{ display:flex; align-items:baseline; gap:6px; font-size:13px; }
  .hz-pat{ font-size:11px; color:var(--text-faint); font-weight:600; }
  .hz-tell q{ font-size:12.5px; color:var(--text-muted); font-style:italic; overflow-wrap:anywhere; }
  .hz-tell p{ font-size:12.5px; color:var(--text); line-height:1.5; }
  .hz-still{ font-size:13px; color:var(--text-muted); line-height:1.55; }
  .hz-still h4{ font-size:13.5px; font-weight:700; color:var(--text); }
  .hz-by{ font-size:11.5px; color:var(--text-faint); }
  .hz-progress{ display:flex; flex-direction:column; gap:8px; padding:4px 0; }
  .hz-progress-head{ display:flex; align-items:center; gap:9px; font-size:13px; color:var(--text); }
  .hz-progress-head span{ margin-left:auto; font-size:12px; font-weight:700; color:var(--text-muted); }
  .hz-bar{ height:6px; border-radius:var(--r-pill); background:var(--surface-2); overflow:hidden; }
  .hz-bar i{ display:block; height:100%; background:var(--accent); border-radius:var(--r-pill);
    transition:width .3s ease; }
  @media (max-width:1000px){
    .hz-layout, .hz-compare{ grid-template-columns:minmax(0,1fr); }
    .hz-sources{ grid-template-columns:repeat(2, minmax(0,1fr)); }
  }
  /* On a phone the rewrite's head stacks: back, then the title and its badges, then the
     actions on their own row, rather than squeezing the title to nothing. */
  @media (max-width:720px){
    .hz-run .th-screen-title{ flex-basis:100%; flex-wrap:wrap; }
    .hz-run .th-screen-title h2{ flex-basis:100%; white-space:normal; }
    .hz-run .th-screen-acts{ flex-basis:100%; flex-wrap:wrap; }
    .hz-run .th-screen-acts .btn{ flex:1 1 auto; }
  }

  /* ---------- The thread screen ---------- */
  /* A conversation is the work, so it gets the page. The rail keeps the other threads
     in the class one click away, which is what stops a full screen feeling like a
     dead end you have to reverse out of. */
  .th-screen{ display:flex; flex-direction:column; gap:14px; height:calc(100vh - 150px); min-height:420px; }
  .th-screen-head{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .th-back{ border:1px solid var(--border); background:var(--surface); border-radius:var(--r-pill);
    padding:6px 13px; font:inherit; font-size:12.5px; font-weight:600; color:var(--text-muted);
    cursor:pointer; flex:none; }
  .th-back:hover{ color:var(--text); border-color:var(--text-faint); }
  .th-screen-title{ display:flex; align-items:center; gap:9px; min-width:0; flex:1; }
  .th-screen-title h2{ font-size:19px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .th-screen-acts{ display:flex; align-items:center; gap:8px; }
  .th-draft-note{ font-size:11.5px; color:var(--text-faint); }
  .th-body-wrap{ display:flex; gap:14px; flex:1; min-height:0; }

  .th-rail{ width:196px; flex:none; display:flex; flex-direction:column; gap:4px;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    padding:10px; overflow:auto; }
  .th-rail-head{ font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-faint);
    padding:4px 8px 6px; }
  .th-rail-item{ display:flex; flex-direction:column; gap:2px; text-align:left; border:none;
    background:transparent; border-radius:var(--r-md); padding:8px 10px; cursor:pointer; font:inherit; }
  .th-rail-item:hover{ background:var(--surface-2); }
  .th-rail-item.active{ background:var(--accent-soft); }
  .th-rail-name{ font-size:13px; font-weight:650; color:var(--text); }
  .th-rail-item.active .th-rail-name{ color:var(--accent-ink); }
  .th-rail-sub{ font-size:11px; color:var(--text-faint); }
  .th-rail-new{ margin-top:6px; display:flex; align-items:center; justify-content:center; gap:6px;
    border:1px dashed var(--border); background:transparent; border-radius:var(--r-md);
    padding:9px; font:inherit; font-size:12.5px; font-weight:600; color:var(--text-muted); cursor:pointer; }
  .th-rail-new:hover{ color:var(--accent-ink); border-color:var(--accent); }
  .th-rail-new svg{ width:15px; height:15px; }

  .th-main{ flex:1; min-width:0; display:flex; flex-direction:column;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
    padding:14px 16px 0; }

  /* The opening screen of a new thread. It has to answer "what is this for" without
     a tour, because the people arriving next did not watch it get built. */
  .th-start{ max-width:640px; margin:8px auto; text-align:left; }
  .th-start h3{ font-size:17px; margin-bottom:6px; }
  .th-start p{ font-size:13.5px; color:var(--text-muted); line-height:1.6; margin:0 0 18px; max-width:56ch; }
  .th-start-group{ margin-bottom:16px; }
  .th-start-label{ font-size:11px; font-weight:700; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:7px; }
  .th-start-items{ display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:6px; }
  .th-start-btn{ display:block; width:100%; text-align:left; border:1px solid var(--border);
    background:var(--surface); border-radius:var(--r-md); padding:9px 12px;
    cursor:pointer; font:inherit; }
  @media (max-width:620px){ .th-start-items{ grid-template-columns:1fr; } }
  .th-start-btn:hover{ border-color:var(--accent); background:var(--accent-soft); }
  .th-start-btn b{ display:block; font-size:13px; font-weight:650; color:var(--text); }
  .th-start-btn span{ display:block; font-size:12px; color:var(--text-faint); margin-top:1px; }

  @media (max-width:900px){
    .th-screen{ height:auto; }
    .th-body-wrap{ flex-direction:column; }
    .th-rail{ width:auto; flex-direction:row; flex-wrap:wrap; }
    .th-rail-new{ margin-top:0; }
  }
  /* Full screen: the thread over the whole window, the way Notes' editor goes full
     screen. The rail stays, so switching threads is still one click. */
  .th-screen.fullscreen{ position:fixed; inset:0; z-index:100; background:var(--bg);
    height:auto; min-height:0; padding:14px 22px 0; }
  .th-screen.fullscreen .th-body-wrap{ flex:1; min-height:0; }
  .th-full-btn{ display:flex; align-items:center; gap:6px; }
  .th-full-btn svg{ width:15px; height:15px; }
  @media (max-width:900px){
    .th-screen.fullscreen{ padding:10px 10px 0; }
    .th-screen.fullscreen .th-main{ flex:1; min-height:0; }
    .th-screen.fullscreen .th-rail{ flex:none; max-height:92px; overflow:auto; }
  }
  /* On a phone the thread's head stacks: back and title, then the actions on a row of
     their own that can wrap, rather than squeezing labels onto three lines. */
  @media (max-width:720px){
    .th-screen .th-screen-title{ flex-basis:calc(100% - 120px); }
    .th-screen .th-screen-acts{ flex-basis:100%; flex-wrap:wrap; }
    .th-screen .th-screen-acts .btn, .th-screen .th-screen-acts .hs-spend{ white-space:nowrap; }
  }

  /* ---------- Threads ---------- */
  /* A transcript in the same bubble language as the rest of the app: the student's
     turns are accent-tinted and sit right, Vesta's are a plain surface and sit left. */
  .th-modal{ max-width:760px; }
  .th-body{ max-height:70vh; display:flex; flex-direction:column; gap:0; padding-bottom:0; }
  .th-srcbar{ display:flex; flex-direction:column; gap:8px; padding:8px 12px;
    background:var(--surface-2); border-radius:var(--r-md); margin-bottom:12px; font-size:12px; }
  .th-srchead{ display:flex; align-items:center; gap:9px; }
  /* The list of sources is reference material, not the conversation, so it stays one
     line until asked for. Hover opens it; click pins it open, which is what makes it
     reachable on a touchscreen and from the keyboard. */
  .th-srcbar .th-srcfull{ display:none; }
  .th-srcbar:hover .th-srcfull,
  .th-srcbar:focus-within .th-srcfull,
  .th-srcbar.th-open .th-srcfull{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .th-srcsummary{ flex:1; min-width:0; color:var(--text-faint); overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  /* The summary is what collapses, not the row: hiding it would let the buttons slide
     left the moment the list opens, which is the same problem in the other direction. */
  .th-srcbar:hover .th-srcsummary,
  .th-srcbar:focus-within .th-srcsummary,
  .th-srcbar.th-open .th-srcsummary{ visibility:hidden; }
  .th-srctoggle{ border:none; background:transparent; color:var(--text-faint); cursor:pointer;
    font:inherit; font-size:11px; padding:2px 6px; border-radius:6px; }
  .th-srctoggle:hover{ color:var(--text); background:var(--surface); }
  .th-srclabel{ font-size:11px; font-weight:700; text-transform:uppercase; color:var(--text-faint); }
  .th-srclist{ display:flex; gap:6px; flex-wrap:wrap; flex:1; min-width:0; }
  .th-srclist.th-none{ color:var(--text-faint); }
  .th-src{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-pill);
    padding:3px 9px; font-size:11.5px; }
  .th-src-dim{ opacity:.5; text-decoration:line-through; }
  .th-srcwarn{ width:100%; font-size:11.5px; color:var(--text-faint); }
  .th-scroll{ flex:1; overflow:auto; display:flex; flex-direction:column; gap:14px;
    padding:4px 2px 14px; min-height:220px; }
  /* Cap the measure. The pane grows with the window; a line of prose should not.
     Each turn takes the full 760px column and aligns its own bubble inside it, so
     the left and right sides of the conversation survive the centring. */
  .th-main .th-scroll > *{ max-width:760px; width:100%; margin-left:auto; margin-right:auto; }
  .th-main .th-msg{ align-self:auto; }
  .th-main .th-msg.th-user{ align-items:flex-end; }
  .th-main .th-msg.th-assistant{ align-items:flex-start; }
  .th-main .th-msg .th-text{ max-width:88%; }
  .th-main .th-composer{ max-width:760px; width:100%; margin-left:auto; margin-right:auto; }
  .th-msg{ max-width:82%; display:flex; flex-direction:column; gap:5px; }
  .th-msg.th-user{ align-self:flex-end; align-items:flex-end; }
  .th-msg.th-assistant{ align-self:flex-start; }
  .th-who{ font-size:11px; font-weight:700; color:var(--text-faint); text-transform:lowercase; }
  .th-text{ border-radius:var(--r-card); padding:11px 14px; font-size:13.5px; line-height:1.6;
    overflow-wrap:anywhere; }
  .th-user .th-text{ background:var(--accent-soft); color:var(--accent-ink); }
  .th-assistant .th-text{ background:var(--surface); border:1px solid var(--border); color:var(--text); }
  .th-md h1, .th-md h2, .th-md h3{ font-size:14px; margin:10px 0 4px; }
  .th-md p{ margin:0 0 8px; }
  .th-md ul, .th-md ol{ margin:0 0 8px 18px; }
  .th-msg-acts{ display:flex; gap:6px; opacity:0; transition:opacity .12s ease; }
  .th-msg:hover .th-msg-acts, .th-msg:focus-within .th-msg-acts{ opacity:1; }
  .th-empty{ color:var(--text-faint); font-size:13px; text-align:center; padding:18px 0 6px; }
  .th-starters{ display:flex; flex-wrap:wrap; gap:7px; padding-top:6px; }
  .th-starters .hs-group-label{ width:100%; }
  .th-composer{ display:flex; gap:8px; align-items:flex-end; padding:12px 0 16px;
    border-top:1px solid var(--border); background:var(--surface); position:sticky; bottom:0; }
  .th-composer textarea{ flex:1; resize:none; min-height:42px; max-height:150px; }
  /* The lightning bolt: a pill that is plainly on or off, with its word beside the icon. */
  .th-fast{ display:flex; align-items:center; gap:5px; height:38px; padding:0 12px; flex:none;
    border:1px solid var(--border); background:var(--surface); border-radius:var(--r-pill);
    font:inherit; font-size:12.5px; font-weight:650; color:var(--text-faint); cursor:pointer;
    transition:background .12s, color .12s, border-color .12s; }
  .th-fast svg{ width:15px; height:15px; }
  .th-fast:hover{ color:var(--text); border-color:var(--text-faint); }
  .th-fast.on{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink); }
  .th-fast.on svg{ fill:currentColor; }
  .th-stop{ display:flex; align-items:center; gap:6px; }
  .th-stop svg{ width:13px; height:13px; fill:currentColor; }
  .th-live-status{ display:flex; align-items:center; gap:8px; min-width:0; font-size:12.5px;
    color:var(--text-faint); }
  .th-live-status:empty{ display:none; }
  .th-think-line{ max-width:68ch; min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; font-style:italic; }
  .th-think-line b{ font-style:normal; font-weight:650; color:var(--text-muted); margin-right:3px; }
  .th-spin{ width:12px; height:12px; flex:none; border-radius:50%; border:2px solid var(--surface-3);
    border-top-color:var(--accent); animation:hs-spin .7s linear infinite; display:block; }
  .th-live-text:empty{ display:none; }
  .th-caret{ display:inline-block; width:7px; height:1em; margin-left:2px; vertical-align:-2px;
    background:var(--accent); border-radius:2px; animation:th-blink 1s steps(2, start) infinite; }
  @keyframes th-blink{ to{ visibility:hidden; } }
  .th-stopped{ font-size:11.5px; font-weight:650; color:var(--text-faint); margin-top:4px; }
  .th-picker{ overflow:auto; }
  .hs-none{ color:var(--text-faint); font-size:12.5px; padding:4px 0; }
  @media (max-width:640px){ .th-msg{ max-width:94%; } }

  /* Files whose text matched, shown under the ones whose names did. */
  .files-inside{ display:flex; flex-direction:column; gap:8px; margin-bottom:18px; }
  .files-inside-row{ display:flex; align-items:flex-start; gap:12px; text-align:left;
    width:100%; padding:11px 13px; border:1px solid var(--border); background:var(--surface);
    border-radius:var(--r-card); cursor:pointer; }
  .files-inside-row:hover{ background:var(--surface-2); }
  .files-inside-snip{ font-size:12.5px; color:var(--text-muted); line-height:1.5;
    margin:3px 0 2px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; }
  .files-result-banner{ display:flex; align-items:center; gap:10px; flex-wrap:wrap;
    background:var(--accent-soft); border:1px solid var(--accent); border-radius:var(--r-card);
    padding:11px 14px; margin-bottom:16px; font-size:13px; }
  .files-result-banner .fr-count{ font-weight:700; color:var(--accent-ink); }
  .files-result-banner .fr-scope{ color:var(--text-muted); flex:1; }
  .files-result-banner .btn{ margin-left:auto; }

  .input-search .search-clear{ border:none; background:transparent; cursor:pointer; padding:0 2px;
    color:var(--text-faint); font-size:13px; line-height:1; font-family:inherit; flex:none; }
  .input-search .search-clear:hover{ color:var(--text); }

  .cp-crumb-link{ border:none; background:transparent; color:var(--accent); font-size:13px;
    font-weight:500; cursor:pointer; padding:2px 5px; border-radius:var(--r-sm); font-family:inherit; }
  .cp-crumb-link:hover{ text-decoration:underline; }
  .cp-crumb-cur{ color:var(--text-muted); padding:2px 5px; border-radius:var(--r-sm); }

  /* ---------- Calendar rebuild ---------- */
  .cal-layout{ display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px; align-items:start; }
  .cal-main{ min-width:0; }
  .cal-rail{ display:flex; flex-direction:column; gap:16px; }
  #main:has(.cal-grid) .cal-layout{ flex:1; min-height:0; }
  #main:has(.cal-grid) .cal-main{ display:flex; flex-direction:column; min-height:0; }
  /* let 1fr rows govern height so the month still fits the window */
  #main:has(.cal-grid) .cal-cell{ min-height:0; }

  .cal-ev{ display:flex; flex-direction:column; gap:2px; font-size:10.5px; line-height:1.35; padding:4px 6px;
    border-radius:6px; border-left:3px solid var(--c, var(--accent)); background:var(--surface-2);
    overflow:hidden; cursor:pointer; }
  .cal-ev:hover{ background:var(--surface-3); }
  .cal-ev.done{ opacity:.55; }
  .cal-ev.done .cal-ev-title{ text-decoration:line-through; }
  /* the time leads the chip, so it wraps the title in a baseline row rather than its own line */
  .cal-ev-line{ display:flex; align-items:baseline; gap:4px; min-width:0; }
  .cal-ev-time{ flex:none; font-size:10px; font-weight:500; color:var(--text-muted); font-variant-numeric:tabular-nums; }
  .cal-ev-title{ font-weight:600; font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-ev-cls{ color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cal-ev-kind{ font-size:9px; font-weight:700; padding:1px 6px; border-radius:var(--r-pill); align-self:flex-start; }
  /* one line instead of three, so more of the day fits in the cell */
  .cal-ev.simple{ padding:3px 6px; }
  .cal-more{ font-size:10px; color:var(--text-faint); padding-left:3px; }
  .cal-cell.sel{ box-shadow:inset 0 0 0 2px var(--accent); }

  .cal-week{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
  .cal-week-col{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md);
    min-height:260px; display:flex; flex-direction:column; cursor:pointer; overflow:hidden; }
  .cal-week-col.today{ border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); }
  .cal-week-head{ display:flex; align-items:baseline; justify-content:space-between; padding:9px 10px;
    border-bottom:1px solid var(--border); background:var(--surface-2); }
  .cal-week-dow{ font-size:10.5px; font-weight:700; color:var(--text-faint); text-transform:uppercase; letter-spacing:.05em; }
  .cal-week-num{ font-size:14px; font-weight:700; }
  .cal-week-body{ padding:8px; display:flex; flex-direction:column; gap:4px; overflow-y:auto; }
  .cal-week-empty{ color:var(--text-faint); font-size:12px; text-align:center; padding-top:8px; }

  .cal-legend{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:13px; cursor:pointer; }
  .cal-legend input{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
  .cal-legend-sw{ width:12px; height:12px; border-radius:4px; flex:none; }

  @media (max-width:1200px){ .cal-layout{ grid-template-columns:minmax(0,1fr); } }

  /* ---------- Assignments table ---------- */
  .seg-tabs{ display:inline-flex; background:var(--surface-2); border-radius:var(--r-md); padding:3px; gap:2px; }
  .seg-tab{ border:none; background:transparent; padding:7px 15px; border-radius:7px; font-size:13px; font-weight:600;
    color:var(--text-muted); cursor:pointer; font-family:inherit; }
  .seg-tab.active{ background:var(--accent-soft); color:var(--accent-ink); }

  .asg-toolbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .asg-toolbar-right{ display:flex; align-items:center; gap:10px; }
  /* Same construction as the sidebar and notes search: a filled grey field with
     the icon inside. White on a grey page read as a floating outline, not a box
     you can type in. */
  .input-search{ display:flex; align-items:center; gap:8px; background:var(--surface-2);
    border:1px solid var(--border); border-radius:var(--r-md); padding:8px 10px; min-width:240px; }
  .input-search:focus-within{ border-color:var(--accent); background:var(--surface); }
  .input-search .ic{ color:var(--text-faint); width:16px; height:16px; flex:none; display:flex; }
  .input-search .ic svg{ width:16px; height:16px; }
  .input-search input{ border:none; outline:none; background:transparent; font-size:12.5px;
    color:var(--text); width:100%; min-width:0; padding:0; font-family:inherit; }
  .input-search input::placeholder{ color:var(--text-faint); }

  .asg-filters{ display:flex; gap:4px; background:var(--surface-2); border-radius:var(--r-md); padding:4px;
    margin-bottom:16px; width:fit-content; flex-wrap:wrap; }
  .asg-filter{ border:none; background:transparent; padding:7px 14px; border-radius:7px; font-size:12.5px; font-weight:600;
    color:var(--text-muted); cursor:pointer; font-family:inherit; }
  .asg-filter:hover{ color:var(--text); }
  .asg-filter.active{ background:var(--accent-soft); color:var(--accent-ink); }

  .asg-expand{ display:flex; gap:16px; justify-content:flex-end; margin-bottom:10px; }
  .link-btn{ border:none; background:transparent; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; padding:0; }
  .link-btn:hover{ text-decoration:underline; }

  .asg-bulk{ display:flex; align-items:center; gap:10px; background:var(--accent-soft); border-radius:var(--r-md);
    padding:9px 14px; margin-bottom:14px; font-size:13px; font-weight:600; color:var(--accent-ink); }
  .asg-bulk .btn{ box-shadow:none; }

  .asg-card{ padding:0; overflow:hidden; }
  .asg-row{ display:grid; grid-template-columns:38px minmax(0,2.4fr) minmax(0,1fr) 1.1fr .9fr 1fr .7fr 40px;
    align-items:center; gap:10px; padding:11px 16px; border-bottom:1px solid var(--border); }
  .asg-row.no-course{ grid-template-columns:38px minmax(0,2.4fr) 1.1fr .9fr 1fr .7fr .7fr 40px; }
  .asg-row.has-grade:not(.no-course){ grid-template-columns:38px minmax(0,2.4fr) minmax(0,1fr) 1.1fr .9fr 1fr .7fr .7fr 40px; }
  .asg-row:last-child{ border-bottom:none; }
  .asg-row:not(.asg-head):hover{ background:var(--surface-2); }
  .asg-head{ background:var(--surface-2); border-bottom:1px solid var(--border); padding-top:9px; padding-bottom:9px; }
  .asg-th{ border:none; background:transparent; text-align:left; font-size:11.5px; font-weight:600; color:var(--text-muted);
    cursor:pointer; font-family:inherit; padding:0; }
  .asg-th:hover{ color:var(--text); }
  .asg-th.active{ color:var(--text); }
  .asg-check{ display:flex; align-items:center; justify-content:flex-start; }
  .asg-check input{ width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
  .asg-cell{ min-width:0; font-size:13px; }
  .asg-name{ cursor:pointer; }
  .asg-title{ font-weight:600; font-size:13.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .asg-name:hover .asg-title{ color:var(--accent); }
  .asg-sub{ font-size:12px; color:var(--text-muted); margin-top:1px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .asg-course{ display:flex; align-items:center; gap:7px; overflow:hidden; }
  .asg-course span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .asg-due{ color:var(--text-muted); }
  .asg-due.is-over{ color:var(--danger); font-weight:600; }
  .asg-weight{ text-align:right; color:var(--text-muted); }
  .asg-grade{ text-align:right; color:var(--text-muted); }

  /* Inline grade / weight editing. The cell is a real button so it reads as
     clickable even when it's empty, which is exactly when you most want to click it. */
  .inline-num{ border:1px solid transparent; background:transparent; font:inherit; font-size:13px;
    color:inherit; padding:3px 8px; border-radius:8px; cursor:pointer; text-align:right; min-width:52px;
    font-variant-numeric:tabular-nums; font-weight:600; font-family:inherit;
    transition:background .12s ease, border-color .12s ease, color .12s ease; }
  .inline-num:hover{ background:var(--surface-3); border-color:var(--border); color:var(--text); }
  .inline-num:focus-visible{ outline:2px solid var(--accent); outline-offset:1px; }
  .inline-num.empty{ color:var(--text-faint); font-weight:500; }
  .inline-num.empty:hover{ background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); }
  .inline-num.editing{ padding:0; border-color:var(--accent); background:var(--surface);
    box-shadow:0 0 0 3px var(--accent-soft); }
  .inline-num.bad{ border-color:var(--danger); background:var(--danger-soft); box-shadow:none; }
  .inline-num-input{ width:100%; border:none; background:transparent; font:inherit; font-size:13px;
    font-weight:600; color:var(--text); padding:3px 8px; border-radius:8px; text-align:right;
    outline:none; font-variant-numeric:tabular-nums; }
  .inline-num-input::placeholder{ font-weight:500; color:var(--text-faint); }
  .inline-cat{ border:1px solid transparent; background:transparent; font:inherit; font-size:13px;
    color:var(--text-muted); padding:3px 8px; border-radius:8px; cursor:pointer; text-align:right;
    font-family:inherit; font-variant-numeric:tabular-nums; }
  .inline-cat:hover{ background:var(--surface-3); border-color:var(--border); color:var(--text); }
  .asg-row-menu{ padding:4px 6px; font-size:15px; line-height:1; color:var(--text-faint); box-shadow:none; }

  .type-pill{ display:inline-block; font-size:11.5px; font-weight:600; padding:3px 10px; border-radius:var(--r-pill); white-space:nowrap; }
  .status-pill{ border:none; font-size:11.5px; font-weight:600; padding:4px 11px; border-radius:var(--r-pill);
    cursor:pointer; font-family:inherit; white-space:nowrap; }
  .ws-todo{ background:var(--surface-3); color:var(--text-muted); }
  .ws-prog{ background:#E8EFFE; color:#2456C7; }
  .ws-done{ background:var(--success-soft); color:var(--success); }
  .ws-over{ background:var(--danger-soft); color:var(--danger); }

  .asg-foot{ display:flex; align-items:center; justify-content:space-between; gap:12px; padding:12px 16px; }
  .asg-pager{ display:flex; gap:4px; }
  .asg-page{ border:1px solid var(--border); background:var(--surface); color:var(--text-muted); min-width:30px; height:30px;
    border-radius:var(--r-sm); font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; }
  .asg-page.active{ background:var(--accent-soft); color:var(--accent-ink); border-color:transparent; }

  .asg-group{ background:var(--surface); border:1px solid var(--border); border-left:3px solid var(--c, var(--accent));
    border-radius:var(--r-card); box-shadow:var(--shadow-card); margin-bottom:14px; overflow:hidden; }
  .asg-group-head{ display:flex; align-items:center; gap:10px; padding:14px 16px; cursor:pointer; }
  .asg-group-code{ font-size:15px; font-weight:700; }
  .asg-group-name{ font-size:14px; color:var(--text-muted); flex:1; }
  .asg-group-count{ font-size:13px; color:var(--text-muted); }
  .asg-group-chev{ color:var(--text-faint); font-size:13px; }
  .asg-group-body{ border-top:1px solid var(--border); }

  @media (max-width:1150px){
    .asg-row, .asg-row.no-course, .asg-row.has-grade:not(.no-course){ grid-template-columns:34px minmax(0,2fr) 1fr .9fr 40px; }
    /* Grade is the column you came here to touch, so it survives the squeeze. */
    .asg-col-course, .asg-col-type, .asg-col-status, .asg-col-weight{ display:none; }
  }

  /* ---------- Class page ---------- */
  .cp-crumbs{ display:flex; align-items:center; gap:7px; margin-bottom:10px; font-size:13px; }
  .cp-crumb-back{ border:none; background:transparent; color:var(--accent); font-size:13px; font-weight:500; cursor:pointer; padding:0; font-family:inherit; }
  .cp-crumb-back:hover{ text-decoration:underline; }
  .cp-crumb-sep{ color:var(--text-faint); }
  .cp-crumb-cur{ color:var(--text-muted); }
  .cp-title{ display:flex; align-items:center; gap:11px; }
  .cp-title h1{ font-size:26px; }
  .cp-title .dot{ width:11px; height:11px; }
  .cp-subtitle{ font-size:16px; color:var(--text-muted); margin-top:2px; margin-left:22px; }
  .cp-meta{ font-size:13px; color:var(--text-faint); margin-top:6px; margin-left:22px; }

  .cp-tabbar{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    border-bottom:1px solid var(--border); margin-bottom:20px; flex-wrap:wrap; }
  .cp-tabs{ display:flex; gap:2px; }
  .cp-tab{ border:none; background:transparent; padding:11px 14px; font-size:13.5px; font-weight:600;
    color:var(--text-muted); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; font-family:inherit; }
  .cp-tab:hover{ color:var(--text); }
  .cp-tab.active{ color:var(--accent); border-bottom-color:var(--accent); }
  .cp-tab-actions{ display:flex; gap:8px; padding-bottom:8px; }

  .cp-grid{ display:grid; grid-template-columns:minmax(0,1.75fr) minmax(0,1fr); gap:18px; align-items:start; }
  .cp-main{ display:flex; flex-direction:column; gap:18px; min-width:0; }
  .cp-side{ display:flex; flex-direction:column; gap:18px; min-width:0; }

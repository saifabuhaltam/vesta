  .cp-row{ display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .cp-row:last-child{ border-bottom:none; padding-bottom:2px; }
  .cp-row:hover .cp-row-title{ color:var(--accent); }
  .cp-row-ic{ width:36px; height:36px; border-radius:var(--r-sm); flex:none; display:flex; align-items:center; justify-content:center; }
  .cp-row-ic svg{ width:18px; height:18px; }
  .cp-row-title{ font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cp-row-sub{ font-size:12px; color:var(--text-muted); margin-top:1px; }
  .cp-row-date{ font-size:12.5px; color:var(--text-muted); flex:none; }
  .cp-empty{ font-size:13px; color:var(--text-faint); padding:6px 0 2px; }

  .left-pill{ font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:var(--r-pill); flex:none; }
  .left-pill.danger{ background:var(--danger-soft); color:var(--danger); }
  .left-pill.accent{ background:var(--accent-soft); color:var(--accent-ink); }

  .cp-info-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:14px; padding:7px 0; font-size:13px; }
  .cp-info-k{ color:var(--text-muted); flex:none; }
  .cp-info-v{ text-align:right; font-weight:500; min-width:0; overflow-wrap:anywhere; }
  .cp-dim{ color:var(--text-faint); font-weight:400; }

  .cp-progress-bar{ height:8px; border-radius:var(--r-pill); background:var(--surface-2); overflow:hidden; }
  .cp-progress-bar span{ display:block; height:100%; background:var(--success); border-radius:var(--r-pill); }
  .cp-progress-pct{ margin-top:7px; font-size:12.5px; color:var(--text-muted); }

  .cp-link{ display:flex; align-items:center; gap:11px; padding:9px 0; border-bottom:1px solid var(--border); cursor:pointer; }
  .cp-link:last-child{ border-bottom:none; padding-bottom:2px; }
  .cp-link-ic{ width:30px; height:30px; border-radius:var(--r-sm); background:var(--accent-soft); color:var(--accent);
    display:flex; align-items:center; justify-content:center; flex:none; }
  .cp-link-ic svg{ width:16px; height:16px; }
  .cp-link-label{ flex:1; font-size:13.5px; font-weight:500; }
  .cp-link:hover .cp-link-label{ color:var(--accent); }
  .cp-link-chev{ color:var(--text-faint); font-size:17px; line-height:1; flex:none; }

  .cp-menu-wrap{ position:relative; }
  .cp-menu-btn{ font-size:17px; line-height:1; padding:6px 10px; }
  .cp-menu{ position:absolute; top:100%; right:0; margin-top:4px; min-width:214px; z-index:20;
    background:var(--surface); border:1px solid var(--border); border-radius:var(--r-md); box-shadow:var(--shadow-pop); padding:5px; }
  .cp-menu button{ display:block; width:100%; text-align:left; border:none; background:transparent;
    padding:8px 10px; border-radius:var(--r-sm); font-size:13px; font-family:inherit; color:var(--text); cursor:pointer; }
  .cp-menu button:hover{ background:var(--surface-2); }
  .cp-menu button.danger{ color:var(--danger); font-weight:600; }
  .cp-menu button.danger:hover{ background:color-mix(in srgb, var(--danger) 12%, transparent); }
  /* Named groups, so the menu reads as a few short lists rather than one long one. */
  .cp-menu-label{ padding:8px 10px 3px; font-size:10.5px; font-weight:700; letter-spacing:.07em;
    text-transform:uppercase; color:var(--text-faint); }
  .cp-menu-label:first-child{ padding-top:4px; }
  .cp-menu-sep{ height:1px; background:var(--border); margin:5px 8px; }

  @media (max-width:1100px){ .cp-grid{ grid-template-columns:minmax(0,1fr); } }

  /* ---------- Class library (Files page) ---------- */
  .lib-section{ margin-bottom:18px; border:1px solid var(--border); border-radius:var(--r-card); background:var(--surface); box-shadow:var(--shadow-card); overflow:hidden; }
  .lib-summary{ display:flex; align-items:center; gap:10px; padding:14px 18px; cursor:pointer; list-style:none; font-weight:700; font-size:14.5px; }
  .lib-summary::-webkit-details-marker{ display:none; }
  .lib-summary::before{ content:"▸"; color:var(--text-faint); font-size:11px; width:10px; flex:none; }
  .lib-section[open] .lib-summary::before{ content:"▾"; }
  .lib-summary .hint{ margin-left:auto; font-weight:500; }
  .lib-body{ padding:4px 18px 18px; border-top:1px solid var(--border); }
  .lib-body .file-cat-title{ margin-top:14px; }
  .lib-body .file-cat-title:first-child{ margin-top:10px; }
  .lib-topic-row{ display:flex; align-items:center; gap:8px; padding:6px 2px; font-size:13px; }
  .lib-topic-row .lt-mark{ width:14px; flex:none; text-align:center; color:var(--success); }
  .lib-topic-row.undone .lt-mark{ color:var(--text-faint); }
  .lib-topic-row.undone .lt-text{ color:var(--text-muted); }

  /* ---------------- calendar feeds ---------------- */
  .feed-row{ display:flex; align-items:center; gap:10px; padding:8px 2px; cursor:pointer;
    font-size:13px; font-weight:600; }
  .feed-row input{ width:16px; height:16px; accent-color:var(--accent); cursor:pointer; flex:none; }
  .feed-row input:disabled{ cursor:default; }
  .feed-dot{ width:10px; height:10px; border-radius:50%; flex:none; }
  .feed-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* ---------------- semesters ---------------- */
  /* Terms live entirely in Settings. Nothing about them belongs in the sidebar, which
     is for navigation: which term you are in changes rarely, and changing it is a
     deliberate trip to Settings rather than something to trip over while moving
     between screens. */

  /* The one exception, because it is a warning rather than a control: reading an
     archived term should feel different from working in a live one. */
  .term-banner{ display:flex; align-items:center; gap:12px; flex-wrap:wrap;
    background:var(--warn-soft); border:1px solid var(--warn); color:var(--warn);
    border-radius:14px; padding:10px 14px; margin:0 0 14px; font-size:13px; font-weight:600; }
  .term-banner .tb-text{ flex:1; min-width:200px; }
  .term-banner .tb-text b{ font-weight:800; }
  .term-banner.unlocked{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }

  /* The term list in Settings. Every term is a readable row with its actions in the
     open, rather than a select plus a menu: this is the one screen where the whole
     shape of the year should be visible at once. */
  .term-row{ display:flex; align-items:center; gap:10px; padding:10px 0;
    border-bottom:1px solid var(--border); flex-wrap:wrap; }
  .term-row:last-child{ border-bottom:0; }
  .term-row .tr-main{ flex:1; min-width:160px; }
  .term-row .tr-name{ font-weight:700; display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .term-row .tr-meta{ font-size:12px; color:var(--text-muted); margin-top:2px; }
  .term-row .tr-actions{ display:flex; gap:6px; flex-wrap:wrap; }
  .term-row.is-current{ background:var(--accent-soft); border-radius:12px;
    padding-left:12px; padding-right:12px; margin:2px -12px; border-bottom-color:transparent; }
  .tp-tag{ font-size:10px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
    padding:2px 7px; border-radius:999px; background:var(--surface-3); color:var(--text-muted); }
  .tp-tag.now{ background:var(--accent); color:#fff; }

  .gpa-term{ display:flex; align-items:center; gap:10px; padding:7px 0; }
  .gpa-term .gt-name{ width:104px; font-size:12px; font-weight:700; flex:none;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gpa-term .gt-val{ width:46px; text-align:right; font-variant-numeric:tabular-nums;
    font-size:13px; font-weight:700; }
  .gpa-term.is-now .gt-name{ color:var(--accent); }
  .gpa-cume{ display:flex; align-items:baseline; justify-content:space-between;
    padding:10px 0 4px; border-bottom:1px solid var(--border); margin-bottom:6px; }
  .gpa-cume .gc-val{ font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; }
  .gpa-cume .gc-lbl{ font-size:12px; color:var(--text-muted); font-weight:600; }
  /* ---- Settings: follows reference/settings inspo.png ----
     Sections down the side with an icon and a one-line summary, and each section a
     stack of cards on the page background, so the modal reads like the app itself:
     a nav column beside a content area. The body has a fixed height so switching
     sections never makes the window jump. */
  .settings-modal{ max-width:1000px; width:min(94vw,1000px); overflow:hidden; }
  .settings-body{ display:flex; height:min(680px, calc(100vh - 170px)); }
  .set-nav{ flex:0 0 264px; border-right:1px solid var(--border); padding:22px 12px 14px;
            overflow-y:auto; display:flex; flex-direction:column; gap:3px; }
  .set-nav-head{ padding:0 10px 16px; }
  .set-nav-head h2{ font-size:22px; font-weight:800; margin:0; }
  .set-nav-head p{ font-size:13px; color:var(--text-muted); margin:4px 0 0; }
  .set-nav-btn{ display:flex; align-items:flex-start; gap:12px; text-align:left; padding:11px 12px;
                border-radius:12px; border:none; background:transparent; cursor:pointer; font:inherit;
                color:var(--text); transition:background .12s ease; }
  .set-nav-btn:hover{ background:var(--surface-2); }
  .set-nav-btn.active{ background:var(--accent-soft); }
  .set-nav-ic{ flex:none; width:20px; height:20px; margin-top:1px; color:var(--text-muted); }
  .set-nav-ic svg{ width:20px; height:20px; }
  .set-nav-btn.active .set-nav-ic, .set-nav-btn.active .set-nav-lbl{ color:var(--accent); }
  .set-nav-lbl{ display:block; font-size:13.5px; font-weight:600; }
  .set-nav-sub{ display:block; font-size:12px; color:var(--text-muted); margin-top:2px; line-height:1.35; }
  .set-pane{ flex:1 1 auto; min-width:0; padding:24px 26px 28px; overflow-y:auto; background:var(--bg); }
  .set-pane-head{ display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .set-pane-head h3{ margin:0; font-size:22px; font-weight:800; }
  .set-pane-head p{ color:var(--text-muted); font-size:13.5px; margin:4px 0 0; }
  .set-avatar{ width:56px; height:56px; border-radius:50%; flex:none; display:flex; align-items:center;
               justify-content:center; background:var(--accent-soft); color:var(--accent);
               font-size:19px; font-weight:800; letter-spacing:.02em; }

  .st-card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--r-card);
             box-shadow:var(--shadow-card); padding:18px 20px; }
  .st-card + .st-card{ margin-top:14px; }
  .st-card-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px; }
  .st-card-title{ font-size:15px; font-weight:700; }
  .st-card-sub{ font-size:12.5px; color:var(--text-muted); margin-top:2px; }
  .st-card-head:last-child{ margin-bottom:0; }
  .st-card-head > .btn{ flex:none; white-space:nowrap; }
  .set-sub{ font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
            color:var(--text-muted); margin:18px 0 8px; }

  .st-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:14px; }
  .set-field{ display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:600; color:var(--text); min-width:0; }
  .set-field .hint{ font-weight:400; }
  .set-input{ position:relative; }
  .set-input input{ padding-right:38px; }
  .set-input-btn{ position:absolute; right:4px; top:50%; transform:translateY(-50%); width:30px; height:30px;
                  display:flex; align-items:center; justify-content:center; border:none; background:transparent;
                  color:var(--text-faint); border-radius:8px; cursor:pointer; padding:0; }
  .set-input-btn:hover{ color:var(--text); background:var(--surface-2); }
  .set-input-btn svg, .set-input-lock svg{ width:16px; height:16px; }
  .set-input-lock{ position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-faint);
                   display:flex; pointer-events:none; }
  .set-input input[readonly]{ background:var(--surface-2); color:var(--text-muted); cursor:default; }
  .set-actions{ display:flex; justify-content:flex-end; gap:8px; flex-wrap:wrap; margin-top:14px; }
  .set-msg{ margin-bottom:14px; }

  .set-row{ display:flex; align-items:center; justify-content:space-between; gap:18px;
            padding:12px 0; border-bottom:1px solid var(--border); }
  .set-row:first-child{ padding-top:0; }
  .set-row:last-child{ border-bottom:none; padding-bottom:0; }
  .set-label{ font-weight:600; font-size:13px; }
  .set-help{ font-size:12px; color:var(--text-muted); margin-top:2px; max-width:50ch; }
  .set-control{ flex:0 0 auto; display:flex; align-items:center; gap:8px; }
  .set-control input[type=number]{ width:84px; }

  /* A switch, built on the real checkbox so the change-to-save wiring stays as it was. */
  input[type=checkbox].set-switch{ -webkit-appearance:none; appearance:none; margin:0; flex:none; cursor:pointer;
    width:42px; height:24px; border-radius:var(--r-pill); background:var(--surface-3); position:relative;
    transition:background .15s ease; }
  input[type=checkbox].set-switch::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px;
    border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(16,24,40,.25); transition:transform .15s ease; }
  input[type=checkbox].set-switch:checked{ background:var(--accent); }
  input[type=checkbox].set-switch:checked::after{ transform:translateX(18px); }
  input[type=checkbox].set-switch:disabled{ opacity:.45; cursor:default; }

  /* Theme picked from a small picture of each, rather than from two words. */
  .set-themes{ display:grid; grid-template-columns:repeat(2, minmax(0, 170px)); gap:12px; }
  .set-theme{ border:2px solid var(--border); border-radius:14px; padding:8px; background:var(--surface);
              cursor:pointer; font:inherit; text-align:left; color:var(--text); }
  .set-theme:hover{ border-color:var(--text-faint); }
  .set-theme.active{ border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .set-theme-pic{ display:flex; gap:5px; height:64px; border-radius:9px; padding:6px; margin-bottom:8px; }
  .set-theme-pic i{ display:block; border-radius:5px; }
  .set-theme-pic .sb{ width:24%; }
  .set-theme-pic .main{ flex:1; display:flex; flex-direction:column; gap:5px; }
  .set-theme-pic .main i{ flex:1; }
  .set-theme-pic.light{ background:#F4F5F7; } .set-theme-pic.light .sb{ background:#E7E8EC; }
  .set-theme-pic.light .main i{ background:#FFFFFF; }
  .set-theme-pic.dark{ background:#17171D; } .set-theme-pic.dark .sb{ background:#24252F; }
  .set-theme-pic.dark .main i{ background:#1E1F27; }
  .set-theme-lbl{ font-size:13px; font-weight:600; padding:0 2px 2px; }

  .set-device{ display:flex; align-items:center; gap:14px; }
  .set-device-ic{ width:38px; height:38px; border-radius:10px; background:var(--surface-2); color:var(--text-muted);
                  display:flex; align-items:center; justify-content:center; flex:none; }
  .set-device-ic svg{ width:19px; height:19px; }
  .set-device-main{ flex:1; min-width:0; }
  .set-device-name{ font-size:13.5px; font-weight:600; }
  .set-device-meta{ font-size:12px; color:var(--success); margin-top:2px; }
  .set-scale{ display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); column-gap:18px; }
  .nt-body{ font-size:var(--editor-font-size, 16px); }
  @media (max-width:720px){
    .settings-body{ flex-direction:column; height:auto; max-height:calc(100vh - 150px); }
    .set-nav{ flex:0 0 auto; flex-direction:row; overflow-x:auto; padding:12px;
              border-right:none; border-bottom:1px solid var(--border); }
    .set-nav-head, .set-nav-sub{ display:none; }
    .set-nav-btn{ align-items:center; gap:8px; white-space:nowrap; padding:9px 12px; }
    .set-pane{ padding:18px 16px 22px; }
    .set-pane-head h3{ font-size:19px; }
    .set-avatar{ width:44px; height:44px; font-size:16px; }
    .set-row{ flex-direction:column; align-items:flex-start; gap:8px; }
  }

  /* ---------- Phones ----------
     Vesta was built for a laptop: a 240px sidebar beside a 1120px page. On a phone
     that leaves about 90px of usable width, so below 820px the sidebar becomes a
     drawer, a top bar carries the way into it, and the page gets the whole screen.
     Nothing is removed and nothing moves somewhere new -- the same nav, the same
     pages, reachable with a thumb. */

  .m-top{ display:none; }

  @media (max-width:820px){
    .tiles{ grid-template-columns:repeat(2,minmax(0,1fr)); }
    /* dvh, so the iOS address bar appearing does not cut the page off */
    #app{ height:100vh; height:100dvh; }

    .m-top{
      display:flex; align-items:center; gap:10px;
      position:fixed; top:0; left:0; right:0; height:56px; z-index:55;
      padding:0 12px; background:var(--surface);
      border-bottom:1px solid var(--border);
    }
    .m-top .m-brand{ display:flex; align-items:center; gap:8px; font-weight:800;
      font-size:17px; letter-spacing:-0.01em; }
    .m-top .m-brand img{ width:24px; height:24px; object-fit:contain; }
    .m-btn{
      width:40px; height:40px; flex:none; border-radius:var(--r-md);
      border:1px solid var(--border); background:var(--surface); color:var(--text);
      display:flex; align-items:center; justify-content:center; cursor:pointer;
      box-shadow:var(--shadow-card);
    }
    .m-btn svg{ width:19px; height:19px; }
    .m-top .m-spacer{ flex:1; }

    /* the sidebar, as a drawer */
    #sidebar{
      position:fixed; top:0; bottom:0; left:0; width:272px; z-index:70;
      transform:translateX(-100%); transition:transform .18s ease;
      box-shadow:none; padding-top:16px;
    }
    #app.nav-open #sidebar{ transform:none; box-shadow:0 0 40px rgba(0,0,0,.25); }
    #app.side-collapsed #sidebar{ width:272px; padding:16px 14px; }   /* the rail makes no sense here */
    #app.side-collapsed .brand-mark > span,
    #app.side-collapsed .tab-btn .lbl,
    #app.side-collapsed .nav-extra .lbl,
    #app.side-collapsed .side-search span:not(.ic),
    #app.side-collapsed .sync-row span:not(.sync-dot){ display:inline; }
    #app.side-collapsed .tab-btn,
    #app.side-collapsed .nav-extra,
    #app.side-collapsed .side-search{ justify-content:flex-start; padding-left:10px; padding-right:10px; }
    .side-toggle{ display:none; }

    .m-scrim{
      position:fixed; inset:0; z-index:65; background:rgba(15,17,21,.44);
      opacity:0; pointer-events:none; transition:opacity .18s ease;
    }
    #app.nav-open .m-scrim{ opacity:1; pointer-events:auto; }

    /* the page itself */
    #main{ padding:68px 16px 90px; }
    #main > *{ max-width:none; }
    #view-header{ flex-direction:column; gap:6px; }
    #view-header h1{ font-size:21px; }
    .header-right{ width:100%; justify-content:space-between; }
    #view-actions{ flex-wrap:wrap; justify-content:flex-start; }

    /* touch targets, and controls that fit the width they have */
    .btn{ min-height:38px; }
    .seg-tabs{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .seg-tabs::-webkit-scrollbar{ display:none; }

    /* modals become sheets: full width, anchored to the bottom, scrollable */
    .overlay{ align-items:flex-end; padding:0; }
    .modal, .modal.modal-wide, .dlg{
      max-width:none; width:100%; max-height:92vh; max-height:92dvh;
      border-radius:18px 18px 0 0; display:flex; flex-direction:column;
    }
    .modal-body{ overflow-y:auto; -webkit-overflow-scrolling:touch; }
    .modal-foot{ position:sticky; bottom:0; background:var(--surface); }
    .modal-foot .btn{ flex:1; justify-content:center; }

    /* the field rows that sit side by side on a laptop */
    .field-row{ grid-template-columns:1fr; }
  }

  @media (max-width:620px){
    /* The calendar.
       A seven column month grid on a 393px screen gives each day 46px, which is not
       a day, it is a stripe. Month and Week keep working -- the choice stays on
       screen, as every filter in this app does -- but the grid scrolls sideways
       inside its own box at a width where a date and a chip actually fit, and the
       page behind it does not move. The day panel and the legend stack underneath
       instead of sitting in a 290px column that no longer exists. */
    .cal-layout{ grid-template-columns:minmax(0,1fr); }
    #main:has(.cal-grid){ display:block; overflow:visible; }
    #main:has(.cal-grid) #view{ display:block; overflow:visible; }
    .cal-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
    .cal-grid{ min-width:620px; }
    #main:has(.cal-grid) .cal-grid{ grid-template-rows:auto repeat(6, minmax(84px, auto)); }

    /* the assignments table: the columns that do not earn their width go, and what
       is left reads as a row of cards rather than a squeezed spreadsheet */
    .asg-row, .asg-row.no-course, .asg-row.has-grade:not(.no-course){
      grid-template-columns:30px minmax(0,1fr) auto;
      row-gap:4px; padding:11px 10px;
    }
    .asg-head{ display:none; }
    .asg-col-course, .asg-col-type, .asg-col-weight, .asg-col-grade{ display:none; }
    .asg-col-due{ grid-column:2; font-size:11.5px; color:var(--text-muted); }
    .asg-col-status{ grid-column:3; grid-row:1; }
    .asg-row-menu{ grid-column:3; }

    /* one column everywhere a grid was doing two or three */
    .dash-row, .folder-grid, .file-grid, .cp-grid, .nt-card-grid,
    .set-modes, .th-start-items{ grid-template-columns:minmax(0,1fr) !important; }
    .tiles{ grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:18px; }
    .tiles .tile{ padding:12px; }
    .tiles.icon-tiles .tile{ gap:10px; }
    .tile .n{ font-size:22px; }

    .qz-q{ padding:13px 13px; }
    .learn-input{ font-size:16px; }          /* 16px or iOS zooms the page in */
    input, textarea, select{ font-size:16px; }
    .files-inside-row{ padding:10px; }
  }


</style>
</head>
<body>

<div id="app">
  <div class="m-top">
    <button type="button" class="m-btn" data-action="toggle-nav" aria-label="Menu" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="m-brand"><img src="/vesta-mark.png" alt="">Vesta</span>
    <span class="m-spacer"></span>
    <button type="button" class="m-btn" data-action="open-search" aria-label="Search" title="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.2-3.2"/></svg>
    </button>
  </div>
  <div class="m-scrim" data-action="close-nav"></div>
  <button type="button" class="side-toggle" id="side-toggle"
    data-action="toggle-sidebar" title="Collapse the sidebar" aria-label="Collapse the sidebar">‹</button>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark"><img src="/vesta-mark.png" alt="" class="brand-logo"><span>Vesta</span></div>
    </div>
    <button type="button" class="side-search" data-action="open-search"><span class="ic" data-icon="search"></span><span>Search…</span><span class="kbd">⌘K</span></button>
    <nav class="tabs" id="tabs">
      <!-- grouped by purpose: where you are, your coursework, your material, study tools -->
      <button class="tab-btn" data-action="switch-tab" data-tab="dashboard"><span class="ic" data-icon="home"></span><span class="lbl">Dashboard</span></button>
      <button class="tab-btn" data-action="switch-tab" data-tab="calendar"><span class="ic" data-icon="calendar"></span><span class="lbl">Calendar</span></button>
      <div class="side-divider" role="separator"></div>
      <button class="tab-btn" data-action="switch-tab" data-tab="classes"><span class="ic" data-icon="classes"></span><span class="lbl">Classes</span></button>
      <button class="tab-btn" data-action="switch-tab" data-tab="assignments"><span class="ic" data-icon="assignments"></span><span class="lbl">Assignments</span></button>
      <button class="tab-btn" data-action="switch-tab" data-tab="grades"><span class="ic" data-icon="grades"></span><span class="lbl">Grades</span></button>
      <div class="side-divider" role="separator"></div>
      <button class="tab-btn" data-action="switch-tab" data-tab="notes"><span class="ic" data-icon="notes"></span><span class="lbl">Notes</span></button>
      <button class="tab-btn" data-action="switch-tab" data-tab="files"><span class="ic" data-icon="files"></span><span class="lbl">Files</span></button>
      <div class="side-divider" role="separator"></div>
      <button class="tab-btn" data-action="switch-tab" data-tab="headstart"><span class="ic" data-icon="zap"></span><span class="lbl">Headstart</span></button>
      <button class="tab-btn" data-action="switch-tab" data-tab="study"><span class="ic" data-icon="cards"></span><span class="lbl">Study</span></button>
      <button class="tab-btn" data-action="switch-tab" data-tab="focus"><span class="ic" data-icon="focus"></span><span class="lbl">Focus</span></button>
    </nav>
    <div class="side-stats" id="side-stats"></div>
    <div class="side-foot">
      <button class="nav-extra" data-action="open-settings"><span class="ic" data-icon="settings"></span><span class="lbl">Settings</span></button>
      <div class="sync-row"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Connecting…</span></div>
    </div>
  </aside>
  <main id="main">
    <div id="term-banner"></div>
    <div id="view-header"></div>
    <div id="view-actions"></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<input type="file" id="item-file-input" multiple style="display:none;">
<div id="dialog-root"></div>
<div id="search-root"></div>
<div id="focus-root"></div>

<script>
(function(){
  "use strict";

  var classes = [];
  var events = [];
  var items = [];
  var termSettings = { name:'', startDate:'', endDate:'' };
  // Which term the app is showing, and every term there is. The server owns the
  // choice, so a second tab or a second device is never looking somewhere else.
  var semesters = [];
  var semester = null;
  var termLocked = false;
  var expandedItems = new Set();
  var activeTab = 'dashboard';
  var activeClassId = null;
  var openMenuId = null;
  var DOTS = '\u22EF';
  var calMonth = (function(){ var d=new Date(); d.setDate(1); d.setHours(0,0,0,0); return d; })();
  var calView = 'month';
  var hiddenClassIds = new Set();
  var hiddenEventTypes = new Set();
  var calSelectedDay = null;

  var TYPE_LABELS = { assignment:'Assignment', homework:'Homework', quiz:'Quiz', exam:'Exam', reading:'Reading', discussion:'Discussion', project:'Project', other:'Other' };
  var TYPE_ICON = { assignment:'▤', homework:'▤', quiz:'?', exam:'!', reading:'▥', discussion:'❝', project:'◆', other:'•' };
  var TYPE_PILL = {
    assignment:['#FFF1E6','#B4560D'], homework:['#E8EFFE','#2456C7'], quiz:['#E7F7EE','#18794E'],
    exam:['#FDE8E8','#C0342E'], reading:['#FEF6DF','#8A6005'], discussion:['#E4F2F4','#0F6E7A'],
    project:['#F3EBFE','#6D3FC4'], other:['#EEF0F4','#5B6472']
  };
  function typePillHtml(type){
    var t = TYPE_PILL[type] || TYPE_PILL.other;
    return '<span class="type-pill" style="background:'+t[0]+';color:'+t[1]+';">'+(TYPE_LABELS[type]||'Other')+'</span>';
  }
  // Stored item.status is 'todo' | 'in_progress' | 'done'. Overdue is derived, never stored.
  var WORK_STATUS = {
    todo:        { label:'Not started', cls:'ws-todo' },
    in_progress: { label:'In progress', cls:'ws-prog' },
    done:        { label:'Completed',   cls:'ws-done' },
    overdue:     { label:'Overdue',     cls:'ws-over' }
  };
  function workStatusKey(it){
    if(it.status==='done') return 'done';
    if(it.dueDate && diffDaysFromToday(it.dueDate) < 0) return 'overdue';
    return it.status==='in_progress' ? 'in_progress' : 'todo';
  }
  function statusPillHtml(it){
    var k = workStatusKey(it);
    var s = WORK_STATUS[k];
    return '<button type="button" class="status-pill '+s.cls+'" data-action="cycle-status" data-id="'+it.id+'" title="Click to change">'+s.label+'</button>';
  }

  // ---------------- line icons ----------------
  var ICONS = {
    home: '<path d="M3 10.2 12 3l9 7.2"/><path d="M5.6 9.2V20h12.8V9.2"/>',

  // Chip-sized time: drops ":00" on the hour so a grid cell spends its width on the title.

  function mdLite(text){

        html += '<h'+lvl+' style="margin:14px 0 6px;">'+inlineMd(h[2])+'</h'+lvl+'>';

  /**

  function itemEffectiveWeight(it){

  // ---------------- Inline grade / weight editing ----------------
  // Grades come back from profs in whatever shape they feel like, so a cell takes
  // "17/20", "85", or "85%" and always stores a percent. Blank clears the grade.
  function parseGradeEntry(raw){
    var str = String(raw==null?'':raw).replace(/%/g,'').trim();

    var frac = str.match(/^(\d*\.?\d+)\s*(?:\/|\s+out\s+of\s+)\s*(\d*\.?\d+)$/i);

      return { ok:true, value: roundPct(Number(frac[1]) / den * 100) };

  function startInlineEdit(cell){
    // A closing menu can re-render the table on the same click that opened this
    // cell, so always edit the copy that is actually on the page.
    if(!document.contains(cell)){
      var fresh = document.querySelector('[data-action="inline-edit"][data-id="'
        + cell.dataset.id+'"][data-field="'+cell.dataset.field+'"]');
      if(!fresh) return;
      cell = fresh;
    }
    if(cell.classList.contains('editing')) return;
    var id = cell.dataset.id, field = cell.dataset.field;
    var it = items.find(function(x){ return x.id===id; });
    if(!it) return;
    var cur = field==='weight' ? it.weight : it.score;
    var advanceTo = null;

    cell.classList.add('editing');
    cell.classList.remove('empty');
    cell.dataset.action = 'inline-stop';
    cell.innerHTML = '<input type="text" class="inline-num-input" inputmode="decimal" spellcheck="false"'
      + ' value="'+escapeHtml(cur!=null ? fmtPctVal(cur) : '')+'"'
      + ' placeholder="'+(field==='weight' ? '20' : '17/20')+'"'
      + ' aria-label="'+(field==='weight' ? 'Grade weight percent' : 'Grade percent')+'">';

    input.focus();
    input.select();

      settled = true;
      cell.classList.remove('editing','bad');

      cell.classList.toggle('empty', cur==null);
      cell.innerHTML = cur!=null ? fmtPctVal(cur)+'%' : '—';
    }
    function commit(fromBlur){
      if(settled) return;
      var parsed = parseGradeEntry(input.value);
      if(!parsed.ok){

        if(fromBlur){ revert(); return; }
        cell.classList.add('bad');
        input.focus();
        input.select();
        return;
      }
      cell.classList.remove('bad');
      if(parsed.value === (cur==null ? null : roundPct(Number(cur)))){
        revert();
        if(advanceTo){ inlineFocusNext = advanceTo; restoreInlineFocus(); }
        return;
      }
      settled = true;
      var patch = {};
      patch[field] = parsed.value;
      // A hand-entered weight is the one you meant, so it stops inheriting the category.
      if(field==='weight' && parsed.value!=null && it.categoryId) patch.categoryId = null;
      inlineFocusNext = advanceTo;
      cell.innerHTML = '<input type="text" class="inline-num-input" value="'
        + escapeHtml(parsed.value!=null ? fmtPctVal(parsed.value) : '')+'" disabled>';
      updateItem(id, patch).catch(function(err){ inlineFocusNext = null; reportError(err); });

      if(e.key==='Enter'){

  /**
   * Standing in a class, as a percentage of the work graded so far.
   *
   * Items outside a category count by their own weight. A category counts by its
   * total weight: its scores are averaged after dropping the lowest N (never all of
   * them), and it counts as graded in proportion to how much of it has been marked.
   */
  function classGradeStats(classId){
    return gradeStatsFrom(classById(classId), items);
  }

  /**
   * A class's standing, worked out from a given set of items.
   *
   * Split out from classGradeStats so the GPA history can run the identical maths
   * over a past term's rows. An archived GPA and a live one must never be arrived at
   * two different ways.
   */
  function gradeStatsFrom(cls, itemList){
    var classId = cls && cls.id;
    var cats = (cls && cls.gradeCategories) || [];
    var inCat = {};
    cats.forEach(function(g){ inCat[g.id] = g; });
    var mine = (itemList || []).filter(function(it){ return it.classId===classId; });
    var totalWeight = 0, gradedWeight = 0, earned = 0;

    mine.forEach(function(it){
      if(it.categoryId && inCat[it.categoryId]) return;
      if(!isNum(it.weight)) return;
      totalWeight += Number(it.weight);
      if(isNum(it.score)){
        gradedWeight += Number(it.weight);
        earned += Number(it.weight) * Number(it.score) / 100;
      }
    });

    cats.forEach(function(g){
      if(!isNum(g.weight)) return;
      totalWeight += Number(g.weight);
      var members = mine.filter(function(it){ return it.categoryId===g.id; });
      var scores = members.filter(function(it){ return isNum(it.score); })
        .map(function(it){ return Number(it.score); })
        .sort(function(a,b){ return a-b; });
      if(!scores.length) return;

      var fraction = Math.min(1, kept.length / counted);
      gradedWeight += Number(g.weight) * fraction;
      earned += Number(g.weight) * fraction * avg / 100;

            : '<button type="button" class="btn" data-action="dlg-cancel">'+escapeHtml(cancelLabel)+'</button>'

   *    show something the server was never asked for;

    return send().then(function(row){

    return eagerNested(id, data, function(){ return apiPut('/api/materials/'+id, data); });
  }
  function addFileFolder(classId, name, opts){
    opts = opts || {};
    return route('addFileFolder', [classId, name, opts], function(){
      return apiPost('/api/classes/'+classId+'/file-folders',
                     { name:name, parentId:opts.parentId || null });
    }).then(loadState);
  }
  function updateFileFolder(fid, data){
    if(BE && typeof BE.updateFileFolder === 'function') return BE.updateFileFolder(fid, data).then(loadState);
    return eagerNested(fid, data, function(){ return apiPut('/api/file-folders/'+fid, data); });
  }
  function deleteFileFolder(fid){
    if(BE && typeof BE.deleteFileFolder === 'function') return BE.deleteFileFolder(fid).then(loadState);
    return eagerNestedDelete(fid, function(){ return apiDelete('/api/file-folders/'+fid); });
  }

  // ---- reading the folder tree ----
  // Folders arrive on their class as a flat list with parentId, the same shape the
  // note tree uses. Everything below is derived rather than cached, because a tree
  // held in two places is a tree that goes out of date.

  /** Every folder in a class. The Inbox has none: it is the place things go before filing. */
  function classFileFolders(classId){
    var c = classById(classId);
    return (c && c.fileFolders) || [];
  }
  function allFileFolders(){
    var out = [];
    classes.forEach(function(c){
      (c.fileFolders||[]).forEach(function(f){ out.push(Object.assign({}, f, { cls:c })); });
    });
    return out;
  }
  function fileFolderById(id){
    if(!id) return null;
    return allFileFolders().find(function(f){ return f.id===id; }) || null;
  }
  /** The folders sitting directly inside a parent, or at the top when parentId is null. */
  function fileFolderChildren(classId, parentId){
    return classFileFolders(classId)
      .filter(function(f){ return (f.parentId||null) === (parentId||null); })
      .sort(function(a,b){ return (a.sortOrder||0)-(b.sortOrder||0) || (a.name||'').localeCompare(b.name||''); });
  }
  /** Root to this folder, for the breadcrumb. Guarded against a cycle it should never see. */
  function fileFolderPath(id){
    var out = [], seen = {}, f = fileFolderById(id);
    while(f && !seen[f.id]){
      seen[f.id] = 1;
      out.unshift(f);
      f = f.parentId ? fileFolderById(f.parentId) : null;
    }
    return out;
  }
  /** A folder and everything nested inside it, so "move into itself" can be refused. */
  function fileFolderDescendants(id){
    var out = [id], frontier = [id];
    while(frontier.length){
      var next = allFileFolders()
        .filter(function(f){ return frontier.indexOf(f.parentId) >= 0; })
        .map(function(f){ return f.id; });
      frontier = next.filter(function(x){ return out.indexOf(x) < 0; });
      out = out.concat(frontier);
    }
    return out;
  }
  /** How many files a folder holds, counting everything in its subfolders too. */
  function fileFolderCount(id){
    var branch = fileFolderDescendants(id);
    return allMaterials().filter(function(m){ return branch.indexOf(m.folderId) >= 0; }).length;
  }
  function fetchRubric(materialId){ return route('fetchRubric', [materialId], function(){ return apiGet('/api/materials/'+materialId+'/rubric'); }); }
  function parseRubric(materialId){
    if(BE) return Promise.reject(new Error('Rubric parsing has not moved to the cloud yet.'));
    return apiPost('/api/materials/'+materialId+'/parse-rubric', {});
  }
  function updateRubric(id, data){ return route('updateRubric', [id, data], function(){ return apiPut('/api/rubrics/'+id, data); }); }
  function deleteRubricRecord(id){ return route('deleteRubricRecord', [id], function(){ return apiDelete('/api/rubrics/'+id); }); }
  function logFocusTime(itemId, seconds){ return route('logFocusTime', [itemId, seconds], function(){ return apiPost('/api/items/'+itemId+'/focus-time', { seconds:seconds }); }); }

  var FILE_CATEGORY_RULES = [
    [/syllabus/, 'syllabus'],
    [/rubric/, 'rubrics'],
    [/midterm|final[\s_-]?exam|past[\s_-]?exam|exam[\s_-]?\d|old[\s_-]?exam/, 'exams'],
    [/lecture|slides|week[\s_-]?\d+|lesson[\s_-]?\d+/, 'slides'],
    [/reading|article|chapter|excerpt/, 'readings'],
    [/project/, 'projects'],
    [/notes|journal/, 'personal']
  ];
  function guessFileCategory(filename){
    var name = (filename||'').toLowerCase();
    for(var i=0;i<FILE_CATEGORY_RULES.length;i++){
      if(FILE_CATEGORY_RULES[i][0].test(name)) return FILE_CATEGORY_RULES[i][1];
    }
    return 'other';
  }
  function formatFocusLive(sec){
    if(sec < 60) return sec + 's';
    return formatFocusDuration(sec);
  }
  function formatFocusDuration(sec){
    var h = Math.floor(sec/3600), m = Math.round((sec%3600)/60);
    if(h>0) return h+'h '+m+'m';
    return m+'m';
  }

  // ---------------- theme ----------------
  var THEME_KEY = 'vesta-theme';
  function systemPrefersDark(){
    return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  }
  function currentTheme(){
    var stored = null;
    try{ stored = localStorage.getItem(THEME_KEY); }catch(e){}
    if(stored==='light' || stored==='dark') return stored;
    return systemPrefersDark() ? 'dark' : 'light';
  }
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
  }
  function setTheme(theme){
    try{ localStorage.setItem(THEME_KEY, theme); }catch(e){}
    if(PREFS && PREFS.theme !== theme) savePrefs({ theme: theme });
    applyTheme(theme);
    document.querySelectorAll('[data-action="set-theme"]').forEach(function(b){
      b.classList.toggle('active', b.dataset.themeChoice===theme);
    });
  }
  function initTheme(){ applyTheme(currentTheme()); }

  // ---------------- preferences ----------------
  // Settings used to live in localStorage, which made them per browser rather than per
  // person: signing in on a phone gave you defaults you had never chosen. They live on
  // the account now, and localStorage keeps only the job it is actually good at --
  // holding the last known theme so the first paint is not the wrong colour.
  var PREFS = null;
  var PREFS_MIGRATED_KEY = 'vesta_prefs_migrated';

  function loadPrefs(){
    return apiGet('/api/prefs').then(function(p){
      PREFS = p;
      applyPrefs();
      return p;
    }).catch(function(){ return null; });
  }

  function savePrefs(patch){
    // Applied before the round trip: a toggle that waits for the network to move reads
    // as broken, and the server's answer overwrites this a moment later anyway.
    PREFS = Object.assign({}, PREFS || {}, patch);
    applyPrefs();
    return apiPut('/api/prefs', patch).then(function(p){
      PREFS = p;
      applyPrefs();
      return p;
    }).catch(function(err){ reportError(err); return PREFS; });
  }

  // Live settings: these describe how the app should look right now, so they apply the
  // moment they change.
  function applyPrefs(){
    if(!PREFS) return;
    applyTheme(PREFS.theme);
    calDetail = PREFS.calendarDetail;
    if(PREFS.defaultGradeScale && PREFS.defaultGradeScale.length){
      DEFAULT_GRADE_SCALE = PREFS.defaultGradeScale;
    }
    applyEditorPrefs();
    applySidebarPages();
  }

  // Grades and Focus can come off the sidebar to keep it short. Only the nav button
  // goes: the pages still work, and are reached from search (⌘K), the dashboard's
  // Current Average tile, and Start Focus Session.
  var OPTIONAL_SIDEBAR_PAGES = { grades:'sidebarShowGrades', focus:'sidebarShowFocus' };
  function applySidebarPages(){
    Object.keys(OPTIONAL_SIDEBAR_PAGES).forEach(function(tab){
      var btn = document.querySelector('#tabs .tab-btn[data-tab="'+tab+'"]');
      if(btn) btn.style.display = PREFS[OPTIONAL_SIDEBAR_PAGES[tab]] === false ? 'none' : '';
    });
  }

  // Opening settings: these say where a view *starts*, so they are read once. Applying
  // them on every save would throw the user out of the layout they just switched to,
  // three sections away in the same Settings window.
  function applyStartupPrefs(){
    if(!PREFS) return;
    calView = PREFS.calendarDefaultView;
    filesLayout = PREFS.filesDefaultLayout;
    hsView = PREFS.headstartView;
    // focusSettings is first read while the page loads, before the account's prefs
    // have arrived, so it only saw this browser's copy. Read it again now, so the
    // timer, scene and effects follow the account onto a new device.
    if(PREFS.focus) focusSettings = loadFocusSettings();
  }

  function applyEditorPrefs(){
    var sizes = { small:'14px', medium:'16px', large:'18px' };
    document.documentElement.style.setProperty(
      '--editor-font-size', sizes[PREFS.editorFontSize] || sizes.medium);
    var body = document.getElementById('nt-body');
    if(body) body.spellcheck = !!PREFS.editorSpellcheck;
  }

  /**
   * One browser notification, if the user asked for them and the browser agreed.
   *
   * Silent about failure on purpose: notifications are a courtesy, and a student
   * mid-essay should never get an error dialog because a permission changed.
   */
  function vestaNotify(title, body, tag){
    try{
      if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
      new Notification(title, { body: body || '', tag: tag || undefined });
    }catch(e){}
  }

  var DUE_NOTIFIED_KEY = 'vesta_due_notified';

  /**
   * Tell the student about work coming due, at most once a day per assignment.
   *
   * The seen-list is per browser rather than per account on purpose: it is about what
   * this screen has already shown you, not about the assignment, and syncing it would
   * mean a notification on the laptop suppresses the one on the phone.
   */
  function notifyDueSoon(){
    if(!PREFS || !PREFS.notifyDueSoon) return;
    if(typeof Notification === 'undefined' || Notification.permission !== 'granted') return;
    var today = todayIso();
    var seen = {};
    try{ seen = JSON.parse(localStorage.getItem(DUE_NOTIFIED_KEY) || '{}') || {}; }catch(e){}
    var horizon = Date.now() + (Number(PREFS.notifyDueSoonHours) || 24) * 3600 * 1000;
    var due = (items || []).filter(function(it){
      if(!it.dueDate || it.status === 'done') return false;
      if(seen[it.id] === today) return false;
      var when = parseISODate(it.dueDate).getTime();
      return when >= Date.now() - 86400000 && when <= horizon;
    });
    due.slice(0, 5).forEach(function(it){
      var cls = classById(it.classId);
      vestaNotify('Due soon: ' + it.title,
                  (cls ? cls.code + ' · ' : '') + 'Due ' + it.dueDate, 'due-' + it.id);
      seen[it.id] = today;
    });
    try{ localStorage.setItem(DUE_NOTIFIED_KEY, JSON.stringify(seen)); }catch(e){}
  }

  function applySidebarPref(){
    if(!PREFS) return;
    var stored = null;
    try{ stored = localStorage.getItem(SIDEBAR_KEY); }catch(e){}
    if(stored !== null) return;         // this device has already been told otherwise
    setSidebarCollapsed(window.innerWidth < 1100 ? true : !!PREFS.sidebarCollapsed);
  }

  /**
   * Carry whatever this browser already had up to the account, once.
   *
   * Without this, everyone's first sign-in after the change silently resets their
   * theme and focus timer to the defaults, which looks exactly like data loss.
   */
  function migratePrefs(){
    var done = false;
    try{ done = localStorage.getItem(PREFS_MIGRATED_KEY) === '1'; }catch(e){}
    if(done || !PREFS) return Promise.resolve();
    var patch = {};
    try{
      var th = localStorage.getItem(THEME_KEY);
      if(th === 'light' || th === 'dark') patch.theme = th;
      var cd = localStorage.getItem(CAL_DETAIL_KEY);
      if(cd === 'simple' || cd === 'detailed') patch.calendarDetail = cd;
      var hv = localStorage.getItem(HS_VIEW_KEY);
      if(hv === 'list' || hv === 'cards') patch.headstartView = hv;
      var raw = localStorage.getItem(FOCUS_SETTINGS_KEY);
      if(raw) patch.focus = JSON.parse(raw);
    }catch(e){}
    try{ localStorage.setItem(PREFS_MIGRATED_KEY, '1'); }catch(e){}
    if(!Object.keys(patch).length) return Promise.resolve();
    return savePrefs(patch);
  }

  // ---------------- init ----------------
  // ---- sidebar ----
  var SIDEBAR_KEY = 'vesta-sidebar-collapsed';
  var sidebarCollapsed = false;

  function setSidebarCollapsed(next){
    sidebarCollapsed = !!next;
    document.getElementById('app').classList.toggle('side-collapsed', sidebarCollapsed);
    var btn = document.getElementById('side-toggle');
    if(btn){
      btn.textContent = sidebarCollapsed ? '›' : '‹';
      var label = sidebarCollapsed ? 'Expand the sidebar' : 'Collapse the sidebar';
      btn.title = label;
      btn.setAttribute('aria-label', label);
    }
    try{ localStorage.setItem(SIDEBAR_KEY, sidebarCollapsed ? '1' : '0'); }catch(e){}
  }

  function initSidebar(){
    var stored = null;
    try{ stored = localStorage.getItem(SIDEBAR_KEY); }catch(e){}
    // Narrow windows start collapsed, because 240px of navigation is a lot of a
    // small screen. A stored choice always wins over that.
    var narrow = window.innerWidth < 1100;
    setSidebarCollapsed(stored === null ? narrow : stored === '1');
  }

  // ---------------- Accounts ----------------
  // Only the deployed app has these. Run locally, /api/auth/me answers
  // accounts:false and none of this is ever shown, which is how Vesta stays the
  // single-user tool it began as when you run it on your own machine.
  var authState = { accounts:false, user:null, busy:false, error:null, notice:null, mode:'login' };

  var AUTH_COPY = {
    login:  { title:'Sign in to Vesta',   button:'Sign in',        path:'/api/auth/login' },
    signup: { title:'Create your account', button:'Create account', path:'/api/auth/signup' },
    reset:  { title:'Reset your password', button:'Send reset link', path:'/api/auth/reset' },
    // Reached only by following a reset email, never by choosing it.
    newpassword: { title:'Set a new password', button:'Save password', path:'/api/auth/password' }
  };

  function authMe(){
    return fetch('/api/auth/me', { credentials:'same-origin' })
      .then(function(r){ return r.json(); })
      .catch(function(){ return { accounts:false, user:null }; });
  }

  function showLogin(){
    var root = document.getElementById('login-root');
    if(!root){
      root = document.createElement('div');
      root.id = 'login-root';
      document.body.appendChild(root);
    }
    // The app itself is hidden rather than dimmed behind a dialog. A blurred dashboard
    // full of someone else's data is a strange thing to show a person who is not
    // signed in, and it made the screen read as a modal interruption rather than the
    // front door.
    document.body.classList.add('signed-out');

    var m = AUTH_COPY[authState.mode] || AUTH_COPY.login;
    var isNew = authState.mode === 'newpassword';
    var wantsPassword = authState.mode !== 'reset';
    var wantsEmail = !isNew;          // the recovery link already says who this is
    var subs = {
      login:  'Your term, in one place.',
      signup: 'You will need an email that has been invited.',
      reset:  'We will email you a link to set a new password.',
      newpassword: 'Choose a new password for ' + (authState.email || 'your account') + '.'
    };
    root.innerHTML = '<div class="auth-screen"><div class="auth-inner">'
      + '<div class="auth-brand"><img src="/vesta-mark.png" alt=""><span>Vesta</span></div>'
      + '<div class="auth-card">'
      + '<h1>'+m.title.replace(' to Vesta','')+'</h1>'
      + '<p class="auth-sub">'+subs[authState.mode]+'</p>'
      + (wantsEmail ? '<label class="auth-field">Email'
          + '<input type="email" id="auth-email" autocomplete="username" spellcheck="false"'
          + ' value="'+escapeHtml(authState.email||'')+'" placeholder="you@example.com"></label>' : '')
      + (wantsPassword ? '<label class="auth-field">'+(isNew ? 'New password' : 'Password')
          + '<input type="password" id="auth-password" autocomplete="'
          + (authState.mode==='login' ? 'current-password' : 'new-password')
          + '" placeholder="'+(authState.mode==='login' ? '' : 'At least 8 characters')+'"></label>' : '')
      + (isNew ? '<label class="auth-field">Confirm new password'
          + '<input type="password" id="auth-password2" autocomplete="new-password"></label>' : '')
      + (authState.notice ? '<div class="auth-note">'+escapeHtml(authState.notice)+'</div>' : '')
      + (authState.error ? '<div class="auth-error">'+escapeHtml(authState.error)+'</div>' : '')
      + '<button type="button" class="btn primary auth-primary" data-action="auth-submit"'
      + (authState.busy?' disabled':'')+'>'+(authState.busy ? 'Working…' : m.button)+'</button>'
      + (authState.mode === 'reset' || isNew ? '' :
          '<div class="auth-or"><span>or</span></div>'
          + '<button type="button" class="btn auth-google" data-action="auth-google">'
          + 'Continue with Google</button>')
      + '<div class="auth-links">'
      + (isNew ? '' :
          (authState.mode!=='login'  ? '<button type="button" data-action="auth-mode" data-mode="login">Sign in</button>' : '')
          + (authState.mode!=='signup' ? '<button type="button" data-action="auth-mode" data-mode="signup">Create an account</button>' : '')
          + (authState.mode!=='reset'  ? '<button type="button" data-action="auth-mode" data-mode="reset">Forgot your password?</button>' : ''))
      + '</div>'
      + '</div>'
      // Only claim to be invite-only when the server says a list is actually in force.
      + '<p class="auth-foot">'+(authState.inviteOnly ? 'Invite only · ' : '')
        + '<a href="/privacy">Privacy</a> · <a href="/terms">Terms</a></p>'
      + '</div></div>';
    // Enter submits from either field. A sign-in form that only responds to the mouse
    // is the kind of thing you notice every single morning.
    root.querySelectorAll('input').forEach(function(el){
      el.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter'){ ev.preventDefault(); authSubmit(); }
      });
    });
    var first = document.getElementById('auth-email');
    if(first && !authState.busy) first.focus();
  }

  function hideLogin(){
    document.body.classList.remove('signed-out');
    var root = document.getElementById('login-root');
    if(root) root.remove();
  }

  function signedIn(user){
    authState.user = user;
    hideLogin();
    // The avatar shows an initial taken from the profile and the whole app is themed
    // from the preferences, so fetch both before the first render rather than letting
    // the letter and the colours change under the user a moment later.
    Promise.all([loadProfile(), loadPrefs()]).then(function(){
      applyStartupPrefs();
      applySidebarPref();
      render();
      return migratePrefs();
    });
    loadState().then(function(){ notifyDueSoon(); }).catch(function(){});
  }

  function authSubmit(){
    var emailEl = document.getElementById('auth-email');
    var passEl = document.getElementById('auth-password');
    var pass2El = document.getElementById('auth-password2');
    // In new-password mode there is no email field, and the address is already known
    // from the recovery token. Reading a missing element would erase it.
    if(emailEl) authState.email = emailEl.value.trim();
    var password = passEl ? passEl.value : '';
    authState.error = null; authState.notice = null;

    if(authState.mode === 'newpassword'){
      if(password.length < 8){ authState.error = 'Use a password of at least 8 characters.'; showLogin(); return; }
      if(password !== (pass2El ? pass2El.value : '')){
        authState.error = 'Those two passwords do not match.'; showLogin(); return;
      }
      authState.busy = true; showLogin();
      apiPostRaw('/api/auth/password',
                 { recoveryToken: authState.recoveryToken || '', newPassword: password })
        .then(function(r){
          authState.busy = false;
          if(!r.ok){ authState.error = r.body.error || 'That password could not be set.'; showLogin(); return; }
          authState.recoveryToken = null;
          if(r.body.user){ signedIn(r.body.user); return; }
          authState.mode = 'login';
          authState.notice = 'Password set. Sign in with it.';
          showLogin();
        })
        .catch(function(){
          authState.busy = false;
          authState.error = 'Could not reach Vesta.';
          showLogin();
        });
      return;
    }

    if(!authState.email){ authState.error = 'Give your email.'; showLogin(); return; }
    if(authState.mode !== 'reset' && !password){ authState.error = 'Give your password.'; showLogin(); return; }
    authState.busy = true; showLogin();
    apiPostRaw((AUTH_COPY[authState.mode]||AUTH_COPY.login).path,
               { email:authState.email, password:password })
      .then(function(r){
        authState.busy = false;
        if(!r.ok){ authState.error = r.body.error || 'That did not work.'; showLogin(); return; }
        if(r.body.user){                     // signed in
          signedIn(r.body.user);
          return;
        }
        // signup awaiting confirmation, or a reset link sent
        authState.mode = 'login';
        authState.notice = r.body.message || 'Check your email.';
        showLogin();
      })
      .catch(function(){
        authState.busy = false;
        authState.error = 'Could not reach Vesta.';
        showLogin();
      });
  }

  function googleSignIn(){
    authState.busy = true; authState.error = null; showLogin();
    apiGet('/api/auth/google/start')
      .then(function(r){
        if(r && r.url){ window.location.href = r.url; return; }
        authState.busy = false;
        authState.error = 'Google sign-in is not set up on this server yet.';
        showLogin();
      })
      .catch(function(){
        authState.busy = false;
        authState.error = 'Could not reach Vesta.';
        showLogin();
      });
  }

  /**
   * Signing in with Google returns the token to the browser in the URL fragment, which
   * a server never sees. Read it once, hand it to Vesta, and wipe it from the address
   * bar: a token left there ends up in browser history and in any screenshot.
   */
  function consumeAuthFragment(){
    var hash = window.location.hash || '';
    if(hash.indexOf('access_token=') === -1 && hash.indexOf('error=') === -1){
      return Promise.resolve(false);
    }
    var p = {};
    hash.replace(/^#/, '').split('&').forEach(function(kv){
      var i = kv.indexOf('=');
      if(i > 0) p[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, ' '));
    });
    history.replaceState(null, '', window.location.pathname + window.location.search);
    // A reset email comes back here too, carrying type=recovery. Treating it like any
    // other token would sign the person in with the password they have just told us
    // they cannot remember, and leave them no way to set a new one. Hold the token
    // instead and ask for the new password.
    if(p.type === 'recovery' && p.access_token){
      authState.mode = 'newpassword';
      authState.recoveryToken = p.access_token;
      authState.email = p.email || authState.email || '';
      return Promise.resolve(false);
    }
    if(p.error || !p.access_token){
      authState.error = p.error_description || p.error || 'That Google sign-in did not complete.';
      return Promise.resolve(false);
    }
    return apiPostRaw('/api/auth/session', { accessToken: p.access_token })
      .then(function(r){
        if(r.ok && r.body.user){ authState.user = r.body.user; return true; }
        authState.error = r.body.error || 'That Google sign-in was not accepted.';
        return false;
      })
      .catch(function(){ authState.error = 'Could not reach Vesta.'; return false; });
  }

  function init(){
    initSidebar();
    initTheme();
    paintIcons();
    // A Google sign-in lands back here with the token in the fragment, so deal with
    // that before asking the server who is signed in.
    return consumeAuthFragment().then(function(justSignedIn){
      if(justSignedIn){ signedIn(authState.user); return; }
      // Ask the server whether this copy has accounts at all. One request, and it
      // decides between the app and a sign-in screen.
      return authMe().then(function(a){
        authState.accounts = !!a.accounts;
        authState.inviteOnly = !!(a && a.inviteOnly);
        authState.user = (a && a.user) || null;
        if(authState.accounts && !authState.user){ showLogin(); return; }
        Promise.all([
          authState.accounts ? loadProfile() : Promise.resolve(null),
          loadPrefs()
        ]).then(function(){
          applyStartupPrefs();
          applySidebarPref();
          render();
          return migratePrefs();
        });
        return loadState().then(function(){ notifyDueSoon(); });
      });
    }).catch(function(){ loadState(); });
  }

  /**
   * Keep this device in step with the others. Postgres publishes row changes and
   * Row Level Security applies to that stream too, so only this user's rows arrive.
   * Edits are coalesced: a burst of changes triggers one reload, not twenty.
   */
  var liveSyncTimer = null;
  function startLiveSync(){
    if(!BE || !BE.subscribe) return;
    BE.subscribe(function(){
      if(liveSyncTimer) clearTimeout(liveSyncTimer);
      liveSyncTimer = setTimeout(function(){
        liveSyncTimer = null;
        // Never yank the editor out from under someone who is mid-sentence.
        var editing = document.activeElement &&
          (document.activeElement.id === 'nt-body' || document.activeElement.id === 'nt-title');
        if(editing) refreshCachedState().catch(function(){});
        else loadState();
      }, 400);
    });
  }

  // ---------------- render: shell ----------------
  function render(){
    var navTab = (activeTab==='class') ? 'classes' : activeTab;
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.tab===navTab); });
    renderTermBanner();
    renderSideStats();
    renderHeader();
    renderView();
    paintIcons();
    renderMathIn(document);
    restoreInlineFocus();
  }

  function accountEmail(){
    return (authState.user && authState.user.email) || vestaProfile.email || '';
  }
  function accountLabel(){
    if(!authState.accounts) return 'Settings';
    var name = vestaProfile.displayName;
    var email = accountEmail();
    if(name && email) return name + ' · ' + email;
    return name || email || 'Account';
  }
  function accountInitial(){
    var name = vestaProfile.displayName || accountEmail();
    return (name || 'S').trim().charAt(0).toUpperCase() || 'S';
  }

  function renderSideStats(){
    // The mockups keep the sidebar clean: nav, then Settings pinned at the bottom.
    // This element stays as the flex spacer that pushes Settings down.
    document.getElementById('side-stats').innerHTML = '';
  }

  /** The first word of the display name set in Settings, or '' when there is none. */
  function firstName(){
    return (vestaProfile.displayName || '').trim().split(/\s+/)[0] || '';
  }

  function greetingWord(){
    var h = new Date().getHours();
    if(h<12) return 'Good morning';
    if(h<18) return 'Good afternoon';
    return 'Good evening';
  }

  function renderHeader(){
    var header = document.getElementById('view-header');
    var dateLabel = new Date().toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'});
    var headerRight = '<div class="header-right"><span class="header-date">'+dateLabel+'</span>'
      + '<div class="avatar" data-action="'+(authState.accounts ? 'open-account' : 'open-settings')+'"'
        + ' title="'+escapeHtml(accountLabel())+'">'
        + escapeHtml(accountInitial())+'</div></div>';

    if(activeTab==='class'){
      var cls = classById(activeClassId);
      if(cls){
        var gs = classGradeStats(cls.id);
        var gradeBit = gs.currentGrade!=null
          ? '<span class="grade-badge" style="--c:'+cls.color+';margin-left:10px;">'+letterForGrade(cls, gs.currentGrade)+' '+gs.currentGrade.toFixed(0)+'%</span>'
          : '';
        header.innerHTML = '<div style="min-width:0;">'
          + '<div class="cp-crumbs"><button type="button" class="cp-crumb-back" data-action="switch-tab" data-tab="classes">‹ Classes</button>'
          + '<span class="cp-crumb-sep">›</span><span class="cp-crumb-cur">'+escapeHtml(cls.code||cls.name||'Class')+'</span></div>'
          + '<div class="cp-title"><span class="dot" style="--c:'+cls.color+'"></span>'
          + '<h1>'+escapeHtml(cls.code||cls.name||'Untitled class')+'</h1>'+gradeBit+'</div>'
          + (cls.code && cls.name ? '<div class="cp-subtitle">'+escapeHtml(cls.name)+'</div>' : '')
          + (cls.professor ? '<div class="cp-meta">'+escapeHtml(cls.professor)+'</div>' : '')
          + '</div>' + headerRight;
        document.getElementById('view-actions').innerHTML = '';
        return;
      }
    }

    var titles = {
      dashboard:[greetingWord()+(firstName() ? ', '+firstName()+'.' : '.'), 'Here\'s what\'s happening with your courses.'],
      calendar:['Calendar','View your classes, assignments, exams, and more.'],
      classes:['Classes','Your courses and everything attached to them.'],
      assignments:['Assignments','All your assignments, deadlines, and exams.'],
      headstart:['Headstart','Get ahead on what\'s coming up.'],
      study:['Study','Flashcards and practice from your own terms, and the Humanizer for your writing.'],
      notes:['Notes','Every note across your classes, in one place.'],
      files:['Files','Store and organize your course materials, notes, and resources.'],
      grades:['Grades','Track your academic progress across all courses.'],
      focus:['Focus','Distraction-free work sessions, tracked per assignment.']
    };
    var t = titles[activeTab] || titles.dashboard;
    header.innerHTML = '<div><h1>'+escapeHtml(t[0])+'</h1><div class="sub">'+escapeHtml(t[1])+'</div></div>' + headerRight;

    var action = '';
    // Nothing that starts a write is offered while an archived term is locked. The
    // server refuses those calls anyway; this stops the page from inviting them.
    if(activeTab==='classes' && !termLocked) action = '<span style="display:flex;gap:8px;">'
      + '<button class="btn" data-action="cal-sfu-open">Get schedule from SFU</button>'
      + '<button class="btn" data-action="si-open">Import syllabus</button>'
      + '<button class="btn primary" data-action="open-add-class">+ Add class</button></span>';
    // Assignments renders its own toolbar (tabs + search + add) inside the view.
    document.getElementById('view-actions').innerHTML = action;
  }

  function renderView(){
    var view = document.getElementById('view');
    if(activeTab==='class') view.innerHTML = viewClassPage();
    else if(activeTab==='dashboard') view.innerHTML = viewDashboard();
    else if(activeTab==='classes') view.innerHTML = viewClasses();
    else if(activeTab==='calendar') view.innerHTML = viewCalendar();
    else if(activeTab==='headstart') view.innerHTML = viewHeadstart();
    else if(activeTab==='study') view.innerHTML = viewStudy();
    else if(activeTab==='notes') view.innerHTML = viewNotesPage();
    else if(activeTab==='files') view.innerHTML = viewFilesPage();
    else if(activeTab==='grades') view.innerHTML = viewGradesPage();
    else if(activeTab==='focus') view.innerHTML = viewFocusPage();

    var host = document.getElementById('asg-body');
    if(!host){ renderView(); paintIcons(); return; }

  // ---------------- Dashboard ----------------
  function viewDashboard(){
    var totalAssignments = items.length;
    var overdue = items.filter(function(it){ return statusOf(it)==='overdue'; }).length;
    var week = items.filter(function(it){ var s=statusOf(it); return s==='today'||s==='week'; }).length;
    var completedTotal = items.filter(function(it){ return it.status==='done'; }).length;
    var graded = classes.map(function(c){ return classGradeStats(c.id).currentGrade; }).filter(function(g){ return g!=null; });
    var avg = graded.length ? (graded.reduce(function(s,g){ return s+g; },0)/graded.length) : null;

    var html = '<div class="tiles icon-tiles">'
      + iconTile('assignments', 'var(--accent-soft)', 'var(--accent)', totalAssignments, 'Total Assignments')
      + iconTile('calendar', 'var(--accent-soft)', 'var(--accent)', week, 'Due This Week')
      + iconTile('check', 'var(--success-soft)', 'var(--success)', completedTotal, 'Completed')
      + iconTile('chart', '#EFE9FE', '#7C5BD8', avg!=null?avg.toFixed(0)+'%':'—', 'Current Average', 'grades')
      + '</div>';

    html += '<div class="dash-row">' + focusHighlightHtml() + upcomingWeekCardHtml() + '</div>';
    html += classesPreviewCardHtml();
    html += '<div class="dash-row">' + recentFilesCardHtml() + recentNotesCardHtml() + '</div>';

    return '<div class="tile'+(tab?' tile-link':'')+'"'
      + (tab?' data-action="switch-tab" data-tab="'+tab+'" role="link" title="Open '+escapeHtml(label)+'"':'')+'>'
      + '<div class="tile-icon" style="--tint-bg:'+tintBg+';--tint-fg:'+tintFg+';">'+iconSvg(iconName)+'</div>'
      + '<div><div class="n">'+n+'</div><div class="l">'+label+'</div></div></div>';
  }

  function focusHighlightHtml(){
    var open = items.filter(function(it){ return it.status!=='done' && it.dueDate; })
      .sort(function(a,b){ return a.dueDate.localeCompare(b.dueDate); });
    if(open.length===0){
      return '<div class="card"><div class="card-head"><h2>What to work on</h2></div>'
        + '<div class="empty"><div class="empty-icon">✓</div>Nothing open right now. Add an assignment to get started.</div></div>';
    }
    // An archived term is for reading. Offering to start a focus session on last
    // year's essay only leads to the server refusing the write with a 423.
    if(termLocked){
      var lit = open[0];
      var lcls = classById(lit.classId);
      return '<div class="card">'
        + '<div class="card-head"><h2>Where this term stood</h2></div>'
        + '<div class="focus-highlight">'
        + '<div class="fh-icon">'+(TYPE_ICON[lit.type]||'▤')+'</div>'
        + '<div style="flex:1;min-width:0;">'
        + '<div class="fh-top">'+(lcls?'<span class="class-chip" style="--c:'+(lcls.color||'var(--none)')+'">'+escapeHtml(lcls.code)+'</span>':'<span class="class-chip">General</span>')
        + '<span class="due-label">Left open</span></div>'
        + '<h3>'+escapeHtml(lit.title)+'</h3>'
        + '<p>This term is archived. Unlock it in Settings if you need to change something.</p>'
        + '<div class="fh-actions"><a href="#" data-action="open-item-detail" data-id="'+lit.id+'">View Details →</a></div>'
        + '</div></div></div>';
    }
    var it = open[0];
    var cls = classById(it.classId);
    var col = cls ? cls.color : 'var(--none)';
    var due = diffDaysFromToday(it.dueDate);
    var dueLabel = due<0 ? (Math.abs(due)+' days overdue') : due===0 ? 'Due today' : due===1 ? 'Due tomorrow' : 'Due in '+due+' days';
    var desc = it.notes ? escapeHtml(it.notes.slice(0,140))+(it.notes.length>140?'…':'') : (it.weight!=null ? 'Worth '+it.weight+'% of your grade in this class.' : 'Take a look and get ahead of it.');
    return '<div class="card">'
      + '<div class="card-head"><h2>What to work on <span style="color:var(--text-faint);font-weight:400;">→</span></h2></div>'
      + '<div class="focus-highlight">'
      + '<div class="fh-icon">'+(TYPE_ICON[it.type]||'▤')+'</div>'
      + '<div style="flex:1;min-width:0;">'
      + '<div class="fh-top">'+(cls?'<span class="class-chip" style="--c:'+col+'">'+escapeHtml(cls.code)+'</span>':'<span class="class-chip">General</span>')
      + '<span class="due-label" style="color:'+(due<=0?'var(--danger)':'var(--text-muted)')+';font-weight:700;">'+dueLabel+'</span></div>'
      + '<h3>'+escapeHtml(it.title)+'</h3>'
      + '<p>'+desc+'</p>'
      + '<div class="fh-actions"><button type="button" class="btn primary" data-action="quick-start-focus" data-id="'+it.id+'">Start Focus Session</button>'
      + '<a href="#" data-action="open-item-detail" data-id="'+it.id+'">View Details →</a></div>'
      + '</div></div></div>';
  }

  function fileTypeInitials(name){
    var ext = (name||'').split('.').pop().toUpperCase();
    return ext.length<=4 ? ext : ext.slice(0,3);
  }
  function fileTypeColor(name){
    var ext = (name||'').split('.').pop().toLowerCase();
    if(ext==='pdf') return '#DC2626';
    if(ext==='doc'||ext==='docx') return '#2563EB';
    if(ext==='ppt'||ext==='pptx') return '#EA580C';
    if(ext==='xls'||ext==='xlsx') return '#16A34A';
    if(ext==='png'||ext==='jpg'||ext==='jpeg'||ext==='gif'||ext==='webp') return '#9B5DE0';
    return '#6B7280';
  }

  function allMaterials(){
    var out = [];
    classes.concat([inboxClass()]).forEach(function(c){
      (c.materials||[]).forEach(function(m){ out.push(Object.assign({}, m, {cls:c})); });
    });
    out.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    return out;

  function allNotes(){
    var out = [];
    classes.concat([inboxClass()]).forEach(function(c){ (c.notesList||[]).forEach(function(n){ out.push(Object.assign({}, n, {cls:c})); }); });
    out.sort(function(a,b){ return (b.createdAt||'').localeCompare(a.createdAt||''); });
    return out;

  function stripHtml(html){
    var d = document.createElement('div'); d.innerHTML = html||'';
    d.querySelectorAll('p,div,h1,h2,h3,h4,h5,h6,li,blockquote,br').forEach(function(el){ el.insertAdjacentText('afterend', ' '); });

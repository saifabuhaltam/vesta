name = "vesta-api"
main = "src/index.js"
compatibility_date = "2026-01-01"

# The bucket the browser never talks to directly. R2 has no concept of a user, so
# every read and write goes through the Worker, which checks ownership first.
[[r2_buckets]]
binding = "FILES"
bucket_name = "vesta-files"

# Drains r2_deletion_queue: objects whose database rows are already gone. Without
# this, a deleted file keeps costing storage forever.
[triggers]
crons = ["23 5 * * *"]

[vars]
# Comma-separated list of origins allowed to call this Worker. Add your Pages URL
# and, if you use one, your custom domain. Never set this to "*": that would let
# any website drive this Worker with a signed-in user's token.
ALLOWED_ORIGIN = "http://localhost:5055,https://vesta.pages.dev"
ANTHROPIC_MODEL = "claude-opus-5"

# Secrets are NOT set here. Set them once with wrangler, so they never enter git:
#
#   wrangler secret put SUPABASE_URL           # https://<ref>.supabase.co
#   wrangler secret put SUPABASE_ANON_KEY      # public, but kept together with the rest
#   wrangler secret put SUPABASE_SERVICE_KEY   # bypasses every RLS policy. Guard this.
#   wrangler secret put ANTHROPIC_API_KEY
#   wrangler secret put UPLOAD_TICKET_SECRET   # any long random string, e.g.
#                                              # openssl rand -hex 32
#
# SUPABASE_SERVICE_KEY is the one that matters. It bypasses Row Level Security
# entirely, so anything holding it can read every user's data. It belongs here and
# in nothing else. If it ever reaches the browser or a commit, rotate it in the
# Supabase dashboard immediately.
